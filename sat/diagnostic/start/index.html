<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>SJMaths SAT Math Diagnostic</title>
    <meta name="description" content="SJMaths SAT Math Diagnostic assessment interface.">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#0a0d0b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #edf0eb;
            --surface: #f8f9f6;
            --white: #fff;
            --ink: #121713;
            --muted: #747d75;
            --soft: #949d96;
            --line: #d6ddd5;
            --dark: #0a0d0b;
            --dark2: #121813;
            --dark3: #1c241f;
            --darkline: #29342d;
            --green: #206f4b;
            --green-soft: #e2efe7;
            --lime: #dcef83;
            --amber: #c27d2f;
            --red: #b84d45;
            --max: 1240px
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: "DM Sans", Inter, system-ui, sans-serif;
            overflow: hidden;
            -webkit-font-smoothing: antialiased
        }

        a {
            text-decoration: none;
            color: inherit
        }

        button,
        input,
        textarea {
            font: inherit
        }

        button {
            cursor: pointer
        }

        .app {
            height: 100dvh;
            display: grid;
            grid-template-rows: 58px 28px 1fr 58px
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            background: var(--dark);
            color: #ecf2ed;
            border-bottom: 1px solid #242d27
        }

        .top-left,
        .top-right {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .brand {
            font: 700 18px "Space Grotesk";
            letter-spacing: -.06em
        }

        .brand span {
            color: var(--lime)
        }

        .test-name {
            font-size: 10px;
            color: #89958d;
            padding-left: 10px;
            border-left: 1px solid #303b33
        }

        .top-right {
            gap: 7px
        }

        .tool-btn,
        .exit-btn,
        .timer {
            height: 34px;
            border: 1px solid #344139;
            border-radius: 8px;
            background: #121813;
            color: #e6ece8;
            font-size: 10px;
            font-weight: 700
        }

        .tool-btn,
        .exit-btn {
            padding: 0 10px
        }

        .timer {
            display: flex;
            align-items: center;
            padding: 0 10px;
            font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace
        }

        .timer.low {
            color: #ffd29f;
            border-color: #765229
        }

        .timer.critical {
            color: #ffd0cb;
            border-color: #7d403a
        }

        .progress {
            position: relative;
            background: #dbe1da;
            border-bottom: 1px solid var(--line)
        }

        .progress-fill {
            height: 100%;
            width: 0;
            background: var(--green);
            transition: width .18s
        }

        .progress-label {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            color: #5d675f;
            font-weight: 700;
            letter-spacing: .04em
        }

        .main {
            min-height: 0;
            display: grid;
            grid-template-columns: 170px minmax(0, 1fr);
            background: #eef0ec
        }

        .nav-panel {
            background: #e7eae5;
            border-right: 1px solid var(--line);
            padding: 13px 10px;
            overflow: auto
        }

        .panel-label {
            font: 9px ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: .06em;
            color: #808980
        }

        .module {
            font-size: 10px;
            color: #667069;
            margin: 4px 0 9px;
            font-weight: 700
        }

        .qgrid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px
        }

        .qbtn {
            height: 28px;
            border: 1px solid #d2d9d1;
            border-radius: 6px;
            background: #fbfcfa;
            color: #707970;
            font-size: 9px;
            position: relative
        }

        .qbtn:hover {
            border-color: #9caf9f
        }

        .qbtn.answered {
            background: var(--green-soft);
            border-color: #bfd8c8;
            color: var(--green)
        }

        .qbtn.current {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink)
        }

        .qbtn.review::after {
            content: "";
            position: absolute;
            right: 3px;
            bottom: 3px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--amber)
        }

        .qbtn.eliminated:before {
            content: "";
            position: absolute;
            left: 4px;
            right: 4px;
            top: 50%;
            height: 1px;
            background: #a3aaa3;
            transform: rotate(-15deg)
        }

        .nav-rule {
            border-top: 1px solid var(--line);
            margin: 13px 0
        }

        .legend {
            display: grid;
            gap: 7px;
            font-size: 9px;
            color: #7c857d
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: 7px
        }

        .legend i {
            width: 9px;
            height: 9px;
            border-radius: 3px;
            background: #fff;
            border: 1px solid #cad2c9
        }

        .legend i.a {
            background: var(--green-soft);
            border-color: #bfd8c8
        }

        .legend i.r {
            box-shadow: inset 0 -3px 0 var(--amber)
        }

        .question-area {
            min-width: 0;
            overflow: auto;
            background: #f2f4f0
        }

        .question-wrap {
            width: min(850px, calc(100% - 56px));
            margin: 0 auto;
            padding: 36px 0 45px
        }

        .q-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 18px
        }

        .topic {
            font-size: 10px;
            color: var(--green);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .07em
        }

        .mode {
            font-size: 10px;
            color: #7b847c;
            margin-top: 3px
        }

        .question {
            font: 600 clamp(24px, 2.5vw, 34px)/1.28 "Space Grotesk";
            letter-spacing: -.035em;
            max-width: 820px;
            margin: 17px 0 22px
        }

        .question.small {
            font-size: 26px
        }

        .question p {
            margin: 0
        }

        .formula {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace
        }

        .media {
            margin: 0 0 20px;
            padding: 14px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
            display: flex;
            justify-content: center
        }

        .answers {
            display: grid;
            gap: 9px
        }

        .answer {
            min-height: 56px;
            width: 100%;
            border: 1px solid #d1d8d0;
            border-radius: 11px;
            background: #fff;
            display: grid;
            grid-template-columns: 31px 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 0 12px;
            text-align: left;
            color: #202720;
            font-size: 13px;
            transition: .14s
        }

        .answer:hover {
            border-color: #8eae99;
            transform: translateY(-1px)
        }

        .answer.selected {
            background: #edf6f0;
            border-color: #6fa083;
            box-shadow: inset 0 0 0 1px #83aa92
        }

        .answer.eliminated {
            color: #a1a69f;
            background: #f1f2ef
        }

        .answer.eliminated .answer-text {
            text-decoration: line-through;
            color: #9ca29c
        }

        .letter {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #eef1ed;
            font-size: 10px;
            font-weight: 800;
            color: #4b554d
        }

        .answer.selected .letter {
            background: #d9ebe0;
            color: var(--green)
        }

        .mark {
            font-size: 10px;
            color: transparent
        }

        .answer.selected .mark {
            color: var(--green)
        }

        .spr {
            max-width: 460px
        }

        .spr-input {
            height: 56px;
            width: 100%;
            border: 1px solid #c9d1c9;
            border-radius: 11px;
            background: #fff;
            padding: 0 14px;
            font-size: 17px;
            outline: none
        }

        .spr-input:focus {
            border-color: #78a18a;
            box-shadow: 0 0 0 3px rgba(32, 111, 75, .08)
        }

        .spr-help {
            margin-top: 8px;
            font-size: 10px;
            color: #858d85
        }

        .question-tools {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-top: 19px
        }

        .small-tool {
            height: 34px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            color: #59625a;
            padding: 0 10px;
            font-size: 10px;
            font-weight: 700
        }

        .small-tool:hover {
            border-color: #9aae9f
        }

        .small-tool.active {
            color: var(--green);
            border-color: #9cbea8;
            background: #edf6f0
        }

        .note {
            margin-top: 15px;
            font-size: 9px;
            color: #8b928a
        }

        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 0 15px;
            background: #fff;
            border-top: 1px solid #d5dbd4
        }

        .bottom-left {
            display: flex;
            gap: 10px;
            align-items: center
        }

        .answer-status {
            font-size: 9px;
            color: #737c74
        }

        .autosave {
            font-size: 9px;
            color: #a0a69f
        }

        .bottom-actions {
            display: flex;
            gap: 6px
        }

        .bottom-btn {
            height: 38px;
            padding: 0 12px;
            border: 1px solid #cdd4cc;
            border-radius: 8px;
            background: #fff;
            color: #58615a;
            font-size: 10px;
            font-weight: 700
        }

        .bottom-btn:disabled {
            opacity: .45
        }

        .bottom-btn.primary {
            background: var(--ink);
            border-color: var(--ink);
            color: #fff
        }

        .bottom-btn.submit {
            background: var(--green);
            border-color: var(--green);
            color: #fff
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(7, 10, 8, .68);
            backdrop-filter: blur(5px)
        }

        .modal {
            width: min(980px, 100%);
            max-height: 90dvh;
            overflow: auto;
            background: #f7f8f5;
            border: 1px solid #d5dcd4;
            border-radius: 15px;
            color: var(--ink);
            box-shadow: 0 28px 80px rgba(0, 0, 0, .3)
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 17px;
            border-bottom: 1px solid var(--line)
        }

        .modal-head h3 {
            font: 600 17px "Space Grotesk";
            margin: 0
        }

        .close {
            border: 0;
            background: transparent;
            color: #6d756d;
            font-size: 19px
        }

        .modal-body {
            padding: 17px;
            overflow: hidden
        }

        .modal-body p {
            margin: 0 0 12px;
            font-size: 11px;
            color: #707870;
            line-height: 1.5
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 7px;
            margin-top: 16px
        }

        .modal-btn {
            height: 38px;
            border: 1px solid var(--line2);
            border-radius: 8px;
            background: #fff;
            padding: 0 12px;
            font-size: 10px;
            font-weight: 700
        }

        .modal-btn.primary {
            background: var(--ink);
            border-color: var(--ink);
            color: #fff
        }

        .modal-btn.green {
            background: var(--green);
            border-color: var(--green);
            color: #fff
        }

        .menu-table {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px
        }

        .menu-q {
            height: 31px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fff;
            font-size: 9px;
            color: #70786f
        }

        .menu-q.answered {
            background: var(--green-soft);
            color: var(--green)
        }

        .menu-q.review {
            box-shadow: inset 0 -3px 0 var(--amber)
        }

        .menu-q.current {
            background: var(--ink);
            border-color: var(--ink);
            color: #fff
        }

        .ref-sheet {
            display: grid;
            gap: 12px
        }

        .ref-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px
        }

        .formula-card {
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 11px;
            background: #fff
        }

        .formula-card b {
            display: block;
            font-size: 10px;
            margin-bottom: 5px
        }

        .formula-card span {
            font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
            color: #414941
        }

        .notes-area {
            width: 100%;
            min-height: 190px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            padding: 11px;
            resize: vertical;
            outline: none;
            font-size: 12px
        }

        .notes-area:focus {
            border-color: #86a692
        }

        .calc-wrap {
            height: 520px;
            display: flex;
            flex-direction: column
        }

        .calc-frame {
            flex: 1;
            border: 1px solid var(--line);
            border-radius: 10px;
            overflow: hidden;
            background: #fff
        }

        .calc-fallback {
            padding: 15px;
            font-size: 11px;
            color: #737b73
        }

        .calc-fallback b {
            color: var(--ink)
        }

        .zoom-row {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .zoom-row button {
            height: 34px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
            font-size: 11px
        }

        .zoom-value {
            font: 11px ui-monospace;
            color: #697269
        }

        .review-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px
        }

        .review-card {
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            padding: 11px;
            font-size: 10px
        }

        .review-card b {
            display: block;
            color: var(--ink);
            font-size: 12px;
            margin-bottom: 3px
        }

        .review-card span {
            color: #747c74
        }

        @media(max-width:900px) {
            .main {
                grid-template-columns: 112px minmax(0, 1fr)
            }

            .nav-panel {
                padding: 12px 7px
            }

            .qgrid {
                grid-template-columns: repeat(3, 1fr)
            }

            .question-wrap {
                width: min(850px, calc(100% - 38px));
                padding: 28px 0
            }
        }

        @media(max-width:650px) {
            .app {
                grid-template-rows: 54px 24px 1fr 58px
            }

            .topbar {
                padding: 0 10px
            }

            .test-name {
                display: none
            }

            .timer {
                padding: 0 8px
            }

            .tool-btn {
                display: inline-flex;
                padding: 0 8px
            }

            .main {
                grid-template-columns: 1fr
            }

            .nav-panel {
                display: none
            }

            .question-area {
                overflow: auto
            }

            .question-wrap {
                width: calc(100% - 26px);
                padding: 22px 0 30px
            }

            .question {
                font-size: 23px;
                margin: 13px 0 18px
            }

            .question.small {
                font-size: 21px
            }

            .answer {
                min-height: 56px;
                font-size: 13px
            }

            .q-head {
                display: block
            }

            .mode {
                margin-top: 4px
            }

            .bottom {
                padding: 0 9px
            }

            .autosave {
                display: none
            }

            .bottom-btn {
                height: 39px;
                padding: 0 10px
            }

            .modal {
                width: 100%;
                border-radius: 14px
            }
        }

        @media(max-width:430px) {
            .bottom-actions {
                gap: 4px
            }

            .bottom-btn {
                padding: 0 8px
            }

            .question {
                font-size: 21px
            }

            .answer {
                min-height: 54px
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="top-left"><a class="brand" href="/sat/">SJ<span>Maths</span></a><span class="test-name">SAT Math
                    Diagnostic</span></div>
            <div class="top-right">
                <button class="tool-btn" id="menuBtn">Question Menu</button>
                <div class="timer" id="timer">35:00</div>
                <button class="tool-btn" id="refBtn">Reference</button>
                <button class="tool-btn" id="calcBtn" title="Open calculator.html from this folder">Calculator</button>
                <button class="exit-btn" id="exitBtn">Exit</button>
            </div>
        </header>
        <div class="progress">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-label" id="progressLabel">Module 1 · Question 1 of 15</div>
        </div>
        <div class="main">
            <aside class="nav-panel">
                <div class="panel-label" id="moduleLabel">MODULE 1</div>
                <div class="module">15 questions</div>
                <div class="qgrid" id="qgrid"></div>
                <div class="nav-rule"></div>
                <div class="legend"><span><i></i>Not answered</span><span><i class="a"></i>Answered</span><span><i
                            class="r"></i>Review</span></div>
            </aside>

            <main class="question-area">
                <div class="question-wrap">
                    <div class="q-head">
                        <div>
                            <div class="topic" id="topic"></div>
                            <div class="mode" id="mode"></div>
                        </div>
                        <div class="mode" id="questionNumber"></div>
                    </div>
                    <div class="question" id="questionText"></div>
                    <div id="media"></div>
                    <div id="responseArea"></div>
                    <div class="question-tools">
                        <button class="small-tool" id="reviewBtn">🔖 Mark for Review</button>
                        <button class="small-tool" id="highlightBtn">Highlight & Notes</button>
                        <button class="small-tool" id="eliminateBtn">Option Eliminator</button>
                        <button class="small-tool" id="lineBtn">Line Reader</button>
                        <button class="small-tool" id="zoomBtn">Zoom</button>
                    </div>
                    <div class="note" id="note"></div>
                </div>
            </main>
        </div>
        <footer class="bottom">
            <div class="bottom-left"><span class="answer-status" id="status">No answer selected</span><span
                    class="autosave" id="save">Saved</span></div>
            <div class="bottom-actions">
                <button class="bottom-btn" id="prevBtn">← Previous</button>
                <button class="bottom-btn primary" id="nextBtn">Next →</button>
            </div>
        </footer>
    </div>

    <div class="overlay" id="overlay">
        <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-head">
                <h3 id="modalTitle"></h3><button class="close" id="closeModal">×</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        /* Demo diagnostic question bank. Replace with backend/SJDS data later. */
        const allQuestions = [
            { d: "Algebra", t: "mcq", q: "If a quadratic function has zeros at x = 2 and x = 6, which expression could represent the function?", o: ["(x + 2)(x + 6)", "(x − 2)(x − 6)", "(x − 2)(x + 6)", "(x + 2)(x − 6)"] },
            { d: "Algebra", t: "mcq", q: "If 3x − 7 = 14, what is the value of x?", o: ["5", "6", "7", "8"] },
            { d: "Algebra", t: "spr", q: "For the equation 4x + 9 = 29, enter the value of x.", a: "5", n: "Enter a numerical response." },
            { d: "Algebra", t: "mcq", q: "Which equation represents a line with slope 3 and y-intercept −2?", o: ["y = 3x − 2", "y = −3x + 2", "y = 2x − 3", "y = −2x + 3"] },
            { d: "Algebra", t: "mcq", q: "The system x + y = 10 and x − y = 2 has what solution?", o: ["(4,6)", "(6,4)", "(5,5)", "(8,2)"] },
            { d: "Advanced Math", t: "mcq", q: "Which expression is equivalent to (x + 3)²?", o: ["x² + 3x + 9", "x² + 6x + 9", "x² + 9", "x² + 6"] },
            { d: "Advanced Math", t: "mcq", q: "If f(x) = x² − 4x + 3, what is f(5)?", o: ["6", "7", "8", "9"] },
            { d: "Advanced Math", t: "spr", q: "For the equation 2x + 7 = 19, enter the value of x.", a: "6", n: "Enter a numerical response." },
            { d: "Advanced Math", t: "mcq", q: "Which value is a solution to x² − 9 = 0?", o: ["−3", "0", "3", "Both −3 and 3"] },
            { d: "Advanced Math", t: "mcq", q: "If 2ˣ = 16, what is x?", o: ["2", "3", "4", "8"] },
            { d: "Problem-Solving & Data", t: "mcq", q: "A quantity increases from 80 to 100. What is the percent increase?", o: ["20%", "25%", "30%", "40%"] },
            { d: "Problem-Solving & Data", t: "mcq", q: "A car travels 180 miles in 3 hours. What is its average speed?", o: ["45 mph", "50 mph", "60 mph", "90 mph"] },
            { d: "Problem-Solving & Data", t: "spr", q: "A shirt costs $40 and is discounted by 15%. Enter the sale price.", a: "34", n: "Enter the answer as a number." },
            { d: "Problem-Solving & Data", t: "mcq", q: "What is the median of 3, 8, 10, 11, 15?", o: ["8", "9", "10", "11"] },
            { d: "Problem-Solving & Data", t: "mcq", q: "A fair coin is flipped twice. What is the probability of getting two heads?", o: ["1/2", "1/3", "1/4", "1/8"] },
            { d: "Geometry & Trigonometry", t: "mcq", q: "What is the area of a triangle with base 10 and height 7?", o: ["17.5", "35", "70", "140"] },
            { d: "Geometry & Trigonometry", t: "mcq", q: "A circle has radius 4. What is its circumference in terms of π?", o: ["4π", "8π", "16π", "32π"] },
            { d: "Geometry & Trigonometry", t: "spr", q: "A right triangle has legs 6 and 8. Enter the length of its hypotenuse.", a: "10", n: "Enter a numerical response." },
            { d: "Geometry & Trigonometry", t: "mcq", q: "Two angles of a triangle measure 45° and 65°. What is the third angle?", o: ["60°", "70°", "80°", "90°"] },
            { d: "Geometry & Trigonometry", t: "mcq", q: "Which equation describes a circle centered at (0,0) with radius 5?", o: ["x² + y² = 5", "x² + y² = 10", "x² + y² = 25", "x² + y² = 50"] },
            { d: "Algebra", t: "mcq", q: "If 2x + 5 > 13, which inequality is equivalent?", o: ["x > 4", "x > 9", "x < 4", "x < 9"] },
            { d: "Advanced Math", t: "mcq", q: "Which is a factor of x² − 5x + 6?", o: ["x + 2", "x + 3", "x − 2", "x − 6"] },
            { d: "Advanced Math", t: "spr", q: "If y = 3x² and x = 4, enter y.", a: "48", n: "Enter a numerical response." },
            { d: "Problem-Solving & Data", t: "mcq", q: "A sample has mean 18. If every value increases by 3, what is the new mean?", o: ["18", "19", "21", "54"] },
            { d: "Problem-Solving & Data", t: "mcq", q: "If P(A)=0.4 and P(B)=0.5 for independent events, what is P(A and B)?", o: ["0.1", "0.2", "0.4", "0.9"] },
            { d: "Geometry & Trigonometry", t: "mcq", q: "In a 45-45-90 triangle, if a leg is 6, what is the hypotenuse?", o: ["6", "6√2", "12", "18"] },
            { d: "Geometry & Trigonometry", t: "mcq", q: "A rectangle has perimeter 30 and length 9. What is its width?", o: ["5", "6", "7", "8"] },
            { d: "Algebra", t: "mcq", q: "Which point lies on y = 2x + 1?", o: ["(1,1)", "(1,3)", "(2,2)", "(3,5)"] },
            { d: "Advanced Math", t: "spr", q: "If x² = 49 and x is positive, enter x.", a: "7", n: "Enter a numerical response." }
        ];

        const questions = allQuestions.slice(0, 30);
        const state = {
            module: 1,
            index: 0,
            answers: Array(30).fill(null),
            review: new Set(),
            eliminated: Array.from({ length: 30 }, () => new Set()),
            eliminateMode: false,
            timers: [35 * 60, 35 * 60],
            notes: "",
            highlight: false,
            lineReader: false,
            zoom: 1,
            running: true
        };

        const $ = id => document.getElementById(id);
        const qgrid = $("qgrid"), topic = $("topic"), mode = $("mode"), questionText = $("questionText"), responseArea = $("responseArea");
        const note = $("note"), progressFill = $("progressFill"), progressLabel = $("progressLabel"), moduleLabel = $("moduleLabel"), questionNumber = $("questionNumber");
        const timer = $("timer"), status = $("status"), save = $("save"), reviewBtn = $("reviewBtn"), eliminateBtn = $("eliminateBtn"), highlightBtn = $("highlightBtn"), lineBtn = $("lineBtn"), zoomBtn = $("zoomBtn");
        const overlay = $("overlay"), modalTitle = $("modalTitle"), modalBody = $("modalBody");

        function moduleRange() {
            return state.module === 1 ? [0, 14] : [15, 29];
        }
        function currentQuestion() { return questions[state.index] }
        function buildQuestionGrid() {
            qgrid.innerHTML = "";
            moduleLabel.textContent = `MODULE ${state.module}`;
            const [s, e] = moduleRange();
            for (let i = s; i <= e; i++) {
                const b = document.createElement("button"); b.type = "button"; b.className = "qbtn"; b.textContent = (i - s + 1);
                b.title = `Question ${i - s + 1}`;
                b.addEventListener("click", () => goTo(i));
                qgrid.appendChild(b);
            }
            updateGrid();
        }
        function updateGrid() {
            const [s, e] = moduleRange();
            [...qgrid.children].forEach((b, j) => {
                const idx = s + j;
                const a = state.answers[idx];
                b.classList.toggle("current", idx === state.index);
                b.classList.toggle("answered", a !== null && a !== "");
                b.classList.toggle("review", state.review.has(idx));
                b.classList.toggle("eliminated", state.eliminated[idx].size > 0);
            });
        }
        function render() {
            const q = currentQuestion();
            topic.textContent = q.d;
            mode.textContent = q.t === "mcq" ? "Multiple choice" : "Student-produced response";
            questionNumber.textContent = `Question ${state.index - (state.module === 1 ? 0 : 15) + 1} of 15`;
            questionText.innerHTML = q.q;
            questionText.classList.toggle("small", q.q.length < 70);
            responseArea.innerHTML = "";
            if (q.t === "mcq") {
                const wrap = document.createElement("div"); wrap.className = "answers";
                q.o.forEach((opt, i) => {
                    const b = document.createElement("button"); b.type = "button"; b.className = "answer";
                    if (state.answers[state.index] === i) b.classList.add("selected");
                    if (state.eliminated[state.index].has(i)) b.classList.add("eliminated");
                    b.innerHTML = `<span class="letter">${String.fromCharCode(65 + i)}</span><span class="answer-text">${opt}</span><span class="mark">✓</span>`;
                    b.addEventListener("click", () => {
                        if (state.eliminateMode) { toggleEliminate(i); return }
                        if (state.eliminated[state.index].has(i)) return;
                        state.answers[state.index] = i; persist(); setSave(); render();
                    });
                    b.addEventListener("contextmenu", e => { e.preventDefault(); toggleEliminate(i) });
                    wrap.appendChild(b);
                });
                responseArea.appendChild(wrap);
            } else {
                const wrap = document.createElement("div"); wrap.className = "spr";
                const input = document.createElement("input"); input.className = "spr-input"; input.inputMode = "decimal"; input.autocomplete = "off"; input.placeholder = "Enter your answer"; input.value = state.answers[state.index] ?? "";
                input.addEventListener("input", () => { state.answers[state.index] = input.value.trim(); persist(); setSave(); updateStatus() });
                wrap.appendChild(input);
                const h = document.createElement("div"); h.className = "spr-help"; h.textContent = q.n || "Enter a numerical response.";
                wrap.appendChild(h); responseArea.appendChild(wrap);
                setTimeout(() => input.focus(), 30);
            }
            note.textContent = "Diagnostic question interface · demonstration question bank.";
            reviewBtn.classList.toggle("active", state.review.has(state.index));
            reviewBtn.textContent = state.review.has(state.index) ? "🔖 Marked for Review" : "🔖 Mark for Review";
            eliminateBtn.classList.toggle("active", q.t === "mcq" && state.eliminateMode);
            eliminateBtn.textContent = state.eliminateMode ? "Option Eliminator · On" : "Option Eliminator";
            lineBtn.classList.toggle("active", state.lineReader);
            zoomBtn.textContent = `Zoom ${Math.round(state.zoom * 100)}%`;
            document.documentElement.style.setProperty("--question-zoom", state.zoom);
            updateStatus(); updateGrid();
        }
        function updateStatus() {
            const a = state.answers[state.index];
            status.textContent = (a !== null && a !== "") ? "Answer selected" : "No answer selected";
            const offset = state.module === 1 ? 0 : 15;
            const local = state.index - offset + 1;
            moduleLabel.textContent = `MODULE ${state.module}`;
            document.querySelector(".module").textContent = "15 questions";
            progressLabel.textContent = `Module ${state.module} · Question ${local} of 15`;
            const within = (local / 15) * 100;
            progressFill.style.width = `${((state.module - 1) * 50) + (within / 2)}%`;
            updateTimer();
            applyZoom();
        }
        function goTo(i) {
            const [s, e] = moduleRange();
            if (i < s || i > e) return;
            state.index = i; render(); document.querySelector(".question-area").scrollTop = 0;
        }
        function toggleReview() {
            if (state.review.has(state.index)) state.review.delete(state.index); else state.review.add(state.index);
            persist(); render();
        }
        function toggleEliminate(i) {
            const set = state.eliminated[state.index];
            if (set.has(i)) set.delete(i); else set.add(i);
            persist(); render();
        }
        function renderMenu() {
            modalTitle.textContent = `Question Menu · Module ${state.module}`;
            const [s, e] = moduleRange();
            const grid = document.createElement("div"); grid.className = "menu-table";
            for (let i = s; i <= e; i++) {
                const b = document.createElement("button"); b.type = "button"; b.className = "menu-q"; b.textContent = i - s + 1;
                if (i === state.index) b.classList.add("current");
                if (state.answers[i] !== null && state.answers[i] !== "") b.classList.add("answered");
                if (state.review.has(i)) b.classList.add("review");
                b.addEventListener("click", () => { closeModal(); goTo(i) });
                grid.appendChild(b);
            }
            modalBody.innerHTML = "";
            const p = document.createElement("p"); p.textContent = "Jump to any question in the current module. Review marks are shown with an amber indicator.";
            modalBody.append(p, grid);
            openModal();
        }
        function renderReference() {
            modalTitle.textContent = "SAT Math Reference Sheet";
            modalBody.innerHTML = `
 <p>Reference formulas for common math questions. SJMaths can replace this demo set with the exact formula sheet used in your final diagnostic.</p>
 <div class="ref-sheet">
  <div class="ref-row">
   <div class="formula-card"><b>Area of a circle</b><span>A = πr²</span></div>
   <div class="formula-card"><b>Circumference</b><span>C = 2πr</span></div>
  </div>
  <div class="ref-row">
   <div class="formula-card"><b>Pythagorean theorem</b><span>a² + b² = c²</span></div>
   <div class="formula-card"><b>Quadratic formula</b><span>x = (−b ± √(b²−4ac)) / 2a</span></div>
  </div>
  <div class="ref-row">
   <div class="formula-card"><b>Triangle area</b><span>A = ½bh</span></div>
   <div class="formula-card"><b>Distance</b><span>d = √((x₂−x₁)²+(y₂−y₁)²)</span></div>
  </div>
 </div>`;
            openModal();
        }
        function renderNotes() {
            modalTitle.textContent = "Notes";
            modalBody.innerHTML = `<p>Add a note for Question ${state.index - (state.module === 1 ? 0 : 15) + 1}. This demo stores it locally in your browser.</p><textarea class="notes-area" id="notesArea" placeholder="Write a quick note...">${state.notes || ""}</textarea><div class="modal-actions"><button class="modal-btn primary" id="saveNotes">Save note</button></div>`;
            $("saveNotes").addEventListener("click", () => { state.notes = $("notesArea").value; persist(); closeModal(); setSave() });
            openModal();
        }
        function toggleLineReader() {
            state.lineReader = !state.lineReader;
            if (state.lineReader) {
                const reader = document.createElement("div"); reader.id = "lineReader";
                reader.style.cssText = "position:fixed;left:170px;right:0;top:36%;height:46px;z-index:20;border-top:2px solid rgba(32,111,75,.85);border-bottom:2px solid rgba(32,111,75,.85);background:rgba(255,255,255,.16);pointer-events:none;";
                document.body.appendChild(reader);
            } else $("lineReader")?.remove();
            lineBtn.classList.toggle("active", state.lineReader);
        }
        window.addEventListener("resize", () => {
            const r = $("lineReader");
            if (!r) return;
            r.style.left = window.innerWidth <= 900 ? "112px" : "170px";
            if (window.innerWidth <= 650) r.style.left = "0px";
        });
        function applyZoom() {
            const q = currentQuestion();
            const base = q.q.length < 70 ? 26 : 34;
            questionText.style.fontSize = `${Math.round(base * state.zoom)}px`;
            zoomBtn.textContent = `Zoom ${Math.round(state.zoom * 100)}%`;
        }
        function zoom() {
            state.zoom = state.zoom >= 1.2 ? 1 : Math.round((state.zoom + .1) * 10) / 10;
            applyZoom();
            persist();
        }
        function calculator() {
            modalTitle.textContent = "SJMaths Graphing Calculator";
            modalBody.innerHTML = `
   <div style="height:min(72vh,680px);min-height:420px">
     <iframe
       src="calculator.html"
       title="SJMaths Graphing Calculator"
       style="width:100%;height:100%;display:block;border:1px solid #d7ddd6;border-radius:10px;background:#202124"
       allow="fullscreen"
     ></iframe>
   </div>
   <p style="margin:9px 0 0;font-size:9px;color:#858d85">
     Opens the calculator included in <code>/sat/diagnostic/start/</code>.
   </p>`;
            openModal();
        }
        function openModal() { overlay.style.display = "flex" }
        function closeModal() { overlay.style.display = "none" }
        function setSave() { save.textContent = "Saved"; clearTimeout(setSave.t); setSave.t = setTimeout(() => save.textContent = "Autosaved", 700) }
        function persist() {
            try {
                localStorage.setItem("sj_sat_diag_v3", JSON.stringify({
                    answers: state.answers,
                    review: [...state.review],
                    eliminated: state.eliminated.map(s => [...s]),
                    module: state.module,
                    index: state.index,
                    timers: state.timers,
                    notes: state.notes
                }));
            } catch (e) { }
        }
        function restore() {
            try {
                const raw = localStorage.getItem("sj_sat_diag_v3") || localStorage.getItem("sj_sat_diag_v2");
                if (!raw) return;
                const s = JSON.parse(raw);
                if (Array.isArray(s.answers) && s.answers.length === 30) state.answers = s.answers;
                if (Array.isArray(s.review)) state.review = new Set(s.review);
                if (Array.isArray(s.eliminated) && s.eliminated.length === 30) state.eliminated = s.eliminated.map(x => new Set(x));
                state.module = (s.module === 2) ? 2 : 1;
                const fallbackIndex = state.module === 1 ? 0 : 15;
                state.index = Number.isInteger(s.index) ? Math.min(29, Math.max(0, s.index)) : fallbackIndex;
                state.timers = Array.isArray(s.timers) && s.timers.length === 2 ? s.timers.map(v => Math.max(0, Number(v) || 0)) : [35 * 60, 35 * 60];
                if (Number.isFinite(s.seconds) && !Array.isArray(s.timers)) state.timers = state.module === 2 ? [35 * 60, Math.max(0, Number(s.seconds))] : [Math.max(0, Number(s.seconds)), 35 * 60];
                state.notes = s.notes || "";
                state.eliminateMode = false;
            } catch (e) { }
        }
        function formatTime(s) { return `${Math.floor(s / 60).toString().padStart(2, "0")}:${(s % 60).toString().padStart(2, "0")}` }
        function currentTimerSeconds() { return state.timers[state.module - 1] }
        function updateTimer() {
            const sec = currentTimerSeconds();
            timer.textContent = formatTime(sec);
            timer.classList.toggle("low", sec <= 600 && sec > 300);
            timer.classList.toggle("critical", sec <= 300);
        }
        function tick() {
            if (!state.running) return;
            const m = state.module - 1;
            if (state.timers[m] > 0) state.timers[m]--;
            updateTimer();
            if (state.timers[m] === 0) {
                state.running = false;
                persist();
                if (state.module === 1) {
                    modalTitle.textContent = "Module 1 time is up";
                    modalBody.innerHTML = '<p>Your time for Module 1 has ended. Bluebook moves students to the second module when a module timer expires. This SJMaths diagnostic will now move you to Module 2.</p><div class="modal-actions"><button class="modal-btn green" id="autoModule2">Continue to Module 2 →</button></div>';
                    $("autoModule2").onclick = () => {
                        closeModal();
                        state.module = 2; state.index = 15; state.running = true;
                        buildQuestionGrid(); render(); persist(); setSave();
                    };
                    openModal();
                } else {
                    openSubmit();
                }
            } else if (state.timers[m] % 10 === 0) persist();
        }
        function next() {
            const [s, e] = moduleRange();
            if (state.index < e) { goTo(state.index + 1); return }
            if (state.module === 1) {
                modalTitle.textContent = "Module 1 complete";
                modalBody.innerHTML = '<p>You have reached the end of Module 1. In the SJMaths diagnostic, continue to Module 2 or review your Module 1 answers first.</p><div class="modal-actions"><button class="modal-btn" id="reviewModule">Review Module 1</button><button class="modal-btn green" id="startModule2">Start Module 2 →</button></div>';
                $("reviewModule").onclick = closeModal;
                $("startModule2").onclick = () => { closeModal(); state.module = 2; state.index = 15; buildQuestionGrid(); render(); persist(); setSave() };
                openModal();
            } else openSubmit();
        }
        function prev() {
            const [s, e] = moduleRange();
            if (state.index > s) { goTo(state.index - 1); return }
            if (state.module === 2) {
                state.module = 1; state.index = 14; buildQuestionGrid(); render(); persist();
            }
        }
        function openSubmit() {
            state.running = false;
            const answered = state.answers.filter(v => v !== null && v !== "").length, flagged = state.review.size;
            modalTitle.textContent = "Review before submission";
            modalBody.innerHTML = `
 <p>Review your responses before finishing the diagnostic.</p>
 <div class="review-grid">
  <div class="review-card"><b>${answered} / 30</b><span>answered</span></div>
  <div class="review-card"><b>${30 - answered}</b><span>unanswered</span></div>
  <div class="review-card"><b>${flagged}</b><span>marked for review</span></div>
  <div class="review-card"><b>${formatTime(currentTimerSeconds())}</b><span>time remaining in module</span></div>
 </div>
 <div class="modal-actions"><button class="modal-btn" id="stayReview">Keep reviewing</button><button class="modal-btn green" id="submitNow">Submit diagnostic</button></div>`;
            $("stayReview").onclick = closeModal; $("submitNow").onclick = () => { closeModal(); showResultState() }; openModal();
        }
        function showResultState() {
            modalTitle.textContent = "Preparing diagnostic profile";
            modalBody.innerHTML = '<p>Responses captured. Building domain and skill-level signals...</p><div style="height:8px;border-radius:99px;background:#e4e8e2;overflow:hidden"><div style="width:0;height:100%;background:#206f4b" id="processingBar"></div></div>';
            openModal();
            setTimeout(() => { $("processingBar").style.width = "100%" }, 40);
            setTimeout(() => {
                modalTitle.textContent = "Diagnostic complete";
                modalBody.innerHTML = '<p>The next production screen will calculate your SJMaths baseline, strengths, priority skills, error patterns, and recommended study path.</p><div class="modal-actions"><button class="modal-btn green" id="viewResult">View diagnostic result →</button></div>';
                $("viewResult").onclick = () => location.href = "/sat/diagnostic/result/";
            }, 800);
        }
        function exit() {
            modalTitle.textContent = "Exit diagnostic?";
            modalBody.innerHTML = '<p>Your progress is saved locally in this demo. You can return to continue later.</p><div class="modal-actions"><button class="modal-btn" id="stay">Stay</button><button class="modal-btn primary" id="leave">Exit</button></div>';
            $("stay").onclick = closeModal; $("leave").onclick = () => location.href = "/sat/diagnostic/";
            openModal();
        }

        $("menuBtn").onclick = renderMenu; $("refBtn").onclick = renderReference; $("calcBtn").onclick = calculator; $("exitBtn").onclick = exit;
        reviewBtn.onclick = toggleReview; eliminateBtn.onclick = () => { if (currentQuestion().t === "mcq") { modalTitle.textContent = "Option Eliminator"; modalBody.innerHTML = '<p>Click an answer to select it. Right-click an option on desktop, or use this mode to cross out an option you think is wrong.</p><div class="modal-actions"><button class="modal-btn" id="okElim">Got it</button></div>'; $("okElim").onclick = closeModal; openModal() } };
        highlightBtn.onclick = renderNotes;
        eliminateBtn.onclick = () => {
            if (currentQuestion().t !== "mcq") return;
            state.eliminateMode = !state.eliminateMode;
            eliminateBtn.classList.toggle("active", state.eliminateMode);
            eliminateBtn.textContent = state.eliminateMode ? "Option Eliminator · On" : "Option Eliminator";
        };
        lineBtn.onclick = toggleLineReader; zoomBtn.onclick = zoom;
        $("prevBtn").onclick = prev; $("nextBtn").onclick = next;
        $("closeModal").onclick = closeModal; overlay.onclick = e => { if (e.target === overlay) closeModal() };
        document.addEventListener("keydown", e => {
            const tag = document.activeElement?.tagName;
            if (["INPUT", "TEXTAREA"].includes(tag)) return;
            if (e.key === "ArrowLeft") prev();
            if (e.key === "ArrowRight") next();
            if (e.key.toLowerCase() === "f") toggleReview();
            if (e.key.toLowerCase() === "c") calculator();
            if (e.key === "Escape") closeModal();
        });

        restore(); buildQuestionGrid(); render(); updateTimer();
        setInterval(tick, 1000);
    </script>
</body>

</html>
