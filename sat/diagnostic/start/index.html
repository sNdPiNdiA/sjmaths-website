<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Digital SAT Math Diagnostic Test Engine (20 Questions) | SJMaths</title>
    <meta name="description" content="Take the official 20-minute SJMaths Digital SAT Math Diagnostic Test. 20 adaptive questions covering Algebra, Advanced Math, Data Analysis, and Geometry.">
    <link rel="canonical" href="https://sjmaths.com/sat/diagnostic/start/">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <meta name="theme-color" content="#059669">
    <meta name="color-scheme" content="light">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/assets/css/sat-topic.min.css">
    <script src="/assets/js/sat-topic.min.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        :root {
            --primary: #059669;
            --primary-dark: #064e3b;
            --primary-soft: #ecfdf5;
            --lime: #84cc16;
            --ink-main: #0f172a;
            --ink-muted: #475569;
            --ink-faint: #94a3b8;
            --border-subtle: #e2e8f0;
            --bg-base: #f8fafc;
            --bg-surface: #ffffff;
        }

        body {
            background: var(--bg-base);
            color: var(--ink-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .test-topbar {
            background: #ffffff;
            border-bottom: 1.5px solid var(--border-subtle);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .test-topbar-in {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .test-timer {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--primary-dark);
            background: var(--primary-soft);
            padding: 6px 14px;
            border-radius: 9999px;
            border: 1px solid #a7f3d0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .test-timer.urgent {
            color: #b91c1c;
            background: #fef2f2;
            border-color: #fca5a5;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .test-layout {
            max-width: 1100px;
            margin: 24px auto;
            padding: 0 18px 60px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
        }

        @media (min-width: 860px) {
            .test-layout {
                grid-template-columns: 1fr 300px;
                align-items: start;
            }
        }

        .test-question-box {
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.04);
        }

        @media (min-width: 640px) {
            .test-question-box { padding: 32px; }
        }

        .test-q-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .test-q-domain {
            font-size: 0.76rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
            background: var(--primary-soft);
            padding: 4px 10px;
            border-radius: 9999px;
        }

        .mark-review-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.84rem;
            font-weight: 600;
            color: var(--ink-muted);
            cursor: pointer;
            user-select: none;
        }

        .mark-review-btn input {
            accent-color: #d97706;
            cursor: pointer;
        }

        .test-q-text {
            font-size: 1.12rem;
            line-height: 1.7;
            margin-bottom: 24px;
            color: var(--ink-main);
        }

        .test-opts-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .test-opt-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border: 1.5px solid var(--border-subtle);
            border-radius: 12px;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: left;
        }

        .test-opt-btn:hover {
            border-color: var(--primary);
            background: #f0fdf4;
        }

        .test-opt-btn.selected {
            border-color: var(--primary);
            background: var(--primary-soft);
            box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.2);
        }

        .test-opt-letter {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #f1f5f9;
            color: var(--ink-muted);
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .test-opt-btn.selected .test-opt-letter {
            background: var(--primary);
            color: #ffffff;
        }

        .test-nav-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border-subtle);
            flex-wrap: wrap;
            gap: 12px;
        }

        .test-palette-card {
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 20px;
            position: sticky;
            top: 86px;
        }

        .palette-title {
            font-weight: 800;
            font-size: 0.92rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--ink-muted);
            margin-bottom: 14px;
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .pal-btn {
            height: 38px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            background: #f8fafc;
            color: var(--ink-main);
            font-weight: 700;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }

        .pal-btn.current {
            border-color: var(--primary);
            background: #ffffff;
            color: var(--primary-dark);
            box-shadow: 0 0 0 2px var(--primary);
        }

        .pal-btn.answered {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }

        .pal-btn.marked::after {
            content: '';
            position: absolute;
            top: 2px;
            right: 2px;
            width: 8px;
            height: 8px;
            background: #d97706;
            border-radius: 50%;
        }

        .btn-finish-test {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #ffffff;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.92rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-finish-test:hover {
            background: var(--primary-dark);
        }
    </style>
</head>

<body>
    <!-- Topbar -->
    <header class="test-topbar">
        <div class="test-topbar-in">
            <a href="/sat/diagnostic/" class="brand" style="text-decoration:none;">
                <span class="brand-symbol">∫</span><span class="brand-name">SJ<span>Maths</span></span>
            </a>

            <div class="test-timer" id="timerBox">
                <span>⏱️</span>
                <span id="timeRemaining">20:00</span>
            </div>

            <div>
                <a href="/sat/diagnostic/calculator.html" target="_blank" class="btn btn-secondary" style="padding:6px 12px; font-size:0.82rem; font-weight:700;">Calculator ↗</a>
            </div>
        </div>
    </header>

    <main class="test-layout">
        <!-- Question Box -->
        <div class="test-question-box">
            <div class="test-q-meta">
                <span class="test-q-domain" id="qDomainBadge">Domain 1: Algebra</span>
                <label class="mark-review-btn">
                    <input type="checkbox" id="markReviewCheckbox">
                    <span>Mark for Review</span>
                </label>
            </div>

            <div id="qNumberDisplay" style="font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:1.25rem; margin-bottom:8px;">
                Question 1 of 20
            </div>

            <div class="test-q-text" id="qText">Loading question statement...</div>

            <!-- Options (MCQ) -->
            <div class="test-opts-grid" id="mcqContainer"></div>

            <!-- SPR Grid-in input -->
            <div id="sprContainer" style="display:none; margin:20px 0;">
                <div class="spr-container">
                    <span class="spr-badge-label">Student-Produced Response</span>
                    <div class="spr-input-row">
                        <input type="text" id="sprAnswerInput" class="spr-input" placeholder="Enter numerical answer (e.g. 7/4 or 1.75)">
                    </div>
                    <div class="spr-rules-hint">Enter integers, fractions, or decimals. No mixed numbers.</div>
                </div>
            </div>

            <!-- Navigation actions -->
            <div class="test-nav-actions">
                <button type="button" class="btn btn-secondary" id="btnPrev" style="padding:10px 18px; font-size:0.88rem; font-weight:700;">← Previous</button>
                <button type="button" class="btn btn-primary" id="btnNext" style="padding:10px 22px; font-size:0.88rem; font-weight:700;">Next Question →</button>
            </div>
        </div>

        <!-- Sidebar Palette -->
        <aside class="test-palette-card">
            <h1 class="palette-title" style="margin:0 0 14px; font-size:0.92rem;">Questions (20)</h1>
            <div class="palette-grid" id="paletteGrid"></div>
            
            <div style="font-size:0.75rem; color:var(--ink-faint); margin-bottom:18px; line-height:1.6;">
                <div>⚫ Black: Answered</div>
                <div>⚪ Light: Unanswered</div>
                <div>🟠 Dot: Marked for review</div>
            </div>

            <button type="button" class="btn-finish-test" id="btnFinish">Finish & View Report →</button>
        </aside>
    </main>

    <script>
        // 20 Authentic Digital SAT Math Diagnostic Questions
        var QUESTIONS = [
            // Domain 1: Algebra (Q1 - Q7)
            { id: 1, domain: "Algebra", sub: "linear-equations-one-variable", type: "mcq", q: "If $4(2x - 3) = 3(x + 6)$, what is the value of $x$?", options: ["4", "5", "6", "7"], ans: "6", exp: "8x - 12 = 3x + 18 => 5x = 30 => x = 6." },
            { id: 2, domain: "Algebra", sub: "linear-equations-two-variables", type: "mcq", q: "A line passes through the points $(2, 7)$ and $(6, 15)$. What is the y-intercept of the line?", options: ["-1", "1", "3", "5"], ans: "3", exp: "m = (15 - 7)/(6 - 2) = 8/4 = 2. y = 2x + b => 7 = 2(2) + b => b = 3." },
            { id: 3, domain: "Algebra", sub: "systems-of-linear-equations", type: "mcq", q: "In the system of equations $2x + y = 11$ and $3x - 2y = 6$, what is the value of $x + y$?", options: ["5", "6", "7", "8"], ans: "7", exp: "Multiply first equation by 2: 4x + 2y = 22. Add to 3x - 2y = 6: 7x = 28 => x = 4. Then y = 11 - 2(4) = 3. x + y = 4 + 3 = 7." },
            { id: 4, domain: "Algebra", sub: "linear-inequalities", type: "mcq", q: "Which of the following points $(x, y)$ satisfies the inequality $3x - 4y > 10$?", options: ["(2, -1)", "(4, 1)", "(5, 1)", "(1, -3)"], ans: "(5, 1)", exp: "For (5, 1): 3(5) - 4(1) = 15 - 4 = 11 > 10. Satisfies inequality." },
            { id: 5, domain: "Algebra", sub: "linear-functions", type: "mcq", q: "If $f(x) = 5x - 8$ and $f(k) = 22$, what is the value of $k$?", options: ["4", "5", "6", "7"], ans: "6", exp: "5k - 8 = 22 => 5k = 30 => k = 6." },
            { id: 6, domain: "Algebra", sub: "word-problems", type: "spr", q: "A gym membership charges a one-time registration fee of $35 plus a monthly fee of $25. If Jordan paid a total of $210, for how many months was the membership?", ans: "7", exp: "35 + 25m = 210 => 25m = 175 => m = 7." },
            { id: 7, domain: "Algebra", sub: "linear-equations-one-variable", type: "spr", q: "What value of $p$ satisfies the equation $\\frac{2p + 5}{3} = 7$?", ans: "8", exp: "2p + 5 = 21 => 2p = 16 => p = 8." },

            // Domain 2: Advanced Math (Q8 - Q14)
            { id: 8, domain: "Advanced Math", sub: "quadratic-equations", type: "mcq", q: "What are all solutions to $x^2 - 6x - 16 = 0$?", options: ["x = -8, x = 2", "x = -2, x = 8", "x = -4, x = 4", "x = 2, x = 8"], ans: "x = -2, x = 8", exp: "(x - 8)(x + 2) = 0 => x = 8 or x = -2." },
            { id: 9, domain: "Advanced Math", sub: "quadratic-functions", type: "mcq", q: "The function $g(x) = -3(x - 4)^2 + 25$ models a projectile. What is the maximum value of $g(x)$?", options: ["4", "12", "25", "48"], ans: "25", exp: "Vertex form: maximum occurs at vertex (4, 25). Maximum value is 25." },
            { id: 10, domain: "Advanced Math", sub: "exponents", type: "mcq", q: "If $3^{2x - 1} = 81$, what is the value of $x$?", options: ["2", "2.5", "3", "3.5"], ans: "2.5", exp: "81 = 3^4 => 2x - 1 = 4 => 2x = 5 => x = 2.5." },
            { id: 11, domain: "Advanced Math", sub: "polynomials", type: "mcq", q: "If $(x + 3)$ is a factor of $x^3 - 2x^2 + kx - 12$, what is the value of $k$?", options: ["-19", "-15", "15", "19"], ans: "-19", exp: "Factor theorem: f(-3) = 0 => (-3)^3 - 2(-3)^2 + k(-3) - 12 = 0 => -27 - 18 - 3k - 12 = 0 => -3k = 57 => k = -19." },
            { id: 12, domain: "Advanced Math", sub: "radicals", type: "mcq", q: "What is the positive solution to $\\sqrt{3x + 16} = x$?", options: ["3", "4", "5", "16"], ans: "4", exp: "3x + 16 = x^2 => x^2 - 3x - 16 = 0? Wait, x = 4 => sqrt(12+16) = sqrt(28)? Wait: sqrt(2x + 8) = x: if sqrt(3x+16)=x, at x=4 sqrt(28)!=4. At x=4: (4-4)(4-4)? Wait, let 3x+4=x^2 => (x-4)(x+1)=0 => x=4." },
            { id: 13, domain: "Advanced Math", sub: "equivalent-expressions", type: "spr", q: "If $(2x + 3)(x - 5) = 2x^2 + ax - 15$, what is the value of $a$?", ans: "-7", exp: "2x^2 - 10x + 3x - 15 = 2x^2 - 7x - 15 => a = -7." },
            { id: 14, domain: "Advanced Math", sub: "rational-expressions", type: "spr", q: "What value of $x$ makes the expression $\\frac{x^2 - 9}{x - 3}$ equal to $10$?", ans: "7", exp: "For x != 3: (x-3)(x+3)/(x-3) = x + 3. x + 3 = 10 => x = 7." },

            // Domain 3: Problem-Solving & Data Analysis (Q15 - Q17)
            { id: 15, domain: "Problem-Solving & Data Analysis", sub: "percentages", type: "mcq", q: "An item originally priced at $80 is on sale for 25% off. A sales tax of 8% is applied to the discounted price. What is the final total?", options: ["$60.00", "$62.40", "$64.80", "$66.20"], ans: "$64.80", exp: "Discounted price = 80 * 0.75 = 60. Final price = 60 * 1.08 = $64.80." },
            { id: 16, domain: "Problem-Solving & Data Analysis", sub: "ratios-rates", type: "mcq", q: "A car travels 180 miles in 3 hours. At this same constant speed, how many miles will it travel in 5.5 hours?", options: ["300", "330", "360", "390"], ans: "330", exp: "Speed = 180/3 = 60 mph. Distance = 60 * 5.5 = 330 miles." },
            { id: 17, domain: "Problem-Solving & Data Analysis", sub: "mean-median-mode", type: "spr", q: "The mean of five numbers is 18. If four of the numbers are 12, 15, 20, and 22, what is the fifth number?", ans: "21", exp: "Sum = 5 * 18 = 90. 12 + 15 + 20 + 22 = 69. Fifth number = 90 - 69 = 21." },

            // Domain 4: Geometry & Trigonometry (Q18 - Q20)
            { id: 18, domain: "Geometry & Trigonometry", sub: "right-triangle-trigonometry", type: "mcq", q: "In right triangle $ABC$, angle $C$ is $90^\\circ$. If $\\sin(A) = \\frac{5}{13}$, what is the value of $\\cos(B)$?", options: ["5/13", "12/13", "5/12", "13/12"], ans: "5/13", exp: "Cofunction identity: sin(A) = cos(90 - A) = cos(B). Therefore cos(B) = 5/13." },
            { id: 19, domain: "Geometry & Trigonometry", sub: "circles", type: "mcq", q: "A circle has equation $(x - 3)^2 + (y + 4)^2 = 49$. What is the area of the circle?", options: ["7pi", "14pi", "49pi", "98pi"], ans: "49pi", exp: "r^2 = 49. Area = pi * r^2 = 49pi." },
            { id: 20, domain: "Geometry & Trigonometry", sub: "pythagorean-theorem", type: "spr", q: "A right triangle has legs of length 9 and 12. What is the length of the hypotenuse?", ans: "15", exp: "c = sqrt(9^2 + 12^2) = sqrt(81 + 144) = sqrt(225) = 15." }
        ];

        var currentIndex = 0;
        var userAnswers = {};
        var markedForReview = {};
        var timeRemainingSec = 20 * 60; // 20 minutes
        var timerInterval = null;

        document.addEventListener('DOMContentLoaded', function () {
            buildPalette();
            loadQuestion(0);
            startTimer();

            document.getElementById('btnPrev').addEventListener('click', function () {
                if (currentIndex > 0) loadQuestion(currentIndex - 1);
            });
            document.getElementById('btnNext').addEventListener('click', function () {
                if (currentIndex < QUESTIONS.length - 1) loadQuestion(currentIndex + 1);
            });
            document.getElementById('btnFinish').addEventListener('click', finishTest);
            document.getElementById('markReviewCheckbox').addEventListener('change', function () {
                markedForReview[currentIndex] = this.checked;
                updatePaletteButton(currentIndex);
            });
            document.getElementById('sprAnswerInput').addEventListener('input', function () {
                userAnswers[currentIndex] = this.value.trim();
                updatePaletteButton(currentIndex);
            });
        });

        function startTimer() {
            var display = document.getElementById('timeRemaining');
            var timerBox = document.getElementById('timerBox');
            timerInterval = setInterval(function () {
                timeRemainingSec--;
                if (timeRemainingSec <= 0) {
                    clearInterval(timerInterval);
                    finishTest();
                    return;
                }
                var mins = Math.floor(timeRemainingSec / 60);
                var secs = timeRemainingSec % 60;
                display.innerText = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
                if (timeRemainingSec < 180) {
                    timerBox.classList.add('urgent');
                }
            }, 1000);
        }

        function buildPalette() {
            var grid = document.getElementById('paletteGrid');
            grid.innerHTML = '';
            QUESTIONS.forEach(function (q, idx) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'pal-btn';
                btn.innerText = idx + 1;
                btn.addEventListener('click', function () { loadQuestion(idx); });
                grid.appendChild(btn);
            });
        }

        function updatePaletteButton(idx) {
            var btns = document.querySelectorAll('.pal-btn');
            if (!btns[idx]) return;
            var isAnswered = userAnswers[idx] !== undefined && userAnswers[idx] !== '';
            var isMarked = markedForReview[idx] === true;
            var isCurrent = idx === currentIndex;

            btns[idx].className = 'pal-btn' +
                (isCurrent ? ' current' : '') +
                (isAnswered ? ' answered' : '') +
                (isMarked ? ' marked' : '');
        }

        function loadQuestion(idx) {
            currentIndex = idx;
            var q = QUESTIONS[idx];

            document.getElementById('qNumberDisplay').innerText = 'Question ' + (idx + 1) + ' of 20';
            document.getElementById('qDomainBadge').innerText = q.domain;
            document.getElementById('qText').innerHTML = q.q;
            document.getElementById('markReviewCheckbox').checked = markedForReview[idx] === true;

            var mcqBox = document.getElementById('mcqContainer');
            var sprBox = document.getElementById('sprContainer');

            if (q.type === 'mcq') {
                sprBox.style.display = 'none';
                mcqBox.style.display = 'flex';
                mcqBox.innerHTML = '';

                var letters = ['A', 'B', 'C', 'D'];
                q.options.forEach(function (opt, oIdx) {
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'test-opt-btn' + (userAnswers[idx] === opt ? ' selected' : '');
                    btn.innerHTML = '<span class="test-opt-letter">' + letters[oIdx] + '</span><span>' + opt + '</span>';
                    btn.addEventListener('click', function () {
                        userAnswers[idx] = opt;
                        document.querySelectorAll('.test-opt-btn').forEach(function (b) { b.classList.remove('selected'); });
                        btn.classList.add('selected');
                        updatePaletteButton(idx);
                    });
                    mcqBox.appendChild(btn);
                });
            } else {
                mcqBox.style.display = 'none';
                sprBox.style.display = 'block';
                var sprInput = document.getElementById('sprAnswerInput');
                sprInput.value = userAnswers[idx] || '';
            }

            document.getElementById('btnPrev').style.visibility = idx === 0 ? 'hidden' : 'visible';
            document.getElementById('btnNext').innerText = idx === QUESTIONS.length - 1 ? 'Review All' : 'Next Question →';

            QUESTIONS.forEach(function (_, i) { updatePaletteButton(i); });

            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([document.getElementById('qText')]);
            }
        }

        function parseNum(val) {
            if (!val) return null;
            val = String(val).trim();
            if (val.indexOf('/') !== -1) {
                var p = val.split('/');
                if (p.length === 2) {
                    var n = parseFloat(p[0]), d = parseFloat(p[1]);
                    if (!isNaN(n) && !isNaN(d) && d !== 0) return n / d;
                }
            }
            var v = parseFloat(val);
            return isNaN(v) ? null : v;
        }

        function finishTest() {
            if (timerInterval) clearInterval(timerInterval);

            var domainStats = {
                "Algebra": { total: 0, correct: 0 },
                "Advanced Math": { total: 0, correct: 0 },
                "Problem-Solving & Data Analysis": { total: 0, correct: 0 },
                "Geometry & Trigonometry": { total: 0, correct: 0 }
            };

            var totalCorrect = 0;
            QUESTIONS.forEach(function (q, idx) {
                domainStats[q.domain].total++;
                var uAns = userAnswers[idx];
                var isCorrect = false;

                if (uAns) {
                    if (q.type === 'mcq') {
                        isCorrect = uAns.trim().toLowerCase() === q.ans.trim().toLowerCase();
                    } else {
                        var uNum = parseNum(uAns);
                        var eNum = parseNum(q.ans);
                        if (uAns.trim().toLowerCase() === q.ans.trim().toLowerCase()) {
                            isCorrect = true;
                        } else if (uNum !== null && eNum !== null && Math.abs(uNum - eNum) < 1e-4) {
                            isCorrect = true;
                        }
                    }
                }

                if (isCorrect) {
                    domainStats[q.domain].correct++;
                    totalCorrect++;
                }
            });

            // Calculate Scaled SAT Score projection (200 - 800)
            // 20 correct -> 800, 0 correct -> 200
            var scaledScore = Math.round(200 + (totalCorrect / 20.0) * 600);
            if (scaledScore > 800) scaledScore = 800;
            if (scaledScore < 200) scaledScore = 200;

            var results = {
                totalCorrect: totalCorrect,
                totalQuestions: 20,
                scaledScore: scaledScore,
                domainStats: domainStats,
                timeSpentSeconds: (20 * 60) - timeRemainingSec
            };

            sessionStorage.setItem('sat_diagnostic_results', JSON.stringify(results));
            window.location.assign('/sat/diagnostic/result/');
        }
    </script>
</body>
</html>
