<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Evaluation System</title>
    <!-- Use FontAwesome for icons -->
    <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css?v=1781927005">
    <link rel="stylesheet" href="css/evaluator.css">
    <link rel="canonical" href="https://sjmaths.com/digital-evaluation/evaluator.html">
    <meta name="description" content="Digital Evaluation System study material for CBSE Maths on SJMaths with notes, questions, practice resources, and exam preparation support.">
    <meta property="og:title" content="Digital Evaluation System">
    <meta property="og:description" content="Digital Evaluation System study material for CBSE Maths on SJMaths with notes, questions, practice resources, and exam preparation support.">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://sjmaths.com/digital-evaluation/evaluator.html">
    <meta property="og:image" content="https://sjmaths.com/assets/icons/icon-512x512.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Digital Evaluation System">
    <meta name="twitter:description" content="Digital Evaluation System study material for CBSE Maths on SJMaths with notes, questions, practice resources, and exam preparation support.">
    <meta name="twitter:image" content="https://sjmaths.com/assets/icons/icon-512x512.png">
    <meta name="robots" content="noindex, follow">
</head>

<body>
    <h1 class="seo-page-title">Digital Evaluation System</h1>
    <!-- Top Header Bar -->
    <header class="eval-header">
        <div class="subject-title">Subject : (0412) Mathematics-Set-2</div>
        <div class="header-controls">
            <span>Evaluator ID: E2733481</span>
            <button class="btn-exit">Exit</button>
        </div>
    </header>

    <div class="eval-layout">
        <!-- Left Sidebar (Questions & Marks) -->
        <aside class="eval-sidebar" id="sidebar">
            <div class="script-info">
                <div>Script ID : 159764</div>
                <div>User ID : E2733481</div>
                <div>User Role : Evaluator</div>
            </div>

            <div class="marks-table-header">
                <div class="col-qno">Q.No.</div>
                <div class="col-max">Max.<br>Marks</div>
                <div class="col-marks">Marks</div>
                <div class="col-steps">Steps</div>
            </div>

            <div class="marks-table-body" id="questionsList">
                <!-- Javascript will populate rows here (Q1 to Q12 etc) -->
            </div>

            <div class="marks-total-bar">
                <div class="status-box na">NA</div>
                <div class="total-score" id="totalScoreBox">Total : 00/80</div>
            </div>
        </aside>

        <!-- Main Workspace (Canvas Area) -->
        <main class="eval-workspace">
            <div class="canvas-container-wrapper" id="canvasWrapper">
                <!-- Fabric.js Canvas -->
                <canvas id="evalCanvas"></canvas>
            </div>
        </main>
    </div>

    <!-- Bottom Toolbar -->
    <footer class="eval-toolbar">
        <div class="thumbnail-nav" id="thumbnailNav">
            <!-- Emulated Pages -->
            <button class="thumb-btn active">01</button>
            <button class="thumb-btn">02</button>
            <button class="thumb-btn">03</button>
            <button class="thumb-btn">04</button>
        </div>

        <div class="image-controls">
            <div class="control-group">
                <div class="control-label">Brightness: <span id="brightnessVal">100</span> <a href="#"
                        class="reset-link">Reset</a></div>
                <input type="range" class="slider" min="0" max="200" value="100" id="brightnessSlider">
            </div>
            <div class="control-group">
                <div class="control-label">Contrast: <span id="contrastVal">100</span> <a href="#"
                        class="reset-link">Reset</a></div>
                <input type="range" class="slider" min="0" max="200" value="100" id="contrastSlider">
            </div>
            <div class="zoom-controls">
                <button class="tool-btn" id="btnZoomIn"><i class="fas fa-search-plus"></i></button>
                <button class="tool-btn" id="btnZoomOut"><i class="fas fa-search-minus"></i></button>
                <button class="tool-btn" id="btnRotate"><i class="fas fa-undo"></i></button>
                <button class="tool-btn" id="btnFit"><i class="fas fa-expand"></i></button>
            </div>
        </div>

        <div class="annotation-tools">
            <button class="tool-btn" id="toolSelect" title="Select Tool"><i class="fas fa-mouse-pointer"></i></button>
            <button class="tool-btn" id="toolText" title="Add Text/Marks (M)"><span class="bold-text">M</span></button>
            <button class="tool-btn tool-active" id="toolTick" title="Tick Mark"><i class="fas fa-check"
                    style="color: #2e7d32;"></i></button>
            <button class="tool-btn" id="toolCross" title="Cross Mark"><i class="fas fa-times"
                    style="color: #c62828;"></i></button>
            <button class="tool-btn" id="toolDraw" title="Freehand Draw"><i class="fas fa-pen"
                    style="color: #8e44ad;"></i></button>
            <button class="tool-btn" id="toolEraser" title="Remove Graphic"><i class="fas fa-eraser"
                    style="color: #d32f2f;"></i></button>
        </div>

        <div class="action-buttons">
            <button class="btn-action save-btn"><i class="fas fa-save"></i><br>SAVE</button>
            <div class="action-col">
                <button class="btn-sub btn-sol">Sol.</button>
                <button class="btn-sub btn-ufm">UFM</button>
            </div>
            <div class="action-col">
                <button class="btn-sub btn-qp">Q.P.</button>
                <button class="btn-sub btn-reject">Reject</button>
            </div>
            <div class="action-col">
                <button class="btn-primary-action submit">Submit</button>
                <button class="btn-primary-action exit">Exit</button>
            </div>
        </div>
    </footer>

    <!-- Fabric.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="js/evaluator.js"></script>
</body>

</html>
