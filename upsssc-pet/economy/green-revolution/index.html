              "hi": "• **P — PL-480 पर निर्भरता:** गंभीर खाद्यान्न की कमी के दौरान भारत पब्लिक लॉ 480 (फूड फॉर पीस) के तहत अमेरिकी गेहूँ के आयात पर बहुत अधिक निर्भर था।\n• **L — निम्न कृषि उत्पादकता:** स्वतंत्रता के बाद पारंपरिक बीजों और वर्षा पर आधारित खेती के कारण पैदाوار रुकी रही।\n• **U — अनिश्चित मानसून:** **1965** और **1966** में लगातार विनाशकारी सूखे ने राष्ट्रीय अस्तित्व को खतरे में डाल दिया था।\n• **G — अनाज की कमी का संकट:** भारत को गंभीर 'शिप-टू-माउथ' (हाथ से मुँह तक) की स्थिति का सामना करना पड़ा, जिसके कारण प्रधानमंत्री **लाल बहादुर शास्त्री** ने 1965 में **'जय जवान जय किसान'** का नारा दिया।\n• **स्मृति-चिह्न:** खाद्य घाटे को **PLUG** (प्लग) करना (**P**L-480, **L**ow productivity/कम उत्पादकता, **U**npredictable monsoons/अनिश्चित मानसून, **G**rain shortage/अनाज की कमी)।"

          {
            "title": {
              "en": "2. Five Core Technological Pillars (Mnemonic: **FARM-I**)",
              "hi": "2. पाँच मुख्य तकनीकी स्तंभ (स्मृति-चिह्न: **FARM-I**)"

            "content": {
              "en": "• **F — Fertilizers:** High application of chemical Nitrogen, Phosphorus, and Potassium (**NPK**) fertilizers.\n• **A — Assured Irrigation:** Rapid expansion of canal networks, tubewells, and electrical pumpsets.\n• **R — Research & HYV Seeds:** Dwarf, non-lodging, high-response seed varieties developed by ICAR, CIMMYT, and IRRI.\n• **M — Mechanization:** Introduction of tractors, threshers, harvesters, and mechanical tillers for multi-cropping.\n• **I — Insecticides & Plant Protection:** Chemical pest and disease management to protect dense single-crop stands.\n• **Mnemonic:** **FARM-I** (**F**ertilizers, **A**ssured Irrigation, **R**esearch HYV Seeds, **M**echanization, **I**nsecticides).",
              "hi": "• **F — उर्वरक:** रासायनिक नाइट्रोजन, फॉस्फोरस और पोटेशियम (**NPK**) उर्वरकों का भारी उपयोग।\n• **A — सुनिश्चित सिंचाई:** नहर नेटवर्क, नलकूपों (ट्यूबवेल) और बिजली के पंपसेटों का तीव्र विस्तार।\n• **R — अनुसंधान और एच.वाई.वी. (HYV) बीज:** ICAR, CIMMYT और IRRI द्वारा विकसित बौनी, गिरने से बचाने वाली (non-lodging) और अधिक प्रतिक्रिया देने वाली बीज किस्में।\n• **M — मशीनीकरण:** बहु-फसल (multi-cropping) के लिए ट्रैक्टरों, थ्रेशर, हार्वेस्टर और यांत्रिक टिलर की शुरुआत।\n• **I — कीटनाशक और पादप सुरक्षा:** घनी एकल-फसल (single-crop) को बचाने के लिए रासायनिक कीट और रोग प्रबंधन।\n• **स्मृति-चिह्न:** **FARM-I** (**F**ertilizers/उर्वरक, **A**ssured Irrigation/सुनिश्चित सिंचाई, **R**esearch HYV Seeds/अनुसंधान HYV बीज, **M**echanization/मशीनीकरण, **I**nsecticides/कीटनाशक)।"

          {
            "title": {
              "en": "3. Temporal Phases of Implementation",
              "hi": "3. कार्यान्वयन के कालक्रम (चरण)"
            },
            "content": {
              "en": "• **Phase I (1966–1972):** Highly concentrated phase; limited to **Wheat** in **Punjab**, **Haryana**, and **Western UP**.\n• **Phase II (1970s–1980s):** Expansion phase; extended to **Rice** and spread to **Andhra Pradesh**, **Tamil Nadu**, **Coastal Odisha**, and **Eastern UP**.\n• **Phase III (1990s Onward / Evergreen Era):** Shift toward **sustainable agriculture**, eco-friendly technology, and crop diversification.\n• **Key Metric:** Wheat yield jumped from **827 kg/ha (1965-66)** to **2,281 kg/ha (1990-91)**.",
              "hi": "• **चरण I (1966–1972):** अत्यधिक केंद्रित चरण; **पंजाब**, **हरियाणा** और **पश्चिमी उत्तर प्रदेश** में केवल **गेहूँ** तक सीमित।\n• **चरण II (1970 के दशक–1980 के दशक):** विस्तार चरण; **चावल** तक विस्तारित और **आंध्र प्रदेश**, **तमिलनाडु**, **तटीय ओडिशा** और **पूर्वी उत्तर प्रदेश** तक फैला।\n• **चरण III (1990 का दशक और उसके बाद / सदाबहार युग):** **सतत कृषि**, पर्यावरण-अनुकूल तकनीक और फसल विविधीकरण की ओर बदलाव।\n• **प्रमुख आँकड़ा:** गेहूँ की उपज **827 किग्रा/हेक्टेयर (1965-66)** से बढ़कर **2,281 किग्रा/हेक्टेयर (1990-91)** हो गई।"
            }

          {
            "title": {
              "en": "4. Major Socio-Economic Benefits (Mnemonic: **S-C-O-P-E**)",
              "hi": "4. प्रमुख सामाजिक-आर्थिक लाभ (स्मृति-चिह्न: **S-C-O-P-E**)"
            },
            "content": {
              "en": "• **S — Self-Sufficiency:** Eliminated dependence on foreign food assistance and established buffer stock with **Food Corporation of India (FCI)**.\n• **C — Commercialization:** Shifted Indian agriculture from subsistence farming to market-oriented commercial production.\n• **O — Output Surge:** Massive increase in food grain production, especially wheat and rice ('Wheat Revolution').\n• **P — Prosperity of Farmers:** Surging farm revenues led to rural economic growth and capital formation in North India.\n• **E — Employment Generation:** Created massive seasonal employment in harvesting, transportation, processing, and machinery repair.\n• **Mnemonic:** **S-C-O-P-E** (**S**elf-Sufficiency, **C**ommercialization, **O**utput Surge, **P**rosperity, **E**mployment).",
              "hi": "• **S — आत्मनिर्भरता:** विदेशी खाद्य सहायता पर निर्भरता समाप्त की और **भारतीय खाद्य निगम (FCI)** के साथ बफर स्टॉक की स्थापना की।\n• **C — व्यावसायीकरण:** भारतीय कृषि को निर्वाह खेती (subsistence farming) से बाजार-उन्मुख व्यावसायिक उत्पादन में बदला।\n• **O — उत्पादन में भारी वृद्धि:** खाद्यान्न उत्पादन में भारी वृद्धि, विशेष रूप से गेहूँ और चावल ('गेहूँ क्रांति')।\n• **P — किसानों की समृद्धि:** बढ़ती कृषि आय से उत्तर भारत में ग्रामीण आर्थिक विकास और पूँजी निर्माण हुआ।\n• **E — रोजगार सृजन:** कटाई, परिवहन, प्रसंस्करण और मशीनरी मरम्मत में भारी मौसमी रोजगार का सृजन हुआ।\n• **स्मृति-चिह्न:** **S-C-O-P-E** (**S**elf-Sufficiency/आत्मनिर्भरता, **C**ommercialization/व्यावसायीकरण, **O**utput Surge/उत्पादन में वृद्धि, **P**rosperity/समृद्धि, **E**mployment/रोजगार)।"
            }
          },
          {
            "title": {
              "en": "5. Critical Drawbacks & Ecological Vulnerabilities (Mnemonic: **D-R-A-I-N**)",
              "hi": "5. गंभीर कमियाँ और पारिस्थितिक संवेदनशीलताएँ (स्मृति-चिह्न: **D-R-A-I-N**)"
            },
            "content": {
              "en": "• **D — Disparity Regional:** Created wide economic divide between prosperous North-West India and neglected Eastern/Central India.\n• **R — Resource Depletion:** Extreme over-extraction of groundwater via tubewells in **Punjab** and **Western UP**.\n• **A — Alkalinity & Salinity:** Over-irrigation and excessive chemical usage damaged soil pH and land fertility.\n• **I — Inequality Social:** Large landlords benefited disproportionately; small and marginal farmers slipped into debt.\n• **N — Narrow Crop Focus:** Neglect of **Pulses**, **Oilseeds**, and **Coarse Cereals** (Millets), causing 'Perverse Crop Substitution'.\n• **Mnemonic:** **D-R-A-I-N** (**D**isparity, **R**esource Depletion, **A**lkalinity, **I**nequality, **N**arrow Crop Focus).",
              "hi": "• **D — क्षेत्रीय असमानता:** समृद्ध उत्तर-पश्चिम भारत और उपेक्षित पूर्वी/मध्य भारत के बीच चौड़ी आर्थिक खाई पैदा की।\n• **R — संसाधन की कमी (क्षय):** **पंजाब** और **पश्चिमी उत्तर प्रदेश** में नलकूपों के माध्यम से भूजल का अत्यधिक दोहन।\n• **A — क्षारीयता और लवणता:** अत्यधिक सिंचाई और रसायनों के अत्यधिक उपयोग से मिट्टी के pH और भूमि की उर्वरता को नुकसान पहुँचा।\n• **I — सामाजिक असमानता:** बड़े जमींदारों को असंगत रूप से लाभ हुआ; छोटे और सीमांत किसान कर्ज के दलदल में फँस गए।\n• **N — संकीर्ण फसल फोकस:** **दालों**, **तिलहनों** और **मोटे अनाजों** (बाजरा आदि) की उपेक्षा, जिससे 'विपरीत फसल प्रतिस्थापन' (Perverse Crop Substitution) हुआ।\n• **स्मृति-चिह्न:** **D-R-A-I-N** (ड्रेन) (**D**isparity/असमानता, **R**esource Depletion/संसाधन क्षय, **A**lkalinity/क्षारीयता, **I**nequality/असमानता, **N**arrow Crop Focus/संकीर्ण फसल फोकस)।"
            }

            "title": {
              "en": "6. Modern Extensions: Rainbow & Evergreen Revolutions",
              "hi": "6. आधुनिक विस्तार: इंद्रधनुषी और सदाबहार क्रांतियाँ"

            "content": {
              "en": "• **Evergreen Revolution:** Coined by **Dr. M.S. Swaminathan** to achieve long-term agricultural productivity without ecological harm.\n• **Rainbow Revolution:** Comprehensive umbrella term combining ALL sectoral agricultural revolutions (Green, White, Yellow, Blue, Golden, Grey, Silver, Red).\n• **BGREI Scheme:** **Bring Green Revolution to Eastern India (2010-11)** targeted 7 states (including **Eastern UP**) to replicate Phase I success in eastern rice-growing belts.",
              "hi": "• **सदाबहार क्रांति:** पारिस्थितिक नुकसान के बिना दीर्घकालिक कृषि उत्पादकता प्राप्त करने के लिए **डॉ. एम.एस. स्वामीनाथन** द्वारा गढ़ा गया शब्द।\n• **इंद्रधनुषी क्रांति (Rainbow Revolution):** सभी क्षेत्रीय कृषि क्रांतियों (हरित, श्वेत, पीली, नीली, सुनहरी, धूसर, रजत, लाल) को मिलाने वाला व्यापक छत्र शब्द (umbrella term)।\n• **BGREI योजना:** **पूर्वी भारत में हरित क्रांति लाना (2010-11)** ने पूर्वी चावल उत्पादक क्षेत्रों में चरण I की सफलता को दोहराने के लिए 7 राज्यों (विशेषकर **पूर्वी उत्तर प्रदेश** सहित) को लक्षित किया।"
