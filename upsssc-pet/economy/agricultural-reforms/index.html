            "content": {
              "en": "• **Abolition of Intermediaries:** Removed **Zamindars**, **Ryots**, and **Mahals** to bring farmers in direct contact with the state.\n• **Tenancy Reforms:** Regulation of **rent levels** (capped at 1/4th to 1/5th of produce), **security of tenure**, and conferment of **ownership rights** to tenants.\n• **Ceiling on Land Holdings:** Imposed upper limit on agricultural land ownership to redistribute surplus land to **landless agricultural laborers**.\n• **Consolidation of Holdings (Chakbandi):** Merging fragmented scattered plots into compact unified land holdings.\n• **UP Specific Landmark:** Enacted **UP Zamindari Abolition and Land Reforms Act, 1950** which was enforced on **July 1, 1952**.\n• **Mnemonic for Land Reform Pillars:** **ATCC** -> **A**bolition of Intermediaries, **T**enancy Reforms, **C**eiling on Land, **C**hakbandi.",

              "en": "• **Green Revolution (1966-67):** Introduced **High Yielding Varieties (HYV)** seeds (wheat/rice), **chemical fertilizers**, and expanded **tubewell irrigation**. Promoted by **M.S. Swaminathan** in India and **Norman Borlaug** globally.\n• **PM Krishi Sinchayee Yojana (PMKSY - 2015):** Formulated by amalgmating **AIBP**, **IWMP**, and **On-Farm Water Management (OFWM)**.\n• **Core Motto of PMKSY:** **\"Har Khet Ko Pani\"** and **\"Per Drop More Crop\"** (focus on micro-irrigation like drip and sprinkler system).\n• **Command Area Development:** Accelerated completion of ongoing major and medium irrigation projects.\n• **Mnemonic for PMKSY Pillars:** **AIO** -> **A**IBP (Accelerated Irrigation Benefit), **I**WMP (Integrated Watershed Management), **O**FWM (On-Farm Water Management).",
              "hi": "• **हरित क्रांति (1966-67):** **उच्च उपज देने वाली किस्म (HYV)** के बीज (गेहूं/चावल), **रासायनिक उर्वरक** पेश किए गए, और **ट्यूबवेल सिंचाई** का विस्तार किया गया। भारत में **एम.एस. स्वामीनाथन** और वैश्विक स्तर पर **नॉर्मन बोरलॉग** द्वारा इसे बढ़ावा दिया गया।\n• **पीएम कृषि सिंचाइयों योजना (PMKSY - 2015):** **AIBP**, **IWMP**, और **ऑन-फार्म वाटर मैनेजमेंट (OFWM)** को मिलाकर तैयार की गई।\n• **PMKSY का मुख्य आदर्श वाक्य:** **\"हर खेत को पानी\"** और **\"प्रति बूंद अधिक फसल\"** (ड्रिप और स्प्रिंकलर प्रणाली जैसी सूक्ष्म सिंचाई पर ध्यान)।\n• **कमांड क्षेत्र विकास:** चल रही बड़ी और मध्यम सिंचाई परियोजनाओं को तेजी से पूरा करना।\n• **PMKSY स्तंभों के लिए म्नेमोनिक:** **AIO** -> **A**IBP (त्वरित सिंचाई लाभ), **I**WMP (एकीकृत वाटरशेड प्रबंधन), **O**FWM (ऑन-फार्म जल प्रबंधन)।"

            "title": {
              "en": "3. Price Support System & MSP Calculation Rules",
              "hi": "3. मूल्य समर्थन प्रणाली और एमएसपी गणना नियम"
            },
            "content": {
              "en": "• **Commission for Agricultural Costs & Prices (CACP):** Established in **1965** (originally as Agricultural Prices Commission); recommends MSP for **22 mandated crops** and **Fair and Remunerative Price (FRP)** for sugarcane.\n• **Final Approving Authority:** **Cabinet Committee on Economic Affairs (CCEA)** chaired by the **Prime Minister**.\n• **Cost Concepts Used by CACP:**\n  - **A2:** Direct paid-out costs on seeds, fertilizers, pesticides, hired labor, fuel, irrigation.\n  - **A2 + FL:** Includes **A2** plus estimated value of **unpaid family labor (FL)**.\n  - **C2:** Comprehensive cost including **A2 + FL** + **rental value of owned land** + **interest on fixed capital**.\n• **Swaminathan Committee Formula (2006):** Recommended MSP = **C2 + 50% margin**.\n• **Current Central Formula:** Government fixes MSP at minimum **1.5 times (A2 + FL)**.\n• **Mnemonic for Cost Hierarchy:** **A2 < A2+FL < C2** -> **A**ctuall paid < **F**amily added < **C**omprehensive.",
              "hi": "• **कृषि लागत और मूल्य आयोग (CACP):** **1965** में स्थापित (मूल रूप से कृषि मूल्य आयोग के रूप में); **22 अनिवार्य फसलों** के लिए एमएसपी और गन्ने के लिए **उचित और लाभकारी मूल्य (FRP)** की सिफारिश करता है।\n• **अंतिम अनुमोदन प्राधिकारी:** **प्रधानमंत्री** की अध्यक्षता वाली **आर्थिक मामलों की मंत्रिमंडलीय समिति (CCEA)**।\n• **CACP द्वारा प्रयुक्त लागत अवधारणाएँ:**\n  - **A2:** बीज, उर्वरक, कीटनाशक, किराए पर लिए गए श्रम, ईंधन, सिंचाई पर प्रत्यक्ष भुगतान की गई लागत।\n  - **A2 + FL:** इसमें **A2** के साथ **अवैतनिक पारिवारिक श्रम (FL)** का अनुमानित मूल्य शामिल है।\n  - **C2:** व्यापक लागत जिसमें **A2 + FL** + **स्वामित्व वाली भूमि का किराये का मूल्य** + **स्थिर पूंजी पर ब्याज** शामिल है।\n• **स्वामीनाथन समिति का फॉर्मूला (2006):** अनुशंसित MSP = **C2 + 50% मार्जिन**।\n• **वर्तमान केंद्रीय फॉर्मूला:** सरकार न्यूनतम **1.5 गुना (A2 + FL)** पर MSP तय करती है।\n• **लागत पदानुक्रम के लिए म्नेमोनिक:** **A2 < A2+FL < C2** -> **A**ctual paid (वास्तविक भुगतान) < **F**amily added (पारिवारिक जोड़ी गई) < **C**omprehensive (व्यापक)।"
            }

            "title": {

              "hi": "4. संस्थागत ऋण और वित्तीय सहायता सुधार"

            "content": {
              "en": "• **NABARD Setup:** Established on **July 12, 1982** under **NABARD Act 1981** based on recommendations of **B. Sivaraman Committee**.\n• **Kisan Credit Card (KCC - 1998):** Formulated on the recommendations of **R.V. Gupta Committee** to deliver flexible short-term institutional credit.\n• **Priority Sector Lending (PSL):** Commercial banks must direct **18% of ANBC** to agriculture, with a sub-target of **10%** for **Small and Marginal Farmers (SMFs)**.\n• **PM-KISAN (2019):** Income support scheme providing **₹6,000 per year** in **3 equal installments of ₹2,000** directly to landholding farmers' bank accounts via DBT.\n• **Interest Subvention Scheme:** Provides **2% interest subvention** and additional **3% prompt repayment incentive (PRI)** making effective interest rate **4% per annum** for short-term crop loans up to **₹3 Lakh**.",
              "hi": "• **नाबार्ड की स्थापना:** **बी. शिवरामन समिति** की सिफारिशों के आधार पर **नाबार्ड अधिनियम 1981** के तहत **12 जुलाई 1982** को स्थापित।\n• **किसान क्रेडिट कार्ड (KCC - 1998):** लचीला अल्पकालिक संस्थागत ऋण प्रदान करने के लिए **आर.वी. गुप्ता समिति** की सिफारिशों पर तैयार किया गया।\n• **प्राथमिकता प्राप्त क्षेत्र को ऋण (PSL):** वाणिज्यिक बैंकों को **ANBC का 18%** कृषि को देना होगा, जिसमें **छोटे और सीमांत किसानों (SMFs)** के लिए **10%** का उप-लक्ष्य शामिल है।\n• **पीएम-किसान (2019):** आय सहायता योजना जो DBT के माध्यम से सीधे भूमि धारक किसानों के बैंक खातों में **3 समान किस्तों में ₹2,000** प्रति वर्ष **₹6,000** प्रदान करती है।\n• **ब्याज अनुदान योजना:** **₹3 लाख** तक के अल्पकालिक फसल ऋणों के लिए **2% ब्याज अनुदान** और अतिरिक्त **3% समय पर भुगतान प्रोत्साहन (PRI)** प्रदान करती है जिससे प्रभावी ब्याज दर **4% प्रति वर्ष** हो जाती है।"

            "title": {

            "content": {
              "en": "• **e-NAM (National Agriculture Market - 2016):** Pan-India electronic trading portal integrating existing **APMC mandis** into a unified national market; managed by **Small Farmers Agribusiness Consortium (SFAC)**.\n• **PM Fasal Bima Yojana (PMFBY - 2016):** Comprehensive crop yield loss insurance scheme replacing NAIS/MNAIS.\n• **Uniform Low Premium Rates for PMFBY:**\n  - **1.5%** for all **Rabi crops**\n  - **2.0%** for all **Kharif crops**\n  - **5.0%** for **Commercial & Horticultural crops**\n• **Agriculture Infrastructure Fund (AIF - 2020):** **₹1 Lakh Crore** debt financing facility for post-harvest infrastructure projects from **2020 to 2032**.\n• **Mnemonic for PMFBY Premium:** **R-K-C = 1.5 - 2 - 5** -> **R**abi (1.5%), **K**harif (2%), **C**ommercial (5%).",
              "hi": "• **ई-नाम (राष्ट्रीय कृषि बाजार - 2016):** मौजूदा **APMC मंडियों** को एक एकीकृत राष्ट्रीय बाजार में एकीकृत करने वाला अखिल भारतीय इलेक्ट्रॉनिक ट्रेडिंग पोर्टल; **स्मॉल फार्मर्स एग्रीबिजनेस कंसोर्टियम (SFAC)** द्वारा प्रबंधित।\n• **पीएम फसल बीमा योजना (PMFBY - 2016):** NAIS/MNAIS की जगह लेने वाली व्यापक फसल उपज नुकसान बीमा योजना।\n• **PMFBY के लिए एकसमान कम प्रीमियम दरें:**\n  - सभी **रबी फसलों** के लिए **1.5%**\n  - सभी **खरीफ फसलों** के लिए **2.0%**\n  - **वाणिज्यिक और बागवानी फसलों** के लिए **5.0%**\n• **कृषि अवसंरचना कोष (AIF - 2020):** **2020 से 2032** तक कटाई के बाद के बुनियादी ढांचा परियोजनाओं के लिए **₹1 लाख करोड़** की ऋण वित्तपोषण सुविधा।\n• **PMFBY प्रीमियम के लिए म्नेमोनिक:** **R-K-C = 1.5 - 2 - 5** -> **R**abi (1.5%), **K**harif (2%), **C**ommercial (5%)।"
