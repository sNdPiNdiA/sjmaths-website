            "content": {
              "en": "• **Rainwater Harvesting (RWH):** Technique of collection and storage of rainwater into natural reservoirs or sub-surface aquifers.\n• **Check Dams:** Small barriers built across the direction of water flow on shallow rivers to trap water.\n• **Farm Ponds:** Excavated structures to harvest rainwater for supplemental irrigation during dry spells.\n• **Mnemonic for Conservation Methods:** **R**avi **C**an **F**arm (**R**ainwater harvesting, **C**heck dams, **F**arm ponds).",
              "hi": "• **वर्षा जल संचयन (RWH):** वर्षा के पानी को प्राकृतिक जलाशयों या उप-सतही जलभृतों में एकत्र और संग्रहीत करने की तकनीक।\n• **चेक डैम:** पानी को रोकने के लिए उथली नदियों में जल प्रवाह की दिशा के आर-पार बनाए गए छोटे अवरोध।\n• **फार्म पॉन्ड (खेत तालाब):** सूखे के दौरान पूरक सिंचाई के लिए वर्षा जल संचयन हेतु खोदी गई संरचनाएँ।\n• **संरक्षण विधियों के लिए स्मृति सहायक:** **R**avi **C**an **F**arm (**R**ainwater harvesting, **C**heck dams, **F**arm ponds)।"
            }

            "title": {
              "en": "3. Regulatory Bodies and Acts",
              "hi": "3. नियामक निकाय और अधिनियम"
            },
            "content": {
              "en": "• **CGWB:** **Central Ground Water Board**, apex national body for scientific studies, monitoring, and assessment.\n• **CGWA:** **Central Ground Water Authority**, constituted under the **Environment (Protection) Act, 1986** for regulation and control.\n• **State Groundwater Departments:** Implement local state-level acts and NOC approvals for commercial extraction.\n• **Mnemonic for Regulatory Hierarchy:** **C**entral **G**overnment **S**aves **W**ater (**C**GWB, **C**GWA, **S**tate bodies).",
              "hi": "• **CGWB:** **केंद्रीय भूजल बोर्ड**, वैज्ञानिक अध्ययन, निगरानी और मूल्यांकन के लिए शीर्ष राष्ट्रीय निकाय।\n• **CGWA:** **केंद्रीय भूजल प्राधिकरण**, विनियमन और नियंत्रण के लिए **पर्यावरण (संरक्षण) अधिनियम, 1986** के तहत गठित।\n• **राज्य भूजल विभाग:** स्थानीय राज्य-स्तरीय अधिनियमों को लागू करना और व्यावसायिक निष्कर्षण के लिए एनओसी (NOC) अनुमोदन प्रदान करना।\n• **नियामक पदानुक्रम के लिए स्मृति सहायक:** **C**entral **G**overnment **S**aves **W**ater (**C**GWB, **C**GWA, **S**tate bodies)।"
            }
          },
          {
            "title": {
              "en": "4. Major Threats: Groundwater Depletion",
              "hi": "4. प्रमुख खतरे: भूजल का ह्रास"
            },
            "content": {
              "en": "• **Over-extraction:** Excessive pumping for agriculture (paddy and wheat) outpaces natural recharge.\n• **Salinity Intrusion:** Over-pumping in coastal areas causes saline sea water to contaminate fresh groundwater.\n• **Land Subsidence:** Compaction of aquifer layers when water is removed, leading to sinking land surfaces.\n• **Fluoride & Arsenic Contamination:** Geogenic contamination affecting the **Indo-Gangetic-Brahmaputra plain** (especially West Bengal and Uttar Pradesh).",
              "hi": "• **अत्यधिक निष्कर्षण:** कृषि (धान और गेहूं) के लिए अत्यधिक पंपिंग प्राकृतिक पुनर्भरण से अधिक हो रही है।\n• **लवणता घुसपैठ:** तटीय क्षेत्रों में अत्यधिक पंपिंग के कारण खारा समुद्री पानी ताजे भूजल को दूषित कर देता है।\n• **भूमि धंसाव:** पानी निकाले जाने पर जलभृत परतों का संकुचन, जिससे भूमि की सतह धंसने लगती है।\n• **फ्लोराइड और आर्सेनिक संदूषण:** भूगर्भीय संदूषण जो **इंडो-गंगा-ब्रह्मपुत्र के मैदान** (विशेषकर पश्चिम बंगाल और उत्तर प्रदेश) को प्रभावित कर रहा है।"
            }
          },
          {
            "title": {
              "en": "5. Government Schemes for Water Management",
              "hi": "5. जल प्रबंधन के लिए सरकारी योजनाएँ"
            },
            "content": {
              "en": "• **Atal Bhujal Yojana (ABHY):** Central sector scheme with **World Bank** assistance for sustainable groundwater management in **7 states**.\n• **Jal Jeevan Mission (JJM):** Aiming to provide safe and adequate drinking water through individual household tap connections.\n• **Mission Amrit Sarovar:** Launched in **2022** to develop/rejuvenate **75 water bodies** in each district of India.\n• **PMKSY (Pradhan Mantri Krishi Sinchayee Yojana):** Har Khet ko Pani and Per Drop More Crop initiatives.",
              "hi": "• **अटल भूजल योजना (ABHY):** **7 राज्यों** में स्थायी भूजल प्रबंधन के लिए **विश्व बैंक** की सहायता से संचालित केंद्रीय क्षेत्र की योजना।\n• **जल जीवन मिशन (JJM):** व्यक्तिगत घरेलू नल कनेक्शन के माध्यम से सुरक्षित और पर्याप्त पेयजल उपलब्ध कराने का लक्ष्य।\n• **मिशन अमृत सरोवर:** भारत के प्रत्येक जिले में **75 जल निकायों** को विकसित/पुनर्जीवित करने के लिए **2022** में शुरू किया गया।\n• **PMKSY (प्रधानमंत्री कृषि सिंचाई योजना):** 'हर खेत को पानी' और 'प्रति बूंद अधिक फसल' पहल।"
            }
          }
