            "content": {
              "en": "• **Weather:** State of the atmosphere over an area at a **short point in time** (e.g., sunny, rainy today).\n• **Climate:** Generalization of weather conditions over a **long period** (minimum **30 years**).\n• **Elements:** Both share identical elements — **Temperature, Pressure, Wind, Humidity, and Precipitation**.\n• **Mnemonic:** **W**eather is **W**ild and changes **W**eekly; **C**limate is **C**onsistent and calculated over **C**enturies (decades).",

              "hi": "• **परिभाषा:** एक वर्ष में हवा की दिशा का मौसमी उलटफेर।\n• **दक्षिण-पश्चिम मानसून:** **जून से सितंबर** तक चलता है, जो भारत की **75%** से अधिक वार्षिक वर्षा लाता है।\n• **शाखाएं:** **अरब सागर शाखा** और **बंगाल की खाड़ी शाखा** में विभाजित।\n• **मानसून का निवर्तन (लौटता मानसून):** **अक्टूबर-नवंबर** में होता है, जो **कोरोमंडल तट** (तमिलनाडु) पर वर्षा लाता है।\n• **स्मृति-सहायक:** **S**outh-West (दक्षिण-पश्चिम) **S**ummer (गर्मी) में **S**oaking (भरपूर) बारिश लाता है; **R**etreating (लौटता) मानसून **R**ight (दाहिनी ओर/पूर्वी तट) पर **R**ain (बारिश) लाता है।"
