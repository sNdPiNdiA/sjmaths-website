              "hi": "• **रेबीज (हाइड्रोफोबिया):** संक्रमित कुत्ते/जानवर के काटने से **हैबोवायरस** के कारण होता है; केंद्रीय तंत्रिका तंत्र को प्रभावित करता है।\n• **एड्स (AIDS):** **ह्यूमन इम्युनोडेफिशिएंसी वायरस (HIV)** के कारण होता है; **CD4+ T-लिम्फोसाइट्स** को लक्षित करता है; **ELISA** और **वेस्टर्न ब्लोट** द्वारा परीक्षण किया जाता है।\n• **पोलियो:** रीढ़ की हड्डी को प्रभावित करने वाला एंटरोवायरस, जिससे पक्षाघात (पैरालिसिस) होता है; **साल्क वैक्सीन** (इजेक्टेबल) और **सबिन वैक्सीन** (ओरल)।\n• **डेंगु:** **एडीज इजिप्टी** मच्छर द्वारा संचरित; अचानक तेज बुखार और **प्लेटलेट काउंट** में गिरावट का कारण बनता है।\n• **वायरल रोगों के लिए mnemonic:** **\" रेखा हमेंहिट करके पो पीछे छोड़ गई \"** -> रेबीज, खसरा, हर्पीज, मेनिंजाइटिस, हेपेटाइटिस, पोलियो, चिकनपॉक्स, चेचक (छोटा चेचक), एड्स, डेंगू, इन्फ्लूएंजा।"

              "hi": "• **मलेरिया:** **प्लाज्मोडियम** प्रजाति (विवैक्स, फाल्ciparum) के कारण होता है; मादा **एनोफिलीज मच्छर** द्वारा संचरित; **कुनैन** (सिनकोना की छाल से प्राप्त) से इलाज किया जाता है।\n• **अमीबायसिस (पेंचिश):** **एंटामोइबा हिस्टोलिटिका** के कारण होता है; दूषित भोजन और पानी से फैलता है।\n• **निद्रा रोग (स्लीपिंग सिकनेस):** **ट्रिपेनोसोमा** के कारण होता है; **त्से त्से मक्खी** द्वारा संचरित।\n• **काला-जार (लीशमैनियासिस):** **लीशमैनिया डोनोवानी** के कारण होता है; **सैंडफ्लाई (बालू मक्खी)** द्वारा संचरित।\n• **दाद (रिंगवर्म):** **माइक्रोस्पोरम**, **ट्राइकोफाइटन**, और **एपिडर्मोफाइटन** के कारण होने वाला फंगल संक्रमण।\n• **प्रोटोजोआ रोगों के लिए mnemonic:** **\" पापा काम पे सोते हैं \"** -> पा (पायरिया), पा (काला-जार), का (मलेरिया), म (अमीबी पेचिश), पे (निद्रा रोग)।"

            "content": {
              "en": "• **Down Syndrome:** Trisomy of **Chromosome 21**; causes mental retardation and distinct facial features.\n• **Turner Syndrome:** Monosomy of sex chromosomes (**45, XO**); affects females, leading to sterile short stature.\n• **Klinefelter Syndrome:** Presence of extra X chromosome (**47, XXY**); affects males, leading to gynecomastia and sterility.\n• **Hemophilia:** X-linked recessive bleeding disorder; also called **Bleeder's Disease** (royal disease).\n• **Color Blindness:** Inability to distinguish between red and green colors; X-linked recessive genetic trait.",
              "hi": "• **डाउन सिंड्रोम:** **गुणसूत्र 21** की ट्राइसोमी; मानसिक मंदता और विशिष्ट चेहरे की विशेषताओं का कारण बनता है।\n• **टर्नर सिंड्रोम:** सेक्स क्रोमोसोम की मोनोसोमी (**45, XO**); महिलाओं को प्रभावित करता है, जिससे बांझपन और कम लंबाई होती है।\n• **क्लाइनफेल्टर सिंड्रोम:** अतिरिक्त X गुणसूत्र की उपस्थिति (**47, XXY**); पुरुषों को प्रभावित करता है, जिससे गाइनेकोमेस्टिया (स्तनों का विकास) और बांझपन होता है।\n• **हीमोफिलिया:** X-लिंक्ड रिसेसिव ब्लीडिंग डिसऑर्डर; इसे **ब्लीडर्स डिजीज** (शाही बीमारी) भी कहा जाता है।\n• **वर्णांधता (कलर ब्लाइंडनेस):** लाल और हरे रंग के बीच अंतर करने में असमर्थता; X-लिंक्ड रिसेसिव आनुवंशिक गुण।"
