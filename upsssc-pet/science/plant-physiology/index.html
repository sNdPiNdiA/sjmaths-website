          {
            "title": {
              "en": "1. Photosynthesis & Chlorophyll Mechanics",

            },
            "content": {
              "en": "• Process by which green plants manufacture food using **sunlight**, **carbon dioxide**, and **water**.\n• Occurs inside **Chloroplasts** containing the green pigment **Chlorophyll**.\n• **Light Reaction (Thylakoid):** Photolysis of water releases oxygen and generates **ATP** and **NADPH**.\n• **Dark Reaction/Calvin Cycle (Stroma):** Fixation of $CO_2$ into glucose without direct light.\n• **Mnemonic for Phases:** **'L'ight in 'T'he 'S'un, 'D'ark in 'S'troma** (Light-Thylakoid-Sun, Dark-Stroma).",
              "hi": "• वह प्रक्रिया जिसके द्वारा हरे पौधे **सूर्य के प्रकाश**, **कार्बन डाइऑक्साइड** और **जल** का उपयोग करके भोजन बनाते हैं।\n• हरे वर्णक **क्लोरोफिल** युक्त **क्लोरोप्लास्ट (हरित लवक)** के अंदर होता है।\n• **प्रकाश अभिक्रिया (थायलाकोइड):** जल का फोटोलाइसिस (प्रकाशीय अपघटन) ऑक्सीजन छोड़ता है और **ATP** तथा **NADPH** उत्पन्न करता है।\n• **अंधकार अभिक्रिया/कैल्विन चक्र (स्ट्रोमा):** प्रत्यक्ष प्रकाश के बिना $CO_2$ का ग्लूकोज में स्थिरीकरण।\n• **चरणों के लिए म्निमोनिक्स:** **'L'ight in 'T'he 'S'un, 'D'ark in 'S'troma** (Light-Thylakoid-Sun, Dark-Stroma)."

              "hi": "2. श्वसन और ऊर्जा मुद्रा"

            "content": {
              "en": "• Breakdown of complex organic molecules to release energy in living cells.\n• Occurs continuously in both light and dark conditions.\n• **Glycolysis:** Takes place in the **cytoplasm** (glucose broken down to pyruvate).\n• **Krebs Cycle & ETS:** Takes place in the **mitochondria**.\n• Energy released is stored as **ATP (Adenosine Triphosphate)**.\n• **Mnemonic for Aerobic Steps:** **'G'et 'K'eys 'E'arly** (Glycolysis -> Krebs Cycle -> Electron Transport System).",
              "hi": "• जीवित कोशिकाओं में ऊर्जा छोड़ने के लिए जटिल कार्बनिक अणुओं का टूटना।\n• प्रकाश और अंधकार दोनों स्थितियों में लगातार होता है।\n• **ग्लाइकोलिसिस:** **कोशिका द्रव्य (साइटोप्लाज्म)** में होता है (ग्लूकोज पाइरुवेट में टूट जाता है)।\n• **क्रेब्स चक्र और ईटीएस (ETS):** **माइटोकॉन्ड्रिया** में होता है।\n• मुक्त ऊर्जा **ATP (एडेनोसिन ट्राइफॉस्फेट)** के रूप में संग्रहित होती है।\n• **वायवीय चरणों के लिए म्निमोनिक्स:** **'G'et 'K'eys 'E'arly** (Glycolysis -> Krebs Cycle -> Electron Transport System)."
            }
          },
          {
            "title": {
              "en": "3. Transpiration & Stomatal Regulation",
              "hi": "3. वाष्पोसर्जन और रंध्र नियमन"
            },
            "content": {
              "en": "• Loss of water in the form of water vapor from aerial parts of the plant.\n• Regulated by microscopic pores called **Stomata** present mostly on the **Leaf** surface.\n• Guard cells control the opening and closing of **stomata** based on turgor pressure and **potassium ion ($K^+$)** influx.\n• Creates a suction pull (transpiration pull) that helps in the ascent of sap from the **Root**.\n• **Mnemonic for Stomatal Opening:** **'K'eys 'O'pen 'W'ater** ($K^+$ influx leads to osmotic water entry and opening).",
