            },
            "content": {
              "en": "• **Distance:** Total path length covered by a moving object; it is a **scalar quantity**.\n• **Displacement:** Shortest straight-line distance between initial and final position; it is a **vector quantity**.\n• Magnitude of displacement is **always less than or equal to** distance.\n• **Mnemonic:** **SAD** (Scalar = Always Distance, Vector = Displacement) and **DV** (Displacement is Vector).",
              "hi": "• **दूरी:** किसी गतिमान वस्तु द्वारा तय की गई कुल पथ की लंबाई; यह एक **अदिश राशि (स्कॉलर क्वांटिटी)** है।\n• **विस्थापन:** प्रारंभिक और अंतिम स्थिति के बीच की सबसे छोटी सीधी रेखा की दूरी; यह एक **सदिश राशि (वेक्टर क्वांटिटी)** है।\n• विस्थापन का परिमाण दूरी से **हमेशा कम या बराबर** होता है।\n• **स्मृति सहायक (म्निमोनिक):** **SAD** (Scalar = Always Distance, Vector = Displacement) और **DV** (Displacement is Vector)।"

              "hi": "• **त्वरण:** समय के साथ वेग के परिवर्तन की दर ($a = \\frac{v-u}{t}$); मात्रक **m/s²** है।\n• मंदन **ऋणात्मक त्वरण** है जब वेग घटता है।\n• पहला समीकरण: **$v = u + at$**\n• दूसरा समीकरण: **$s = ut + \\frac{1}{2}at^2$**\n• तीसरा समीकरण: **$v^2 = u^2 + 2as$**\n• **समीकरणों के लिए म्निमोनिक:** **VUF** (Velocity = u + at), **SUT** (S = ut + half at square), **VUS** (v square = u square + 2as)।"

              "en": "Newton's Laws of Motion",

            "content": {
              "en": "• **First Law (Law of Inertia):** A body continues in its state of rest or uniform motion unless acted upon by an **external force**.\n• **Second Law (Law of Momentum):** Rate of change of momentum is directly proportional to the applied force ($F = ma$).\n• **Third Law (Action-Reaction):** To every action, there is an **equal and opposite reaction**.\n• **Mnemonic for Laws:** **FIN** (First = Inertia), **FMA** (Second = Force equals mass into acceleration), **AR** (Third = Action-Reaction).",
              "hi": "• **पहला नियम (जड़त्व का नियम):** कोई पिंड तब तक अपनी विराम अवस्था या एकसमान गति की अवस्था में रहता है जब तक उस पर कोई **बाहरी बल** न लगाया जाए।\n• **दूसरा नियम (संवेग का नियम):** संवेग के परिवर्तन की दर लगाए गए बल के समानुपाती होती है ($F = ma$)।\n• **तीसरा नियम (क्रिया-प्रतिक्रिया):** प्रत्येक क्रिया के लिए, एक **समान और विपरीत प्रतिक्रिया** होती है।\n• **नियमों के लिए म्निमोनिक:** **FIN** (First = Inertia), **FMA** (Second = Force equals mass into acceleration), **AR** (Third = Action-Reaction)।"
            }
          },

              "en": "Linear Momentum and Inertia",
              "hi": "रेखीय संवेग और जड़त्व"
            },
            "content": {
              "en": "• **Momentum ($p$):** Product of mass and velocity ($p = mv$); vector quantity, unit **kg·m/s**.\n• **Inertia:** Inherent property of a body to resist changes in its state of **rest or motion**.\n• Inertia is directly proportional to **mass** (heavier objects have more inertia).\n• Inertia of rest, inertia of motion, and inertia of direction are the three main types.",
              "hi": "• **संवेग ($p$):** द्रव्यमान और वेग का गुणनफल ($p = mv$); सदिश राशि, मात्रक **kg·m/s** है।\n• **जड़त्व:** किसी पिंड का अपनी **विराम या गति** की अवस्था में परिवर्तन का विरोध करने का आंतरिक गुण।\n• जड़त्व सीधे **द्रव्यमान** के समानुपाती होता है (भारी वस्तुओं में अधिक जड़त्व होता है)।\n• विराम का जड़त्व, गति का जड़त्व और दिशा का जड़त्व इसके तीन मुख्य प्रकार हैं।"
