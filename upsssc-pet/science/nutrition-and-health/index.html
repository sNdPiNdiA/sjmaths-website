              "hi": "• **संरचना:** कार्बन, हाइड्रोजन, ऑक्सीजन, नाइट्रोजन और कभी-कभी सल्फर युक्त **पेप्टाइड बॉन्ड** द्वारा जुड़े **अमीनो एसिड** के बहुलक (पॉलीमर्स)।\n• **आवश्यक अमीनो एसिड:** मानव शरीर द्वारा संश्लेषित नहीं किए जा सकते; इन्हें आहार के माध्यम से प्राप्त किया जाना चाहिए (जैसे, **लाइसिन, ल्यूसीन**)।\n• **अनावश्यक अमीनो एसिड:** शरीर के भीतर संश्लेषित होते हैं (जैसे, **अलैनिन, ग्लाइसिन**)।\n• **न्यूनता जनित रोग:** **क्वाशियोरकॉर** (पर्याप्त कैलोरी सेवन के साथ प्रोटीन की कमी) और **मैरास्मस** (समग्र प्रोटीन-ऊर्जा कुपोषण)।\n• **आवश्यक अमीनो एसिड के लिए म्नेमोनिक्स:** **PVT TIM HALL** (फेनिलएलनिन, वैलीन, थ्रियोनिन, ट्रिप्टोफैन, आइसोल्यूसीन, मेथिओनिन, हिस्टिडाइन, arginine, ल्यूसीन, लाइसिन)।"

          {
            "title": {

              "hi": "संतुलित आहार और न्यूनता जनित रोग"

            "content": {
              "en": "• **Balanced Diet:** Contains all essential nutrients in correct proportions (Carbohydrates 60-70%, Proteins 15-20%, Fats 20-25%).\n• **Malnutrition:** Condition resulting from lack of one or more nutrients.\n• **Protein-Energy Malnutrition (PEM):** Affects infants and young children primarily in developing nations.\n• **Water & Roughage:** Crucial non-nutrient components; water constitutes **60-70%** of adult human body weight.\n• **Mnemonic for Disease Classification:** **C-D-V** (Communicable, Deficiency, Viral/Bacterial).",
              "hi": "• **संतुलित आहार:** इसमें सही अनुपात में सभी आवश्यक पोषक तत्व होते हैं (कार्बोहाइड्रेट 60-70%, प्रोटीन 15-20%, वसा 20-25%)।\n• **कुपोषण:** एक या अधिक पोषक तत्वों की कमी के कारण उत्पन्न स्थिति।\n• **प्रोटीन-ऊर्जा कुपोषण (PEM):** मुख्य रूप से विकासशील देशों में शिशुओं और छोटे बच्चों को प्रभावित करता है।\n• **पानी और रफेज (कच्चे रेशे):** महत्वपूर्ण गैर-पोषक घटक; पानी वयस्क मानव शरीर के वजन का **60-70%** हिस्सा बनाता है।\n• **रोग वर्गीकरण के लिए म्नेमोनिक्स:** **C-D-V** (संचारी/संक्रामक, न्यूनता जनित, वायरल/बैक्टीरियल)।"
