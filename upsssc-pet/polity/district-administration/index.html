            "content": {
              "en": "• Post created in **1772** by **Governor-General Warren Hastings** as **Collector**.\n• Initially, the focus was solely on **revenue collection** and civil justice.\n• Lord Cornwallis separated revenue administration from judicial administration.\n• Later, magisterial powers were added, converting the Collector into the **District Magistrate**.\n• **Mnemonic for British Pioneers:** **'W-C-L'** (Warren Hastings created Collector, Lord Cornwallis separated Judiciary, Lytton expanded local bodies).",

            "content": {
              "en": "• **Head of Revenue Administration:** Manages land revenue, land reforms, record maintenance, and relief work.\n• **District Collector:** Recovery of government dues, issuance of certificates (domicile, caste, income).\n• **District Magistrate (Law & Order):** Controls police administration, executes **CrPC (Criminal Procedure Code)**, issues arms licenses, and supervises jails.\n• **District Election Officer:** Conducts Lok Sabha, Vidhan Sabha, and local body elections.\n• **Crisis & Disaster Manager:** Head of **District Disaster Management Authority (DDMA)**.",
              "hi": "• **राजस्व प्रशासन के प्रमुख:** भू-राजस्व, भूमि सुधार, रिकॉर्ड रख-रखाव और राहत कार्यों का प्रबंधन करते हैं।\n• **जिला कलेक्टर:** सरकारी बकाये की वसूली, प्रमाण पत्र (निवास, जाति, आय) जारी करना।\n• **जिला मजिस्ट्रेट (कानून और व्यवस्था):** पुलिस प्रशासन को नियंत्रित करते हैं, **सीआरपीसी (दंड प्रक्रिया संहिता)** लागू करते हैं, शस्त्र लाइसेंस जारी करते हैं, और जेलों का निरीक्षण करते हैं।\n• **जिला निर्वाचन अधिकारी:** लोकसभा, विधानसभा और स्थानीय निकाय चुनाव संपन्न कराते हैं।\n• **संकट और आपदा प्रबंधक:** **जिला आपदा प्रबंधन प्राधिकरण (DDMA)** के प्रमुख।"
