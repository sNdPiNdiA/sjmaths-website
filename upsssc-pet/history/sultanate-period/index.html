              "en": "• **Jalal-ud-din Khilji (1290–1296 AD):** Founder, known for his mild and lenient administration.\n• **Alauddin Khilji (1296–1316 AD):** First sultan to maintain a **permanent standing army**; introduced **cash salaries** and **branding of horses (Daag)** and **descriptive roll of soldiers (Chehra)**.\n• **Market Control Policy:** Established strict price controls and appointed **Diwan-i-Riyasat** and **Shahna-i-Mandi** to check cheating and hoarding.\n• **Land Revenue:** Raised land revenue to **50% of produce** (Biswa); measured land for tax assessment.\n• **Mnemonic for Alauddin's Military Reforms:** **D**o **C**ash **P**ayments (Daag, Chehra, Permanent army).",

              "hi": "• **ग्यासुद्दीन तुगलक (1320–1325 ई.):** **तुगलकाबंद** किलेबंद शहर का निर्माण किया; एक मंडप के गिरने से मृत्यु हो गई।\n• **मोहम्मद बिन तुगलक (1325–1351 ई.):** **बुद्धिमान मूर्ख / विरोधों का मिश्रण** के रूप में जाने जाते हैं; राजधानी **दिल्ली से दौलतबाद** (1327 ई.) स्थानांतरित की; **सांकेतिक मुद्रा** (चांदी के स्थान पर तांबे के सिक्के) की शुरुआत की।\n• **कृषि सुधार:** कृषि के लिए एक नया विभाग **दीवान-ए-कोही** बनाया।\n• **फिरोज शाह तुगलक (1351–1388 ई.):** सिंचाई के लिए व्यापक नहरें बनवाईं; **जौनपुर, हिसार, फिरोजबाद** जैसे शहर बसाए; **दीवान-ए-खैरात** (दान विभाग) और **दीवान-ए-बंदागान** (दास विभाग) की स्थापना की; जजिया कर सख्ती से वसूला।"

              "en": "• **Khizr Khan (1414–1421 AD):** Founder of Sayyid dynasty; ruled as a vassal of Timur.\n• **Bahlol Lodi (1451–1489 AD):** Founder of Lodi dynasty; respected Afghan nobles (called *Maqsad-i-Ali*).\n• **Sikandar Lodi (1489–1517 AD):** Founded **Agra city in 1504 AD** and made it his capital; introduced **Gaj-i-Sikandari** (32 digits yard) for land measurement; wrote Persian poetry under pen name **Gulrukhi**.\n• **Ibrahim Lodi (1517–1526 AD):** Last Lodi and last Delhi Sultan; arrogant ruler who alienated nobles; defeated and killed by **Babur** in the **First Battle of Panipat (1526 AD)**.",

              "en": "• **Diwan-i-Wizarat:** Department of Finance and Revenue, headed by **Wazir**.\n• **Diwan-i-Ariz:** Department of Military, headed by **Ariz-ud-mumalik**.\n• **Diwan-i-Insha:** Department of Royal Correspondence.\n• **Diwan-i-Rasalat:** Department of Religious affairs and appeals.\n• **Diwan-i-Bandagan:** Department of Slaves (created by Firuz Shah Tughlaq).\n• **Provincial Administration:** Provinces were called **Iqtas**, administered by **Iqtadars** or **Muqtis**.",
