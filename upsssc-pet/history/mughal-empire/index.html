              "hi": "• **अकबर** **बैरम खान** के संरक्षण में 13 वर्ष की आयु में गद्दी पर बैठे (**1556**)।\n• **हेमू** के खिलाफ **पानीपत का दूसरा युद्ध** (**1556**) जीता।\n• **जज़िया** (**1564**) और तीर्थयात्रा कर समाप्त किया; **सुल्ह-ए-कुल** (सभी के साथ शांति) और **दीन-ए-इलाही** (**1582**) की शुरुआत की।\n• **जहांगीर** ने न्याय (**ज़ंजीर-ए-अदल** या न्याय की जंजीर) पर ध्यान केंद्रित किया और चित्रकला को संरक्षण दिया।\n• जहांगीर के शासनकाल के दौरान **नूरजहां** (पत्नी) ने वास्तविक सत्ता का उपयोग किया।"

            "title": {
              "en": "Peak of Architecture and Decline (Shah Jahan & Aurangzeb)",

            },
            "content": {
              "en": "• **Shah Jahan**'s reign is known as the **Golden Age of Mughal Architecture** (**Taj Mahal**, **Red Fort**, **Jama Masjid**).\n• **Aurangzeb** (Alamgir) expanded the empire to its greatest territorial extent.\n• Re-imposed **Jizya** (**1679**), executed **Guru Tegh Bahadur** (9th Sikh Guru), and reversed liberal policies.\n• Led to massive rebellions by **Marathas** (**Shivaji**), **Sikhs**, and **Rajputs**, leading to empire's downfall.\n• **Mnemonic for Great 6 Mughals:** **B-H-A-J-S-A** (**B**abur, **H**umayun, **A**kbar, **J**ahangir, **S**hah Jahan, **A**urangzeb).",
              "hi": "• **शाहजहाँ** के शासनकाल को **मुगल वास्तुकला का स्वर्ण युग** कहा जाता है (**ताजमहल**, **लाल किला**, **जामा मस्जिद**)।\n• **औरंगजेब** (आलमगीर) ने साम्राज्य को उसके सबसे बड़े प्रादेशिक विस्तार तक पहुँचाया।\n• **जज़िया** कर पुनः लगाया (**1679**), **गुरु तेग बहादुर** (9वें सिख गुरु) को मृत्युदंड दिया, और उदार नीतियों को उलट दिया।\n• इससे **मराठाओं** (**शिवाजी**), **सिखों** और **राजपूतों** द्वारा बड़े पैमाने पर विद्रोह हुए, जिससे साम्राज्य का पतन हुआ।\n• **महान 6 मुगलों के लिए म्नेमोनिक:** **B-H-A-J-S-A** (**B**abur, **H**umayun, **A**kbar, **J**ahangir, **S**hah Jahan, **A**urangzeb)।"
            }

            "title": {
              "en": "Mughal Administration and Revenue Systems",
              "hi": "मुगल प्रशासन और राजस्व प्रणाली"

            "content": {
              "en": "• **Mansabdari System:** Introduced by **Akbar**, graded civil and military officials (**Zat** for rank, **Sawar** for cavalry).\n• **Zabti / Dahsala System:** Revenue system managed by **Todar Mal** (Akbar's revenue minister), fixing tax based on 10-year average yield.\n• **Central Administration:** **Wakil** (Prime minister), **Diwan** (Revenue head), **Mir Bakshi** (Military head & intelligence), **Sadr-us-Sudur** (Ecclesiastical & grants head).\n• Provincial administration divided into **Subas** (governed by **Subedar**), **Sarkars**, and **Parganas**.",
              "hi": "• **मनसबदारी प्रणाली:** **अकबर** द्वारा शुरू की गई, सिविल और सैन्य अधिकारियों को श्रेणीबद्ध किया गया (पद के लिए **जात**, घुड़सवार सेना के लिए **सवार**)।\n• **जब्ती / दहसाला प्रणाली:** **टोडरमल** (अकबर के राजस्व मंत्री) द्वारा प्रबंधित राजस्व प्रणाली, जिसमें 10 साल की औसत उपज के आधार पर कर तय किया गया।\n• **केंद्रीय प्रशासन:** **वकील** (प्रधान मंत्री), **दीवान** (राजस्व प्रमुख), **मीर बख्शी** (सैन्य प्रमुख और खुफिया), **सद्र-उस-सुदूर** (धार्मिक मामलों और अनुदान प्रमुख)।\n• प्रांतीय प्रशासन **सूबा** (**सूबेदार** द्वारा शासित), **सरकार** और **परगना** में विभाजित था।"
            }

            "title": {
              "en": "Art, Culture, and Literature",
              "hi": "कला, संस्कृति और साहित्य"

            "content": {
              "en": "• **Painting:** Reached pinnacle under **Jahangir** (masters like **Ustad Mansur** and **Abul Hasan**).\n• **Literature:** **Ain-i-Akbari** and **Akbarnama** written by **Abul Fazl** in Persian; **Padshahnama** by **Abdul Hamid Lahori**.\n• **Translation Bureau (Maktab Khana):** Sanskrit works like **Mahabharata** translated into Persian as **Razmnama**.\n• **Architecture Style:** Use of **Pietra Dura** (inlay work with semi-precious stones), **Charbagh** garden layout, and marble domes.",
              "hi": "• **चित्रकला:** **जहांगीर** के शासनकाल में अपने चरम पर पहुँची (**उस्ताद मंसूर** और **अुल हसन** जैसे उस्ताद)।\n• **साहित्य:** **अबुल फजल** द्वारा फारसी में लिखित **आइन-ए-अकबरी** और **अकबरनामा**; **अब्दुल हमीद लाहौरी** द्वारा **पादशाहनामा**।\n• **अनुवाद ब्यूरो (मक्तब खाना):** **महाभारत** जैसे संस्कृत ग्रंथों का फारसी में **रज्मनामा** के रूप में अनुवाद किया गया।\n• **वास्तुकला शैली:** **पिएत्रा दुरा** (अर्ध-कीमती पत्थरों के साथ जड़ाऊ काम), **चारबाग** उद्यान लेआउट और संगमरमर के गुंबदों का उपयोग।"
