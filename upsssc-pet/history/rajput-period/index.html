              "en": "• Ruled by the **Sisodia** (earlier Guhila) clan from their capital at **Mewar** (Chittorgarh).\n• **Mahana Kumbha:** Built the **Kirti Stambh** (Tower of Victory) at Chittorgarh and was an accomplished musician/scholar.\n• **Maharana Sanga (Sangram Singh):** United various **Rajputana** clans against **Babur** in the **Battle of Khanwa** (1527).\n• **Maharana Pratap:** Fought the legendary **Battle of Haldighati** (1576) against Mughal Emperor Akbar's forces led by Man Singh, relying on guerrilla warfare with his loyal horse **Chetak**.",

              "en": "• **Feudal Hierarchy:** The **Samanta system** weakened central authority as regional lords held immense autonomy.\n• **Position of Women:** Practices like **Jauhar** (mass self-immolation by women) and **Sati** emerged prominently during times of defeat to protect honor.\n• **Temple Architecture:** Developed the **Nagara style**, characterized by curvilinear towers (*Shikhara*), pillared halls (*Mandapa*), and intricate carvings.\n• **Literary Patronage:** Flourished with works in Sanskrit and Apabhramsha, including **Kalhana**'s *Rajatarangini* and **Jayadeva**'s *Gita Govinda*.",
