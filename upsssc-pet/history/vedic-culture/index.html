              "hi": "• **पूर्व वैदिक काल (ऋग्वैदिक काल):** 1500 ईसा पूर्व – 1000 ईसा पूर्व; मुख्य रूप से पशुपालक, कबीलाई समाज, **ऋग्वेद** की रचना।\n• **उत्तर वैदिक काल:** 1000 ईसा पूर्व – 600 ईसा पूर्व; स्थिर कृषि, लोहे की खोज (**चित्रित धूसर मृद्भांड - PGW** संस्कृति), अन्य तीन वेदों, ब्राह्मण ग्रंथों और उपनिषदों की रचना।\n• **सामाजिक बदलाव:** कबीलाई समानता और पशु-धन से लेकर प्रादेशिक राज्यों, जाति की कठोरता और कराधान (कर प्रणाली) तक।"
            }
          },
          {
            "title": {
              "en": "3. The Four Vedas and Literature",
              "hi": "3. चारों वेद और साहित्य"
            },
            "content": {
              "en": "• **Rig Veda:** Collection of hymns, praises of deities, contains the famous **Gayatri Mantra** (Mandala 3, dedicated to Savitri) and **Purusha Sukta** (origin of Varna in Mandala 10).\n• **Samaveda:** Book of chants, musical notes (origin of Indian classical music).\n• **Yajurveda:** Book of sacrificial rituals, prose and poetry formats.\n• **Atharvaveda:** Book of charms, spells, traditional medicines, and worldly affairs.\n• **Mnemonic for Vedas:** **'R-S-Y-A'** -> **R**igveda, **S**amaveda, **Y**ajurveda, **A**tharvaveda.",
              "hi": "• **ऋग्वेद:** भजनों का संग्रह, देवताओं की स्तुति, प्रसिद्ध **गायत्री मंत्र** (मंडल 3, सावित्री को समर्पित) और **पुरुष सूक्त** (मंडल 10 में वर्ण की उत्पत्ति) शामिल हैं।\n• **सामवेद:** मंत्रों/गान की पुस्तक, संगीत के स्वर (भारतीय शास्त्रीय संगीत का उद्गम)।\n• **यजुर्वेद:** यज्ञ संबंधी अनुष्ठानों की पुस्तक, गद्य और पद्य दोनों प्रारूपों में।\n• **अथर्ववेद:** जादू-टोने, मंत्रों, पारंपरिक औषधियों और सांसारिक मामलों की पुस्तक।\n• **वेदों के लिए म्नोनिक:** **'R-S-Y-A'** -> **R**igveda, **S**amaveda, **Y**ajurveda, **A**tharvaveda।"
            }
          },
          {
            "title": {
              "en": "4. Vedic Literature Hierarchy",
              "hi": "4. वैदिक साहित्य पदानुक्रम"
            },
            "content": {
              "en": "• **Samhitas:** The core Vedic texts (four Vedas).\n• **Brahmanas:** Prose commentaries on rituals and sacrifices (e.g., Shatapatha Brahmana).\n• **Aranyakas:** Forest books dealing with meditation and mysticism.\n• **Upanishads:** Philosophical treatises dealing with **Atman** and **Brahman** (Total 108 Upanishads; Satyameva Jayate taken from Mundaka Upanishad).",
              "hi": "• **संहिता:** मूल वैदिक ग्रंथ (चारों वेद)।\n• **ब्राह्मण ग्रंथ:** अनुष्ठानों और यज्ञों पर गद्य टीकाएँ (उदा., शतपथ ब्राह्मण)।\n• **आरण्यक:** ध्यान और रहस्यवाद से संबंधित वन ग्रंथ।\n• **उपनिषद:** **आत्मा** और **ब्रह्म** से संबंधित दार्शनिक ग्रंथ (कुल 108 उपनिषद; 'सत्यमेव जयते' मुंडक उपनिषद से लिया गया है)।"
            }
          },
          {
            "title": {
              "en": "5. Economy and Polity in Vedic Times",
              "hi": "5. वैदिक काल में अर्थव्यवस्था और राजव्यवस्था"
            },
            "content": {
              "en": "• **Economy:** Cattle (**Gau**) was the chief currency and measure of wealth in Rig Vedic times; agriculture became dominant in Later Vedic times.\n• **Polity Hierarchy:** **Kula** (family) -> **Grama** (village) -> **Vis** (clan) -> **Jana** (tribe) -> **Rashtra** (territory).\n• **Assemblies:** **Sabha** (council of elders/nobles) and **Samiti** (general assembly of people) actively checked royal power.",
              "hi": "• **अर्थव्यवस्था:** ऋग्वैदिक काल में गाय (**गौ**) मुख्य मुद्रा और धन का पैमाना थी; उत्तर वैदिक काल में कृषि प्रमुख हो गई।\n• **राजव्यवस्था पदानुक्रम:** **कुल** (परिवार) -> **ग्राम** (गाँव) -> **विश** (कुल/कबीले का भाग) -> **जन** (कबीला) -> **राष्ट्र** (क्षेत्र)।\n• **सभाएँ:** **सभा** (बुजुर्गों/अभिजात वर्ग की परिषद) और **समिति** (लोगों की सामान्य सभा) ने शाही शक्ति पर सक्रिय रूप से नियंत्रण रखा।"
            }
          }
        ]
