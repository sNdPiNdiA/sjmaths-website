            "content": "• **तत्सम शब्द** का विलोम केवल **तत्सम** ही होगा।\n• **तद्भव शब्द** का विलोम केवल **तद्भव** ही होगा।\n• **उदाहरण (तत्सम):** **अंधकार** का विलोम **प्रकाश** (न कि 'उजाला')।\n• **उदाहरण (तद्भव):** **अंधेरा** का विलोम **उजाला** (न कि 'प्रकाश')।\n• **10+ प्रमुख उदाहरण:**\n1. **अग्नि** → **जल**\n2. **अति** → **अल्प**\n3. **अमृत** → **विष**\n4. **अनुराग** → **विराग**\n5. **उत्कर्ष** → **अपकर्ष**\n6. **गुरु** → **लघु**\n7. **चेतन** → **जड़**\n8. **प्रत्यक्ष** → **परोक्ष / अप्रत्यक्ष**\n9. **स्थावर** → **जंगम**\n10. **ऋजु** → **वक्र**\n11. **आहुत** → **अनाहुत**\n• **ट्रिक (Mnemonic):** **'तत्सम-तत्सम, तद्भव-तद्भव, जात न बदलो भाई!'** (यदि प्रश्न संस्कृत/तत्सम में है, तो उत्तर भी संस्कृत/तत्सम ही चुनें)।"

        if (btnHi) btnHi.setAttribute('aria-pressed', String(lang === 'hi'));
        try { localStorage.setItem('sj_pref_lang', lang); } catch (e) { }
      };
      document.addEventListener('DOMContentLoaded', () => {
        const pref = (localStorage.getItem('sj_pref_lang') || 'en');
        apply(pref);
        if (btnEn) btnEn.addEventListener('click', () => apply('en'));
        if (btnHi) btnHi.addEventListener('click', () => apply('hi'));
      });
    })();
  </script>
