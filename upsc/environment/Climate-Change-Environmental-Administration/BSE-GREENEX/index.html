<h1>BSE - GREENEX</h1>
<p>Study guide for BSE - GREENEX (UPSC Civil Services Prelims &amp; Mains). Access key concepts, syllabus details, prep checklist, and interactive practice questions.</p>
<h3>1. Core Study Notes</h3><h4>Pointwise Study Notes</h4><ol class="pointwise-study-notes"><li><strong>Definition of BSE GREENEX</strong>: BSE GREENEX is the first carbon-based index launched by the Bombay Stock Exchange in collaboration with IIM Ahmedabad to gauge the carbon performance of Indian companies.</li><li><strong>Objective</strong>: The primary objective is to identify and highlight companies that are energy efficient and proactively mitigate climate change risks through sustainable business operations.</li><li><strong>Base Date and Value</strong>: The index was officially launched with a base date of August 24, 2010, set at a base value of 100 points.</li><li><strong>Constituent Selection</strong>: Constituents are selected from the broader BSE 100 index by filtering companies based on their greenhouse gas emissions intensity relative to their financial performance.</li><li><strong>Key Performance Metric</strong>: The index evaluates energy efficiency using greenhouse gas emission intensity per unit of total income, making it a relative measure rather than an absolute cap.</li><li><strong>Dual Evaluation Approach</strong>: It uniquely combines financial market performance with environmental efficiency data, penalizing high carbon emitters and rewarding low carbon emitters.</li><li><strong>Market Significance</strong>: It provides institutional and retail investors with a benchmark to construct green portfolios and channel investments toward sustainable Indian corporations.</li><li><strong>Policy Alignment</strong>: GREENEX aligns with India&#39;s broader climate commitments under the National Action Plan on Climate Change and voluntary emission reduction goals.</li><li><strong>Limitations</strong>: Adoption remains limited because voluntary carbon disclosures in India lack uniform standardization, reducing the absolute comparability across diverse industrial sectors.</li></ol><div class="upsc-study-aids"><section class="upsc-study-aid upsc-study-mind-map"><h3>Mind Map</h3><p><strong>BSE GREENEX</strong></p><ul><li><strong>Overview</strong><ul><li>Launched by BSE</li><li>IIM Ahmedabad collab</li><li>Base year 2010</li></ul></li><li><strong>Mechanism</strong><ul><li>BSE 100 subset</li><li>Emission intensity</li><li>Energy efficiency</li></ul></li><li><strong>Significance</strong><ul><li>Green investing</li><li>Market benchmark</li><li>Policy alignment</li></ul></li></ul></section><section class="upsc-study-aid upsc-study-table"><div class="upsc-study-table-wrap" role="region" aria-label="Study aid table" tabindex="0" style="max-width:100%;overflow-x:auto"><table><caption>Comparison of BSE Indices</caption><thead><tr><th scope="col">Parameter</th><th scope="col">BSE GREENEX</th></tr></thead><tbody><tr><th scope="row">Primary Focus</th><td>Energy efficiency and carbon emission intensity</td></tr><tr><th scope="row">Universe</th><td>Filtered subset of BSE 100 companies</td></tr></tbody></table></div></section><section class="upsc-study-aid upsc-study-mnemonics"><h3>Mnemonics</h3><ul><li><strong>GREENEX Core Elements</strong><p>Recall phrase: B I E</p><dl><dt>B</dt><dd>Bombay Stock Exchange</dd><dt>I</dt><dd>IIM Ahmedabad collaboration</dd><dt>E</dt><dd>Emission intensity metric</dd></dl><p><strong>Use:</strong> Remembering development partners and core metric.</p></li></ul></section><section class="upsc-study-aid upsc-study-tricks"><h3>Methods and Tricks</h3><ul><li><strong>Filtering Logic Method</strong><ol><li>Start with the broad BSE 100 universe.</li><li>Apply financial liquidity screens.</li><li>Rank companies by GHG emission intensity per unit of income.</li></ol><p><strong>Exam use:</strong> Tracing how GREENEX constituents are filtered from standard indices.</p></li></ul></section><section class="upsc-study-aid upsc-study-tips"><h3>Exam Tips</h3><ul><li><strong>Mains Integration</strong>: Use BSE GREENEX as a practical example of market-based financial instruments driving corporate environmental accountability in GS Paper III.</li><li><strong>Prelims Focus</strong>: Remember that GREENEX measures relative carbon/energy efficiency rather than absolute carbon neutrality.</li></ul></section><section class="upsc-study-aid upsc-study-traps"><h3>Prelims Traps and Corrections</h3><ul><li><strong>Confusing GREENEX with a mandatory carbon trading cap-and-trade scheme.</strong>: GREENEX is a stock market index tracking energy efficiency, not a regulatory carbon market mechanism.</li><li><strong>Assuming GREENEX covers all listed companies on the BSE.</strong>: Constituents are derived specifically from the BSE 100 index universe.</li></ul></section></div>

<h1>BSE - GREENEX</h1>
<p>Study guide for BSE - GREENEX (UPSC Civil Services Prelims &amp; Mains). Access key concepts, syllabus details, prep checklist, and interactive practice questions.</p>
<h3>1. Core Study Notes</h3><h4>बिंदुवार अध्ययन नोट्स</h4><ol class="pointwise-study-notes"><li><strong>BSE GREENEX की परिभाषा</strong>: BSE GREENEX बॉम्बे स्टॉक एक्सचेंज द्वारा IIM अहमदाबाद के सहयोग से शुरू किया गया पहला कार्बन-आधारित सूचकांक है, जो भारतीय कंपनियों के कार्बन प्रदर्शन को मापता है।</li><li><strong>उद्देश्य</strong>: इसका प्राथमिक उद्देश्य उन कंपनियों की पहचान करना और उन्हें उजागर करना है जो ऊर्जा कुशल हैं और टिकाऊ व्यावसायिक संचालन के माध्यम से जलवायु परिवर्तन के जोखिमों को सक्रिय रूप से कम करती हैं।</li><li><strong>आधार तिथि और मूल्य</strong>: यह सूचकांक आधिकारिक तौर पर 24 अगस्त, 2010 की आधार तिथि के साथ 100 अंकों के आधार मूल्य पर लॉन्च किया गया था।</li><li><strong>घटक चयन</strong>: घटकों का चयन व्यापक BSE 100 सूचकांक से कंपनियों को उनके वित्तीय प्रदर्शन के सापेक्ष ग्रीनहाउस गैस उत्सर्जन तीव्रता के आधार पर फ़िल्टर करके किया जाता है।</li><li><strong>प्रमुख प्रदर्शन मीट्रिक</strong>: यह सूचकांक कुल आय की प्रति इकाई ग्रीनहाउस गैस उत्सर्जन तीव्रता का उपयोग करके ऊर्जा दक्षता का मूल्यांकन करता है, जो इसे एक पूर्ण सीमा (absolute cap) के बजाय एक सापेक्ष माप बनाता है।</li><li><strong>दोहरा मूल्यांकन दृष्टिकोण</strong>: यह विशिष्ट रूप से वित्तीय बाजार के प्रदर्शन को पर्यावरणीय दक्षता डेटा के साथ जोड़ता है, जिसमें उच्च कार्बन उत्सर्जकों को दंडित किया जाता है और कम कार्बन उत्सर्जकों को पुरस्कृत किया जाता है।</li><li><strong>बाजार महत्व</strong>: यह संस्थागत और खुदरा निवेशकों को ग्रीन पोर्टफोलियो बनाने और टिकाऊ भारतीय निगमों की ओर निवेश को निर्देशित करने के लिए एक बेंचमार्क प्रदान करता है।</li><li><strong>नीति संरेखण</strong>: GREENEX जलवायु परिवर्तन पर राष्ट्रीय कार्य योजना (NAPCC) और स्वैच्छिक उत्सर्जन कटौती लक्ष्यों के तहत भारत की व्यापक जलवायु प्रतिबद्धताओं के साथ संरेखित है।</li><li><strong>सीमाएं</strong>: इसका अंगीकरण सीमित है क्योंकि भारत में स्वैच्छिक कार्बन प्रकटीकरण में समान मानकीकरण का अभाव है, जिससे विभिन्न औद्योगिक क्षेत्रों में पूर्ण तुलनात्मकता कम हो जाती है।</li></ol><div class="upsc-study-aids"><section class="upsc-study-aid upsc-study-mind-map"><h3>माइंड मैप</h3><p><strong>BSE GREENEX</strong></p><ul><li><strong>अवलोकन</strong><ul><li>BSE द्वारा लॉन्च</li><li>IIM अहमदाबाद का सहयोग</li><li>आधार वर्ष 2010</li></ul></li><li><strong>तंत्र</strong><ul><li>BSE 100 का उपसमुच्चय</li><li>उत्सर्जन तीव्रता</li><li>ऊर्जा दक्षता</li></ul></li><li><strong>महत्व</strong><ul><li>ग्रीन इन्वेस्टिंग</li><li>बाजार बेंचमार्क</li><li>नीति संरेखण</li></ul></li></ul></section><section class="upsc-study-aid upsc-study-table"><div class="upsc-study-table-wrap" role="region" aria-label="अध्ययन तालिका" tabindex="0" style="max-width:100%;overflow-x:auto"><table><caption>BSE सूचकांकों की तुलना</caption><thead><tr><th scope="col">पैरामीटर</th><th scope="col">BSE GREENEX</th></tr></thead><tbody><tr><th scope="row">प्राथमिक फोकस</th><td>ऊर्जा दक्षता और कार्बन उत्सर्जन तीव्रता</td></tr><tr><th scope="row">यूनिवर्स</th><td>BSE 100 कंपनियों का फ़िल्टर किया गया उपसमुच्चय</td></tr></tbody></table></div></section><section class="upsc-study-aid upsc-study-mnemonics"><h3>स्मरण सूत्र</h3><ul><li><strong>GREENEX के मुख्य तत्व</strong><p>स्मरण वाक्य: B I E</p><dl><dt>B</dt><dd>बॉम्बे स्टॉक एक्सचेंज (Bombay Stock Exchange)</dd><dt>I</dt><dd>IIM अहमदाबाद सहयोग</dd><dt>E</dt><dd>उत्सर्जन तीव्रता मीट्रिक (Emission intensity metric)</dd></dl><p><strong>उपयोग:</strong> विकास भागीदारों और मुख्य मीट्रिक को याद रखने के लिए।</p></li></ul></section><section class="upsc-study-aid upsc-study-tricks"><h3>तरीके और उपयोगी युक्तियाँ</h3><ul><li><strong>फ़िल्टरिंग लॉजिक विधि</strong><ol><li>व्यापक BSE 100 यूनिवर्स से शुरुआत करें।</li><li>वित्तीय तरलता स्क्रीन लागू करें।</li><li>आय की प्रति इकाई GHG उत्सर्जन तीव्रता के आधार पर कंपनियों को रैंक करें।</li></ol><p><strong>परीक्षा में उपयोग:</strong> यह समझने के लिए कि GREENEX घटकों को मानक सूचकांकों से कैसे फ़िल्टर किया जाता है।</p></li></ul></section><section class="upsc-study-aid upsc-study-tips"><h3>परीक्षा सुझाव</h3><ul><li><strong>मेन्स एकीकरण</strong>: GS पेपर III में कॉर्पोरेट पर्यावरणीय जवाबदेही को बढ़ावा देने वाले बाजार-आधारित वित्तीय साधनों के व्यावहारिक उदाहरण के रूप में BSE GREENEX का उपयोग करें।</li><li><strong>प्रीलिम्स फोकस</strong>: याद रखें कि GREENEX पूर्ण कार्बन तटस्थता के बजाय सापेक्ष कार्बन/ऊर्जा दक्षता को मापता है।</li></ul></section><section class="upsc-study-aid upsc-study-traps"><h3>प्रारंभिक परीक्षा की भ्रांतियाँ और सही तथ्य</h3><ul><li><strong>GREENEX को अनिवार्य कार्बन ट्रेडिंग कैप-एंड-ट्रेड योजना के साथ भ्रमित करना।</strong>: GREENEX ऊर्जा दक्षता को ट्रैक करने वाला एक शेयर बाजार सूचकांक है, न कि कोई नियामक कार्बन बाजार तंत्र।</li><li><strong>यह मान लेना कि GREENEX BSE पर सूचीबद्ध सभी कंपनियों को कवर करता है।</strong>: घटक विशेष रूप से BSE 100 सूचकांक यूनिवर्स से लिए गए हैं।</li></ul></section></div>

<script type="application/json" id="embedded-study-guide-data">{"breadcrumbs":{"parent":"UPSC Syllabus","parentUrl":"/upsc/","current":"BSE - GREENEX"},"hero":{"title":"BSE - GREENEX","description":"Study guide for BSE - GREENEX (UPSC Civil Services Prelims & Mains). Access key concepts, syllabus details, prep checklist, and interactive practice questions."},"timeline":{"title":"Topic Timeline Framework","description":"Chronological milestones and key historical progression.","cards":[]},"mnemonics":{"title":"Mnemonics & Memory Hacks","description":"Memory triggers to help retain this topic for UPSC Prelims.","items":[]},"traps":{"title":"UPSC Common Exam Traps","items":[]},"deepDive":{"title":"Pointwise Study Notes","description":"Study this microtopic through concise notes, a mind map, tables and topic-specific recall aids.","sections":[{"title":"Pointwise Study Notes","content":"\u003col class=\"pointwise-study-notes\">\u003cli>\u003cstrong>Definition of BSE GREENEX\u003c/strong>: BSE GREENEX is the first carbon-based index launched by the Bombay Stock Exchange in collaboration with IIM Ahmedabad to gauge the carbon performance of Indian companies.\u003c/li>\u003cli>\u003cstrong>Objective\u003c/strong>: The primary objective is to identify and highlight companies that are energy efficient and proactively mitigate climate change risks through sustainable business operations.\u003c/li>\u003cli>\u003cstrong>Base Date and Value\u003c/strong>: The index was officially launched with a base date of August 24, 2010, set at a base value of 100 points.\u003c/li>\u003cli>\u003cstrong>Constituent Selection\u003c/strong>: Constituents are selected from the broader BSE 100 index by filtering companies based on their greenhouse gas emissions intensity relative to their financial performance.\u003c/li>\u003cli>\u003cstrong>Key Performance Metric\u003c/strong>: The index evaluates energy efficiency using greenhouse gas emission intensity per unit of total income, making it a relative measure rather than an absolute cap.\u003c/li>\u003cli>\u003cstrong>Dual Evaluation Approach\u003c/strong>: It uniquely combines financial market performance with environmental efficiency data, penalizing high carbon emitters and rewarding low carbon emitters.\u003c/li>\u003cli>\u003cstrong>Market Significance\u003c/strong>: It provides institutional and retail investors with a benchmark to construct green portfolios and channel investments toward sustainable Indian corporations.\u003c/li>\u003cli>\u003cstrong>Policy Alignment\u003c/strong>: GREENEX aligns with India&#39;s broader climate commitments under the National Action Plan on Climate Change and voluntary emission reduction goals.\u003c/li>\u003cli>\u003cstrong>Limitations\u003c/strong>: Adoption remains limited because voluntary carbon disclosures in India lack uniform standardization, reducing the absolute comparability across diverse industrial sectors.\u003c/li>\u003c/ol>\u003cdiv class=\"upsc-study-aids\">\u003csection class=\"upsc-study-aid upsc-study-mind-map\">\u003ch3>Mind Map\u003c/h3>\u003cp>\u003cstrong>BSE GREENEX\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cstrong>Overview\u003c/strong>\u003cul>\u003cli>Launched by BSE\u003c/li>\u003cli>IIM Ahmedabad collab\u003c/li>\u003cli>Base year 2010\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>Mechanism\u003c/strong>\u003cul>\u003cli>BSE 100 subset\u003c/li>\u003cli>Emission intensity\u003c/li>\u003cli>Energy efficiency\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>Significance\u003c/strong>\u003cul>\u003cli>Green investing\u003c/li>\u003cli>Market benchmark\u003c/li>\u003cli>Policy alignment\u003c/li>\u003c/ul>\u003c/li>\u003c/ul>\u003c/section>\u003csection class=\"upsc-study-aid upsc-study-table\">\u003cdiv class=\"upsc-study-table-wrap\" role=\"region\" aria-label=\"Study aid table\" tabindex=\"0\" style=\"max-width:100%;overflow-x:auto\">\u003ctable>\u003ccaption>Comparison of BSE Indices\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">Parameter\u003c/th>\u003cth scope=\"col\">BSE GREENEX\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">Primary Focus\u003c/th>\u003ctd>Energy efficiency and carbon emission intensity\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">Universe\u003c/th>\u003ctd>Filtered subset of BSE 100 companies\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003csection class=\"upsc-study-aid upsc-study-mnemonics\">\u003ch3>Mnemonics\u003c/h3>\u003cul>\u003cli>\u003cstrong>GREENEX Core Elements\u003c/strong>\u003cp>Recall phrase: B I E\u003c/p>\u003cdl>\u003cdt>B\u003c/dt>\u003cdd>Bombay Stock Exchange\u003c/dd>\u003cdt>I\u003c/dt>\u003cdd>IIM Ahmedabad collaboration\u003c/dd>\u003cdt>E\u003c/dt>\u003cdd>Emission intensity metric\u003c/dd>\u003c/dl>\u003cp>\u003cstrong>Use:\u003c/strong> Remembering development partners and core metric.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003csection class=\"upsc-study-aid upsc-study-tricks\">\u003ch3>Methods and Tricks\u003c/h3>\u003cul>\u003cli>\u003cstrong>Filtering Logic Method\u003c/strong>\u003col>\u003cli>Start with the broad BSE 100 universe.\u003c/li>\u003cli>Apply financial liquidity screens.\u003c/li>\u003cli>Rank companies by GHG emission intensity per unit of income.\u003c/li>\u003c/ol>\u003cp>\u003cstrong>Exam use:\u003c/strong> Tracing how GREENEX constituents are filtered from standard indices.\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003csection class=\"upsc-study-aid upsc-study-tips\">\u003ch3>Exam Tips\u003c/h3>\u003cul>\u003cli>\u003cstrong>Mains Integration\u003c/strong>: Use BSE GREENEX as a practical example of market-based financial instruments driving corporate environmental accountability in GS Paper III.\u003c/li>\u003cli>\u003cstrong>Prelims Focus\u003c/strong>: Remember that GREENEX measures relative carbon/energy efficiency rather than absolute carbon neutrality.\u003c/li>\u003c/ul>\u003c/section>\u003csection class=\"upsc-study-aid upsc-study-traps\">\u003ch3>Prelims Traps and Corrections\u003c/h3>\u003cul>\u003cli>\u003cstrong>Confusing GREENEX with a mandatory carbon trading cap-and-trade scheme.\u003c/strong>: GREENEX is a stock market index tracking energy efficiency, not a regulatory carbon market mechanism.\u003c/li>\u003cli>\u003cstrong>Assuming GREENEX covers all listed companies on the BSE.\u003c/strong>: Constituents are derived specifically from the BSE 100 index universe.\u003c/li>\u003c/ul>\u003c/section>\u003c/div>","masteryZone":[]}]},"practiceQuestions":[],"mockTestQuestions":[]}</script>
<script type="application/json" id="embedded-study-guide-data-hi">{"breadcrumbs":{"parent":"UPSC Syllabus","parentUrl":"/upsc/","current":"BSE - GREENEX"},"hero":{"title":"BSE - GREENEX","description":"Study guide for BSE - GREENEX (UPSC Civil Services Prelims & Mains). Access key concepts, syllabus details, prep checklist, and interactive practice questions."},"timeline":{"title":"Topic Timeline Framework","description":"Chronological milestones and key historical progression.","cards":[]},"mnemonics":{"title":"Mnemonics & Memory Hacks","description":"Memory triggers to help retain this topic for UPSC Prelims.","items":[]},"traps":{"title":"UPSC Common Exam Traps","items":[]},"deepDive":{"title":"बिंदुवार अध्ययन नोट्स","description":"इस सूक्ष्म विषय के मुख्य विचारों और पुनरावृत्ति सहायक सामग्री को क्रमबद्ध बिंदुओं में पढ़ें।","sections":[{"title":"बिंदुवार अध्ययन नोट्स","content":"\u003col class=\"pointwise-study-notes\">\u003cli>\u003cstrong>BSE GREENEX की परिभाषा\u003c/strong>: BSE GREENEX बॉम्बे स्टॉक एक्सचेंज द्वारा IIM अहमदाबाद के सहयोग से शुरू किया गया पहला कार्बन-आधारित सूचकांक है, जो भारतीय कंपनियों के कार्बन प्रदर्शन को मापता है।\u003c/li>\u003cli>\u003cstrong>उद्देश्य\u003c/strong>: इसका प्राथमिक उद्देश्य उन कंपनियों की पहचान करना और उन्हें उजागर करना है जो ऊर्जा कुशल हैं और टिकाऊ व्यावसायिक संचालन के माध्यम से जलवायु परिवर्तन के जोखिमों को सक्रिय रूप से कम करती हैं।\u003c/li>\u003cli>\u003cstrong>आधार तिथि और मूल्य\u003c/strong>: यह सूचकांक आधिकारिक तौर पर 24 अगस्त, 2010 की आधार तिथि के साथ 100 अंकों के आधार मूल्य पर लॉन्च किया गया था।\u003c/li>\u003cli>\u003cstrong>घटक चयन\u003c/strong>: घटकों का चयन व्यापक BSE 100 सूचकांक से कंपनियों को उनके वित्तीय प्रदर्शन के सापेक्ष ग्रीनहाउस गैस उत्सर्जन तीव्रता के आधार पर फ़िल्टर करके किया जाता है।\u003c/li>\u003cli>\u003cstrong>प्रमुख प्रदर्शन मीट्रिक\u003c/strong>: यह सूचकांक कुल आय की प्रति इकाई ग्रीनहाउस गैस उत्सर्जन तीव्रता का उपयोग करके ऊर्जा दक्षता का मूल्यांकन करता है, जो इसे एक पूर्ण सीमा (absolute cap) के बजाय एक सापेक्ष माप बनाता है।\u003c/li>\u003cli>\u003cstrong>दोहरा मूल्यांकन दृष्टिकोण\u003c/strong>: यह विशिष्ट रूप से वित्तीय बाजार के प्रदर्शन को पर्यावरणीय दक्षता डेटा के साथ जोड़ता है, जिसमें उच्च कार्बन उत्सर्जकों को दंडित किया जाता है और कम कार्बन उत्सर्जकों को पुरस्कृत किया जाता है।\u003c/li>\u003cli>\u003cstrong>बाजार महत्व\u003c/strong>: यह संस्थागत और खुदरा निवेशकों को ग्रीन पोर्टफोलियो बनाने और टिकाऊ भारतीय निगमों की ओर निवेश को निर्देशित करने के लिए एक बेंचमार्क प्रदान करता है।\u003c/li>\u003cli>\u003cstrong>नीति संरेखण\u003c/strong>: GREENEX जलवायु परिवर्तन पर राष्ट्रीय कार्य योजना (NAPCC) और स्वैच्छिक उत्सर्जन कटौती लक्ष्यों के तहत भारत की व्यापक जलवायु प्रतिबद्धताओं के साथ संरेखित है।\u003c/li>\u003cli>\u003cstrong>सीमाएं\u003c/strong>: इसका अंगीकरण सीमित है क्योंकि भारत में स्वैच्छिक कार्बन प्रकटीकरण में समान मानकीकरण का अभाव है, जिससे विभिन्न औद्योगिक क्षेत्रों में पूर्ण तुलनात्मकता कम हो जाती है।\u003c/li>\u003c/ol>\u003cdiv class=\"upsc-study-aids\">\u003csection class=\"upsc-study-aid upsc-study-mind-map\">\u003ch3>माइंड मैप\u003c/h3>\u003cp>\u003cstrong>BSE GREENEX\u003c/strong>\u003c/p>\u003cul>\u003cli>\u003cstrong>अवलोकन\u003c/strong>\u003cul>\u003cli>BSE द्वारा लॉन्च\u003c/li>\u003cli>IIM अहमदाबाद का सहयोग\u003c/li>\u003cli>आधार वर्ष 2010\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>तंत्र\u003c/strong>\u003cul>\u003cli>BSE 100 का उपसमुच्चय\u003c/li>\u003cli>उत्सर्जन तीव्रता\u003c/li>\u003cli>ऊर्जा दक्षता\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>महत्व\u003c/strong>\u003cul>\u003cli>ग्रीन इन्वेस्टिंग\u003c/li>\u003cli>बाजार बेंचमार्क\u003c/li>\u003cli>नीति संरेखण\u003c/li>\u003c/ul>\u003c/li>\u003c/ul>\u003c/section>\u003csection class=\"upsc-study-aid upsc-study-table\">\u003cdiv class=\"upsc-study-table-wrap\" role=\"region\" aria-label=\"अध्ययन तालिका\" tabindex=\"0\" style=\"max-width:100%;overflow-x:auto\">\u003ctable>\u003ccaption>BSE सूचकांकों की तुलना\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">पैरामीटर\u003c/th>\u003cth scope=\"col\">BSE GREENEX\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">प्राथमिक फोकस\u003c/th>\u003ctd>ऊर्जा दक्षता और कार्बन उत्सर्जन तीव्रता\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">यूनिवर्स\u003c/th>\u003ctd>BSE 100 कंपनियों का फ़िल्टर किया गया उपसमुच्चय\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003csection class=\"upsc-study-aid upsc-study-mnemonics\">\u003ch3>स्मरण सूत्र\u003c/h3>\u003cul>\u003cli>\u003cstrong>GREENEX के मुख्य तत्व\u003c/strong>\u003cp>स्मरण वाक्य: B I E\u003c/p>\u003cdl>\u003cdt>B\u003c/dt>\u003cdd>बॉम्बे स्टॉक एक्सचेंज (Bombay Stock Exchange)\u003c/dd>\u003cdt>I\u003c/dt>\u003cdd>IIM अहमदाबाद सहयोग\u003c/dd>\u003cdt>E\u003c/dt>\u003cdd>उत्सर्जन तीव्रता मीट्रिक (Emission intensity metric)\u003c/dd>\u003c/dl>\u003cp>\u003cstrong>उपयोग:\u003c/strong> विकास भागीदारों और मुख्य मीट्रिक को याद रखने के लिए।\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003csection class=\"upsc-study-aid upsc-study-tricks\">\u003ch3>तरीके और उपयोगी युक्तियाँ\u003c/h3>\u003cul>\u003cli>\u003cstrong>फ़िल्टरिंग लॉजिक विधि\u003c/strong>\u003col>\u003cli>व्यापक BSE 100 यूनिवर्स से शुरुआत करें।\u003c/li>\u003cli>वित्तीय तरलता स्क्रीन लागू करें।\u003c/li>\u003cli>आय की प्रति इकाई GHG उत्सर्जन तीव्रता के आधार पर कंपनियों को रैंक करें।\u003c/li>\u003c/ol>\u003cp>\u003cstrong>परीक्षा में उपयोग:\u003c/strong> यह समझने के लिए कि GREENEX घटकों को मानक सूचकांकों से कैसे फ़िल्टर किया जाता है।\u003c/p>\u003c/li>\u003c/ul>\u003c/section>\u003csection class=\"upsc-study-aid upsc-study-tips\">\u003ch3>परीक्षा सुझाव\u003c/h3>\u003cul>\u003cli>\u003cstrong>मेन्स एकीकरण\u003c/strong>: GS पेपर III में कॉर्पोरेट पर्यावरणीय जवाबदेही को बढ़ावा देने वाले बाजार-आधारित वित्तीय साधनों के व्यावहारिक उदाहरण के रूप में BSE GREENEX का उपयोग करें।\u003c/li>\u003cli>\u003cstrong>प्रीलिम्स फोकस\u003c/strong>: याद रखें कि GREENEX पूर्ण कार्बन तटस्थता के बजाय सापेक्ष कार्बन/ऊर्जा दक्षता को मापता है।\u003c/li>\u003c/ul>\u003c/section>\u003csection class=\"upsc-study-aid upsc-study-traps\">\u003ch3>प्रारंभिक परीक्षा की भ्रांतियाँ और सही तथ्य\u003c/h3>\u003cul>\u003cli>\u003cstrong>GREENEX को अनिवार्य कार्बन ट्रेडिंग कैप-एंड-ट्रेड योजना के साथ भ्रमित करना।\u003c/strong>: GREENEX ऊर्जा दक्षता को ट्रैक करने वाला एक शेयर बाजार सूचकांक है, न कि कोई नियामक कार्बन बाजार तंत्र।\u003c/li>\u003cli>\u003cstrong>यह मान लेना कि GREENEX BSE पर सूचीबद्ध सभी कंपनियों को कवर करता है।\u003c/strong>: घटक विशेष रूप से BSE 100 सूचकांक यूनिवर्स से लिए गए हैं।\u003c/li>\u003c/ul>\u003c/section>\u003c/div>","masteryZone":[]}]},"practiceQuestions":[],"mockTestQuestions":[]}</script>
