<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/assets/css/test-interface.min.css?v=1781144817">

        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\(', '\)']] },
            svg: { fontCache: 'global' }
        };
    </script>

    <meta name="description" content="Practice Class 11 Maths Three Dimensional Geometry Standard unit test questions with CBSE exam revision support on SJMaths.">
    
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://sjmaths.com/class-11-maths/tests/unit-wise/unit-7-three-dimensional-geometry/standard.html">
<meta property="og:title" content="Class 11 Three Dimensional Geometry Standard Test | SJMaths">
    <meta property="og:description" content="Practice Class 11 Maths Three Dimensional Geometry Standard unit test questions with CBSE exam revision support on SJMaths.">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://sjmaths.com/class-11-maths/tests/unit-wise/unit-7-three-dimensional-geometry/standard.html">
    <meta property="og:image" content="https://sjmaths.com/assets/icons/icon-512x512.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Class 11 Three Dimensional Geometry Standard Test | SJMaths">
    <meta name="twitter:description" content="Practice Class 11 Maths Three Dimensional Geometry Standard unit test questions with CBSE exam revision support on SJMaths.">
    <meta name="twitter:image" content="https://sjmaths.com/assets/icons/icon-512x512.png">
</head>
<body>
    <h1 class="seo-page-title">Standard | Class 11 Maths</h1>
    <div class="test-header">
        <div class="logo">SJMaths Test Series</div>
        <div class="timer-badge">
            <i class="fas fa-clock"></i>
            <span id="timerDisplay">00:00</span>
        </div>
    </div>

    <div class="test-container">
        <main class="question-panel">
            <div class="section-header" id="qSection">Section A</div>
            <div class="q-header">
                <span id="qNumber">Question 1</span>
                <span id="qMarks">(1 Mark)</span>
            </div>
            <div class="q-text" id="qText">Loading Question...</div>
            <div id="inputArea"></div>
            <div id="solutionArea" class="solution-div"></div>
        </main>

        <aside class="nav-panel">
            <div style="display:flex; align-items:center; margin-bottom:1rem;">
                <h3 style="margin:0; font-size:1rem;">Question Palette</h3>
                <button id="paletteToggle" style="background:none; border:none; color:#2c3e50; cursor:pointer; display:none; font-size:1.1rem; margin-left: auto;">
                    <i class="fas fa-chevron-up"></i>
                </button>
            </div>
            <div id="paletteBody">
                <div class="palette-grid" id="questionPalette"></div>
                <div style="margin-top: 2rem; font-size: 0.8rem; color: #666;">
                    <div style="display:flex; gap:8px; align-items:center; margin-bottom:5px;">
                        <span style="width:12px; height:12px; background:#27ae60; border-radius:50%;"></span> Answered
                    </div>
                    <div style="display:flex; gap:8px; align-items:center; margin-bottom:5px;">
                        <span style="width:12px; height:12px; background:#c0392b; border-radius:50%;"></span> Visited
                    </div>
                    <div style="display:flex; gap:8px; align-items:center;">
                        <span style="width:12px; height:12px; border:1px solid #ccc; border-radius:50%;"></span> Not Visited
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <div class="test-footer">
        <button class="btn-nav btn-reset" id="btnReset">Reset</button>
        <div style="flex:1"></div>
        <button class="btn-nav btn-prev" id="btnPrev">Previous</button>
        <button class="btn-nav btn-next" id="btnNext">Next</button>
    </div>

    <div class="result-overlay" id="resultModal">
        <div class="result-card">
            <div class="score-circle">
                <div class="score-text"></div>
            </div>
            <div id="resultMessage"></div>
            <button class="btn-nav btn-submit" onclick="closeResult()" style="margin-top:1.5rem;">Review Answers</button>
            <a href="../" style="display:block; margin-top:1rem; color:#666; text-decoration:none;">Back to Tests</a>
        </div>
    </div>

    <script src="/assets/js/test-engine.min.js?v=1781144817"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetch('standard.json')
                .then(response => response.json())
                .then(data => {
                    data.exitUrl = '../index.html';
                    new TestEngine(data);
                });
            const toggleBtn = document.getElementById('paletteToggle');
            const navPanel = document.querySelector('.nav-panel');
            if(toggleBtn && navPanel) {
                toggleBtn.addEventListener('click', () => {
                    navPanel.classList.toggle('collapsed');
                    toggleBtn.querySelector('i').style.transform = navPanel.classList.contains('collapsed') ? 'rotate(180deg)' : 'rotate(0deg)';
                });
            }
        });
    </script>
</body>
</html>
