<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="description"
        content="SJMaths Maths Mastery — personalised mathematics learning."
    >

    <title>Maths Mastery | SJMaths</title>

    <link
        rel="stylesheet"
        href="./assets/css/mastery.css"
    >

    <link
        rel="stylesheet"
        href="./assets/css/mastery-components.css"
    >

    <link
        rel="stylesheet"
        href="./assets/css/mastery-responsive.css"
    >

</head>


<body>

<div
    id="maths-mastery-app"
    class="mastery-app"
>


    <!-- ========================================================
         TOP NAVIGATION
         ======================================================== -->

    <header class="mastery-header">

        <a
            href="/"
            class="mastery-brand"
            aria-label="SJMaths"
        >

            <span class="mastery-brand__mark">
                SJ
            </span>

            <span class="mastery-brand__text">

                <strong>
                    SJMaths
                </strong>

                <small>
                    Maths Mastery
                </small>

            </span>

        </a>


        <div
            id="header-learner-context"
            class="mastery-header__context"
            hidden
        >
            <span
                id="header-target-badge"
                class="mastery-context-badge"
            >
                🎯 <span id="header-target-name">Target</span>
            </span>

            <span
                id="header-status-pill"
                class="mastery-context-status"
            >
                <span class="mastery-context-dot"></span>
                <span id="header-status-text">Ready</span>
            </span>
        </div>

        <nav
            class="mastery-nav"
            aria-label="Main navigation"
        >

            <button
                id="header-progress-button"
                class="mastery-nav-button"
                type="button"
                hidden
            >
                Progress
            </button>

            <button
                id="header-menu-button"
                class="mastery-nav-button mastery-nav-button--menu"
                type="button"
                aria-label="Open menu"
                hidden
            >
                Menu
            </button>

        </nav>

    </header>


    <!-- ========================================================
         MAIN
         ======================================================== -->

    <main
        id="mastery-main"
        class="mastery-main"
    >

        <section
            id="mastery-screen"
            class="mastery-screen"
            aria-live="polite"
        >

            <div class="mastery-loading">

                <div class="mastery-loading__spinner"></div>

                <span>
                    Preparing your learning space…
                </span>

            </div>

        </section>

    </main>


    <!-- ========================================================
         STATUS
         ======================================================== -->

    <div
        id="mastery-status"
        class="mastery-status"
        role="status"
        aria-live="polite"
        hidden
    ></div>


    <!-- ========================================================
         MOBILE BOTTOM NAV
         ======================================================== -->

    <nav
        class="mastery-bottom-nav"
        aria-label="Learning navigation"
        hidden
    >

        <button
            type="button"
            data-nav="learn"
        >
            <span class="mastery-bottom-nav__icon">L</span>
            <span>Learn</span>
        </button>

        <button
            type="button"
            data-nav="practice"
        >
            <span class="mastery-bottom-nav__icon">P</span>
            <span>Practice</span>
        </button>

        <button
            type="button"
            data-nav="progress"
        >
            <span class="mastery-bottom-nav__icon">↗</span>
            <span>Progress</span>
        </button>

    </nav>


    <!-- ========================================================
         FOOTER
         ======================================================== -->

    <footer class="mastery-footer">

        <span>
            SJMaths
        </span>

        <span>
            Maths Mastery
        </span>

    </footer>


</div>


<script
    type="module"
    src="./assets/js/app.js"
></script>

</body>

</html>
