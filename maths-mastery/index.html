<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths Mastery - Coming Soon | SJMaths</title>
    <!-- Use main site CSS -->
    <link rel="stylesheet" href="../assets/css/main.min.css?v=1772255290">
    <link rel="stylesheet" href="../assets/css/layout.min.css?v=1772255290">
    <link rel="stylesheet" href="../assets/css/component.min.css?v=1772255290">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            font-family: 'Poppins', sans-serif;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #333;
        }

        .container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            color: #7B1FA2;
            /* Primary Deep Purple */
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .icon-box {
            font-size: 4rem;
            color: #7B1FA2;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        .btn {
            display: inline-block;
            background: #7B1FA2;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(123, 31, 162, 0.3);
        }

        .btn:hover {
            background: #9C27B0;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(123, 31, 162, 0.4);
            color: white;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="icon-box">
            <i class="fas fa-rocket"></i>
        </div>
        <h1>Maths Mastery</h1>
        <p>We're building something amazing! <br>The ultimate interactive learning experience is currently under
            development.</p>
        <p><strong>Status:</strong> Construction in Progress 🚧</p>

        <a href="/" class="btn"><i class="fas fa-home"></i> Back to Home</a>
    </div>

</body>

</html>
