<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" width="100%" height="auto" style="max-width:940px; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="foilGrad7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="polarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#2563eb" />
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#10b981" />
    </marker>
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#ef4444" />
    </marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#8b5cf6" />
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#d97706" />
    </marker>
    <marker id="arrDark" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#475569" />
    </marker>
  </defs>

  <!-- Background Panel -->
  <rect x="4" y="4" width="932" height="492" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />

  <!-- Diagram Title Header -->
  <text x="470" y="32" text-anchor="middle" fill="#f8fafc" font-size="16" font-weight="700" letter-spacing="0.5">AERODYNAMIC REACTION FORCES &amp; DRAG POLAR (TOPIC 1.7)</text>
  <line x1="40" y1="44" x2="900" y2="44" stroke="#334155" stroke-dasharray="4,4" />

  <!-- ==================== LEFT PANEL: AIRFOIL FORCE DECOMPOSITION ==================== -->
  <g id="left-panel">
    <rect x="20" y="56" width="430" height="424" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" />
    <text x="235" y="80" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">1. Aerodynamic Reaction Force Decomposition</text>

    <!-- Relative Wind Vector (Incoming Flow) -->
    <line x1="40" y1="300" x2="160" y2="300" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrBlue)" />
    <line x1="40" y1="320" x2="140" y2="320" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrBlue)" stroke-dasharray="3,3" />
    <line x1="40" y1="280" x2="140" y2="280" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrBlue)" stroke-dasharray="3,3" />
    <text x="50" y="270" fill="#38bdf8" font-size="11" font-weight="600">Relative Wind (V&infin;)</text>

    <!-- Airfoil Geometry (pitched at alpha = 8 deg) -->
    <!-- Chord Reference Line (dashed) -->
    <line x1="130" y1="320" x2="400" y2="260" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="390" y="252" fill="#94a3b8" font-size="10">Chord Line</text>

    <!-- Angle of attack arc -->
    <path d="M 200,300 A 70,70 0 0,0 197,306" fill="none" stroke="#fbbf24" stroke-width="2" />
    <line x1="130" y1="300" x2="230" y2="300" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2" />
    <text x="212" y="306" fill="#fbbf24" font-size="12" font-weight="700">&alpha;</text>

    <!-- Airfoil Body Path -->
    <path d="M 140,318 C 132,305 145,275 190,265 C 250,250 340,260 400,265 C 340,278 250,300 190,312 C 160,318 145,322 140,318 Z"
          fill="url(#foilGrad7)" stroke="#38bdf8" stroke-width="2" />

    <!-- Center of Pressure (CP) -->
    <circle cx="215" cy="275" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
    <text x="180" y="295" fill="#f59e0b" font-size="11" font-weight="700">CP (Center of Pressure)</text>

    <!-- Resultant Force Vector R (Purple) -->
    <line x1="215" y1="275" x2="255" y2="115" stroke="#a855f7" stroke-width="3" marker-end="url(#arrPurple)" />
    <text x="265" y="125" fill="#c084fc" font-size="13" font-weight="700">R (Total Aerodynamic Reaction)</text>

    <!-- Lift Vector L (Green, Perpendicular to Relative Wind) -->
    <line x1="215" y1="275" x2="215" y2="125" stroke="#10b981" stroke-width="2.8" marker-end="url(#arrGreen)" />
    <text x="145" y="145" fill="#10b981" font-size="13" font-weight="700">L (Lift)</text>
    <text x="110" y="160" fill="#6ee7b7" font-size="9.5">&perp; Relative Wind</text>

    <!-- Drag Vector D (Red, Parallel to Relative Wind) -->
    <line x1="215" y1="275" x2="335" y2="275" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrRed)" />
    <text x="345" y="280" fill="#ef4444" font-size="13" font-weight="700">D (Drag)</text>
    <text x="345" y="295" fill="#fca5a5" font-size="9.5">&parallel; Relative Wind</text>

    <!-- Vector parallelogram dashed lines -->
    <line x1="215" y1="125" x2="255" y2="115" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="335" y1="275" x2="255" y2="115" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2" />

    <!-- Right-angle indicator between L and D -->
    <path d="M 215,260 L 230,260 L 230,275" fill="none" stroke="#10b981" stroke-width="1.2" />

    <!-- Formula Box at bottom left -->
    <rect x="35" y="380" width="400" height="85" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="50" y="402" fill="#38bdf8" font-size="11" font-weight="700">Key Aerodynamic Equations (UPSC ASO):</text>
    <text x="50" y="422" fill="#f8fafc" font-size="11">Lift: <tspan fill="#10b981" font-weight="700">L = &frac12;&rho;V&sup2; S C<tspan font-size="8" dy="2">L</tspan></tspan><tspan dy="-2">  &bull;  Drag: </tspan><tspan fill="#ef4444" font-weight="700">D = &frac12;&rho;V&sup2; S C<tspan font-size="8" dy="2">D</tspan></tspan></text>
    <text x="50" y="442" fill="#f8fafc" font-size="11">Total Reaction: <tspan fill="#c084fc" font-weight="700">R = &radic;(L&sup2; + D&sup2;)</tspan>  &bull;  Efficiency: <tspan fill="#fbbf24" font-weight="700">L/D = C<tspan font-size="8" dy="2">L</tspan>/C<tspan font-size="8">D</tspan></tspan></text>
    <text x="50" y="458" fill="#94a3b8" font-size="9.5">Dynamic Pressure: q = &frac12;&rho;V&sup2;  &bull;  S = Wing Reference Area</text>
  </g>

  <!-- ==================== RIGHT PANEL: THE DRAG POLAR (CL vs CD) ==================== -->
  <g id="right-panel">
    <rect x="470" y="56" width="450" height="424" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" />
    <text x="695" y="80" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">2. The Complete Aircraft Drag Polar (CL vs. CD)</text>

    <!-- Axes (CL vertical, CD horizontal) -->
    <!-- X-axis: CD -->
    <line x1="520" y1="410" x2="890" y2="410" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrDark)" />
    <text x="895" y="415" fill="#f8fafc" font-size="12" font-weight="700">C<tspan font-size="9" dy="2">D</tspan></text>
    <text x="730" y="435" text-anchor="middle" fill="#94a3b8" font-size="10.5">Drag Coefficient (Total Drag)</text>

    <!-- Y-axis: CL -->
    <line x1="520" y1="410" x2="520" y2="105" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrDark)" />
    <text x="515" y="100" fill="#f8fafc" font-size="12" font-weight="700">C<tspan font-size="9" dy="2">L</tspan></text>
    <text x="495" y="240" text-anchor="middle" fill="#94a3b8" font-size="10.5" transform="rotate(-90 495,240)">Lift Coefficient</text>

    <!-- Origin label -->
    <text x="510" y="425" fill="#64748b" font-size="10">0</text>

    <!-- Parabolic Drag Polar Curve (Green) -->
    <!-- CD = CD0 + k * CL^2 -->
    <!-- Point 0: (570, 410) => CD0 = 0.02 -->
    <!-- Point md: (670, 260) => (L/D)max tangent -->
    <!-- Point stall: (840, 140) => CLmax stall hook -->
    <path d="M 565,410 C 570,360 610,290 670,250 C 730,210 790,170 820,150 C 835,140 850,145 845,170"
          fill="none" stroke="#10b981" stroke-width="3" />

    <!-- Parasite Drag (CD0) intercept on CD axis -->
    <circle cx="565" cy="410" r="4.5" fill="#ef4444" />
    <text x="545" y="432" fill="#fca5a5" font-size="10" font-weight="700">C<tspan font-size="8" dy="2">D0</tspan></text>
    <text x="535" y="445" fill="#94a3b8" font-size="8.5">(Zero-lift parasite drag)</text>

    <!-- Tangent line from Origin to Polar curve (Amber/Yellow) -->
    <line x1="520" y1="410" x2="760" y2="155" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,4" />
    <text x="765" y="160" fill="#fbbf24" font-size="11" font-weight="700">Tangent from Origin: (L/D)<tspan font-size="8" dy="2">max</tspan></text>

    <!-- Point of (L/D)max on the curve -->
    <circle cx="670" cy="250" r="5.5" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />

    <!-- Dashed projection lines from (L/D)max point -->
    <line x1="520" y1="250" x2="670" y2="250" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3,3" />
    <line x1="670" y1="250" x2="670" y2="410" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3,3" />

    <text x="475" y="254" fill="#fbbf24" font-size="10.5" font-weight="700">C<tspan font-size="8" dy="2">L,md</tspan></text>
    <text x="645" y="425" fill="#fbbf24" font-size="10.5" font-weight="700">2 &times; C<tspan font-size="8" dy="2">D0</tspan></text>

    <!-- Equality marker: CD0 = CDi -->
    <rect x="580" y="275" width="170" height="36" rx="4" fill="#0f172a" stroke="#d97706" />
    <text x="665" y="292" text-anchor="middle" fill="#fde68a" font-size="10" font-weight="700">AT (L/D)max / MIN DRAG:</text>
    <text x="665" y="305" text-anchor="middle" fill="#38bdf8" font-size="9.5">Parasite Drag = Induced Drag (C<tspan font-size="7">D0</tspan> = k C<tspan font-size="7">L</tspan>&sup2;)</text>

    <!-- Stall Point (CLmax) -->
    <circle cx="820" cy="150" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
    <text x="828" y="142" fill="#ef4444" font-size="11" font-weight="700">C<tspan font-size="8" dy="2">L,max</tspan><tspan dy="-2"> (Stall)</tspan></text>
    <line x1="520" y1="150" x2="820" y2="150" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3" />
    <text x="475" y="154" fill="#ef4444" font-size="10.5" font-weight="700">C<tspan font-size="8" dy="2">L,max</tspan></text>

    <!-- Critical UPSC Exam Takeaway Box -->
    <rect x="490" y="340" width="410" height="60" rx="6" fill="#0f172a" stroke="#10b981" />
    <text x="505" y="358" fill="#10b981" font-size="10.5" font-weight="700">&bull; UPSC ASO High-Frequency Rule (2018 Q4, 2023 Q41):</text>
    <text x="505" y="375" fill="#f8fafc" font-size="10">Maximum efficiency <tspan fill="#fbbf24" font-weight="700">(L/D)max</tspan> occurs at <tspan fill="#38bdf8" font-weight="700">C<tspan font-size="8">L,md</tspan> = &radic;(C<tspan font-size="8">D0</tspan>/k)</tspan>, NOT at C<tspan font-size="8">L,max</tspan>!</text>
    <text x="505" y="390" fill="#94a3b8" font-size="9.5">At (L/D)max: Glide angle is minimum (&gamma;min), glide range is maximum, and CD = 2 &times; CD0.</text>
  </g>
</svg>