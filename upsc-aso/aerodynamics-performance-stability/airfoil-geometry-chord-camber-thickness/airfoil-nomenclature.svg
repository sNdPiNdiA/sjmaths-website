<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="100%" height="auto" style="max-width:920px; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.06" />
    </linearGradient>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#dc2626" />
    </marker>
    <marker id="arrowRedRev" markerWidth="8" markerHeight="8" refX="3" refY="4" orient="auto">
      <path d="M7,1 L1,4 L7,7 Z" fill="#dc2626" />
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#2563eb" />
    </marker>
    <marker id="arrowBlueRev" markerWidth="8" markerHeight="8" refX="3" refY="4" orient="auto">
      <path d="M7,1 L1,4 L7,7 Z" fill="#2563eb" />
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#059669" />
    </marker>
    <marker id="arrowEmeraldRev" markerWidth="8" markerHeight="8" refX="3" refY="4" orient="auto">
      <path d="M7,1 L1,4 L7,7 Z" fill="#059669" />
    </marker>
    <marker id="arrowWind" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M1,1.5 L8,4.5 L1,7.5 Z" fill="#0284c7" />
    </marker>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="920" height="480" fill="#ffffff" rx="12" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Grid Guide Lines (Subtle) -->
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="80" y1="100" x2="840" y2="100" />
    <line x1="80" y1="180" x2="840" y2="180" />
    <line x1="80" y1="260" x2="840" y2="260" />
    <line x1="80" y1="340" x2="840" y2="340" />
    <line x1="80" y1="420" x2="840" y2="420" />
    <line x1="160" y1="60" x2="160" y2="440" />
    <line x1="320" y1="60" x2="320" y2="440" />
    <line x1="480" y1="60" x2="480" y2="440" />
    <line x1="640" y1="60" x2="640" y2="440" />
    <line x1="800" y1="60" x2="800" y2="440" />
  </g>

  <!-- Title & Nomenclature Heading -->
  <text x="460" y="38" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a" letter-spacing="-0.02em">
    Airfoil Geometric Nomenclature &amp; Reference Parameters
  </text>
  <text x="460" y="58" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">
    Standard NACA 4-Digit Aerodynamic Profile Cross-Section
  </text>

  <!-- AIRFOIL PROFILE BODY -->
  <!-- Airfoil Path: Leading Edge at (160, 260), Trailing Edge at (780, 260) -->
  <path d="M 160,260 
           C 160,200 220,135 340,135 
           C 440,135 560,165 670,210 
           C 725,232 765,252 780,260
           C 765,263 710,274 640,281
           C 540,290 420,295 340,295 
           C 240,295 180,285 160,260 Z"
        fill="url(#foilGrad)" stroke="#1e40af" stroke-width="2.5" filter="url(#shadow)" />

  <!-- CHORD LINE (Straight Line connecting LE and TE) -->
  <line x1="160" y1="260" x2="780" y2="260" stroke="#dc2626" stroke-width="2" stroke-dasharray="8,5" />
  
  <!-- MEAN CAMBER LINE (Locus of points midway between upper & lower surfaces) -->
  <path d="M 160,260 
           C 180,230 250,210 380,210 
           C 510,210 650,238 780,260" 
        fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="6,4" />

  <!-- LEADING EDGE (LE) DETAIL -->
  <!-- LE Circle Arc illustrating Leading Edge Radius -->
  <circle cx="178" cy="260" r="18" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="3,3" />
  <circle cx="160" cy="260" r="4.5" fill="#dc2626" />
  <line x1="160" y1="260" x2="110" y2="210" stroke="#64748b" stroke-width="1.2" />
  <rect x="35" y="185" width="120" height="30" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
  <text x="95" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Leading Edge (LE)</text>

  <!-- LEADING EDGE RADIUS ANNOTATION -->
  <line x1="178" y1="260" x2="135" y2="310" stroke="#f59e0b" stroke-width="1.2" />
  <rect x="65" y="310" width="140" height="26" rx="5" fill="#fffbeb" stroke="#fde68a" stroke-width="1" />
  <text x="135" y="327" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">LE Radius (r<tspan font-size="8" dy="2">le</tspan><tspan font-size="11" dy="-2">)</tspan></text>

  <!-- TRAILING EDGE (TE) DETAIL -->
  <circle cx="780" cy="260" r="4.5" fill="#dc2626" />
  <line x1="780" y1="260" x2="825" y2="210" stroke="#64748b" stroke-width="1.2" />
  <rect x="770" y="185" width="120" height="30" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
  <text x="830" y="204" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Trailing Edge (TE)</text>

  <!-- MAXIMUM THICKNESS DIMENSION (At ~30% Chord, x ≈ 340) -->
  <!-- Upper: y ≈ 135, Lower: y ≈ 295, Chord: y = 260 -->
  <line x1="340" y1="135" x2="340" y2="295" stroke="#2563eb" stroke-width="2" marker-start="url(#arrowBlueRev)" marker-end="url(#arrowBlue)" />
  <!-- Extension witness ticks -->
  <line x1="328" y1="135" x2="352" y2="135" stroke="#2563eb" stroke-width="1.5" />
  <line x1="328" y1="295" x2="352" y2="295" stroke="#2563eb" stroke-width="1.5" />
  <rect x="235" y="75" width="190" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
  <text x="330" y="93" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">Maximum Thickness (t<tspan font-size="8" dy="2">max</tspan><tspan font-size="11" dy="-2">)</tspan></text>
  <text x="330" y="108" text-anchor="middle" font-size="10" font-weight="500" fill="#3b82f6">NACA Last 2 Digits (e.g. 12%)</text>
  <line x1="330" y1="117" x2="340" y2="135" stroke="#2563eb" stroke-width="1" stroke-dasharray="2,2" />

  <!-- MAXIMUM CAMBER DIMENSION (At ~40% Chord, x ≈ 408) -->
  <!-- Mean camber line at y ≈ 210, Chord line at y = 260 -->
  <line x1="408" y1="210" x2="408" y2="260" stroke="#059669" stroke-width="2" marker-start="url(#arrowEmeraldRev)" marker-end="url(#arrowEmerald)" />
  <rect x="420" y="215" width="165" height="42" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
  <text x="502" y="233" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">Maximum Camber (m)</text>
  <text x="502" y="248" text-anchor="middle" font-size="10" font-weight="500" fill="#059669">NACA 1st Digit (e.g. 2%)</text>
  <line x1="420" y1="235" x2="408" y2="235" stroke="#059669" stroke-width="1" />

  <!-- SURFACE CALLOUTS -->
  <!-- Upper Surface -->
  <path d="M 520,152 Q 540,115 580,115" fill="none" stroke="#1e40af" stroke-width="1.2" />
  <circle cx="520" cy="152" r="3" fill="#1e40af" />
  <text x="585" y="119" font-size="11" font-weight="700" fill="#1e40af">Upper Surface (Suction / Extrados)</text>

  <!-- Lower Surface -->
  <path d="M 520,286 Q 540,325 580,325" fill="none" stroke="#1e40af" stroke-width="1.2" />
  <circle cx="520" cy="286" r="3" fill="#1e40af" />
  <text x="585" y="329" font-size="11" font-weight="700" fill="#1e40af">Lower Surface (Pressure / Intrados)</text>

  <!-- CHORD LINE DIMENSION & LABEL (c) -->
  <line x1="160" y1="385" x2="780" y2="385" stroke="#dc2626" stroke-width="2" marker-start="url(#arrowRedRev)" marker-end="url(#arrowRed)" />
  <!-- Witness lines from LE and TE to chord dimension -->
  <line x1="160" y1="265" x2="160" y2="395" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="780" y1="265" x2="780" y2="395" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,3" />
  <rect x="410" y="372" width="120" height="26" rx="5" fill="#fef2f2" stroke="#fecaca" stroke-width="1" />
  <text x="470" y="389" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">Chord Line (c)</text>

  <!-- RELATIVE WIND & ANGLE OF ATTACK (ALPHA) -->
  <g transform="translate(45, 260)">
    <!-- Relative wind vector approaching at an angle -->
    <line x1="0" y1="50" x2="95" y2="10" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowWind)" />
    <line x1="10" y1="50" x2="105" y2="10" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrowWind)" />
    <!-- Horizontal reference line extension -->
    <line x1="45" y1="10" x2="115" y2="10" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,2" />
    <text x="50" y="68" font-size="10" font-weight="700" fill="#0284c7">Relative Wind (V<tspan font-size="7" dy="2">∞</tspan><tspan font-size="10" dy="-2">)</tspan></text>
  </g>

  <!-- LEGEND BOX IN BOTTOM LEFT -->
  <rect x="35" y="415" width="850" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <g transform="translate(50, 444)">
    <!-- Item 1: Chord Line -->
    <line x1="0" y1="-4" x2="28" y2="-4" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,3" />
    <text x="35" y="0" font-size="11" font-weight="600" fill="#334155">Chord Line: Straight reference line connecting LE &amp; TE</text>

    <!-- Item 2: Mean Camber Line -->
    <line x1="390" y1="-4" x2="418" y2="-4" stroke="#059669" stroke-width="2.5" stroke-dasharray="5,3" />
    <text x="425" y="0" font-size="11" font-weight="600" fill="#334155">Mean Camber Line: Midpoint curve between upper &amp; lower surfaces</text>
  </g>
</svg>

