    <style>
        /* Page Specific Styles */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(255, 255, 255, 0.2);
            --shadow-lg: 0 10px 30px -5px rgba(0, 0, 0, 0.1);
        }

        body.dark-mode {
            --glass-bg: rgba(30, 30, 30, 0.95);
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        .ebooks-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            animation: fadeIn 0.5s ease-out;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }

        .filter-btn {
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            border: 1px solid var(--border-color, #eee);
            background: var(--glass-bg);
            color: var(--text-body);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-sm);
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .ebooks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .ebook-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 1.2rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .ebook-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        .ebook-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: var(--accent-purple-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        .ebook-info h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.2rem;
            color: var(--text-dark);
        }

        .ebook-info p {
            margin: 0 0 1.5rem 0;
            font-size: 0.9rem;
            color: var(--text-light);
            line-height: 1.5;
        }

        .download-btn {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.8rem;
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            border-radius: 0.8rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
        }

        .download-btn:hover {
            background: var(--primary);
            color: white;
        }

        .badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-free {
            background: #e0f2f1;
            color: #00695c;
        }

        .badge-premium {
            background: #fff3e0;
            color: #e65100;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

<body>

    <div id="header-container"></div>

    <main>
        <div class="ebooks-container">
            <div class="page-header">
                <h1>E-Books & Resources</h1>
                <p style="color: var(--text-light);">Download high-quality study materials, notes, and question banks.
                </p>
            </div>

            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="class-9">Class 9</button>
                <button class="filter-btn" data-filter="class-10">Class 10</button>
                <button class="filter-btn" data-filter="class-11">Class 11</button>
                <button class="filter-btn" data-filter="class-12">Class 12</button>
            </div>

            <div id="ebooksGrid" class="ebooks-grid">
                <!-- Populated by JS -->
                <div class="skeleton" style="height: 250px; border-radius: 1.2rem;"></div>
                <div class="skeleton" style="height: 250px; border-radius: 1.2rem;"></div>
                <div class="skeleton" style="height: 250px; border-radius: 1.2rem;"></div>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>


    <script src="/assets/js/main.min.js?v=1781884533" defer data-cfasync="false"></script>

    <script>
        const resources = [
            { id: 1, title: "Class 10 Maths Formula + Concept Revision", desc: "Complete Class 10 Maths formula sheet and concept revision ebook for fast board exam preparation.", class: "class-10", type: "free", icon: "fa-square-root-alt", url: "/pages/class-10-maths-formula-concept-bible.html", cta: "Read on Site" },
            { id: 2, title: "Class 12 Maths Complete Formula + Concept Revision", desc: "Complete Class 12 Maths formula sheet and concept revision ebook for fast board exam preparation.", class: "class-12", type: "free", icon: "fa-square-root-alt", url: "/pages/class-12-maths-formula-bible.html", cta: "Read on Site" },
            { id: 9, title: "Class 11 Maths Formula + Concept Revision", desc: "Complete Class 11 Maths formula sheet and concept revision ebook for fast board exam preparation.", class: "class-11", type: "free", icon: "fa-square-root-alt", url: "/pages/class-11-maths-formula-bible.html", cta: "Read on Site" },
            { id: 3, title: "Class 9 Maths Formula + Concept Revision", desc: "Complete Class 9 Maths formula sheet and concept revision ebook for fast school exam preparation.", class: "class-9", type: "free", icon: "fa-square-root-alt", url: "/pages/class-9-maths-formula-concept-bible.html", cta: "Read on Site" }
        ];

        const grid = document.getElementById('ebooksGrid');
        const filters = document.querySelectorAll('.filter-btn');

        function renderResources(filter) {
            grid.innerHTML = '';

            const filtered = filter === 'all'
                ? resources
                : resources.filter(r => r.class === filter);

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-light);">No resources found for this category.</div>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'ebook-card';
                const isExternalLink = item.url && /^https?:\/\//.test(item.url);
                const actionLabel = item.cta || 'Download PDF';
                const actionIcon = actionLabel === 'Read on Site' ? 'fa-book-open' : 'fa-download';

                card.innerHTML = `
                <span class="badge badge-${item.type}">${item.type === 'free' ? 'Free' : 'Premium'}</span>
                <div class="ebook-icon"><i class="fas ${item.icon}"></i></div>
                <div class="ebook-info">
                    <h3>${item.title}</h3>
                    <p>${item.desc}</p>
                </div>
                <a href="${item.url || '#'}" class="download-btn"${isExternalLink ? ' target="_blank" rel="noopener noreferrer"' : item.url ? '' : ` onclick="alert('Download started for: ${item.title}')"`}>
                    <i class="fas ${actionIcon}"></i> ${actionLabel}
                </a>
            `;
                grid.appendChild(card);
            });
        }

        filters.forEach(btn => {
            btn.addEventListener('click', () => {
                filters.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderResources(btn.dataset.filter);
            });
        });

        // Initial Render
        document.addEventListener('DOMContentLoaded', () => {
            // Simulate loading
            setTimeout(() => renderResources('all'), 500);
        });
    </script>
