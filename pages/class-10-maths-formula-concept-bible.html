    <!-- PDF Viewer Script -->
    <script>
        const PDF_URL = '/assets/ebooks/class-10-maths-formula-concept-bible-2025-26.pdf';
        let pdfDoc = null;
        let currentPage = 1;
        let currentZoom = 1.0;
        let renderNonce = 0;
        let resizeTimer = null;

        const canvas = document.getElementById('pdfCanvas');
        const stageEl = document.getElementById('readerStage');
        const loaderEl = document.getElementById('loaderOverlay');
        const pageBadgeEl = document.getElementById('pageBadge');
        const percentageEl = document.getElementById('readPercentage');
        const progressFillEl = document.getElementById('progressFill');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const ctx = canvas.getContext('2d', { alpha: false });

        function updateUI() {
            if (!pdfDoc) {
                pageBadgeEl.textContent = 'Loading...';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                return;
            }

            const total = pdfDoc.numPages;
            pageBadgeEl.textContent = `Page ${currentPage} of ${total}`;
            const pct = Math.round((currentPage / total) * 100);
            percentageEl.textContent = `${pct}% Read`;
            progressFillEl.style.width = `${pct}%`;

            prevBtn.disabled = (currentPage <= 1);
            nextBtn.disabled = (currentPage >= total);
        }

        async function renderPage() {
            if (!pdfDoc) return;

            const nonce = ++renderNonce;

            try {
                const page = await pdfDoc.getPage(currentPage);
                if (nonce !== renderNonce) return;

                const baseViewport = page.getViewport({ scale: 1 });
                const stageWidth = Math.max(stageEl.clientWidth - 40, 280);
                const stageHeight = Math.max(stageEl.clientHeight - 40, 360);

                const scaleX = stageWidth / baseViewport.width;
                const scaleY = stageHeight / baseViewport.height;
                const fitScale = Math.min(scaleX, scaleY);

                const outputScale = window.devicePixelRatio || 1;
                const finalScale = fitScale * currentZoom * outputScale;
                const viewport = page.getViewport({ scale: finalScale });

                canvas.width = Math.floor(viewport.width);
                canvas.height = Math.floor(viewport.height);
                canvas.style.width = Math.floor(viewport.width / outputScale) + 'px';
                canvas.style.height = Math.floor(viewport.height / outputScale) + 'px';

                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';

                await page.render({
                    canvasContext: ctx,
                    viewport: viewport
                }).promise;

                if (nonce !== renderNonce) return;

                updateUI();
                if (loaderEl) {
                    loaderEl.style.opacity = '0';
                    setTimeout(() => { loaderEl.style.display = 'none'; }, 300);
                }
            } catch (err) {
                console.error('Render error:', err);
            }
        }

        function goToPrevPage() {
            if (!pdfDoc || currentPage <= 1) return;
            currentPage--;
            renderPage();
        }

        function goToNextPage() {
            if (!pdfDoc || currentPage >= pdfDoc.numPages) return;
            currentPage++;
            renderPage();
        }

        function adjustZoom(delta) {
            currentZoom = Math.max(0.7, Math.min(2.5, currentZoom + delta));
            renderPage();
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                goToPrevPage();
            } else if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                e.preventDefault();
                goToNextPage();
            }
        });

        // Touch Swipe gestures
        let touchStartX = 0;
        let touchStartY = 0;

        stageEl.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        stageEl.addEventListener('touchend', (e) => {
            const diffX = e.changedTouches[0].screenX - touchStartX;
            const diffY = e.changedTouches[0].screenY - touchStartY;

            if (Math.abs(diffX) > 45 && Math.abs(diffY) < 60) {
                if (diffX < 0) {
                    goToNextPage();
                } else {
                    goToPrevPage();
                }
            }
        }, { passive: true });

        // Resize handler
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(renderPage, 120);
        });

        // Initial load
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const pdfjsLib = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
                if (!pdfjsLib) throw new Error('PDF.js not loaded');

                pdfjsLib.GlobalWorkerOptions.workerSrc = '/assets/vendor/pdfjs/pdf.worker.min.js';

                const response = await fetch(PDF_URL, {
                    credentials: 'same-origin',
                    cache: 'no-store'
                });

                if (!response.ok) throw new Error('PDF fetch failed');

                const buffer = await response.arrayBuffer();
                pdfDoc = await pdfjsLib.getDocument({
                    data: new Uint8Array(buffer),
                    disableAutoFetch: true,
                    disableStream: true,
                    disableRange: true
                }).promise;

                updateUI();
                renderPage();
            } catch (err) {
                console.error('PDF load error:', err);
            }
        });
    </script>
