    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.98);
            --glass-border: rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
        }

        .contact-section {
            padding: 2.5rem 1rem;
        }

        .contact-wrapper {
            max-width: 680px;
            margin: 0 auto;
            padding: 3rem 2.5rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 1.5rem;
            box-shadow: var(--shadow-lg);
            animation: fadeIn 0.5s ease-out;
        }

        .section-title {
            text-align: center;
            margin-bottom: 2rem;
        }

        .section-title h1 {
            color: #1C5D4F;
            margin-bottom: 0.5rem;
            font-size: 2.2rem;
            font-weight: 800;
        }

        .section-title p {
            color: #4a5568;
            font-size: 1rem;
            line-height: 1.6;
        }

        .contact-info-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .contact-card-item {
            background: rgba(5, 150, 105, 0.05);
            border: 1px solid rgba(5, 150, 105, 0.18);
            border-radius: 12px;
            padding: 1.2rem 1rem;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .contact-card-item:hover {
            transform: translateY(-2px);
        }

        .contact-card-item i {
            color: #059669;
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .contact-card-item strong {
            color: #1C5D4F;
            font-size: 0.95rem;
            display: block;
            margin-bottom: 0.2rem;
        }

        .contact-card-item a,
        .contact-card-item span {
            color: #4a5568;
            font-size: 0.88rem;
            text-decoration: none;
            word-break: break-all;
        }

        .contact-card-item a:hover {
            color: #059669;
            text-decoration: underline;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #2d3748;
            font-size: 0.92rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: #ffffff;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #059669;
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #059669;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
            font-size: 1.05rem;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            background-color: #047857;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

<body>

    <div id="header-container"></div>

    <section class="contact-section">
        <div class="contact-wrapper">

            <div class="section-title">
                <h1>Contact SJMaths Support</h1>
                <p>Have an academic query, question feedback, or platform suggestion? Our team responds within 24 to 48 business hours.</p>
            </div>

            <!-- Direct Contact Info Cards (E-E-A-T) -->
            <div class="contact-info-cards">
                <div class="contact-card-item">
                    <i class="fas fa-envelope"></i>
                    <strong>Email Support</strong>
                    <a href="mailto:support@sjmaths.com">support@sjmaths.com</a>
                </div>
                <div class="contact-card-item">
                    <i class="fas fa-phone"></i>
                    <strong>Helpline</strong>
                    <a href="tel:+919170940900">+91-9170940900</a>
                </div>
                <div class="contact-card-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <strong>Location</strong>
                    <span>Uttar Pradesh, India</span>
                </div>
            </div>

            <form action="https://formspree.io/f/xkoggobv" method="POST" class="form-card">

                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject / Exam Class</label>
                    <input type="text" id="subject" name="subject" placeholder="e.g. Class 10 Maths or UPSC GS-2 Feedback" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="How can we assist you?"
                        required></textarea>
                </div>

                <button type="submit" class="submit-btn" aria-label="Send Message">Send Message</button>
            </form>

        </div>
    </section>
