            "content": {
              "en": "• **Anushilan Samiti (1902):** Founded in **Calcutta** by **Promotha Mitter**, with key leaders like **Barindra Kumar Ghosh** and **Bhupendranath Datta**.\n• **Jugantar Organ (1906):** Weekly journal launched to propagate revolutionary ideas.\n• **Abhinav Bharat (1904):** Reorganized from **Mitra Mela** by **Vinayak Damodar Savarkar** (VD Savarkar) in **Maharashtra**.\n• **Ghadar Party (1913):** Founded in **San Francisco, USA** by **Lala Hardayal** and **Sohan Singh Bhakna** to free India through armed revolt.\n• **Mnemonic for Founders:** **'A'**nushilan = **'P'**romotha (**AP**), **'A'**bhinav Bharat = **'S'**avarkar (**AS**), **'G'**hadar = **'H'**ardayal (**GH**).",

            "content": {
              "en": "• **HRA (Hindustan Republican Association):** Formed in **1924** at **Kanpur** by **Sachindra Nath Sanyal**, **Ram Prasad Bismil**, and **Jogesh Chandra Chatterjee**.\n• **Kakori Conspiracy Train Robbery (9 August 1925):** HRA members looted government money near Lucknow; resulted in the execution of Bismil, Ashfaqulla Khan, Roshan Singh, and Lahiri.\n• **HSRA (Hindustan Socialist Republican Association):** Re-established in **1928** at **Feroz Shah Kotla, Delhi** under the leadership of **Chandra Shekhar Azad** and **Bhagat Singh**, adding 'Socialist' to the name.\n• **Assembly Bomb Incident (8 April 1929):** **Bhagat Singh** and **Batukeshwar Dutt** threw non-lethal bombs in the Central Legislative Assembly to 'make the deaf hear'.",
              "hi": "• **एचआरए (हिंदुस्तान रिपब्लिकन एसोसिएशन):** **1924** में **कानपुर** में **सचींद्र नाथ सान्याल**, **राम प्रसाद बिस्मिल** और **योगेश चंद्र चटर्जी** द्वारा गठित।\n• **काकोरी षड्यंत्र ट्रेन डकैती (9 अगस्त 1925):** एचआरए के सदस्यों ने लखनऊ के पास सरकारी खजाना लूटा; जिसके परिणामस्वरूप बिस्मिल, अशफाकउल्ला खान, रोशन सिंह और लाहिड़ी को फांसी दी गई।\n• **एचएसआरए (हिंदुस्तान सोशलिस्ट रिपब्लिकन एसोसिएशन):** **चंद्रशेखर आजाद** और **भगत सिंह** के नेतृत्व में **1928** में **फिरोज शाह कोटला, दिल्ली** में पुनः स्थापित, जिसमें नाम में 'सोशलिस्ट' जोड़ा गया।\n• **असेंबली बम कांड (8 अप्रैल 1929):** 'बहनों को सुनाने के लिए' **भगत सिंह** और **बटुकेश्वर दत्त** ने केंद्रीय विधान सभा में गैर-घातक बम फेंके।"
            }
          },
          {
            "title": {
              "en": "Netaji Subhas Chandra Bose: Early Political Journey",

            "content": {
              "en": "• **Birth & Background:** Born on **23 January 1897** in **Cuttack, Odisha**.\n• **Civil Services Success:** Cleared the **ICS (Indian Civil Service)** exam in **1920** in England, but resigned in **1921** to join the freedom movement.\n• **Political Guru:** Mentored by **Deshbandhu Chittaranjan Das (C.R. Das)**.\n• **Municipal Leadership:** Elected as **Mayor of Calcutta** in **1930**.\n• **Newspaper:** Founded and edited the newspaper **'Swaraj'**.",
              "hi": "• **जन्म और पृष्ठभूमि:** **23 जनवरी 1897** को **कटक, ओडिशा** में जन्मे।\n• **सिविल सेवा में सफलता:** इंग्लैंड में **1920** में **आईसीएस (इंडियन सिविल सर्विस)** परीक्षा पास की, लेकिन स्वतंत्रता आंदोलन में शामिल होने के लिए **1921** में इस्तीफा दे दिया।\n• **राजनीतिक गुरु:** **देशबंधु चित्तरंजन दास (सी.आर. दास)** द्वारा मार्गदर्शन प्राप्त।\n• **नगर निगम नेतृत्व:** **1930** में **कोलकाता के मेयर** चुने गए।\n• **समाचार पत्र:** **'स्वराज'** समाचार पत्र की स्थापना और संपादन किया।"
            }
          },
          {
            "title": {
              "en": "Congress Presidency and Ideological Split",
              "hi": "कांग्रेस की अध्यक्षता और वैचारिक विभाजन"
            },
            "content": {
              "en": "• **Haripura Session (1938):** Elected unanimously as **Congress President**; formed the **National Planning Committee** under **Jawaharlal Nehru**.\n• **Tripuri Session (1939):** Re-elected defeating **Pattabhi Sitaramayya** (backed by Mahatma Gandhi) by 1580 to 1377 votes.\n• **Resignation (1939):** Resigned due to ideological differences with the Gandhi-led conservative faction and founded the **Forward Bloc** on **3 May 1939**.\n• **Mnemonic for Sessions:** **H**aripura (**38**) before **T**ripuri (**39**) -> **H-T** (High Tension).",
              "hi": "• **हरिपुरा अधिवेशन (1938):** सर्वसम्मति से **कांग्रेस अध्यक्ष** चुने गए; **जवाहरलाल नेहरू** के नेतृत्व में **राष्ट्रीय योजना समिति** का गठन किया।\n• **त्रिपुरी अधिवेशन (1939):** महात्मा गांधी समर्थित **पट्टाभी सीतारमैया** को 1580 के मुकाबले 1377 वोटों से हराकर पुनः निर्वाचित हुए।\n• **इस्तीफा (1939):** गांधी के नेतृत्व वाले रूढ़िवादी गुट के साथ वैचारिक मतभेदों के कारण इस्तीफा दे दिया और **3 मई 1939** को **फारवर्ड ब्लॉक** की स्थापना की।\n• **अधिषेणों के लिए न्यूमोनिक:** **H**aripura (**38**) से पहले **T**ripuri (**39**) -> **H-T** (हाई टेंशन)।"
            }

          {
            "title": {
              "en": "The Great Escape and Foreign Mission",
              "hi": "महान पलायन और विदेशी मिशन"
            },
            "content": {
              "en": "• **House Arrest Escape (1941):** Escaped from his Elgin Road house in Calcutta disguised as a deaf-and-dumb pathan ('Ziauddin') to reach **Berlin, Germany**.\n• **Radio Broadcasts:** Broadcasted regular addresses to India from **Azad Hind Radio** in Germany.\n• **Meeting Hitler:** Met **Adolf Hitler** in **1942** to secure German support for Indian independence.\n• **Transfer to Asia:** Travelled by German and Japanese submarines across oceans in **1943** to reach Southeast Asia.",
              "hi": "• **नजरबंदी से पलायन (1941):** **बर्लिन, जर्मनी** पहुँचने के लिए कलकत्ता के अपने एल्गिन रोड स्थित घर से एक गूंगे-बहरे पठान ('ज़ियाउद्दीन') के वेश में भागे।\n• **रेडियो प्रसारण:** जर्मनी में **आज़ाद हिंद रेडियो** से भारत के लिए नियमित संबोधन प्रसारित किए।\n• **हिटलर से मुलाकात:** भारतीय स्वतंत्रता के लिए जर्मन समर्थन सुरक्षित करने हेतु **1942** में **एडोल्फ हिटलर** से मुलाकात की।\n• **एशिया की ओर प्रस्थान:** दक्षिण पूर्व एशिया पहुँचने के लिए **1943** में महासागरों को पार करते हुए जर्मन और जापानी पनडुब्बियों से यात्रा की।"

          {
            "title": {
              "en": "Indian National Army (INA) and Azad Hind Government",
              "hi": "भारतीय राष्ट्रीय सेना (INA) और आज़ाद हिंद सरकार"
            },
            "content": {
              "en": "• **Origin of INA:** Originally conceived by **Captain Mohan Singh** in **1942** with Indian POWs captured by Japan.\n• **Netaji's Leadership:** Took over supreme command of INA from **Rash Behari Bose** in **Singapore** in **July 1943**.\n• **Provisional Government:** Formed the **Arzi Hukumat-e-Azad Hind** (Provisional Government of Free India) on **21 October 1943**.\n• **Famous Slogans:** Given by Netaji — **'Delhi Chalo'** and **'Give me blood, and I shall give you freedom!'**\n• **INA Regiments:** Named after national icons — **Subhas Regiment**, **Gandhi Regiment**, **Nehru Regiment**, and the women's regiment named **Rani Jhansi Regiment** (led by **Captain Lakshmi Sahgal**).",
              "hi": "• **INA की उत्पत्ति:** मूल रूप से **कैप्टन मोहन सिंह** द्वारा **1942** में जापान द्वारा पकड़े गए भारतीय युद्धबंदियों (POWs) के साथ इसकी परिकल्पना की गई थी।\n• **नेताजी का नेतृत्व:** **जुलाई 1943** में **सिंगापुर** में **रासबिहारी बोस** से INA की सर्वोच्च कमान संभाली।\n• **अस्थायी सरकार:** **21 अक्टूबर 1943** को **आर्ज़ी हुकूमत-ए-आज़ाद हिंद** (स्वतंत्र भारत की अनंतिम सरकार) का गठन किया।\n• **प्रसिद्ध नारे:** नेताजी द्वारा दिए गए — **'दिल्ली चलो'** और **'तुम मुझे खून दो, मैं तुम्हें आज़ादी दूंगा!'**\n• **INA रेजिमेंट:** राष्ट्रीय प्रतीकों के नाम पर — **सुभाष रेजिमेंट**, **गांधी रेजिमेंट**, **नेहरू रेजिमेंट**, और महिलाओं की रेजिमेंट का नाम **रानी झांसी रेजिमेंट** (**कैप्टन लक्ष्मी सहगल** के नेतृत्व में)।"
            }

          {
            "title": {
              "en": "Demise and Posthumous Legacy",
              "hi": "निधन और मरणोपरांत विरासत"
            },
            "content": {
              "en": "• **Mysterious Death:** Officially reported to have died in a tragic plane crash in **Taihoku (Taipei), Formosa (Taiwan)** on **18 August 1945**.\n• **INA Trials (1945-46):** Public trials held at the **Red Fort, Delhi** for captured INA officers (**P.K. Sehgal**, **Shah Nawaz Khan**, **Gurbakhsh Singh Dhillon**); defended by **Bhulabhai Desai**, **Jawaharlal Nehru**, and **K.N. Katju**.\n• **Title 'Netaji':** Endearingly conferred upon Subhas Chandra Bose by the Indian residents in Germany (led by **A.C.N. Nambiar**).\n• **Parakram Diwas:** Celebrated annually on **23 January** to mark his birth anniversary.",
              "hi": "• **रहस्यमयी मृत्यु:** **18 अगस्त 1945** को **ताइहोकू (ताइपे), फॉर्मोसा (ताइवान)** में एक दुखद विमान दुर्घटना में मृत्यु होने की आधिकारिक सूचना दी गई।\n• **INA मुकदमे (1945-46):** पकड़े गए INA अधिकारियों (**पी.के. सहगल**, **शाहनवाज खान**, **गुरबख्श सिंह ढिल्लों**) के लिए **लाल किला, दिल्ली** में सार्वजनिक मुकदमे चलाए गए; जिनका बचाव **भूलाभाई देसाई**, **जawaharlal नेहरू** और **के.एन. काटजू** ने किया।\n• **'नेताजी' उपाधि:** जर्मनी में भारतीय प्रवासियों (नेतृत्व **ए.सी.एन. नांबियार**) द्वारा सुभाष चंद्र बोस को स्नेहपूर्वक प्रदान की गई।\n• **पराक्रम दिवस:** उनकी जयंती के उपलक्ष्य में प्रतिवर्ष **23 जनवरी** को मनाया जाता है।"
            }
