            "title": {
              "en": "1. Indian Architectural Styles (**Nagara, Dravida, Vesara**)",

            "content": {
              "en": "• **Nagara Style:** Prominent in **Northern India**, features beehive-shaped tower (**Shikhara**), absence of massive boundary walls, and **Amalaka** on top.\n• **Dravida Style:** Found in **Southern India**, characterized by pyramidal tower (**Vimana**), massive enclosure walls, and elaborate gateways (**Gopurams**).\n• **Vesara Style:** Hybrid style combining elements of both **Nagara** and **Dravida**, patronized by **Chalukyas and Hoysalas**.\n• **Mnemonic:** **NDV = Northern Dravida Vesara -> North is Nagara, South is Dravida, Middle is Vesara**.",
              "hi": "• **नगर शैली:** **उत्तरी भारत** में प्रमुख, इसमें मधुमक्खी के छत्ते के आकार का टॉवर (**शिखर**), विशाल सीमा दीवारों की अनुपस्थिति, और शीर्ष पर **आमलक** होता है।\n• **द्रविड़ शैली:** **दक्षिण भारत** में पाई जाती है, जिसकी विशेषता पिरामिडनुमा टॉवर (**विमान**), विशाल घेरे वाली दीवारें और विस्तृत प्रवेश द्वार (**गोपुरम**) हैं।\n• **वेसर शैली:** **नगर** और **द्रविड़** दोनों के तत्वों को मिलाने वाली हाइब्रिड शैली, जिसे **चालुक्यों और होयस्लों** का संरक्षण प्राप्त था।\n• **स्मरण सहायक (Mnemonic):** **NDV = Northern Dravida Vesara -> उत्तर में नगर, दक्षिण में द्रविड़, मध्य में वेसर**।"

              "hi": "• **भरतनाट्यम:** **तमिलनाडु** से उत्पन्न, **नाट्यशास्त्र** के सिद्धांतों और मूर्तिकला जैसी मुद्राओं के लिए जाना जाता है।\n• **कथक:** **उत्तर प्रदेश** से उत्पन्न, पाद संचालन (**तत्कर**) और **घराने** (लखनऊ, बनारस) पर जोर देता है।\n• **कथकली और मोहिनीअट्टम:** **केरल** से उत्पन्न, भारी फेशियल मेकअप और कथावाचन की विशेषता है।\n• **कुचिपुड़ी:** **आंध्र प्रदेश** से उत्पन्न, तेज लय और नाटकीय कथावाचन को शामिल करता है।\n• **ओडिसी:** **ओडिशा** से उत्पन्न, **त्रिभंग** मुद्रा (शरीर को तीन जगह से मोड़ने) के लिए जाना जाता है।\n• **मणिपुरी:** **मणिपुर** से उत्पन्न, **राधा-कृष्ण (रास लीला)** के भक्ति विषयों पर केंद्रित है।\n• **सत्रिया:** **असम** से उत्पन्न, 15वीं शताब्दी में संत **शंकरदेव** द्वारा शुरू किया गया।"

            "content": {
              "en": "• **Hindustani Music:** Practiced in **Northern India**, heavily influenced by **Persian and Islamic** traditions, uses **Khayal, Dhrupad, and Tarana**.\n• **Carnatic Music:** Practiced in **Southern India**, strictly devotional, temple-centric, structured around **Ragas and Talas**.\n• **Key Terminology:** **Shruti** (microtone), **Swara** (note), **Raga** (melodic framework), **Tala** (rhythmic cycle).\n• **Mnemonic:** **H**industani = **H**orth (North); **C**arnatic = **C**oast (South).",

              "hi": "• **सिंधु घाटी:** **नर्तकी** (कांसे की लास्ट-वैक्स तकनीक), **पुरोहित राजा** (खड़ीय पत्थर/स्टीेटाइट)।\n• **मौर्य कला:** पॉलिश किए गए पत्थर के स्तंभ (**अशोक स्तंभ**), **लोमर्ष ऋषि गुफा** (बराबर की पहाड़ियाँ)।\n• **गुप्त कला:** मूर्तिकला का स्वर्ण युग, **सारनाथ में बुद्ध की प्रतिमा** (धर्मचक्र प्रवर्तन मुद्रा)।\n• **अजंता और एलोरा की गुफाएँ:** **महाराष्ट्र** में स्थित, अजंता में बौद्ध भित्ति चित्र हैं; एलोरा में चट्टान को काटकर बनाई गई वास्तुकला (**कैलाश मंदिर - गुफा 16**) है।"

            "title": {
              "en": "5. Folk Dances of Uttar Pradesh (**Exam Special**)",

              "en": "• **Kathak:** Classical dance indigenous to **Uttar Pradesh**.\n• **Charkula:** Performed in **Braj region**, balancing 108 oil lamps on the head.\n• **Raslila:** Depicts adolescent plays of **Lord Krishna** with **Gopis**.\n• **Kajri / Birha / Alha:** Traditional folk songs and ballad forms tied to seasonal rains and martial history.",
              "hi": "• **कथक:** **उत्तर प्रदेश** का मूल शास्त्रीय नृत्य।\n• **चरकुला:** **ब्रज क्षेत्र** में किया जाता है, जिसमें सिर पर 108 तेल के दीये संतुलित किए जाते हैं।\n• **रासलीला:** **भगवान कृष्ण** की **गोपियों** के साथ बाल लीलाओं का चित्रण करती है।\n• **कजरी / बिरहा / आल्हा:** मौसमी बारिश और वीरता के इतिहास से जुड़े पारंपरिक लोक गीत और गाथागीत।"
