          {
            "title": {
              "en": "Levels of Biodiversity",
              "hi": "जैविक विविधता के स्तर"
            },
            "content": {
              "en": "• **Genetic Diversity:** Variation of genes within species (e.g., different varieties of rice or mangoes).\n• **Species Diversity:** Variety of species within a particular region (e.g., amphibians in Western Ghats vs Eastern Ghats).\n• **Ecosystem Diversity:** Variety of ecosystems in a geographical location (e.g., deserts, mangroves, coral reefs, and tropical rain forests).\n• **Mnemonic:** 'Get Some Energy' for **G**enetic, **S**pecies, **E**cosystem.",
              "hi": "• **आनुवंशिक विविधता (Genetic Diversity):** जातियों के भीतर जीनों में विभिन्नता (जैसे, चावल या आम की विभिन्न किस्में)।\n• **प्रजाति विविधता (Species Diversity):** किसी विशेष क्षेत्र के भीतर जातियों की विविधता (जैसे, पश्चिमी घाट बनाम पूर्वी घाट के उभयचर)।\n• **पारिस्थितिकी तंत्र विविधता (Ecosystem Diversity):** भौगोलिक स्थिति में पारिस्थितिकी तंत्र की विविधता (जैसे, रेगिस्तान, मैंग्रोव, प्रवाल भित्तियाँ, और उष्णकटिबंधीय वर्षा वन)।\n• **स्मरण सहायक (Mnemonic):** **G**enetic, **S**pecies, **E**cosystem के लिए 'Get Some Energy'।"
            }
          },
          {
            "title": {
              "en": "Conservation Strategies",
              "hi": "संरक्षण रणनीतियाँ"
            },
            "content": {
              "en": "• **In-situ Conservation:** Protecting species in their natural habitats (e.g., **National Parks, Wildlife Sanctuaries, Biosphere Reserves, Sacred Groves**).\n• **Ex-situ Conservation:** Protecting species outside their natural habitats (e.g., **Botanical Gardens, Zoological Parks, Seed Banks, Cryopreservation**).\n• **Core Difference:** In-situ focuses on ecosystem-level protection; Ex-situ focuses on individual species rescue and breeding.",
              "hi": "• **स्व-स्थान संरक्षण (In-situ Conservation):** जातियों को उनके प्राकृतिक आवासों में संरक्षित करना (जैसे, **राष्ट्रीय उद्यान, वन्यजीव अभयारण्य, बायोस्फीयर रिजर्व, पवित्र उपवन**)।\n• **बाह्य-स्थान संरक्षण (Ex-situ Conservation):** जातियों को उनके प्राकृतिक आवासों के बाहर संरक्षित करना (जैसे, **वनस्पति उद्यान, प्राणि उद्यान, बीज बैंक, क्रायोप्रेज़र्वेशन**)।\n• **मुख्य अंतर:** स्व-स्थान संरक्षण पारिस्थितिकी तंत्र-स्तर के संरक्षण पर ध्यान केंद्रित करता है; बाह्य-स्थान संरक्षण व्यक्तिगत प्रजातियों के बचाव और प्रजनन पर ध्यान केंद्रित करता है।"
            }
          },
          {
            "title": {
              "en": "Biodiversity Hotspots Concept",
              "hi": "जैव विविधता हॉटस्पॉट की अवधारणा"
            },
            "content": {
              "en": "• Defined by **Norman Myers** in 1988 as regions with high levels of endemic species facing severe habitat loss.\n• **Criteria:** Must contain at least **1,500 species of vascular plants** as endemics and have lost at least **70% of its original habitat**.\n• **Indian Hotspots:** **Himalayas, Indo-Burma, Western Ghats, and Sundaland** (including Nicobar Islands).\n• **Mnemonic:** 'How Is Wild Sundar' for **H**imalayas, **I**ndo-Burma, **W**estern Ghats, **Sundaland**.",
              "hi": "• **नॉर्मन मायर्स (Norman Myers)** द्वारा 1988 में ऐसे क्षेत्रों के रूप में परिभाषित किया गया जहाँ स्थानिक प्रजातियों की उच्च मात्रा है और जो गंभीर आवास हानि का सामना कर रहे हैं।\n• **मानदंड:** इसमें स्थानिक रूप से कम से कम **1,500 संवहनी पौधों की प्रजातियाँ (vascular plants)** होनी चाहिए और इसने अपने मूल आवास का कम से कम **70%** हिस्सा खो दिया हो।\n• **भारतीय हॉटस्पॉट:** **हिमालय, इंडो-बर्मा, पश्चिमी घाट, और सुंडालैंड** (निकोबार द्वीप समूह सहित)।\n• **स्मरण सहायक (Mnemonic):** **H**imalayas, **I**ndo-Burma, **W**estern Ghats, **Sundaland** के लिए 'How Is Wild Sundar'।"
            }
          },
          {
            "title": {
              "en": "Ecological Pyramids",
              "hi": "पारिस्थितिक पिरामिड"
            },
            "content": {
              "en": "• **Pyramid of Number:** Can be upright, inverted (e.g., tree ecosystem), or spindle-shaped.\n• **Pyramid of Biomass:** Generally upright, except in aquatic ecosystems where phytoplankton biomass is less than zooplankton biomass (**Inverted**).\n• **Pyramid of Energy:** Always **strictly upright** due to the **10% Law of Energy Transfer** proposed by **Lindeman** (1942).",
              "hi": "• **संख्या का पिरामिड (Pyramid of Number):** सीधा, उल्टा (जैसे, वृक्ष पारिस्थितिकी तंत्र), या तर्कु-आकार (spindle-shaped) हो सकता है।\n• **जीवभार का पिरामिड (Pyramid of Biomass):** सामान्यतः सीधा होता है, सिवाय जलीय पारिस्थितिकी तंत्र के जहाँ फाइटोप्लांकटन (पादपप्लवक) का जीवभार ज़ूप्लांकटन (प्राणिप्लवक) के जीवभार से कम होता है (**उल्टा**)।\n• **ऊर्जा का पिरामिड (Pyramid of Energy):** **लिंडेमैन** (1942) द्वारा प्रतिपादित **ऊर्जा स्थानांतरण के 10% नियम** के कारण हमेशा **सख्त रूप से सीधा** होता है।"
            }
          },
          {
            "title": {
              "en": "Environmental Acts and Laws in India",
              "hi": "भारत में पर्यावरण अधिनियम और कानून"
            },
            "content": {
              "en": "• **Wildlife Protection Act:** Enacted in **1972**.\n• **Water (Prevention and Control of Pollution) Act:** Enacted in **1974**.\n• **Forest (Conservation) Act:** Enacted in **1980**.\n• **Air (Prevention and Control of Pollution) Act:** Enacted in **1981**.\n• **Environment (Protection) Act:** Enacted in **1986** (known as the **Umbrella Act**).\n• **Biological Diversity Act:** Enacted in **2002**.",
              "hi": "• **वन्यजीव संरक्षण अधिनियम (Wildlife Protection Act):** **1972** में अधिनियमित।\n• **जल (प्रदूषण निवारण एवं नियंत्रण) अधिनियम:** **1974** में अधिनियमित।\n• **वन (संरक्षण) अधिनियम:** **1980** में अधिनियमित।\n• **वायु (प्रदूषण निवारण एवं नियंत्रण) अधिनियम:** **1981** में अधिनियमित।\n• **पर्यावरण (संरक्षण) अधिनियम:** **1986** में अधिनियमित (**छाता अधिनियम / Umbrella Act** के रूप में जाना जाता है)।\n• **जैविक विविधता अधिनियम:** **2002** में अधिनियमित।"
            }
          },
          {
            "title": {
              "en": "Important International Conventions",
              "hi": "महत्वपूर्ण अंतर्राष्ट्रीय सम्मेलन"
            },
            "content": {
