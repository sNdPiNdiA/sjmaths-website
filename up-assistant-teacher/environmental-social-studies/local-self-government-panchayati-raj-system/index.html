              "en": "• **Balwant Rai Mehta Committee (1957):** Recommended **3-tier** Panchayati Raj system.\n• **Ashok Mehta Committee (1977-1978):** Recommended **2-tier** system and constitutional recognition.\n• **G.V.K. Rao Committee (1985):** Emphasized role of bureaucracy and district planning.\n• **L.M. Singhvi Committee (1986):** Recommended **constitutional status** and judicial tribunals for panchayat elections.\n• **Mnemonic for Committees:** 'Bring All Good Leaders' -> **B**alwant Rai, **A**shok, **G**.V.K., **L**.M. Singhvi.",

              "hi": "• **73वें संविधान संशोधन अधिनियम, 1992** के माध्यम से जोड़ा गया, जो **24 अप्रैल 1993** (राष्ट्रीय पंचायती राज दिवस) से प्रभावी हुआ।\n• इसमें परिभाषाओं, ग्राम सभा, गठन, आरक्षण और वित्त का विवरण देने वाले **अनुच्छेद 243 से 243-O** शामिल हैं।\n• **11वीं अनुसूची:** इसमें कृषि, स्वास्थ्य, स्वच्छता और प्राथमिक शिक्षा को कवर करने वाली पंचायतों को हस्तांतरित **29 कार्यात्मक वस्तुएँ** शामिल हैं।\n• **प्रमुख अनुच्छेदों के लिए याद रखने की ट्रिक:** 'BAF-E-D-F-A' -> **B**asic definitions (243), **A**udit/Accounts (243-I), **F**inance Commission (243-I), **E**lections (243-K)।"

              "en": "• **Gram Panchayat:** Lowest level at village/group of villages; headed by **Sarpanch** or **Pradhan**.\n• **Panchayat Samiti:** Intermediate level at block level; acts as a link between village and district; headed by **Pramukh**.\n• **Zilla Parishad:** Apex district level body; coordinates development plans; headed by **Chairperson/President**.\n• **Population Threshold:** States with population below **20 lakhs** may not constitute the intermediate tier.",

              "hi": "• **सीटों का आरक्षण:** उनकी जनसंख्या के अनुपात में **अनुसूचित जातियों (SCs)** और **अनुसूचित जनजातियों (STs)** के लिए अनिवार्य आरक्षण।\n• **महिला आरक्षण:** महिलाओं के लिए कुल सीटों का **एक-तिहाई (33%)** से कम आरक्षित नहीं (बिहार और यूपी जैसे कुछ राज्यों ने विशिष्ट भूमिकाओं में महिला कोटा बढ़ाया है)।\n• **कार्यकाल:** इसकी पहली बैठक के लिए नियत तारीख से सभी स्तरों के लिए **5 वर्ष** की निश्चित अवधि।\n• **विघटन:** पंचायत के विघटन या अधिक्रमण के **6 महीने** के भीतर चुनाव होने चाहिए।"

              "hi": "• **राज्य वित्त आयोग (अनुच्छेद 243-I):** पंचायतों की वित्तीय स्थिति की समीक्षा के लिए हर **5 साल** में **राज्यपाल** द्वारा गठित किया जाता है।\n• **राजस्व के स्रोत:** संपत्ति पर कर, टोल, राज्य की संचित निधि से सहायता अनुदान, और केंद्रीय योजना आवंटन।\n• **ऑडिट:** खातों का रखरखाव और ऑडिट **राज्य विधानमंडल** द्वारा निर्धारित किया जाता है।"
