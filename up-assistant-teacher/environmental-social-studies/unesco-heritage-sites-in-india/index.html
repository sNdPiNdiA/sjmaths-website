            "content": {
              "en": "• **Cultural Sites:** Monuments, groups of buildings, and sites having outstanding universal value from historical, aesthetic, ethnological, or anthropological points of view (e.g., **Taj Mahal**, **Red Fort**).\n• **Natural Sites:** Outstanding physical, biological, and geological formations, habitats of threatened species, and areas of scientific/conservation value (e.g., **Kaziranga National Park**, **Sundarbans**).\n• **Mixed Sites:** Properties that contain elements of both natural and cultural significance (e.g., **Khangchendzonga National Park** in Sikkim).\n• **Intangible Cultural Heritage:** Distinct category for oral traditions, performing arts, social practices, rituals, and festive events (e.g., **Durga Puja in Kolkata**, **Vedic Chanting**).",

            "content": {
              "en": "• **Tentative List:** Member states must first submit an inventory of important properties they intend to nominate over the coming years.\n• **Nomination File:** Detailed dossier prepared by the respective government highlighting the **Outstanding Universal Value (OUV)**.\n• **Advisory Bodies:** Evaluation is conducted by **ICOMOS** (for cultural sites) and **IUCN** (for natural sites).\n• **Selection Criteria:** Total **10 criteria** exist—Criteria (i) to (vi) for cultural heritage, and Criteria (vii) to (x) for natural heritage.",

            },
            "content": {
              "en": "• **Mnemonic Phrase:** **K-S-K-N-N-G-W**\n• **K** - **Kaziranga National Park** (Assam)\n• **S** - **Sundarbans National Park** (West Bengal)\n• **K** - **Keoladeo National Park** (Rajasthan)\n• **N** - **Nanda Devi and Valley of Flowers** (Uttarakhand)\n• **N** - **Nokrek** (Note: Nokrek is a Biosphere Reserve, natural WHS is **Great Himalayan National Park** in HP)\n• **G** - **Great Himalayan National Park** (Himachal Pradesh)\n• **W** - **Western Ghats** (Spread across 6 states)",
