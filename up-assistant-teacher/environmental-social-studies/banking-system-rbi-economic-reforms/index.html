            "title": {
              "en": "1. Evolution and Structure of Indian Banking System",

            "content": {
              "en": "• **First Bank:** Bank of Hindustan established in **1770**.\n• **Presidency Banks:** Bank of Bengal (**1809**), Bank of Bombay (**1840**), and Bank of Madras (**1843**).\n• **Imperial Bank of India:** Formed in **1921** by merging Presidency banks; later nationalized as **State Bank of India (SBI)** on **July 1, 1955**.\n• **Major Nationalizations:** **14 banks** nationalized on **July 19, 1969** (minimum deposit 50 crore); **6 banks** nationalized on **April 15, 1980** (minimum deposit 200 crore).\n• **Mnemonic for Nationalization:** **'14 Sixes in 69 and 80'** (14 banks in 1969, 6 banks in 1980).",
              "hi": "• **पहला बैंक:** बैंक ऑफ हिंदुस्तान की स्थापना **1770** में हुई।\n• **प्रेसीडेंसी बैंक:** बैंक ऑफ बंगाल (**1809**), बैंक ऑफ बॉम्बे (**1840**), और बैंक ऑफ मद्रास (**1843**)।\n• **इम्पीरियल बैंक ऑफ इंडिया:** प्रेसीडेंसी बैंकों का विलय करके **1921** में गठित; बाद में **1 जुलाई 1955** को **भारतीय स्टेट बैंक (SBI)** के रूप में राष्ट्रीयकृत किया गया।\n• **प्रमुख राष्ट्रीयकरण:** **19 जुलाई 1969** को **14 बैंकों** का राष्ट्रीयकरण (न्यूनतम जमा 50 करोड़); **15 अप्रैल 1980** को **6 बैंकों** का राष्ट्रीयकरण (न्यूनतम जमा 200 करोड़)।\n• **राष्ट्रीयकरण के लिए म्निमोनिक:** **'69 और 80 में 14 छक्के'** (1969 में 14 बैंक, 1980 में 6 बैंक)।"

            "title": {
              "en": "2. Reserve Bank of India (RBI) and Monetary Policy",

            "content": {
              "en": "• **Establishment:** Founded on **April 1, 1935** under the **RBI Act, 1934** on the recommendations of the **Hilton Young Commission** (Royal Commission).\n• **Nationalization:** Nationalized on **January 1, 1949**; first Indian Governor was **C.D. Deshmukh**.\n• **Headquarters:** Permanently moved from **Calcutta to Mumbai** in **1937**.\n• **Quantitative Tools:** **Repo Rate**, **Reverse Repo Rate**, **Cash Reserve Ratio (CRR)**, **Statutory Liquidity Ratio (SLR)**, **Bank Rate**, and **Open Market Operations (OMO)**.\n• **Qualitative Tools:** Margin requirements, moral suasion, credit rationing, and direct action.\n• **Mnemonic for Quantitative Tools:** **'CRASH BRO'** (CRR, Repo, SLR, Bank Rate, OMO).",
              "hi": "• **स्थापना:** **हिल्टन यंग कमीशन** (रॉयल कमीशन) की सिफारिशों पर **RBI अधिनियम, 1934** के तहत **1 अप्रैल 1935** को स्थापना हुई।\n• **राष्ट्रीयकरण:** **1 जनवरी 1949** को राष्ट्रीयकरण किया गया; पहले भारतीय गवर्नर **सी.डी. देशमुख** थे।\n• **मुख्यालय:** **1937** में स्थायी रूप से **कोलकाता से मुंबई** स्थानांतरित किया गया।\n• **मात्रात्मक उपकरण:** **रेपो रेट**, **रिवर्स रेपो रेट**, **नकद आरक्षित अनुपात (CRR)**, **वैधानिक तरलता अनुपात (SLR)**, **बैंक रेट**, और **खुले बाजार की गतिविधियाँ (OMO)**।\n• **गुणात्मक उपकरण:** मार्जिन आवश्यकताएं, नैतिक दबाव, ऋण राशनिंग, और प्रत्यक्ष कार्रवाई।\n• **मात्रात्मक उपकरणों के लिए म्निमोनिक:** **'CRASH BRO'** (CRR, Repo, SLR, Bank Rate, OMO)।"
            }

          {
            "title": {
              "en": "3. Economic Reforms of 1991 (LPG Model)",
              "hi": "3. 1991 के आर्थिक सुधार (LPG मॉडल)"
            },
            "content": {
              "en": "• **Trigger:** Severe **Balance of Payment (BOP)** crisis and foreign exchange reserves depleting to barely 2 weeks of imports in **1991**.\n• **Architects:** Prime Minister **P.V. Narasimha Rao** and Finance Minister **Dr. Manmohan Singh**.\n• **Liberalisation:** Reduction of industrial licensing, removal of trade barriers, and tax reforms.\n• **Privatisation:** Transfer of ownership, management, and control from public sector to private sector enterprises (Disinvestment).\n• **Globalisation:** Integration of the national economy with the world economy through **FDI** and foreign portfolio investments.\n• **Mnemonic for LPG Pillars:** **'LPG makes the economy FLY'** (Free trade, Privatise assets, Global integration).",
              "hi": "• **तत्कालिक कारण:** **1991** में गंभीर **भुगतान संतुलन (BOP)** संकट और विदेशी मुद्रा भंडार का केवल 2 सप्ताह के आयात तक सीमित रह जाना।\n• **सूत्रधार:** प्रधानमंत्री **पी.वी. नरसिम्हा राव** और वित्त मंत्री **डॉ. मनमोहन सिंह**।\n• **उदारीकरण:** औद्योगिक लाइसेंसिंग में कमी, व्यापार बाधाओं को हटाना, और कर सुधार।\n• **निजीकरण:** सार्वजनिक क्षेत्र के उद्यमों से स्वामित्व, प्रबंधन और नियंत्रण का निजी क्षेत्र के उद्यमों को हस्तांतरण (विनिवेश)।\n• **वैश्वीकरण:** **FDI** और विदेशी पोर्टफोलियो निवेश के माध्यम से राष्ट्रीय अर्थव्यवस्था का विश्व अर्थव्यवस्था के साथ एकीकरण।\n• **LPG स्तंभों के लिए म्निमोनिक:** **'LPG अर्थव्यवस्था को उड़ान देता है (FLY)'** (मुक्त व्यापार, परिसंपत्तियों का निजीकरण, वैश्विक एकीकरण)।"
            }

          {
            "title": {
              "en": "4. Types of Banks in India",
              "hi": "4. भारत में बैंकों के प्रकार"
            },
            "content": {
              "en": "• **Central Bank:** Apex financial institution (**RBI**) regulating all other banks.\n• **Commercial Banks:** Public Sector Banks (**PSBs**), Private Sector Banks, and Foreign Banks operating for profit.\n• **Regional Rural Banks (RRBs):** Established on **October 2, 1975** based on the recommendations of the **Narasimham Working Group**.\n• **Cooperative Banks:** Operate on a no-profit, no-loss basis catering to agricultural and rural sectors.\n• **NABERT/SIDBI/EXIM:** Specialized financial institutions for agriculture, small industries, and foreign trade respectively.",
              "hi": "• **केंद्रीय बैंक:** अन्य सभी बैंकों को विनियमित करने वाली शीर्ष वित्तीय संस्था (**RBI**)।\n• **वाणिज्यिक बैंक:** सार्वजनिक क्षेत्र के बैंक (**PSBs**), निजी क्षेत्र के बैंक, और लाभ के लिए संचालित विदेशी बैंक।\n• **क्षेत्रीय ग्रामीण बैंक (RRBs):** **नरसिम्हम कार्य समूह** की सिफारिशों के आधार पर **2 अक्टूबर 1975** को स्थापित।\n• **सहकारी बैंक:** कृषि और ग्रामीण क्षेत्रों की जरूरतों को पूरा करने वाले नो-प्रॉफिट, नो-लॉस के आधार पर संचालित बैंक।\n• **नाबार्ड/सिडबी/एक्जिम:** क्रमशः कृषि, लघु उद्योगों और विदेशी व्यापार के लिए विशेष वित्तीय संस्थान।"
            }

          {
            "title": {
              "en": "5. Priority Sector Lending (PSL) and Financial Inclusion",
              "hi": "5. प्राथमिकता प्राप्त क्षेत्र को ऋण (PSL) और वित्तीय समावेशन"
