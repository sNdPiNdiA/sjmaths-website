          {
            "title": {
              "en": "Disaster Management Cycle",
              "hi": "आपदा प्रबंधन चक्र"
            },
            "content": {
              "en": "• **Pre-Disaster Phase:** Focuses on **Mitigation** (reducing vulnerability) and **Preparedness** (planning, warning systems, evacuation drills).\n• **During Disaster Phase:** Focuses on **Response** (search, rescue, emergency relief, medical aid).\n• **Post-Disaster Phase:** Focuses on **Recovery** (restoring essential infrastructure) and **Rehabilitation** (long-term livelihood restoration).\n• **Mnemonic:** Use **MPRR** for **M**itigation, **P**reparedness, **R**esponse, and **R**ecovery.",
              "hi": "• **आपदा-पूर्व चरण:** यह **शमन** (सुभेद्यता को कम करना) और **तैयारी** (योजना, चेतावनी प्रणाली, निकासी अभ्यास) पर केंद्रित है।\n• **आपदा के दौरान चरण:** यह **प्रतिक्रिया** (खोज, बचाव, आपातकालीन राहत, चिकित्सा सहायता) पर केंद्रित है।\n• **आपदा-पश्चात चरण:** यह **पुनर्प्राप्ति** (आवश्यक बुनियादी ढाँचे की बहाली) और **पुनर्वास** (दीर्घकालिक आजीविका बहाली) पर केंद्रित है।\n• **स्मृति सहायक (Mnemonic):** **M**itigation, **P**reparedness, **R**esponse, और **R**ecovery के लिए **MPRR** का उपयोग करें।"
            }
          },
          {
            "title": {
              "en": "Geological Disasters: Earthquakes & Tsunamis",
              "hi": "भूवैज्ञानिक आपदाएँ: भूकंप और सुनामी"
            },
            "content": {
              "en": "• **Earthquake Origin:** Originated at the **Focus (Hypocenter)** inside the Earth; points directly above on the surface form the **Epicenter**.\n• **Measurement Scales:** **Richter Scale** measures magnitude (energy released); **Mercalli Scale** measures intensity (visible damage).\n• **Tsunamis:** Giant sea waves caused by undersea earthquakes, volcanic eruptions, or landslides, highly destructive in coastal regions.",
              "hi": "• **भूकंप की उत्पत्ति:** पृथ्वी के भीतर **फोकस (हाइपोसेंटर)** पर उत्पन्न होती है; सतह पर इसके ठीक ऊपर के बिंदु **एपिकसेंटर (अधिकेंद्र)** का निर्माण करते हैं।\n• **माप पैमाना:** **ريخ्टर पैमाना (Richter Scale)** परिमाण (मुक्त हुई ऊर्जा) को मापता है; **मर्काली पैमाना (Mercalli Scale)** तीव्रता (दृश्यमान क्षति) को मापता है।\n• **सुनामी:** पानी के नीचे आने वाले भूकंपों, ज्वालामुखी विस्फोटों या भूस्खलन के कारण उठने वाली विशाल समुद्री लहरें, जो तटीय क्षेत्रों में अत्यधिक विनाशकारी होती हैं।"
            }
          },
          {
            "title": {
              "en": "Hydrometeorological Disasters: Floods & Droughts",
              "hi": "जल-मौसम संबंधी आपदाएँ: बाढ़ और सूखा"
            },
            "content": {
              "en": "• **Floods:** Overflow of water onto normally dry land, frequently caused by heavy monsoon rains, cloudbursts, or dam failures.\n• **Droughts:** Extended period of deficient rainfall leading to water scarcity, categorized into meteorological, hydrological, and agricultural droughts.\n• **Cyclones:** Rapid inward air circulation around a low-pressure area, categorized as **Tropical Cyclones** in the Bay of Bengal and Arabian Sea.",
              "hi": "• **बाढ़:** सामान्यतः सूखी भूमि पर पानी का फैल जाना, जो अक्सर भारी मानसूनी बारिश, बादल फटने या बांध टूटने के कारण होता है।\n• **सूखा:** अपर्याप्त वर्षा की लंबी अवधि जिससे पानी की कमी हो जाती है, जिसे मौसमी, जलवैज्ञानिक और कृषि संबंधी सूखे में वर्गीकृत किया जाता है।\n• **चक्रवात:** कम दबाव वाले क्षेत्र के चारों ओर हवा का तेजी से अंदर की ओर चक्रण, जिसे बंगाल की खाड़ी और अरब सागर में **उष्णकटिबंधीय चक्रवात (Tropical Cyclones)** के रूप में वर्गीकृत किया जाता है।"
            }
          },
          {
            "title": {
              "en": "Institutional Setup in India & Uttar Pradesh",
              "hi": "भारत और उत्तर प्रदेश में संस्थागत व्यवस्था"
            },
            "content": {
              "en": "• **NDMA:** National Disaster Management Authority, chaired by the **Prime Minister of India**.\n• **NDRF:** National Disaster Response Force, specialized force established under the **Disaster Management Act, 2005**.\n• **UP State Level:** State Disaster Management Authority (**SDMA**) chaired by the **Chief Minister of Uttar Pradesh** and implemented via district administrations.",
              "hi": "• **एनडीएमए (NDMA):** राष्ट्रीय आपदा प्रबंधन प्राधिकरण, जिसकी अध्यक्षता **भारत के प्रधानमंत्री** करते हैं।\n• **एनडीआरएफ (NDRF):** राष्ट्रीय आपदा मोचन बल, **आपदा प्रबंधन अधिनियम, 2005** के तहत स्थापित विशेष बल।\n• **यूपी राज्य स्तर:** राज्य आपदा प्रबंधन प्राधिकरण (**SDMA**) जिसकी अध्यक्षता **उत्तर प्रदेश के मुख्यमंत्री** करते हैं और जिसे जिला प्रशासन के माध्यम से लागू किया जाता है।"
            }
          },
          {
            "title": {
              "en": "Vulnerability and Risk Assessment",
              "hi": "सुभेद्यता और जोखिम मूल्यांकन"
            },
            "content": {
              "en": "• **Risk Formula:** **Risk = Hazard x Vulnerability / Capacity**.\n• **Hazard:** A dangerous phenomenon, substance, human activity, or condition.\n• **Vulnerability:** Characteristics and circumstances of a community that make it susceptible to the damaging effects of a hazard.\n• **Capacity:** Combination of all strengths, attributes, and resources available within a community to manage disasters.",
              "hi": "• **जोखिम का सूत्र:** **जोखिम = खतरा x सुभेद्यता / क्षमता (Risk = Hazard x Vulnerability / Capacity)**।\n• **खतरा (Hazard):** एक खतरनाक घटना, पदार्थ, मानवीय गतिविधि या स्थिति।\n• **सुभेद्यता (Vulnerability):** किसी समुदाय की वे विशेषताएँ और परिस्थितियाँ जो उसे खतरे के हानिकारक प्रभावों के प्रति संवेदनशील बनाती हैं।\n• **क्षमता (Capacity):** आपदाओं से निपटने के लिए किसी समुदाय के भीतर उपलब्ध सभी ताकतों, विशेषताओं और संसाधनों का संयोजन।"
            }
          },
          {
            "title": {
              "en": "Key Environmental Acts & Frameworks",
              "hi": "प्रमुख पर्यावरणीय अधिनियम और रूपरेखा"
            },
