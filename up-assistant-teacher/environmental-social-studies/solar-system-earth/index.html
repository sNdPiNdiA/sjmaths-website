              "hi": "• एक विशाल अंतरतारकीय आणविक बादल के गुरुत्वाकर्षण पतन से लगभग **4.6 अरब वर्ष पूर्व** निर्मित।\n• **सूर्य** गुरुत्वाकर्षण लंगर के रूप में कार्य करता है, जो सभी ग्रहों को दीर्घवृत्ताकार कक्षाओं में बांधे रखता है।\n• **आंतरिक ग्रह:** बुध, शुक्र, पृथ्वी, मंगल (चट्टानी, घने, कम/कोई उपग्रह नहीं)।\n• **बाहरी ग्रह:** बृहस्पति, शनि, अरुण (यूरेनस), वरुण (नेपच्यून) (गैस युक्त, विशाल, वलय प्रणालियाँ, अनेक उपग्रह)।\n• **क्षुद्रग्रह पेटी:** पूरी तरह से **मंगल और बृहस्पति** की कक्षाओं के बीच स्थित।"

              "en": "• **Law of Orbits (First Law):** All planets move in **elliptical orbits** with the Sun at one focus.\n• **Law of Areas (Second Law):** A line joining a planet and the Sun sweeps out equal areas during equal intervals of time (planets move faster when closer to the Sun).\n• **Law of Periods (Third Law):** The square of the orbital period of a planet is directly proportional to the cube of the semi-major axis of its orbit (**T² ∝ r³**).\n• **Mnemonic for Kepler's Laws:** **O**rbits are ellipses, **A**reas are equal, **P**eriods are proportional (**OAP**).",
              "hi": "• **कक्षाओं का नियम (पहला नियम):** सभी ग्रह सूर्य को एक फोकस पर रखते हुए **दीर्घवृत्ताकार कक्षाओं** में गति करते हैं।\n• **क्षेत्रफलों का नियम (दूसरा नियम):** किसी ग्रह और सूर्य को मिलाने वाली रेखा समान अंतराल में समान क्षेत्रफल तय करती है (सूर्य के पास होने पर ग्रह तेजी से चलते हैं)।\n• **आवर्तकालों का नियम (तीसरा नियम):** किसी ग्रह के परिक्रमण काल का वर्ग उसकी कक्षा के अर्ध-दीर्घ अक्ष के घन के सीधे आनुपातिक होता है (**T² ∝ r³**)।\n• **केप्लर के नियमों के लिए म्नोनिक:** **O**rbits are ellipses, **A**reas are equal, **P**eriods are proportional (**OAP**)।"

            "content": {
              "en": "• Earth spins on its **axis** from **West to East** (Counter-clockwise when viewed from above the North Pole).\n• Takes **23 hours, 56 minutes, and 4 seconds** (Sidereal Day); standard solar day is **24 hours**.\n• Causes **Day and Night**, apparent daily movement of the Sun, stars, and moon from East to West.\n• Generates the **Coriolis Effect**, deflecting winds and ocean currents.\n• **Mnemonic for Rotation Effects:** **D**ay, **N**ight, **C**oriolis (**DNC**).",

            "content": {
              "en": "• Earth revolves around the Sun in an **elliptical orbit** at an average speed of **30 km/s**.\n• Takes **365 days and 6 hours** (One Solar Year); extra 6 hours account for a **Leap Year** every 4 years.\n• Earth's axis is tilted at **23.5°** from the perpendicular to its orbital plane (or **66.5°** to the orbital plane).\n• Combined with revolution, the axial tilt is the sole cause of **Changing Seasons** and varying lengths of day and night.",
              "hi": "• पृथ्वी **30 किमी/सेकंड** की औसत गति से **दीर्घवृत्ताकार कक्षा** में सूर्य के चारों ओर परिक्रमा करती है।\n• **365 दिन और 6 घंटे** (एक सौर वर्ष) लेती है; अतिरिक्त 6 घंटे हर 4 साल में एक **लीप ईयर** बनाते हैं।\n• पृथ्वी का अक्ष अपने कक्षीय तल के लंबवत से **23.5°** झुका हुआ है (या कक्षीय तल से **66.5°**)।\n• परिक्रमा के साथ मिलकर, अक्षीय झुकाव **ऋतु परिवर्तन** और दिन-रात की अलग-अलग लंबाई का एकमात्र कारण है।"
