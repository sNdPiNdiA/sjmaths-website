        "title": "Formula and skill map",
        "type": "subcards",
        "items": [
          {
            "title": "Volume and surface area",
            "content": "Cube: \\(V=a^3, TSA=6a^2, LSA=4a^2\\). Cuboid: \\(V=lbh, TSA=2(lb+bh+hl)\\). Cylinder: \\(V=\\pi r^2h, CSA=2\\pi rh, TSA=2\\pi r(h+r)\\)."
          },
          {
            "title": "Units and capacity",
            "content": "Volume uses cubic units. \\(1\\,\\mathrm{cm}^3=1\\,\\mathrm{mL}\\), \\(1000\\,\\mathrm{cm}^3=1\\,\\mathrm L\\), and \\(1\\,\\mathrm m^3=1000\\,\\mathrm L\\). Use consistent units before calculating."
          },
          {
            "title": "Exam checks",
            "content": "Sketch and label all dimensions before choosing a formula.\nFor recasting, conserve volume rather than surface area."
          },
          {
            "title": "Cone, sphere and hemisphere formulas",
            "content": "Cone: (V=\frac13pi r^2h), slant height (l=sqrt{r^2+h^2}), curved area (=pi rl), total area (=pi r(l+r)). Sphere: (V=\frac43pi r^3), area (=4pi r^2). Hemisphere: (V=\frac23pi r^3), curved area (=2pi r^2), total area (=3pi r^2)."
          }
        ]
      },
      {
        "title": "Core concepts and worked examples",
        "type": "subcards",
        "items": [
          {
            "title": "Cube and cuboid",
            "content": "Worked example: cuboid 8 cm × 5 cm × 3 cm has volume 120 cm³ and total surface area \\(2(40+15+24)=158\\) cm²."
          },
          {
            "title": "Cylinder",
            "content": "Worked example: radius 7 cm, height 10 cm. Volume \\(=\\pi(49)(10)=1540\\) cm³ using \\(22/7\\); curved area \\(=2\\pi(7)(10)=440\\) cm²."
          },
          {
            "title": "Identify exposed surface",
            "content": "Total surface area includes all faces; lateral/curved area excludes end faces. A closed box and an open-top box need different area totals. Worked example: an open cuboid omits the top face lb from its closed-box surface area."
          },
          {
            "title": "Capacity and liquid",
            "content": "Worked example: a tank of 2 m³ holds \\(2000\\) L. Convert cubic units before comparing capacity."
          },
          {
            "title": "Composite solids and melting/recasting",
            "content": "For joined solids add volumes if they do not overlap. When a solid is recast without loss, total volume is conserved; surface area can change. Worked example: 300 cm³ of metal cast into 25 cm³ pieces makes 300/25 = 12 pieces."
          },
          {
            "title": "Scale effects",
            "content": "If every length is multiplied by \\(k\\), surface area scales by \\(k^2\\), volume by \\(k^3\\). Worked example: doubling a cube’s side multiplies its volume by 2³ = 8."
          },
          {
            "title": "Cone",
            "content": "Worked example: (r=3) cm and (h=4) cm give (l=5) cm. Volume (=\frac13pi(9)(4)=12pi) cm³; curved surface area (=pi(3)(5)=15pi) cm²."
          },
          {
            "title": "Sphere and hemisphere",
            "content": "Worked example: a sphere of radius 3 cm has volume (\frac43pi(27)=36pi) cm³ and surface area (4pi(9)=36pi) cm². A hemisphere’s total area includes its circular base."
          }
        ]
      },
      {
        "title": "Question types and solving approaches",
        "type": "subcards",
        "items": [
          {
            "title": "Find volume or surface area",
            "content": "Worked example: cube side 4 cm gives volume 64 cm³ and total surface area 96 cm²."
          },
          {
            "title": "Find a missing dimension",
            "content": "Use the given volume and isolate the unknown. Worked example: cuboid volume 180 cm³, length 9 cm, breadth 5 cm gives height \\(180/(45)=4\\) cm."
          },
          {
            "title": "Capacity or fill problem",
            "content": "Calculate the container volume, convert to litres/millilitres, then compare with the liquid amount. Worked example: a 50 cm × 40 cm × 30 cm tank holds 60,000 cm³ = 60 L."
          },
          {
            "title": "Open or closed container",
            "content": "Count only exposed faces; an open-top cuboid omits the top rectangle. Worked example: an open box with l=5, b=4, h=3 has exposed area lb + 2lh + 2bh = 74 cm²."
          },
          {
            "title": "Recasting or combining solids",
            "content": "Conserve volume under melting/recasting; add or subtract volumes for composite solids. Worked example: a 216 cm³ cube recast into 27 cm³ spheres makes 216/27 = 8 spheres."
          },
          {
            "title": "Cone or sphere calculation",
            "content": "Select the formula from the solid and requested measure. Worked example: a hemisphere with (r=3) cm has curved area (2pi r^2=18pi) cm² and total area (3pi r^2=27pi) cm²."
          }
        ]
      },
      {
        "title": "Proofs and derivations",
        "type": "subcards",
        "items": [
          {
            "title": "Derive cuboid volume",
            "content": "A layer has base area \\(lb\\). Stacking \\(h\\) unit-depth layers gives \\(V=lbh\\)."
          },
          {
            "title": "Derive cuboid surface area",
            "content": "A cuboid has three pairs of equal rectangles: areas \\(lb\\), \\(bh\\), and \\(hl\\); total is \\(2(lb+bh+hl)\\)."
          },
          {
            "title": "Derive cylinder volume",
            "content": "A cylinder has constant circular cross-section \\(\\pi r^2\\) through height \\(h\\), so volume is base area × height: \\(V=\\pi r^2h\\)."
          },
          {
            "title": "Derive cylinder curved surface area",
            "content": "Unroll the curved surface into a rectangle with length equal to circumference \\(2\\pi r\\) and width \\(h\\); area is \\(2\\pi rh\\)."
          },
          {
            "title": "Cone volume relation",
            "content": "A cone with the same base radius and height as a cylinder has one-third its volume: (V=\frac13pi r^2h). Use the cone formula as the standard mensuration result; the factor (\frac13) is essential."
          }
        ]
      },
      {
        "title": "Common errors and how to avoid them",
        "type": "subcards",
        "items": [
          {
            "title": "Confusing area and volume units",
            "content": "Use cm² for area and cm³ for volume."
          },
          {
            "title": "Using diameter as radius",
            "content": "Halve the diameter before applying cylinder formulas."
          },
          {
            "title": "Counting hidden faces",
            "content": "For open or attached solids, count only the surfaces specified as exposed."
          },
          {
            "title": "Converting cubic units linearly",
            "content": "A length conversion is cubed for volume; 1 m³ = 1,000,000 cm³."
          },
          {
            "title": "Confusing cone height and slant height",
            "content": "Volume uses vertical height (h); curved surface area uses slant height (l). For a right cone, (l^2=r^2+h^2)."
          }
        ]
      }
