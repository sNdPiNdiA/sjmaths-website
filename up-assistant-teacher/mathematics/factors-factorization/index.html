          {
            "title": "Divisibility and primes",
            "content": "A factor divides a number exactly; a multiple is an integer product. A prime has exactly two positive factors. Prime factorisation writes a number as a product of primes."
          },
          {
            "title": "HCF and LCM",
            "content": "HCF uses the smallest exponents common to prime factorizations. LCM uses the greatest exponent of every prime present. For positive integers, HCF × LCM = product of the two numbers."
          },
          {
            "title": "Exam checks",
            "content": "Check HCF × LCM against the product of the two original numbers.\nFor divisibility by 3 or 9, add digits repeatedly if convenient."
          },
          {
            "title": "Further divisibility checks",
            "content": "Divisible by 6: divisible by 2 and 3. By 12: divisible by 3 and 4. By 25: last two digits are 00, 25, 50 or 75. By 100: last two digits are 00. By 11: alternating digit-sum difference is a multiple of 11."
          }

        "title": "Core concepts and worked examples",
        "type": "subcards",
        "items": [
          {
            "title": "Factors, multiples, prime and composite",
            "content": "Worked example: factors of 18 are 1, 2, 3, 6, 9, 18; its multiples include 18, 36, 54. Since 18 has more than two factors, it is composite."
          },
          {
            "title": "Prime factorisation",
            "content": "Worked example: divide 84 by primes: \\(84=2\\times42=2^2\\times21=2^2\\times3\\times7\\)."
          },
          {
            "title": "HCF by prime factors",
            "content": "Worked example: \\(36=2^2\\cdot3^2\\), \\(60=2^2\\cdot3\\cdot5\\). HCF is \\(2^2\\cdot3=12\\)."
          },
          {
            "title": "LCM by prime factors",
            "content": "For 36 and 60, take highest exponents: \\(2^2\\cdot3^2\\cdot5=180\\). Worked example: 36 = 2²·3² and 60 = 2²·3·5, so LCM = 2²·3²·5 = 180."
          },
          {
            "title": "Divisibility tests",
            "content": "A number is divisible by 2 if its last digit is even, by 5 if it ends 0 or 5, by 10 if it ends 0, and by 3 or 9 if its digit sum is divisible by 3 or 9. Worked example: 4,572 has digit sum 18, so it is divisible by 3 and 9."
          },
          {
            "title": "Prime factorisation and square roots",
            "content": "Pair equal prime factors to form a perfect square. Worked example: \\(180=2^2\\cdot3^2\\cdot5\\); one more factor 5 makes \\(900=30^2\\)."
          },
          {
            "title": "Divisibility by 4, 6, 8, 11, 12, 25 and 100",
            "content": "Apply each rule to the correct digits or combine tests. Worked example: 1,452 is divisible by 4 because 52 is; divisible by 6 because it is even and its digit sum 12 is divisible by 3; divisible by 11 because (1-4+5-2=0)."
          }
        ]
      },
      {
        "title": "Question types and solving approaches",
        "type": "subcards",
        "items": [
          {
            "title": "Find HCF and LCM",
            "content": "Worked example: 24 = \\(2^3\\cdot3\\), 90 = \\(2\\cdot3^2\\cdot5\\). HCF = 6; LCM = 360."
          },
          {
            "title": "Largest equal groups or largest tile",
            "content": "Use HCF when dividing quantities into the largest equal groups with no remainder. Worked example: 48 and 60 items can be split into at most \\(\\gcd(48,60)=12\\) equal groups."
          },
          {
            "title": "Events repeating together",
            "content": "Use LCM for the first simultaneous repeat. Worked example: bells ring every 6 and 8 minutes; they ring together again after \\(\\operatorname{lcm}(6,8)=24\\) minutes."
          },
          {
            "title": "Check divisibility or primality",
            "content": "Test small prime divisors up to the square root. Worked example: 97 is not divisible by 2, 3, 5, or 7; since \\(\\sqrt{97}<10\\), it is prime."

            "title": "Select and combine divisibility tests",
            "content": "Worked example: 2,340 is divisible by 12 because its digit sum 9 is divisible by 3 and its last two digits 40 are divisible by 4. It is not divisible by 25 because 40 is not 00, 25, 50 or 75."

            "title": "Why prime factorisation is unique",
            "content": "Every composite integer can be split into smaller factors until only primes remain. The fundamental theorem of arithmetic states this prime factorisation is unique apart from order."
          },
          {
            "title": "Why the HCF–LCM product rule works",
            "content": "For each prime, the HCF uses the smaller exponent and the LCM the larger. Their exponents add to the sum of the original exponents, matching the product of the two numbers."
          },
          {
            "title": "Divisibility by 3 and 9",
            "content": "In base ten, \\(10\\equiv1\\pmod 9\\), so each place-value power is congruent to 1. A number and its digit sum therefore have the same remainder on division by 9, and also by 3."

          {
            "title": "Divisibility by 11",

          {
            "title": "Taking wrong exponents",
            "content": "HCF uses minimum powers; LCM uses maximum powers."
          },
          {
            "title": "Calling 1 prime",
            "content": "One has only one positive factor, so it is neither prime nor composite."
          },
          {
            "title": "Stopping factorisation early",

          },
