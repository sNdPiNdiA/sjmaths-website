      {
        "title": "Formula and skill map",
        "type": "subcards",
        "items": [
          {
            "title": "Data and frequency",
            "content": "Organise observations in a frequency table; total frequency \\(N=\\sum f\\). Range \\(=\\) maximum − minimum."
          },
          {
            "title": "Central tendency",
            "content": "Ungrouped mean \\(=\\sum x/n\\); frequency mean \\(=\\sum fx/\\sum f\\). Median is the middle ordered value (or mean of two middle values). Mode is the most frequent value."
          },
          {
            "title": "Graphs",
            "content": "Read axis labels and scales carefully. Bar charts compare categories; line graphs show change; histograms display continuous grouped data with touching bars."
          },
          {
            "title": "Exam checks",
            "content": "Check that frequency totals match the number of observations.\nAverages describe centre; range describes a simple measure of spread."
          },
          {
            "title": "Grouped frequency mean",
            "content": "For class intervals, use each class midpoint (x) as a representative value: approximate mean (=\frac{sum fx}{sum f}). A midpoint is ((\text{lower limit}+\text{upper limit})/2)."
          }
        ]
      },
      {
        "title": "Core concepts and worked examples",
        "type": "subcards",
        "items": [
          {
            "title": "Tables and frequency",
            "content": "Worked example: values 1, 2, 3 occur 2, 4, 1 times. Total frequency is 7 and sum is \\(1(2)+2(4)+3(1)=13\\)."
          },
          {
            "title": "Mean from raw data or frequencies",
            "content": "Worked example: data 3, 5, 5, 7 have mean \\(20/4=5\\). From a frequency table use \\(\\sum fx/\\sum f\\)."
          },
          {
            "title": "Median",
            "content": "Order data first. Worked example: 2, 4, 7, 9, 12 has median 7; for 2, 4, 7, 9, the median is \\((4+7)/2=5.5\\)."
          },
          {
            "title": "Mode and multimodal data",
            "content": "The mode is the most frequent observation. Worked example: 1, 2, 2, 3, 3, 3 has mode 3. A data set can have more than one mode or no repeated value."
          },
          {
            "title": "Range and spread",
            "content": "Worked example: for 4, 11, 13, 18, range is \\(18-4=14\\). Range uses only extremes."
          },
          {
            "title": "Grouped data and graph reading",
            "content": "For grouped continuous data, class intervals must not overlap; read bar height/scale and units before comparing values. Worked example: a bar reaches 6 divisions on a scale of 5 students per division, so its frequency is 30 students."
          },
          {
            "title": "Class intervals and midpoints",
            "content": "A grouped table collects values into non-overlapping intervals. Use each midpoint as a representative value when estimating a grouped mean. Worked example: interval 10–20 has midpoint 15; with frequency 4 it contributes (4(15)=60) to (sum fx)."
          }
        ]
      },
      {
        "title": "Question types and solving approaches",
        "type": "subcards",
        "items": [
          {
            "title": "Find a mean",
            "content": "Worked example: 6, 8, 10, 12 have mean \\(36/4=9\\)."
          },
          {
            "title": "Find a median",
            "content": "Sort first, then locate middle position(s). Worked example: 3, 4, 8, 10, 15, 20 gives median \\((8+10)/2=9\\)."
          },
          {
            "title": "Find a frequency mean",
            "content": "Worked example: values 2 and 5 have frequencies 3 and 2. Mean is \\( (2\\cdot3+5\\cdot2)/5=16/5=3.2\\)."
          },
          {
            "title": "Compare distributions",
            "content": "Use mean/median for centre and range for simple spread; inspect units and possible outliers. Worked example: for 2, 3, 4, 5, 20 the mean is 6.8 but median is 4; the outlier pulls the mean upward."
          },
          {
            "title": "Interpret a graph or table",
            "content": "State the category, value, and unit. Compare changes using the labelled scale rather than visual height alone. Worked example: a rise from 40 to 55 students is an increase of 15 students; the percentage increase is 15/40 × 100 = 37.5%."
          },
          {
            "title": "Estimate a mean from grouped data",
            "content": "Find each class midpoint, multiply by its frequency, sum the products, then divide by total frequency. Worked example: classes 0–10 and 10–20 with frequencies 2 and 3 have midpoints 5 and 15; estimated mean (=(2·5+3·15)/5=11)."
          }
        ]
      },
      {
        "title": "Proofs and derivations",
        "type": "subcards",
        "items": [
          {
            "title": "Why the frequency mean is weighted",
            "content": "A value \\(x\\) occurring \\(f\\) times contributes \\(fx\\) to the total. Summing gives \\(\\sum fx\\); divide by total observations \\(\\sum f\\)."
          },
          {
            "title": "Why median resists extreme values",
            "content": "The median depends on middle rank(s), not the magnitude of the largest or smallest observation. This makes it less affected by an outlier than the mean."
          },
          {
            "title": "Why range measures spread",
            "content": "The largest and smallest values span the observed data interval; their difference gives its width, though it ignores interior variation."
          },
          {
            "title": "Derive the grouped mean estimate",
            "content": "Replace each observation in a class by that class midpoint (x). The estimated total is (sum fx); dividing by the total count (sum f) gives the estimated mean. It is an estimate because original values within each interval are not known."
          }
        ]
      },
      {
        "title": "Common errors and how to avoid them",
        "type": "subcards",
        "items": [
          {
            "title": "Finding median before sorting",
            "content": "Always arrange values in ascending order first."
          },
          {
            "title": "Wrong denominator for frequency mean",
            "content": "Divide by total frequency, not number of distinct values."
          },
          {
            "title": "Reading graph scale incorrectly",
            "content": "Check each tick interval, axis origin, labels, and units."
          },
          {
            "title": "Calling any repeated value the mode",
            "content": "The mode must have the greatest frequency; ties can produce multiple modes."
          },
          {
            "title": "Using a class boundary instead of its midpoint",
            "content": "For a grouped mean estimate, multiply each class frequency by the class midpoint, not only the lower or upper boundary."
          }
        ]
      }
