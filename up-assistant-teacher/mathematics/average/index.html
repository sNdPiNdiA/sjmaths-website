            "title": "Mean formulas",
            "content": "For \\(n\\) observations, arithmetic mean \\(=\\frac{\\text{sum}}{n}\\). Therefore sum \\(=n\\times\\text{mean}\\). Combined mean \\(=\\frac{n_1m_1+n_2m_2}{n_1+n_2}\\). A weighted mean is \\(\\frac{\\sum wx}{\\sum w}\\)."

            "content": "Check a computed mean by multiplying it by the count to recover the total.\nThe mean is sensitive to every observation and can be affected by extreme values."

        "type": "subcards",
        "items": [
          {
            "title": "Arithmetic mean",
            "content": "Worked example: mean of 5, 8, 11, and 16 is \\(40/4=10\\). The mean need not be one of the observed values."
          },
          {
            "title": "Recovering a total",
            "content": "Worked example: 12 students have mean score 68, so their total is \\(12\\times68=816\\) marks."
          },
          {
            "title": "Missing observation",
            "content": "Worked example: five numbers have mean 14, so total is 70. If four sum to 51, the missing number is \\(70-51=19\\)."
          },
          {
            "title": "Combined average",
            "content": "Worked example: 10 learners average 60 and 20 learners average 75. Combined mean is \\( (10\\cdot60+20\\cdot75)/30=70\\)."
          },
          {
            "title": "Weighted average",
            "content": "Worked example: 2 kg at ₹30/kg and 3 kg at ₹50/kg cost ₹210 for 5 kg. Average price is \\(210/5=₹42\\) per kg."
          },
          {
            "title": "Effect of adding or removing data",
            "content": "Adding a value above the old mean raises the mean; adding one below lowers it. Worked example: a mean of 10 over four values gives total 40; adding 15 yields \\(55/5=11\\)."
          }
        ]

            "title": "Find total from mean and count",
            "content": "Worked example: mean 23 for 8 items gives total \\(23\\times8=184\\)."

            "title": "Find a missing value",
            "content": "Worked example: mean of 6 values is 12; five sum to 67. Missing value is \\(72-67=5\\)."
          },
          {
            "title": "Combine two groups",
            "content": "Use group totals, not the unweighted average of group means. Worked example: group sizes 5 and 15 with means 40 and 60 give \\( (200+900)/20=55\\)."
          },

            "title": "Weighted rate or price",
            "content": "Multiply each rate by its quantity, add, then divide by total quantity. This applies to average speed only when distance/time details support that weighting. Worked example: 2 kg at ₹30/kg and 3 kg at ₹50/kg cost ₹210 total, so the weighted mean is ₹42/kg."
