          },

            "title": "Divisibility rules",
            "content": "2: last digit even; 3/9: digit sum divisible by 3/9; 5: last digit 0 or 5; 10: last digit 0; 4: last two digits divisible by 4; 8: last three digits divisible by 8; 11: alternating digit-sum difference divisible by 11."

            "title": "Find a percentage of a quantity",
            "content": "Worked example: 18% of 250 is \\(0.18\\times250=45\\)."

            "title": "Find the whole or rate",

          {
            "title": "Successive changes",
            "content": "Worked example: ₹1,000 rises by 10%, then falls by 10%: \\(1000(1.1)(0.9)=₹990\\), a net 1% decrease."
          },
          {
            "title": "Divisibility rules in use",
            "content": "Worked example: 5,742 has digit sum 18, so it is divisible by 3 and 9; last two digits 42 are not divisible by 4."
          }
        ]
      },

            "title": "Percentage change",
            "content": "Use the original quantity as denominator. Worked example: a value falls from 80 to 68; decrease is \\(12/80\\times100=15\\%\\)."

          {
            "title": "Reverse percentage",
            "content": "If ₹540 is after a 10% discount, it is 90% of marked price; marked price is \\(540/0.9=₹600\\). Worked example: ₹540 after a 10% discount is 90% of the marked price, so MP = 540/0.9 = ₹600."

            "title": "Successive discounts or changes",
            "content": "Multiply factors such as \\(1+r/100\\) for increase and \\(1-r/100\\) for decrease. Worked example: +10% then −10% multiplies by 1.1 × 0.9 = 0.99, a net 1% decrease."
          },
          {
            "title": "Apply divisibility tests",
            "content": "Use last digits for powers of 2/5 and digit sums for 3/9; for 11 compare alternating sums. Worked example: 1,331 has alternating digit-sum difference 1 − 3 + 3 − 1 = 0, so it is divisible by 11."

        "type": "subcards",
        "items": [
          {
            "title": "Derive percentage formula",
            "content": "Since percent means “per hundred,” \\(p\\%\\) of \\(N\\) is \\(pN/100\\). Rearranging gives percentage \\(=100(\\text{part}/\\text{whole})\\%\\)."
          },
          {
            "title": "Why successive percentages do not add directly",

            "title": "Divisibility by 4 and 8",
