          {
            "title": "Profit, loss and base",
            "content": "Profit = SP − CP when SP > CP; loss = CP − SP when CP > SP. Profit% and loss% are calculated on cost price: \\(\\text{profit}/CP\\times100\\%\\), \\(\\text{loss}/CP\\times100\\%\\)."
          },
          {
            "title": "Discount and marked price",
            "content": "Discount = MP − SP; discount% is based on marked price. For discount \\(d\\%\\), \\(SP=MP(1-d/100)\\). Apply successive discounts multiplicatively."
          },
          {
            "title": "Exam checks",
            "content": "Write CP, SP and MP separately before calculating.\nCheck that a positive discount lowers the selling price."
          }
        ]
      },
      {
        "title": "Core concepts and worked examples",
        "type": "subcards",
        "items": [
          {
            "title": "Cost price and selling price",
            "content": "CP is purchase cost; SP is sale price. Worked example: buy for ₹500 and sell for ₹575; profit = ₹75."
          },
          {
            "title": "Profit percentage",
            "content": "Worked example: CP ₹800, SP ₹920. Profit ₹120; profit% \\(=120/800\\times100=15\\%\\)."
          },
          {
            "title": "Loss percentage",
            "content": "Worked example: CP ₹1,200, SP ₹1,020. Loss ₹180; loss% \\(=180/1200\\times100=15\\%\\)."
          },
          {
            "title": "Marked price and discount",
            "content": "Worked example: MP ₹2,000 with 15% discount gives SP \\(2000(0.85)=₹1,700\\)."
          },
          {
            "title": "Successive discounts",
            "content": "Worked example: 20% then 10% off ₹1,000 gives \\(1000(0.8)(0.9)=₹720\\), an overall 28% discount."
          },
          {
            "title": "Find a required selling price",
            "content": "Worked example: CP ₹640 and target profit 25% require SP \\(640(1.25)=₹800\\)."
          },
          {
            "title": "Tax, overhead and net cost",
            "content": "Include stated costs in CP when the problem defines them as seller’s cost; read whether delivery, tax or commission is included. Worked example: purchase ₹500 plus ₹20 delivery gives CP ₹520; at SP ₹600, profit is ₹80."
          }
        ]
      },
      {
        "title": "Question types and solving approaches",
        "type": "subcards",
        "items": [
          {
            "title": "Find profit/loss and rate",
            "content": "Worked example: CP ₹750, SP ₹690; loss ₹60 and loss rate \\(60/750\\times100=8\\%\\)."
          },
          {
            "title": "Find CP or SP from a rate",
            "content": "Worked example: SP ₹1,080 at 20% profit means \\(SP=1.2CP\\), so CP = ₹900."
          },
          {
            "title": "Find marked price after discount",
            "content": "Worked example: SP ₹765 after 15% discount is 85% of MP; MP \\(=765/0.85=₹900\\)."
          },
          {
            "title": "Compare discount offers",
            "content": "Calculate final prices on the same marked price; successive reductions compound. Worked example: on ₹1,000, 20% off gives ₹800; 10% off gives ₹900, so the first offer saves more."
          },
          {
            "title": "Multi-step trade problem",
            "content": "Track each purchase/sale and fee. Calculate net gain from total revenue minus total cost, then use total cost as the percentage base. Worked example: buy 10 items at ₹20 and sell at ₹25 each; cost ₹200, revenue ₹250, profit ₹50 = 25% of cost."
          }
        ]
      },
      {
        "title": "Proofs and derivations",
        "type": "subcards",

          },
          {
            "title": "Derive selling price after loss",
            "content": "If loss is \\(l\\%\\) of CP, then \\(SP=CP(1-l/100)\\)."
          },
          {
            "title": "Derive successive discounts",
            "content": "A first discount leaves fraction \\(1-d_1/100\\); a second leaves \\(1-d_2/100\\) of that. The combined multiplier is their product."
          }
        ]
      },
      {
        "title": "Common errors and how to avoid them",

          },
          {
            "title": "Confusing discount with profit",

          },
          {
            "title": "Adding successive discounts",
