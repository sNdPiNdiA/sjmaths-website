          {
            "title": "Four operations",

        "type": "subcards",
        "items": [
          {
            "title": "Proper, improper and mixed fractions",
            "content": "A proper fraction has numerator smaller than denominator; an improper fraction has numerator at least as large. Worked example: \\(17/5=3\\frac25\\); \\(3\\frac25=17/5\\)."
          },
          {
            "title": "Simplifying and equivalence",
            "content": "Divide top and bottom by a common factor. Worked example: \\(42/56=3/4\\), dividing each by 14."
          },
          {
            "title": "Compare unlike denominators",
            "content": "Worked example: compare \\(5/8\\) and \\(2/3\\). Cross-products are 15 and 16, so \\(5/8<2/3\\)."
          },
          {
            "title": "Addition and subtraction",
            "content": "Worked example: \\(2/3+3/8=16/24+9/24=25/24=1\\frac1{24}\\). Use the least common denominator when practical."
          },
          {
            "title": "Multiplication and cancellation",
            "content": "Worked example: \\(6/15\\times25/18\\). Cancel across: \\(6/18=1/3\\), \\(25/15=5/3\\), so result \\(5/9\\)."
          },
          {
            "title": "Division and reciprocal",
            "content": "Worked example: \\(3/4\\div2/5=3/4\\times5/2=15/8=1\\frac78\\)."
          },
          {
            "title": "Fraction of a quantity and word problems",
            "content": "Worked example: \\(3/5\\) of 40 is \\(40\\times3/5=24\\). “Of” indicates multiplication."
          }
        ]
      },

          {
            "title": "Multiply fractions or mixed numbers",
            "content": "Convert mixed numbers to improper fractions, cancel, then multiply. Worked example: \\(1\\frac12\\times2\\frac23=3/2\\times8/3=4\\)."
          },
          {
            "title": "Divide by a fraction",
            "content": "Worked example: \\(5/6\\div10/9=5/6\\times9/10=3/4\\)."
          },
          {
            "title": "Find a fraction of an amount",
            "content": "Worked example: \\(7/8\\) of ₹640 is \\(640/8\\times7=₹560\\)."
          },
          {
            "title": "Find the whole from a fractional part",
            "content": "Worked example: \\(3/7\\) of a class is 12 students. Whole class is \\(12\\times7/3=28\\)."
          },
          {
            "title": "Compare or order fractions",
            "content": "Use common denominators or cross multiplication; account for negative signs separately. Worked example: 5/8 < 2/3 because 5·3 = 15 < 16 = 2·8."
          }

            "content": "Multiplying by \\(k/k=1\\), for nonzero \\(k\\), gives \\(a/b=ak/bk\\). The ratio is unchanged."

            "title": "Why a common denominator is needed for addition",

          },
          {
            "title": "Why division uses a reciprocal",
            "content": "To divide \\(a/b\\) by \\(c/d\\), find the number that multiplied by \\(c/d\\) gives \\(a/b\\). Multiplying by \\(d/c\\) cancels \\(c/d\\); the divisor must be nonzero."
          }
