            "title": "Compound interest",
            "content": "Annual compounding: \\(A=P(1+r/100)^t\\), \\(CI=A-P\\). For half-yearly compounding, rate per period is \\(r/2\\)% and number of periods \\(2t\\), if the quoted rate is nominal annual."

            "title": "Principal, rate, time and amount",
            "content": "Principal is initial money; interest is the increase; amount is principal plus interest. Worked example: ₹5,000 at 6% simple interest for 2 years gives \\(SI=5000\\cdot6\\cdot2/100=₹600\\), amount ₹5,600."
          },
          {
            "title": "Simple interest over time",
            "content": "SI grows by the same amount each equal period because it is calculated on original principal. Worked example: ₹8,000 at 5% for 9 months: \\(8000\\cdot5\\cdot(9/12)/100=₹300\\)."
          },
          {
            "title": "Compound interest",
            "content": "Interest is added to the balance before the next period. Worked example: ₹10,000 at 10% annually for 2 years gives amount \\(10000(1.1)^2=₹12,100\\), so CI = ₹2,100."
          },
          {
            "title": "Find an unknown quantity",

          },
          {
            "title": "Compare SI and CI",

          {
            "title": "Compounding frequency",

            "title": "Find time or rate",
