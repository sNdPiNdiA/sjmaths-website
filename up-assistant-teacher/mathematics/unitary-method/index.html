            "content": "Find the value or quantity for one unit first. Direct proportion: multiply the one-unit value by the required units. Inverse proportion: total work/resource stays constant when assumptions hold."
          },
          {
            "title": "Check relationship and units",
            "content": "Identify whether the problem is direct or inverse before calculating. Keep rates and time units consistent; state assumptions about equal units or productivity."

        "title": "Core concepts and worked examples",
        "type": "subcards",
        "items": [
          {
            "title": "Value of one unit",
            "content": "Worked example: 7 pens cost ₹84, so one pen costs ₹12."
          },
          {
            "title": "Direct proportion",
            "content": "When one quantity increases with the other at a fixed rate, scale both by the same factor. Worked example: 7 pens cost ₹84; 12 cost \\(12\\times12=₹144\\)."
          },
          {
            "title": "Inverse proportion",
            "content": "When more of one resource reduces the amount needed of another for fixed work, use a constant product. Worked example: 4 equal pumps empty a tank in 9 hours; 6 take \\(4\\cdot9/6=6\\) hours."
          },
          {
            "title": "Several units and compound rates",
            "content": "Work one stage at a time and keep units. Worked example: 3 machines make 180 parts in 2 hours; at equal rates, 5 machines in 4 hours make \\(180(5/3)(4/2)=600\\) parts."
          },
          {
            "title": "Recognising proportionality",
            "content": "Direct: more items cost more at fixed unit price. Inverse: more equal workers take less time for fixed work. Neither applies if the rate changes. Worked example: 3 identical notebooks cost ₹45, so 5 cost ₹75 at the same unit price."
          }
        ]
      },
      {
        "title": "Question types and solving approaches",
        "type": "subcards",
        "items": [
          {
            "title": "Cost or quantity by direct scaling",
            "content": "Find one unit, then multiply. Worked example: 9 m of cloth cost ₹1,350; 4 m cost \\(1350/9\\times4=₹600\\)."
          },
          {
            "title": "Workers and time",
            "content": "Use workers × days constant only for equal work rates and fixed total work. Worked example: 5 equal workers take 12 days; 10 take 5 × 12/10 = 6 days for the same job."
          },
          {
            "title": "Speed, time and distance",
            "content": "For fixed distance, speed and time are inverse; for fixed time, distance and speed are direct. Worked example: 60 km at 30 km/h takes 2 h; at 40 km/h it takes 1.5 h."
          },
          {
            "title": "Multi-stage unitary problem",
            "content": "Find the one-unit rate then scale each independent quantity, checking dimensions at each step. Worked example: 4 printers make 240 pages in 3 min; 6 printers in 5 min make 240 × 6/4 × 5/3 = 600 pages at equal rates."
          }
        ]
      },

        "type": "subcards",
        "items": [
          {
            "title": "Derive direct proportion",
            "content": "If each unit contributes a fixed amount \\(k\\), total for \\(n\\) units is \\(kn\\); the ratio amount/units remains constant."
          },
          {
            "title": "Derive inverse proportion for fixed work",
            "content": "If one worker completes \\(r\\) units of work per time, \\(n\\) equal workers complete at rate \\(nr\\). Fixed work \\(W=nr t\\), so \\(nt\\) is constant."
          },
          {
            "title": "Dimensional check",
            "content": "Multiplying a per-item rate by items cancels item units and leaves currency; unit cancellation helps detect a wrong operation."
          }
        ]
