        "items": [
          {
            "title": "Perimeter and area",
            "content": "Perimeter measures boundary length; area measures surface. Rectangle: \\(P=2(l+b), A=lb\\). Square: \\(P=4s, A=s^2\\). Triangle: \\(A=\\frac12 bh\\). Parallelogram: \\(A=bh\\). Trapezium: \\(A=\\frac12(a+b)h\\), where \\(a,b\\) are parallel sides. Circle: \\(C=2\\pi r=\\pi d, A=\\pi r^2\\)."
          },
          {
            "title": "Units and composite figures",
            "content": "Perimeter uses linear units; area uses square units. Split a composite shape into familiar pieces, or subtract a cut-out. Convert all lengths to one unit before calculating."
          },
          {
            "title": "Exam checks",
            "content": "Convert lengths before using area formulas; 1 m² = 10,000 cm².\nFor circular calculations, state whether you used \\(\\pi=22/7\\) or 3.14."
          },
          {
            "title": "Rhombus, kite and sector formulas",
            "content": "Rhombus or kite area: (A=\frac12d_1d_2), using perpendicular diagonals. Semicircle area: (\frac12pi r^2). Sector area for central angle (\theta) in degrees: (\frac{\theta}{360}pi r^2)."
          }
        ]
      },
      {
        "title": "Core concepts and worked examples",
        "type": "subcards",
        "items": [
          {
            "title": "Rectangle and square",
            "content": "Worked example: a rectangle is 12 cm by 7 cm. \\(P=2(12+7)=38\\) cm and \\(A=12\\times7=84\\) cm². A square of side 7 cm has perimeter 28 cm and area 49 cm²."
          },
          {
            "title": "Triangle and parallelogram",
            "content": "Triangle area uses perpendicular height, not a sloping side. Worked example: base 10 cm, height 6 cm gives \\(A=\\frac12(10)(6)=30\\) cm². A parallelogram with the same base and height has area 60 cm²."
          },
          {
            "title": "Trapezium",
            "content": "Worked example: parallel sides 8 cm and 14 cm, height 5 cm. \\(A=\\frac12(8+14)5=55\\) cm²."
          },
          {
            "title": "Circle",
            "content": "Use radius, not diameter, in \\(A=\\pi r^2\\). Worked example: diameter 14 cm gives \\(r=7\\) cm, so \\(C=44\\) cm and \\(A=154\\) cm² using \\(\\pi=22/7\\)."
          },
          {
            "title": "Composite and shaded figures",
            "content": "Add non-overlapping component areas, or subtract a hole from the outer area. Worked example: a 10 cm square with a 4 cm square cut out has shaded area \\(100-16=84\\) cm²."
          },
          {
            "title": "Reverse dimensions and practical cost",
            "content": "Work backward from the area formula. Worked example: a rectangle has area 96 m² and length 12 m, so breadth is \\(96/12=8\\) m. Fencing cost uses perimeter; flooring cost uses area."
          },
          {
            "title": "Rhombus, kite and circular parts",
            "content": "A rhombus or kite can be split into right triangles by its diagonals. Worked example: diagonals 10 cm and 8 cm give area (\frac12(10)(8)=40) cm². A 90° sector of radius 4 cm has area (\frac{90}{360}pi(16)=4pi) cm²."
          }
        ]
      },
      {
        "title": "Question types and solving approaches",
        "type": "subcards",
        "items": [
          {
            "title": "Find perimeter or area from dimensions",
            "content": "Worked example: a 9 m by 4 m floor needs \\(9\\times4=36\\) m² of covering. Use the area, not perimeter."
          },
          {
            "title": "Find a missing dimension",
            "content": "Worked example: a triangle has area 42 cm² and base 12 cm. From \\(A=bh/2\\), \\(h=2A/b=84/12=7\\) cm."
          },
          {
            "title": "Composite or cut-out region",
            "content": "Worked example: a 14 cm by 10 cm rectangle contains a 4 cm by 3 cm hole. Remaining area is \\(140-12=128\\) cm²."
          },
          {
            "title": "Boundary and cost word problem",
            "content": "Worked example: fencing a 20 m by 15 m field needs \\(2(20+15)=70\\) m. At ₹40 per metre, cost is ₹2,800."
          },
          {
            "title": "Compare shapes",
            "content": "For equal perimeters, compare areas using each shape’s formula; for a boundary task, do not compare area. Worked example: a 6 cm square has area 36 cm²; a 9 cm by 3 cm rectangle with the same perimeter 24 cm has area 27 cm²."
          },
          {
            "title": "Diagonal or sector-area question",
            "content": "Use perpendicular diagonals for a rhombus/kite or the angle fraction of a full circle for a sector. Worked example: a kite with diagonals 12 cm and 7 cm has area (\frac12(12)(7)=42) cm²."
          }
        ]
      },
      {
        "title": "Proofs and derivations",
        "type": "subcards",
        "items": [
          {
            "title": "Triangle area",
            "content": "A triangle is half of a parallelogram with the same base and perpendicular height. Therefore \\(A=bh/2\\)."
          },
          {
            "title": "Parallelogram area",
            "content": "Cut the right triangle at one end and translate it to the other end. The shape becomes a rectangle of base \\(b\\) and height \\(h\\), so its area is \\(bh\\)."
          },
          {
            "title": "Trapezium area",
            "content": "Join two congruent trapeziums to form a parallelogram with base \\(a+b\\) and height \\(h\\). The pair has area \\((a+b)h\\), so one trapezium has \\(\\frac12(a+b)h\\)."
          },
          {
            "title": "Circle area by sector rearrangement",
            "content": "Divide the circle into many narrow sectors and alternate them. The arrangement approaches a rectangle with height \\(r\\) and base half the circumference, \\(\\pi r\\). Thus \\(A=\\pi r^2\\)."
          },
          {
            "title": "Derive rhombus and kite area",
            "content": "The diagonals split the figure into four right triangles. Their total area is (\frac12d_1d_2), since the four triangles together use half the product of the diagonal lengths."
          }
        ]
      },

        "type": "subcards",
        "items": [

            "title": "Confusing perimeter and area",
            "content": "Perimeter is a length; area is square units. Choose the measure that matches the task: fencing uses boundary, carpet uses surface."

            "title": "Using slant height as triangle height",
            "content": "Triangle height must meet the base at a right angle."
          },
          {
            "title": "Using diameter as radius",
            "content": "If the diameter is given, halve it before using \\(\\pi r^2\\)."
          },
          {
            "title": "Adding composite boundaries incorrectly",
            "content": "For an internal cut-out, subtract area. Do not include internal edges in the outside perimeter unless asked for the exposed boundary."
          },
