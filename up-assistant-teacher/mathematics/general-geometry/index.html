          },

            "title": "Parallel lines and transversal",

            "title": "Quadrilaterals and polygons",
            "content": "Parallelogram: opposite sides and angles equal; diagonals bisect each other. Rectangle has four right angles; rhombus has equal sides; square has both. Worked example: a pentagon interior-angle sum is \\((5-2)180=540^\\circ\\)."
          },

            "title": "Circle angle and tangent properties",

            "title": "Reasoned geometry proof",
