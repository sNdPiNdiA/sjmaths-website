<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Adaptive, step-by-step Concept Mastery for CBSE Mathematics with interactive visual models and instant feedback.">
  <title>Concept Mastery — SJMaths</title>
  
  <!-- Premium Google Fonts: Outfit (Display) + Plus Jakarta Sans (UI Body) + JetBrains Mono (Math/Code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- MathJax Configuration -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: {
        fontCache: 'global'
      },
      options: {
        enableMenu: false
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
  
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app-root" class="app-root-wrapper"></div>

  <script type="module">
    import { ConceptMasteryApp } from './app.js';

    document.addEventListener('DOMContentLoaded', () => {
      const app = new ConceptMasteryApp({ containerId: 'app-root' });
      app.init();
      window.sjmathsApp = app; // For easy debugging/access
    });
  </script>
</body>
</html>
