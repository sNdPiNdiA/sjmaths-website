<h2>Introduction to Euclid's Geometry</h2>
<h3>History &amp; Foundations</h3>
<p>1. Etymology: Geometry comes from Greek words 'Geo' (Earth) and 'Metrein' (to measure).</p>
<p>2. Ancient Geometry: Developed in Egypt, Babylonia, and India for practical needs like land boundary measurement after floods and building complex structures.</p>
<p>3. Sriyantra: Mentioned in Atharvaveda, it consists of nine interwoven isosceles triangles.</p>
<p>4. Greek Contributions: Thales gave the first known proof (circle is bisected by its diameter). Euclid (300 BC) systematized geometry in his book 'Elements' (13 books).</p>
<p><strong>Systematization:</strong> Elements (13 Books) — Euclid arranged all known geometry logically.</p>
<p><em>Modern geometry uses undefined terms like Point, Line, and Plane because defining them perfectly is impossible without circular logic.</em></p>
<h4>Sample Practice Questions</h4><ol>
<li>Who is called the Father of Geometry? — Answer: Euclid. Euclid systematic work.</li>
<li>Number of books in Euclid's 'Elements'? — Answer: 13. Historical fact.</li>
<li>Who gave the first known proof in Geometry? — Answer: Thales. Fact.</li>
</ol>
<h4>Previous Year Questions</h4><ol>
<li>**(Exam)** The book 'Elements' was written by?</li>
<li>**(Board)** Mention the Greek word for 'to measure'.</li>
</ol>
<h3>Definitions &amp; Dimensions</h3>
<p>1. Progression: Solid $\rightarrow$ Surface $\rightarrow$ Line $\rightarrow$ Point.</p>
<p>2. Dimensions:</p>
<p>- Solid: 3 (Length, Breadth, Thickness)</p>
<p>- Surface: 2 (Length, Breadth)</p>
<p>- Line: 1 (Length only)</p>
<p>- Point: 0 (No part)</p>
<p>3. Euclid's Definitions:</p>
<p>- Ends of a line are points.</p>
<p>- Ends of a surface are lines.</p>
<p>- A point has no part.</p>
<p><strong>Dimension Ladder:</strong> 3 \rightarrow 2 \rightarrow 1 \rightarrow 0 — Decrementing dimensions from solid to point.</p>
<p><em>The boundaries of a solid are surfaces .</em></p>
<h4>Sample Practice Questions</h4><ol>
<li>A point has how many parts? — Answer: 0. Definition.</li>
<li>Dimensions of a surface? — Answer: 2. Length and Breadth.</li>
<li>A breadthless length is a...? — Answer: Line. Euclid's definition.</li>
</ol>
<h4>Previous Year Questions</h4><ol>
<li>**(Exam)** A surface has how many dimensions?</li>
<li>**(Board)** Boundaries of solids are?</li>
</ol>
<h3>Euclid's Axioms</h3>
<p>Axioms are universal truths used in all branches of math (not just geometry).</p>
<p>1. Equality: Things equal to the same thing are equal to each other.</p>
<p>2. Addition: If equals are added to equals, the wholes are equal.</p>
<p>3. Subtraction: If equals are subtracted from equals, remainders are equal.</p>
<p>4. Coincide: Things which coincide with one another are equal.</p>
<p>5. Whole/Part: The whole is greater than the part.</p>
<p>6. Doubles: Doubles of the same things are equal.</p>
<p>7. Halves: Halves of the same things are equal.</p>
<p><strong>Axiom 1:</strong> A=C, B=C \Rightarrow A=B — If x=10 and y=10 then x=y</p>
<p><em>Axioms are accepted as 'universal truths' without proof.</em></p>
<h4>Sample Practice Questions</h4><ol>
<li>If x = y, and we add 2 to both, result is? — Answer: Equal. Axiom 2.</li>
<li>'Whole is greater than part' is Axiom #? — Answer: 5. Fact.</li>
<li>If 2x = 2y, then x = y. Which axiom? — Answer: 7 (Halves of same). Fact.</li>
</ol>
<h4>Previous Year Questions</h4><ol>
<li>**(Exam)** List Euclid's 5th Axiom.</li>
<li>**(Board)** Addition of equals results in?</li>
</ol>
<h3>Euclid's Postulates</h3>
<p>Postulates are assumptions specific to Geometry.</p>
<p>1st: Straight line from any point to any other point.</p>
<p>2nd: Terminated line (segment) can be produced indefinitely.</p>
<p>3rd: Circle can be drawn with any center and any radius.</p>
<p>4th: All right angles are equal.</p>
<p>5th (Parallel Postulate): If interior angles on same side of transversal &lt; 180°, lines will meet on that side.</p>
<p>Playfair's Axiom: For every line $l$ and point $P$ not on it, there is a unique line $m$ passing through $P$ parallel to $l$.</p>
<p><strong>Sum of Angles (Postulate 5):</strong> $\angle 1 + \angle 2 &lt; 180^\circ \Rightarrow \text{Lines Meet}$ — Condition for intersection.</p>
<p><em>Playfair's Axiom is an equivalent version of Euclid's 5th Postulate.</em></p>
<h4>Sample Practice Questions</h4><ol>
<li>How many lines can pass through two fixed points? — Answer: 1. Postulate 1.</li>
<li>Which postulate mentions circles? — Answer: 3rd. Fact.</li>
<li>Postulate 5 is about? — Answer: Parallelism/Intersection. Complex logic.</li>
</ol>
<h4>Previous Year Questions</h4><ol>
