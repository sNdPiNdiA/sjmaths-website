        :root {

            --primary-dark: #6c3483;

        }

        body {
            background: var(--bg-gradient);

        }

        a {

        }

        /* Hero */
        .page-hero {

            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 1rem;

        }

        .breadcrumbs span {
            color: var(--primary);
            font-weight: 600;
            background: #f4ecf7;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .page-hero h1 {
            font-size: 2.5rem;
            color: var(--text-dark);
            margin-bottom: 0.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .page-hero p {
            color: var(--text-light);
            max-width: 600px;
            margin: 0 auto;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* Nav Buttons */
        .nav-buttons-container {
            display: flex;
            justify-content: space-between;
            max-width: 1100px;
            margin: 0 auto 2rem;
            padding: 0 5%;
            width: 100%;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .nav-btn-back {
            background: rgba(142, 68, 173, 0.1);
            color: var(--primary);
        }

        .nav-btn-back:hover {
            background: rgba(142, 68, 173, 0.2);
            transform: translateX(-5px);
        }

        /* Grid */
        .unit-grid {
            max-width: 1100px;
            margin: 0 auto 5rem;
            padding: 0 5%;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .unit-card {
            background: var(--white);
            border-radius: 20px;
            padding: 1.8rem;
            box-shadow: var(--shadow-soft);
            border: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }

        .unit-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 6px;
            height: 100%;
            background: var(--primary);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .unit-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-hover);
        }

        .unit-card:hover::before {
            opacity: 1;
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 1.2rem;
            margin-bottom: 1.5rem;
        }

        .unit-num {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 1.1rem;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(142, 68, 173, 0.3);
        }

        .unit-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.4;
            padding-top: 5px;
        }

        /* Dropdown */
        details.custom-dropdown {
            width: 100%;
            margin-top: auto;
        }

        summary {
            list-style: none;
            background: #f8f9fa;
            color: var(--text-dark);
            padding: 14px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 12px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary:hover {
            background: #eef2f7;
            color: var(--primary);
            border-color: rgba(142, 68, 173, 0.1);
        }

        details[open] summary {
            background: var(--primary);
            color: white;
            border-radius: 12px 12px 0 0;
            box-shadow: 0 4px 15px rgba(142, 68, 173, 0.2);
        }

        details[open] summary i {
            transform: rotate(180deg);
        }

        summary i {
            transition: transform 0.3s ease;
        }

        .dropdown-content {
            background: white;
            border: 1px solid #eee;
            border-top: none;
            border-radius: 0 0 12px 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dropdown-content a {
            padding: 14px 20px;
            font-size: 0.9rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f5f5f5;
            transition: all 0.2s;
        }

        .dropdown-content a:hover {
            background: #fdfbfd;
            color: var(--primary);
            padding-left: 25px;
        }

        .dropdown-content a:last-child {
            border-bottom: none;
        }

        .dropdown-content a span:first-child {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tag {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            background: #e8f5e9;
            color: #27ae60;
            letter-spacing: 0.3px;
        }

        .tag.standard {
            background: #e3f2fd;
            color: #1976d2;
        }

        .tag.hard {
            background: #ffebee;
            color: #c62828;
        }

        @media (max-width: 768px) {
            .unit-grid {
                grid-template-columns: 1fr;
                padding: 0 1.2rem;

            .nav-buttons-container {

    <script>
        const units = [
            { num: "I", name: "Number Systems", folder: "unit-1-number-systems" },
            { num: "II", name: "Algebra", folder: "unit-2-algebra" },
            { num: "III", name: "Coordinate Geometry", folder: "unit-3-coordinate-geometry" },
            { num: "IV", name: "Geometry", folder: "unit-4-geometry" },
            { num: "V", name: "Mensuration", folder: "unit-5-mensuration" },
            { num: "VI", name: "Statistics", folder: "unit-6-statistics" }
        ];

        function renderUnits() {
            const grid = document.getElementById('unitGrid');
            grid.innerHTML = '';
            units.forEach(unit => {
                const card = document.createElement('div');
                card.className = 'unit-card';
                // Assuming test-1.html and test-2.html are the standard names
                const linksHTML = `
                    <a href="${unit.folder}/test-1.html">
                        <span><i class="fas fa-seedling"></i> Test 1</span>
                        <span class="tag">1 Hr</span>
                    </a>
                    <a href="${unit.folder}/test-2.html">
                        <span><i class="fas fa-book-open"></i> Test 2</span>
                        <span class="tag standard">1 Hr</span>
                    </a>
                `;
                card.innerHTML = `
                    <div class="card-header">
                        <div class="unit-num">${unit.num}</div>
                        <div class="unit-title">${unit.name}</div>
                    </div>
                    <details class="custom-dropdown">
                        <summary>Select Test <i class="fas fa-chevron-down"></i></summary>
                        <div class="dropdown-content">
                            ${linksHTML}
                        </div>
                    </details>
                `;
                grid.appendChild(card);
            });
            attachListeners();
        }

        function attachListeners() {
            const allDetails = document.querySelectorAll('details');
            allDetails.forEach(target => {
                target.addEventListener('click', () => {
                    allDetails.forEach(d => {
                        if (d !== target) d.removeAttribute('open');
                    });
                });
            });
        }

        document.addEventListener('DOMContentLoaded', renderUnits);
    </script>
