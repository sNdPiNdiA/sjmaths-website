<body>
    <div id="header-container"></div>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="login-container">
        <a href="./" class="logo"><span class="logo-symbol">&int;</span> SJMaths</a>

        <h1>Create Account</h1>
        <p class="subtitle">Join us to master mathematics</p>

        <form id="signupForm">
            <button type="button" class="google-btn" id="googleSignupBtn">
                <i class="fab fa-google"></i> Sign up with Google
            </button>

            <div class="links">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </form>

        <a href="./" class="back-home">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </div>

    <!-- FIREBASE AUTH LOGIC -->
    <script type="module">
        import {
            GoogleAuthProvider,
            signInWithPopup
        } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
        import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

        import { auth, db, analytics, logEvent } from './assets/js/firebase-config.min.js?v=d5efb85e';
        import { showToast } from './assets/js/utils.min.js?v=1fe63cc5';

        /* GOOGLE SIGNUP */
        document.getElementById("googleSignupBtn").addEventListener("click", async () => {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Create user document in Firestore
                await setDoc(doc(db, "users", user.uid), {
                    displayName: user.displayName || "",
                    email: user.email || "",
                    photoURL: user.photoURL || "",
                    createdAt: serverTimestamp(),
                    lastLogin: serverTimestamp()
                }, { merge: true });

                const redirectUrl = sessionStorage.getItem('sjmaths_redirect');
                if (redirectUrl) {
                    sessionStorage.removeItem('sjmaths_redirect');
                    window.location.href = redirectUrl;
                } else {
                    window.location.href = "/";
                }
            } catch (error) {
                console.error("Google Sign-Up Error:", error);
                showToast(error.message, "error");
            }
        });

    </script>
