<body>

    <div class="login-container">
        <a href="./" class="logo"><span class="logo-symbol">&int;</span> SJMaths</a>

        <h1>Create Account</h1>
        <p class="subtitle">Join us to master mathematics</p>

        <form id="signupForm">
            <button type="button" class="google-btn" id="googleSignupBtn">
                <svg class="google-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Sign up with Google</span>
            </button>

                Already have an account? <a href="login">Login</a>
            </div>
        </form>

        <a href="./" class="back-home">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </div>

    <!-- FIREBASE AUTH LOGIC -->
    <script type="module">
        import {
            GoogleAuthProvider,
            signInWithPopup
        } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
        import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

        import { auth, db, analytics, logEvent } from './assets/js/firebase-config.min.js?v=6db8bf8a';
        import { showToast } from './assets/js/utils.min.js?v=502903e6';

        /* GOOGLE SIGNUP */
        document.getElementById("googleSignupBtn").addEventListener("click", async () => {
            const provider = new GoogleAuthProvider();
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Create user document in Firestore
                await setDoc(doc(db, "users", user.uid), {
                    displayName: user.displayName || "",
                    email: user.email || "",
                    photoURL: user.photoURL || "",
                    createdAt: serverTimestamp(),
                    lastLogin: serverTimestamp()
                }, { merge: true });

                const redirectUrl = sessionStorage.getItem('sjmaths_redirect');
                if (redirectUrl) {
                    sessionStorage.removeItem('sjmaths_redirect');
                    window.location.href = redirectUrl;
                } else {
                    window.location.href = "/";
                }
            } catch (error) {
                console.error("Google Sign-Up Error:", error);
                showToast(error.message, "error");
            }
        });

    </script>
