name: Current Affairs Pipeline

on:
  schedule:
    - cron: '30 0 * * *'    # 6:00 AM IST daily (00:30 UTC)
    - cron: '30 12 * * *'   # 6:00 PM IST daily (12:30 UTC)
  workflow_dispatch:        # Allows manual run from GitHub Actions UI

permissions:
  contents: write

concurrency:
  group: current-affairs-pipeline
  cancel-in-progress: false

jobs:
  update-current-affairs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: 'npm'
          
      - run: npm ci
      
      - name: Run Current Affairs Pipeline (Fetch, Process, and HTML Page Gen)
        run: npm run ca:full
        
      - name: Generate Sitemaps
        run: npm run generate:sitemaps
        
      - name: Generate Search Index
        run: npm run generate:search
        
      - name: Run Minification Build
        run: npm run build
        
      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Auto update current affairs: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
