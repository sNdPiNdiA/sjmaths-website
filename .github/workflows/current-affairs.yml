name: Current Affairs Pipeline

on:
  schedule:
    - cron: '30 0 * * *'    # 6:00 AM IST daily (00:30 UTC)
    - cron: '30 12 * * *'   # 6:00 PM IST daily (12:30 UTC)
  workflow_dispatch:        # Allows manual run from GitHub Actions UI

jobs:
  update-current-affairs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - run: npm ci
      
      - name: Run Current Affairs Pipeline (Fetch, Process, and HTML Page Gen)
        run: npm run ca:full
        
      - name: Install Puppeteer Chrome (for PDF gen)
        run: npx puppeteer browsers install chrome
        
      - name: Generate PDFs (Weekly, Bimonthly, Monthly)
        run: node scripts/current-affairs/generate-pdf.js
        
      - name: Generate Sitemaps
        run: npm run generate:sitemaps
        
      - name: Generate Search Index
        run: npm run generate:search
        
      - name: Run Minification Build
        run: npm run build
        
      - name: Commit & Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "📰 Auto Update Current Affairs & PDFs: $(date +'%Y-%m-%d %H:%M')"
          git push

