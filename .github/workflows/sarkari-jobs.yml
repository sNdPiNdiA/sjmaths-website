name: Sarkari Jobs Pipeline

on:
  schedule:
    - cron: "30 0,6,12,18 * * *" # 06:00, 12:00, 18:00, 00:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sarkari-jobs-pipeline
  cancel-in-progress: false

jobs:
  update-sarkari-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.1"
          cache: "npm"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-hin tesseract-ocr-eng

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r sarkari-jobs/scripts/requirements.txt

      - name: Run Sarkari Jobs pipeline
        run: npm run sj:orchestrator

      - name: Commit & push generated updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sarkari-jobs/data sarkari-jobs/index.html sarkari-jobs/scripts/raw sarkari-jobs/scripts/parsed sarkari-jobs/pdfs sarkari-jobs/extracted-text
          git diff --cached --quiet || git commit -m "Auto update sarkari jobs: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
