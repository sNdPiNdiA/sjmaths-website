<head>

    <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css?v=1781502020">
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }

        .important-list {
            list-style: none;
            padding: 0;
        }

        .important-item {
            background: #fff;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .important-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .item-info h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .item-info p {
            margin: 0;
            color: #666;
            font-size: 0.9rem;
        }

        .visit-btn {
            background: var(--primary);
            color: #fff;
            padding: 8px 16px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .no-items {
            text-align: center;
            padding: 3rem;
            color: #888;
        }
    </style>

    <link rel="stylesheet" href="/assets/css/component.min.css?v=1781502020">
    <link rel="stylesheet" href="/assets/css/improved-ui.min.css?v=1781502020">
    <meta name="description" content="Important Questions study material for CBSE Maths on SJMaths with notes, questions, practice resources, and exam preparation support.">
    
    <meta name="robots" content="index, follow, max-image-preview:large">
    <link rel="canonical" href="https://sjmaths.com/important-questions.html">
<meta property="og:title" content="Important Questions | SJMaths">
    <meta property="og:description" content="Important Questions study material for CBSE Maths on SJMaths with notes, questions, practice resources, and exam preparation support.">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://sjmaths.com/important-questions.html">
    <meta property="og:image" content="https://sjmaths.com/assets/icons/icon-512x512.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Important Questions | SJMaths">
    <meta name="twitter:description" content="Important Questions study material for CBSE Maths on SJMaths with notes, questions, practice resources, and exam preparation support.">
    <meta name="twitter:image" content="https://sjmaths.com/assets/icons/icon-512x512.png">
</head>

<body>
    <div id="header-container"></div>
    <!-- Header removed by standardizer -->

    <main class="container">
        <h1>Your Important Questions</h1>
        <p>A collection of questions you marked as important.</p>

        <ul id="importantList" class="important-list">
            <!-- Items injected by JS -->
        </ul>
        <div id="noItemsData" class="no-items" style="display:none;">
            <i class="fas fa-star" style="font-size: 3rem; color: #ccc; margin-bottom: 1rem;"></i>
            <p>No questions marked yet. Go to exercises and tap the star icon!</p>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const list = document.getElementById('importantList');
            const noData = document.getElementById('noItemsData');
            let hasItems = false;

            // Iterate over all keys in localStorage
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('sjmaths_important_')) {
                    try {
                        const items = JSON.parse(localStorage.getItem(key));
                        if (items && items.length > 0) {
                            hasItems = true;
                            // Extract path from key: sjmaths_important_/class-9-maths/path/to/file.html
                            const path = key.replace('sjmaths_important_', '');

                            // Estimate readable name from path
                            // Example: /class-9-maths/ncert-exercise-practice/chapter-1-use-of-coordinates/exercise-1-1.html
                            const parts = path.split('/');
                            const chapter = parts[parts.length - 2]?.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) || 'Unknown Chapter';
                            const exercise = parts[parts.length - 1]?.replace('.html', '').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) || 'Unknown Exercise';

                            items.forEach(qId => {
                                const li = document.createElement('li');
                                li.className = 'important-item';
                                li.innerHTML = `
                                    <div class="item-info">
                                        <h3>${exercise} - Question ${qId.replace('q', '')}</h3>
                                        <p>${chapter}</p>
                                    </div>
                                    <a href="${path}#${qId}" class="visit-btn">Visit Question</a>
                                `;
                                list.appendChild(li);
                            });
                        }
                    } catch (e) {
                        console.error('Error parsing important items for key', key, e);
                    }
                }
            }

            if (!hasItems) {
                noData.style.display = 'block';
            }
        });
    </script>

    <script src="/assets/js/exercise-seo.min.js?v=1781502020"></script>
    <script src="/assets/js/main.min.js?v=1781502020" defer data-cfasync="false"></script>

    <script src="/assets/js/global-footer.min.js?v=1781502020" defer data-cfasync="false"></script>
</body>

</html>
