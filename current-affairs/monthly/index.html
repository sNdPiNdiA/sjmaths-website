  <style>
    :root {
      --ca-primary: #e11d48;
      --ca-primary-hover: #be123c;
      --ca-primary-light: rgba(225, 29, 72, 0.08);
      --ca-secondary: #ea580c;
      --ca-gradient: linear-gradient(135deg, #e11d48 0%, #ea580c 100%);
      --ca-gradient-subtle: linear-gradient(135deg, rgba(225, 29, 72, 0.06) 0%, rgba(234, 88, 12, 0.06) 100%);
      --ca-ink: #0f172a;
      --ca-ink-soft: #334155;
      --ca-muted: #64748b;
      --ca-line: #e2e8f0;
      --ca-line-subtle: #f1f5f9;
      --ca-bg: #f8fafc;
      --ca-panel: #ffffff;
      --ca-card-bg: #ffffff;
      --ca-soft: #f1f5f9;
      --ca-good: #10b981;
      --ca-good-bg: rgba(16, 185, 129, 0.08);
      --ca-bad: #ef4444;
      --ca-bad-bg: rgba(239, 68, 68, 0.08);
      --ca-info: #0284c7;
      --ca-info-bg: rgba(2, 132, 199, 0.08);
      --ca-gold: #f59e0b;
      --ca-gold-bg: rgba(245, 158, 11, 0.08);
      --ca-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.07), 0 4px 10px -2px rgba(15, 23, 42, 0.03);
      --ca-shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.04);
      --ca-shadow-hover: 0 16px 36px -4px rgba(15, 23, 42, 0.12), 0 6px 16px -2px rgba(15, 23, 42, 0.06);
      --ca-radius: 18px;
      --ca-radius-sm: 12px;
      --ca-radius-xs: 8px;
      --ca-focus: 0 0 0 3px rgba(225, 29, 72, 0.25);
      --ca-font-scale: 1;
    }

    [data-font="large"] {
      --ca-font-scale: 1.12;
    }

    [data-font="xlarge"] {
      --ca-font-scale: 1.25;
    }

    [data-theme=dark] {
      --ca-ink: #f8fafc;
      --ca-ink-soft: #cbd5e1;
      --ca-muted: #94a3b8;
      --ca-line: #1e293b;
      --ca-line-subtle: #172033;
      --ca-bg: #090d16;
      --ca-panel: #111827;
      --ca-card-bg: #141d30;
      --ca-soft: #1e293b;
      --ca-primary-light: rgba(225, 29, 72, 0.15);
      --ca-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
      --ca-shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.3);
      --ca-shadow-hover: 0 20px 45px rgba(0, 0, 0, 0.65);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--ca-bg);
      color: var(--ca-ink);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.62;
      font-size: calc(15px * var(--ca-font-scale));
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: none;
      box-shadow: var(--ca-focus);
    }

    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3.5px;
      background: transparent;
      z-index: 9999;
    }

    .reading-progress span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--ca-gradient);
      box-shadow: 0 0 10px rgba(225, 29, 72, 0.6);
      transition: width 0.1s ease-out;
    }

    .ca-shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 20px 64px;
    }

    /* Top Hub Navigation */
    .hub-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
      background: var(--ca-panel);
      padding: 8px 12px;
      border: 1px solid var(--ca-line);
      border-radius: 999px;
      box-shadow: var(--ca-shadow-sm);
    }

    .hub-nav-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--ca-muted);
      text-decoration: none;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .hub-nav-link:hover {
      color: var(--ca-ink);
      background: var(--ca-soft);
    }

    .hub-nav-link.active {
      background: var(--ca-gradient);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.28);
    }

    .hub-nav-link.active i {
      color: #fff;
    }

    /* Hero Header Banner */
    .ca-hero {
      position: relative;
      border: 1px solid var(--ca-line);
      border-radius: 24px;
      background: var(--ca-panel);
      box-shadow: var(--ca-shadow);
      padding: 32px 36px;
      margin: 12px 0 20px;
      overflow: hidden;
    }

    .ca-hero::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -80px;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(225, 29, 72, 0.12) 0%, rgba(234, 88, 12, 0.03) 60%, transparent 80%);
      pointer-events: none;
    }

    .hero-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .eyebrow {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      color: var(--ca-primary);
      font-weight: 700;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--ca-primary-light);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(225, 29, 72, 0.15);
    }

    .hero-comfort-controls {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--ca-soft);
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--ca-line);
    }

    .comfort-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ca-ink-soft);
      transition: all 0.15s ease;
    }

    .comfort-btn:hover {
      background: var(--ca-panel);
      color: var(--ca-primary);
      box-shadow: var(--ca-shadow-sm);
    }

    .comfort-btn.active {
      background: var(--ca-panel);
      color: var(--ca-primary);
      font-weight: 700;
      box-shadow: var(--ca-shadow-sm);
    }

    .font-scale-group {
      display: inline-flex;
      align-items: center;
      border-left: 1px solid var(--ca-line);
      padding-left: 6px;
      gap: 2px;
    }

    .font-scale-btn {
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--ca-muted);
    }

    .font-scale-btn.active {
      color: var(--ca-primary);
      background: var(--ca-panel);
    }

    .ca-hero h1 {
      font-family: Outfit, sans-serif;
      font-size: clamp(1.8rem, 3.4vw, 2.6rem);
      line-height: 1.15;
      font-weight: 800;
      margin: 8px 0 10px;
      letter-spacing: -0.02em;
      color: var(--ca-ink);
    }

    .ca-hero p.hero-desc {
      margin: 0 0 20px;
      color: var(--ca-muted);
      font-size: 1rem;
      max-width: 820px;
      line-height: 1.6;
    }

    .search-container {
      position: relative;
      max-width: 680px;
    }

    .search-box-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box-wrap i.search-icon {
      position: absolute;
      left: 16px;
      color: var(--ca-muted);
      font-size: 0.95rem;
      pointer-events: none;
    }

    #globalSearch {
      width: 100%;
      border: 1.5px solid var(--ca-line);
      border-radius: 14px;
      padding: 13px 44px 13px 44px;
      background: var(--ca-bg);
      color: var(--ca-ink);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
      font-size: 0.94rem;
      transition: all 0.2s ease;
    }

    #globalSearch:focus {
      border-color: var(--ca-primary);
      background: var(--ca-panel);
      box-shadow: var(--ca-focus);
    }

    .search-clear-btn {
      position: absolute;
      right: 12px;
      color: var(--ca-muted);
      padding: 6px;
      display: none;
    }

    .search-clear-btn.visible {
      display: block;
    }

    .search-results {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      background: var(--ca-panel);
      border: 1px solid var(--ca-line);
      border-radius: 16px;
      box-shadow: var(--ca-shadow-hover);
      z-index: 50;
      max-height: 360px;
      overflow-y: auto;
      padding: 6px;
    }

    .search-results button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--ca-ink);
      padding: 10px 14px;
      border-radius: 10px;
      transition: background 0.15s;
    }

    .search-results button:hover {
      background: var(--ca-soft);
    }

    .search-results button strong {
      color: var(--ca-primary);
      font-size: 0.92rem;
    }

    .search-results button small {
      color: var(--ca-muted);
      font-size: 0.8rem;
    }

    /* Horizontal Period Selector Rail */
    .period-scroll-wrapper {
      position: relative;
      margin: 18px 0;
    }

    .selector-grid {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 2px 10px;
      scrollbar-width: thin;
      scroll-snap-type: x mandatory;
    }

    .period-card {
      flex: 0 0 auto;
      scroll-snap-align: start;
      border: 1.5px solid var(--ca-line);
      background: var(--ca-panel);
      color: var(--ca-ink);
      border-radius: 16px;
      padding: 12px 18px;
      min-width: 175px;
      text-align: left;
      box-shadow: var(--ca-shadow-sm);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .period-card:hover {
      border-color: var(--ca-primary);
      transform: translateY(-2px);
      box-shadow: var(--ca-shadow);
    }

    .period-card[aria-pressed=true] {
      background: var(--ca-gradient);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 8px 20px rgba(225, 29, 72, 0.3);
      transform: translateY(-2px);
    }

    .period-card strong {
      display: block;
      font-size: 0.95rem;
      font-weight: 700;
      color: inherit;
    }

    .period-card span {
      display: block;
      font-size: 0.78rem;
      opacity: 0.82;
      color: inherit;
      margin-top: 3px;
    }

    /* Study Modes Toolbar */
    .sticky-toolbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--ca-bg);
      padding: 10px 0;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .toolbar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--ca-panel);
      border: 1px solid var(--ca-line);
      border-radius: 999px;
      padding: 6px 10px;
      box-shadow: var(--ca-shadow-sm);
    }

    .sub-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .sub-tabs::-webkit-scrollbar {
      display: none;
    }

    .section-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 8px 18px;
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--ca-muted);
      border: 1px solid transparent;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .section-tab:hover {
      color: var(--ca-ink);
      background: var(--ca-soft);
    }

    .section-tab[aria-selected=true] {
      background: var(--ca-gradient);
      color: #fff;
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.28);
    }

    .section-tab[aria-selected=true] i {
      color: #fff;
    }

    .quick-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .action-icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: var(--ca-muted);
      border: 1px solid var(--ca-line);
      background: var(--ca-bg);
      transition: all 0.15s ease;
    }

    .action-icon-btn:hover {
      background: var(--ca-panel);
      color: var(--ca-primary);
      border-color: var(--ca-primary);
    }

    /* Main Layout Grid */
    .layout {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
      margin-top: 14px;
    }

    .layout.centered {
      grid-template-columns: 1fr;
      max-width: 900px;
      margin: 14px auto 0;
    }

    /* Category Sidebar Navigation */
    .category-nav {
      position: sticky;
      top: 74px;
      background: var(--ca-panel);
      border: 1px solid var(--ca-line);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--ca-shadow);
      max-height: calc(100vh - 90px);
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .category-nav h2 {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ca-muted);
      margin: 0 0 12px;
      font-weight: 800;
      padding-left: 4px;
    }

    .category-nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .category-nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--ca-ink-soft);
      transition: all 0.15s ease;
    }

    .category-nav-item:hover {
      background: var(--ca-soft);
      color: var(--ca-primary);
    }

    .category-nav-item.active {
      background: var(--ca-primary-light);
      color: var(--ca-primary);
      font-weight: 700;
    }

    .category-nav-item .cat-count {
      font-size: 0.75rem;
      font-weight: 700;
      background: var(--ca-soft);
      color: var(--ca-muted);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .category-nav-item.active .cat-count {
      background: var(--ca-primary);
      color: #fff;
    }

    /* Content Area Panels */
    .content-area {
      min-width: 0;
    }

    .category-section {
      scroll-margin-top: 80px;
      margin-bottom: 36px;
    }

    .category-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--ca-line);
    }

    .category-head-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .category-head h2 {
      font-family: Outfit, sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      margin: 0;
      color: var(--ca-ink);
    }

    .category-badge-chip {
      font-size: 0.76rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--ca-primary-light);
      color: var(--ca-primary);
    }

    /* Redesigned Topic Card for Maximum Reading Comfort */
    .topic-card {
      position: relative;
      background: var(--ca-card-bg);
      border: 1px solid var(--ca-line);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: var(--ca-shadow);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .topic-card:hover {
      box-shadow: var(--ca-shadow-hover);
      border-color: rgba(225, 29, 72, 0.3);
      transform: translateY(-2px);
    }

    .topic-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .topic-meta-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill-category {
      font-size: 0.76rem;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 999px;
      background: var(--ca-soft);
      color: var(--ca-ink);
      border: 1px solid var(--ca-line);
    }

    .pill-importance {
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .pill-importance.high {
      background: var(--ca-primary-light);
      color: var(--ca-primary);
      border: 1px solid rgba(225, 29, 72, 0.25);
    }

    .pill-importance.medium {
      background: var(--ca-gold-bg);
      color: var(--ca-gold);
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    .pill-date {
      font-size: 0.75rem;
      color: var(--ca-muted);
      font-weight: 500;
    }

    .card-tools {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ca-muted);
      background: var(--ca-soft);
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }

    .card-tool-btn:hover {
      color: var(--ca-primary);
      background: var(--ca-panel);
      border-color: var(--ca-line);
    }

    .card-tool-btn.active {
      color: var(--ca-primary);
      background: var(--ca-primary-light);
      border-color: rgba(225, 29, 72, 0.25);
    }

    .card-tool-btn.speaking {
      color: #fff;
      background: var(--ca-primary);
      animation: pulse-audio 1.5s infinite;
    }

    @keyframes pulse-audio {
      0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.5); }
      70% { box-shadow: 0 0 0 8px rgba(225, 29, 72, 0); }
      100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
    }

    .topic-title {
      font-family: Outfit, sans-serif;
      font-size: 1.28rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--ca-ink);
      margin: 0 0 14px;
    }

    .topic-facts-block {
      background: var(--ca-bg);
      border: 1px solid var(--ca-line);

      color: #fff;

    .hidden {

    }

    /* Responsive Breakpoints */
    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;

</head>

            ['Miscellaneous', 'Digital museum opens archive on freedom movement', '13 August 2026', 'Medium', ['archive', 'freedom movement', 'culture'], 'The archive gives public access to letters, photographs, and oral histories from the independence movement.', 'Culture-linked current affairs can support history revision.', 'Remember archive theme and institution.'],
            ['Banking & Finance', 'Public sector banks start fraud analytics cell', '14 August 2026', 'High', ['banking', 'fraud analytics', 'cyber security'], 'Banks will share risk signals and suspicious transaction patterns through a coordinated analytics cell.', 'Banking awareness frequently asks RBI, cyber risk, and fraud prevention updates.', 'Remember: analytics supports early warning.']
          ]
        }
      ].map(file => ({ ...file, topics: file.topics.map((t, i) => ({ id: `${fileId(fileStart(file))}-${i}`, category: t[0], title: t[1], date: t[2], importance: t[3], facts: t[4], detail: t[5], exam: t[6], remember: t[7], tags: ['SSC', 'Banking', 'Railway', 'UPSC', t[0]].slice(0, 4) })) }));

      function fileStart(file) { return file && file.start ? file.start : 'week' }
      function fileId(value) { return String(value).replaceAll('-', '') }

      async function loadWeeklyFiles() {
        try {
          const dataVersion = '2026-08-09-v2';
          const manifest = await fetch(`/current-affairs/data/manifest.json?v=${dataVersion}`, { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject(new Error(`manifest ${r.status}`)));
          const files = await Promise.all((manifest.weekly || []).map(path => fetch(`/current-affairs/data/${path}?v=${dataVersion}`, { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject(new Error(`${path} ${r.status}`)))));
          files.map(normalizeWeek).forEach(file => {
            const existing = weeklyFiles.findIndex(item => item.id === file.id);
            if (existing >= 0) weeklyFiles.splice(existing, 1, file); else weeklyFiles.push(file);
          });
          weeklyFiles.sort((a, b) => a.start.localeCompare(b.start));
        } catch (error) {
          console.warn('Using embedded weekly current affairs fallback data.', error);
        }
      }

      function normalizeWeek(file) {
        return {
          ...file,
          label: file.label || `${file.start} - ${file.end}`,
          month: file.month || monthName(file.start),
          months: file.months || [file.month || monthName(file.start)],
          biMonth: file.biMonth || biMonthName(file.start),
          topics: (file.topics || []).map((topic, index) => ({
            id: topic.id || `${fileId(file.start)}-${index}`,
            category: topic.category || 'Miscellaneous',
            title: topic.title || 'Untitled Current Affairs Topic',
            date: topic.date || file.label || file.start,
            importance: topic.importance || 'Medium',
            facts: topic.facts || [],
            detail: topic.detail || topic.summary || '',
            exam: topic.exam || topic.examImportance || 'Important for competitive exam revision.',
            remember: topic.remember || topic.memoryPoint || '',
            tags: topic.tags || ['SSC', 'Banking', 'Railway', 'UPSC'],
            source: topic.source || '',
            hi: topic.hi || null
          }))
        };
      }

      function monthName(dateText) { return new Date(`${dateText}T00:00:00`).toLocaleString('en-US', { month: 'long' }) }
      function biMonthName(dateText) {
        const month = new Date(`${dateText}T00:00:00`).getMonth();
        return ['Jan - Feb', 'Jan - Feb', 'Mar - Apr', 'Mar - Apr', 'May - Jun', 'May - Jun', 'Jul - Aug', 'Jul - Aug', 'Sep - Oct', 'Sep - Oct', 'Nov - Dec', 'Nov - Dec'][month];
      }

      const storeKey = 'sjmathsMonthlyCurrentAffairsDashboard';
      const defaults = { mode: 'monthly', period: 'August', section: 'learn', practice: 'mcq', bookmarks: [], theme: 'light', lang: 'en', font: 'normal' };
      const state = { ...defaults, ...JSON.parse(localStorage.getItem(storeKey) || '{}') };
      const $ = s => document.querySelector(s);
      const save = () => localStorage.setItem(storeKey, JSON.stringify(state));

      const selectedWeeks = () => weeklyFiles.filter(w => (w.months || [w.month]).includes(state.period));
      const selectedTopics = () => selectedWeeks().flatMap(w => w.topics.map(t => ({ ...t, week: w.label })));
      const periods = () => months.map(m => {
        const count = weeklyFiles.filter(w => (w.months || [w.month]).includes(m)).reduce((acc, w) => acc + w.topics.length, 0);
        return { id: m, label: m, count };
      });

      function ensurePeriod() {
        const urlParams = new URLSearchParams(location.search);
        const latestWeek = weeklyFiles[weeklyFiles.length - 1];
        const defaultMonth = latestWeek ? latestWeek.month : 'August';

        if (urlParams.get('period') && months.includes(urlParams.get('period'))) {
          state.period = urlParams.get('period');
        } else if (!state.period || !months.includes(state.period)) {
          state.period = defaultMonth;
        }
      }

      function setTheme() {
        document.documentElement.dataset.theme = state.theme;
        const icon = state.theme === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        $('#themeToggle').innerHTML = icon;
      }

      function setFont(fontScale) {
        state.font = fontScale || state.font || 'normal';
        document.documentElement.dataset.font = state.font;
        document.querySelectorAll('[data-font-set]').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.fontSet === state.font);
        });
        save();
      }

      function showToast(text) {
        const toast = $('#caToast');
        $('#toastMsg').textContent = text;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      }

      function setLang() {
        const isHi = state.lang === 'hi';
        $('#langLabel').textContent = isHi ? 'English' : 'हिंदी';
        document.documentElement.lang = isHi ? 'hi' : 'en';

        document.querySelectorAll('.section-tab span').forEach((el, i) => {
          const labels = isHi ? ['मासिक नोट्स', 'त्वरित वन-लाइनर्स', 'अभ्यास एवं क्विज़'] : ['Monthly Notes', 'One-Liners', 'Practice & Quiz'];
          if (labels[i]) el.textContent = labels[i];
        });

        const heroTitle = document.getElementById('pageTitle');
        if (heroTitle) heroTitle.textContent = isHi ? 'मासिक करेंट अफेयर्स सूचकांक' : 'Monthly Current Affairs Index';
        const heroDesc = document.getElementById('heroDesc');
        if (heroDesc) heroDesc.textContent = isHi ? 'मासिक विस्तृत करेंट अफेयर्स संकलन का अध्ययन करें, ऑडियो सारांश सुनें, मानक प्रश्नों का अभ्यास करें और त्वरित वन-लाइनर्स दोहराएं।' : 'Explore full-month comprehensive current affairs compilations, audio summaries, exam practice MCQs, and rapid revision notes.';
        const heroBadge = document.getElementById('heroBadge');
        if (heroBadge) heroBadge.innerHTML = isHi ? '<i class="fas fa-calendar-check"></i> मासिक करेंट अफेयर्स संग्रह' : '<i class="fas fa-calendar-check"></i> Monthly Current Affairs Archives';
        const catNavTitle = document.getElementById('catNavTitle');
        if (catNavTitle) catNavTitle.textContent = isHi ? 'विषय श्रेणियाँ' : 'Categories';
        const searchInput = document.getElementById('globalSearch');
        if (searchInput) searchInput.placeholder = isHi ? 'विषय, योजनाएँ, पुरस्कार, नियुक्तियाँ, रिपोर्ट खोजें... (/ दबाएँ)' : 'Search topics, schemes, awards, appointments, reports... (Press / to search)';

        renderShell();
      }

      function renderShell() {
        ensurePeriod();
        setTheme();
        setFont(state.font);

        document.querySelectorAll('.section-tab').forEach(b => {
          const isSelected = b.dataset.section === state.section;
          b.setAttribute('aria-selected', isSelected);
          b.tabIndex = isSelected ? 0 : -1;
        });

        const currentPeriods = periods();
        $('#periodSelector').innerHTML = currentPeriods.map(p => `
          <button class="period-card" type="button" data-period="${p.id}" aria-pressed="${p.id === state.period}">
            <strong>${p.label}</strong>
            <span>${p.count} ${state.lang === 'hi' ? 'विषय' : 'topics'}</span>
          </button>
        `).join('');

        $('#learnPanel').classList.toggle('hidden', state.section !== 'learn');
        $('#onelinersPanel').classList.toggle('hidden', state.section !== 'oneliners');
        $('#practicePanel').classList.toggle('hidden', state.section !== 'practice');

        const layout = $('#mainLayout');
        const isLearn = state.section === 'learn';
        layout.classList.toggle('centered', !isLearn);
        $('#categoryNavSidebar').classList.toggle('hidden', !isLearn);

        renderCategories();
        if (state.section === 'learn') renderLearn();
        if (state.section === 'oneliners') renderOneliners();
        if (state.section === 'practice') renderPractice();

        save();
      }

      function renderCategories() {
        const isHi = state.lang === 'hi';
        const topics = selectedTopics();
        const available = categories.filter(c => topics.some(t => t.category === c));

        $('#categoryNav').innerHTML = available.map(c => {
          const count = topics.filter(t => t.category === c).length;
          const icon = categoryIconMap[c] || 'fa-tag';
          const name = isHi ? (categoryHiMap[c] || c) : c;
          return `
            <button class="category-nav-item" type="button" data-jump="${slug(c)}">
              <span><i class="fas ${icon}" style="width:16px; margin-right:6px; opacity:0.75;"></i> ${name}</span>
              <span class="cat-count">${count}</span>
            </button>
          `;
        }).join('');
      }

      function renderLearn() {
        const isHi = state.lang === 'hi';
        const topics = selectedTopics();
        const groups = categories.map(c => [c, topics.filter(t => t.category === c)]).filter(g => g[1].length);

        if (!topics.length) {
          $('#learnPanel').innerHTML = `<div style="text-align:center; padding:40px; color:var(--ca-muted);">No topics available for this month.</div>`;
          return;
        }

        $('#learnPanel').innerHTML = groups.map(([category, items]) => {
          const icon = categoryIconMap[category] || 'fa-folder';
          const catName = isHi ? (categoryHiMap[category] || category) : category;
          return `
            <section class="category-section" id="${slug(category)}" data-category="${category}">
              <div class="category-head">
                <div class="category-head-title">
                  <i class="fas ${icon}" style="color:var(--ca-primary); font-size:1.2rem;"></i>
                  <h2>${catName}</h2>
                  <span class="category-badge-chip">${items.length} ${isHi ? 'विषय' : 'topics'}</span>
                </div>
              </div>
              <div class="category-cards-wrap">
                ${items.map(topicCard).join('')}
              </div>
            </section>
          `;
        }).join('');
      }

      function topicCard(t) {
        const isHi = state.lang === 'hi';
        const hi = t.hi || {};
        const title = isHi ? (hi.title || t.title) : t.title;
        const categoryName = isHi ? (categoryHiMap[t.category] || t.category) : t.category;
        const importanceName = isHi ? (hi.importance || t.importance) : t.importance;
        const facts = isHi ? (hi.facts && hi.facts.length ? hi.facts : t.facts) : t.facts;
        const detail = isHi ? (hi.detail || t.detail) : t.detail;
        const exam = isHi ? (hi.exam || t.exam) : t.exam;
        const remember = isHi ? (hi.remember || t.remember) : t.remember;
        const isBookmarked = state.bookmarks.includes(t.id);
        const importanceClass = (t.importance || '').toLowerCase() === 'high' ? 'high' : 'medium';

        return `
          <article class="topic-card" id="${t.id}" data-id="${t.id}">
            <div class="topic-card-header">
              <div class="topic-meta-left">
                <span class="pill-category">${categoryName}</span>
                <span class="pill-importance ${importanceClass}">
                  ${importanceClass === 'high' ? '🔥' : '⚡'} ${importanceName}
                </span>
                <span class="pill-date"><i class="far fa-calendar-alt"></i> ${t.date}</span>
              </div>
              <div class="card-tools">
                <button class="card-tool-btn" type="button" data-speak="${t.id}" title="${isHi ? 'ऑडियो सुनें' : 'Listen with Audio Reader'}">
                  <i class="fas fa-volume-up"></i> <span>${isHi ? 'सुनें' : 'Listen'}</span>
                </button>
                <button class="card-tool-btn ${isBookmarked ? 'active' : ''}" type="button" data-bookmark="${t.id}" title="${isHi ? 'बुकमार्क करें' : 'Bookmark'}">
                  <i class="${isBookmarked ? 'fas' : 'far'} fa-bookmark"></i>
                </button>
                <button class="card-tool-btn" type="button" data-copy-card="${t.id}" title="${isHi ? 'कॉपी करें' : 'Copy'}">
                  <i class="far fa-copy"></i>
                </button>
              </div>
            </div>

            <h3 class="topic-title">${title}</h3>

            ${facts && facts.length ? `
              <div class="topic-facts-block">
                <div class="facts-heading"><i class="fas fa-bolt"></i> ${isHi ? 'मुख्य तथ्य एवं बिंदु' : 'Key Facts & Highlights'}</div>
                <ul class="facts-list">
                  ${facts.map(f => `<li>${f}</li>`).join('')}
                </ul>
              </div>
            ` : ''}

            ${detail ? `<p class="topic-detail-text">${detail}</p>` : ''}

            ${exam ? `
              <div class="topic-exam-callout">
                <i class="fas fa-graduation-cap"></i>
                <div><strong>${isHi ? 'परीक्षा उपयोगिता:' : 'Exam Relevance:'}</strong> ${exam}</div>
              </div>
            ` : ''}

            ${remember ? `
              <div class="topic-remember-box">
                <i class="fas fa-lightbulb"></i>
                <div><strong>${isHi ? 'याद रखें (Key Takeaway):' : 'Remember:'}</strong> ${remember}</div>
              </div>
            ` : ''}
          </article>
        `;
      }

      function renderOneliners() {
        const isHi = state.lang === 'hi';
        const topics = selectedTopics();

        if (!topics.length) {
          $('#onelinersPanel').innerHTML = `<div style="text-align:center; padding:40px; color:var(--ca-muted);">No one-liners available for this period.</div>`;
          return;
        }

        let html = `
          <div style="margin-bottom: 20px;">
            <h2 style="font-family: Outfit, sans-serif; font-size: 1.4rem; margin: 0 0 6px;">
              ${isHi ? 'मासिक त्वरित पुनरावृत्ति वन-लाइनर्स' : 'Monthly Quick Revision One-Liners'}
            </h2>
            <p style="color:var(--ca-muted); margin:0; font-size:0.9rem;">
              ${isHi ? 'परीक्षा से पहले 5 मिनट में सभी महत्वपूर्ण बिंदुओं को दोहराएं।' : 'Scan and revise core facts in 5 minutes before your examination.'}
            </p>
          </div>
          <div class="oneliner-stream">
        `;

        topics.forEach((t, idx) => {
          const hi = t.hi || {};
          const title = isHi ? (hi.title || t.title) : t.title;
          const category = isHi ? (categoryHiMap[t.category] || t.category) : t.category;
          const facts = isHi ? (hi.facts || t.facts) : t.facts;
          const remember = isHi ? (hi.remember || t.remember) : t.remember;

          html += `
            <div class="oneliner-card">
              <div class="oneliner-title">${idx + 1}. ${title}</div>
              <div class="oneliner-meta"><i class="fas fa-tag"></i> ${category} • <i class="far fa-calendar-alt"></i> ${t.date}</div>
              ${facts && facts.length ? `
                <div class="oneliner-facts">
                  ${facts.map(f => `<span class="oneliner-pill">${f}</span>`).join('')}
                </div>
              ` : ''}
              ${remember ? `
                <p class="oneliner-remember"><i class="fas fa-lightbulb" style="color:var(--ca-gold); margin-right:5px;"></i><strong>${isHi ? 'याद रखें:' : 'Remember:'}</strong> ${remember}</p>
              ` : ''}
            </div>
          `;
        });

        html += `</div>`;
        $('#onelinersPanel').innerHTML = html;
      }

      function generatePracticeQuestions() {
        const topics = selectedTopics();
        const allQuestions = [];

        topics.forEach(t => {
          const isHi = state.lang === 'hi';
          const hi = t.hi || {};
          const title = isHi ? (hi.title || t.title) : t.title;
          const facts = isHi ? (hi.facts || t.facts) : t.facts;

          if (facts && facts.length) {
            const fact = facts[0];
            allQuestions.push({
              type: 'mcq',
              q: isHi ? `हाल ही में चर्चा में रहे "${title}" के संबंध में निम्नलिखित में से कौन सा कथन सही है?` : `Regarding "${title}" recently in the news, which of the following is correct?`,
              o: [
                fact,
                isHi ? "यह केवल निजी कॉर्पोरेट क्षेत्र तक सीमित है" : "It is strictly limited to private commercial entities only",
                isHi ? "इसे 2035 के बाद पूरी तरह समाप्त कर दिया जाएगा" : "It will be completely phased out after the next decade",
                isHi ? "उपरोक्त में से कोई नहीं" : "None of the above statements are correct"
              ].sort(() => Math.random() - 0.5),
              a: fact,
              ex: `${title}: ${fact}`
            });

            allQuestions.push({
              type: 'truefalse',
              q: isHi ? `सत्य या असत्य: ${fact} — "${title}" से संबंधित है।` : `True or False: "${fact}" is directly related to "${title}".`,
              o: isHi ? ['सत्य (True)', 'असत्य (False)'] : ['True', 'False'],
              a: isHi ? 'सत्य (True)' : 'True',
              ex: `${title} → ${fact}`
            });
          }
        });

        return allQuestions;
      }

      let currentQuizType = 'mcq';
      let currentQuizIdx = 0;

      function renderPractice() {
        const isHi = state.lang === 'hi';
        const questions = generatePracticeQuestions().filter(q => q.type === currentQuizType);

        if (!questions.length) {
          $('#practicePanel').innerHTML = `
            <div class="quiz-container" style="text-align:center; padding:48px 20px;">
              <i class="fas fa-clipboard-check" style="font-size:2.5rem; color:var(--ca-muted); margin-bottom:12px;"></i>
              <h3>${isHi ? 'अभ्यास प्रश्न उपलब्ध नहीं हैं' : 'No Practice Questions Available'}</h3>
              <p style="color:var(--ca-muted);">${isHi ? 'कृपया किसी अन्य माह का चयन करें।' : 'Please select another month with available questions.'}</p>
            </div>
          `;
          return;
        }

        const qIdx = Math.max(0, Math.min(currentQuizIdx, questions.length - 1));
        const q = questions[qIdx];
        const progressPct = Math.round(((qIdx + 1) / questions.length) * 100);

        $('#practicePanel').innerHTML = `
          <div class="quiz-container">
            <div class="quiz-tabs" role="tablist">
              <button class="practice-tab" type="button" data-quiz-tab="mcq" aria-selected="${currentQuizType === 'mcq'}">Multiple Choice (MCQ)</button>
              <button class="practice-tab" type="button" data-quiz-tab="truefalse" aria-selected="${currentQuizType === 'truefalse'}">True / False</button>
            </div>

            <div class="quiz-progress-wrap">
              <div class="quiz-progress-bar"><span style="width:${progressPct}%"></span></div>
              <span class="quiz-progress-text">${qIdx + 1} / ${questions.length}</span>
            </div>

            <div class="quiz-question-stem">${q.q}</div>

            <div class="quiz-options-grid" id="quizOptions">
              ${q.o.map(opt => `
                <button class="quiz-option-btn" type="button" data-quiz-opt="${esc(opt)}" data-correct="${esc(q.a)}" data-ex="${esc(q.ex)}">
                  <span>${opt}</span>
                </button>
              `).join('')}
            </div>

            <div id="quizFeedback" class="hidden"></div>
          </div>
        `;
      }

      // Audio Text-to-Speech Engine
      let currentUtterance = null;
      let activeSpeakingBtn = null;

      function stopSpeech() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        if (activeSpeakingBtn) {
          activeSpeakingBtn.classList.remove('speaking');
          activeSpeakingBtn.querySelector('span').textContent = state.lang === 'hi' ? 'सुनें' : 'Listen';
          activeSpeakingBtn = null;
        }
      }

      function speakTopic(topicId, btn) {
        if (!('speechSynthesis' in window)) {
          showToast('Text-to-speech is not supported on this browser.');
          return;
        }

        if (activeSpeakingBtn === btn) {
          stopSpeech();
          return;
        }

        stopSpeech();

        const topic = selectedTopics().find(t => t.id === topicId);
        if (!topic) return;

        const isHi = state.lang === 'hi';
        const hi = topic.hi || {};
        const title = isHi ? (hi.title || topic.title) : topic.title;
        const facts = (isHi ? (hi.facts || topic.facts) : topic.facts).join('. ');
        const detail = isHi ? (hi.detail || topic.detail) : topic.detail;
        const textToRead = `${title}. ${facts}. ${detail}`;

        currentUtterance = new SpeechSynthesisUtterance(textToRead);
        currentUtterance.lang = isHi ? 'hi-IN' : 'en-IN';
        currentUtterance.rate = 0.95;

        btn.classList.add('speaking');
        btn.querySelector('span').textContent = isHi ? 'रुकें' : 'Stop';
        activeSpeakingBtn = btn;

        currentUtterance.onend = () => stopSpeech();
        currentUtterance.onerror = () => stopSpeech();

        window.speechSynthesis.speak(currentUtterance);
      }

      function slug(text) { return text.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') }
      function esc(text) { return String(text).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])) }

      function copyCardText(topicId) {
        const t = selectedTopics().find(item => item.id === topicId);
        if (!t) return;
        const isHi = state.lang === 'hi';
        const hi = t.hi || {};
        const title = isHi ? (hi.title || t.title) : t.title;
        const facts = isHi ? (hi.facts || t.facts) : t.facts;
        const detail = isHi ? (hi.detail || t.detail) : t.detail;
        const text = `${title} (${t.date})\n\nKey Facts:\n${facts.map(f => `• ${f}`).join('\n')}\n\n${detail}`;
        navigator.clipboard?.writeText(text).then(() => showToast('Summary copied to clipboard!'));
      }

      function copyPeriodText() {
        const topics = selectedTopics();
        const pLabel = periods().find(p => p.id === state.period)?.label || state.period;
        const text = [`SJMaths Monthly Current Affairs - ${pLabel}`, ...topics.map((t, i) => `${i + 1}. ${t.title} (${t.date})\n${t.detail}`)].join('\n\n');
        navigator.clipboard?.writeText(text).then(() => showToast('Monthly compilation copied!'));
      }

      // Event Listeners
      document.addEventListener('click', e => {
        const periodBtn = e.target.closest('[data-period]');
        if (periodBtn) {
          stopSpeech();
          state.period = periodBtn.dataset.period;
          history.replaceState(null, '', `?period=${encodeURIComponent(state.period)}`);
          renderShell();
          return;
        }

        const sectionBtn = e.target.closest('[data-section]');
        if (sectionBtn) {
          stopSpeech();
          state.section = sectionBtn.dataset.section;
          renderShell();
          return;
        }

        const fontBtn = e.target.closest('[data-font-set]');
        if (fontBtn) {
          setFont(fontBtn.dataset.fontSet);
          return;
        }

        const jumpBtn = e.target.closest('[data-jump]');
        if (jumpBtn) {
          const target = document.getElementById(jumpBtn.dataset.jump);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            document.querySelectorAll('.category-nav-item').forEach(b => b.classList.remove('active'));
            jumpBtn.classList.add('active');
          }
          return;
        }

        const speakBtn = e.target.closest('[data-speak]');
        if (speakBtn) {
          speakTopic(speakBtn.dataset.speak, speakBtn);
          return;
        }

        const bookmarkBtn = e.target.closest('[data-bookmark]');
        if (bookmarkBtn) {
          const id = bookmarkBtn.dataset.bookmark;
          if (state.bookmarks.includes(id)) {
            state.bookmarks = state.bookmarks.filter(b => b !== id);
            bookmarkBtn.classList.remove('active');
            bookmarkBtn.querySelector('i').className = 'far fa-bookmark';
            showToast('Removed from Bookmarks');
          } else {
            state.bookmarks.push(id);
            bookmarkBtn.classList.add('active');
            bookmarkBtn.querySelector('i').className = 'fas fa-bookmark';
            showToast('Saved to Bookmarks!');
          }
          save();
          return;
        }

        const copyCardBtn = e.target.closest('[data-copy-card]');
        if (copyCardBtn) {
          copyCardText(copyCardBtn.dataset.copyCard);
          return;
        }

        const quizTabBtn = e.target.closest('[data-quiz-tab]');
        if (quizTabBtn) {
          currentQuizType = quizTabBtn.dataset.quizTab;
          currentQuizIdx = 0;
          renderPractice();
          return;
        }

        const quizOptBtn = e.target.closest('[data-quiz-opt]');
        if (quizOptBtn && !quizOptBtn.disabled) {
          const isCorrect = quizOptBtn.dataset.quizOpt === quizOptBtn.dataset.correct;
          document.querySelectorAll('.quiz-option-btn').forEach(btn => {
            btn.disabled = true;
            if (btn.dataset.quizOpt === quizOptBtn.dataset.correct) {
              btn.classList.add('correct');
            }
          });

          if (!isCorrect) {
            quizOptBtn.classList.add('wrong');
          }

          const fb = $('#quizFeedback');
          fb.className = `quiz-feedback-box ${isCorrect ? 'correct' : 'wrong'}`;
          fb.innerHTML = `<strong>${isCorrect ? '✓ Correct Answer!' : '✗ Incorrect!'}</strong><br>${quizOptBtn.dataset.ex}`;
          fb.classList.remove('hidden');

          setTimeout(() => {
            currentQuizIdx++;
            renderPractice();
          }, 1800);
          return;
        }
      });

      $('#langToggle').addEventListener('click', () => {
        stopSpeech();
        state.lang = state.lang === 'hi' ? 'en' : 'hi';
        setLang();
        save();
      });

      $('#themeToggle').addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        setTheme();
        save();
      });

      $('#copyPeriod').addEventListener('click', copyPeriodText);
      $('#printPage').addEventListener('click', () => window.print());
      $('#sharePeriod').addEventListener('click', () => {
        const url = `${location.origin}${location.pathname}?period=${encodeURIComponent(state.period)}`;
        if (navigator.share) {
          navigator.share({ title: `SJMaths Current Affairs`, url });
        } else {
          navigator.clipboard?.writeText(url).then(() => showToast('Link copied to clipboard!'));
        }
      });

      $('#backTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

      // Search Handler
      const searchInput = $('#globalSearch');
      const searchResults = $('#searchResults');
      const searchClearBtn = $('#searchClearBtn');

      searchInput.addEventListener('input', e => {
        const term = e.target.value.trim().toLowerCase();
        searchClearBtn.classList.toggle('visible', term.length > 0);

        if (!term) {
          searchResults.classList.add('hidden');
          searchResults.innerHTML = '';
          return;
        }

        const hits = selectedTopics().filter(t => {
          const hi = t.hi || {};
          const fullText = `${t.title} ${hi.title || ''} ${t.category} ${t.facts.join(' ')} ${t.detail}`.toLowerCase();
          return fullText.includes(term);
        }).slice(0, 8);

        if (hits.length) {
          searchResults.innerHTML = hits.map(t => `
            <button type="button" data-search-hit="${t.id}">
              <strong>${state.lang === 'hi' && t.hi ? t.hi.title : t.title}</strong><br>
              <small>${t.category} • ${t.date}</small>
            </button>
          `).join('');
        } else {
          searchResults.innerHTML = `<div style="padding:10px 14px; color:var(--ca-muted); font-size:0.85rem;">No matching topics found</div>`;
        }
        searchResults.classList.remove('hidden');
      });

      searchResults.addEventListener('click', e => {
        const hit = e.target.closest('[data-search-hit]');
        if (hit) {
          searchResults.classList.add('hidden');
          const target = document.getElementById(hit.dataset.searchHit);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            target.style.outline = '2px solid var(--ca-primary)';
            setTimeout(() => target.style.outline = 'none', 1800);
          }
        }
      });

      searchClearBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchClearBtn.classList.remove('visible');
        searchResults.classList.add('hidden');
        searchInput.focus();
      });

      document.addEventListener('keydown', e => {
        if (e.key === '/' && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
        }
      });

      window.addEventListener('scroll', () => {
        const doc = document.documentElement;
        const scrollPct = (doc.scrollTop / (doc.scrollHeight - doc.clientHeight)) * 100;
        $('#readingBar').style.width = `${Math.min(100, Math.max(0, scrollPct))}%`;
        $('#backTop').classList.toggle('show', window.scrollY > 380);

        document.querySelectorAll('.category-section').forEach(sec => {
          const rect = sec.getBoundingClientRect();
          if (rect.top <= 140 && rect.bottom >= 140) {
            document.querySelectorAll('.category-nav-item').forEach(b => {
              b.classList.toggle('active', b.dataset.jump === sec.id);
            });
          }
        });
      }, { passive: true });

      loadWeeklyFiles().then(() => {
        setLang();
      });
    })();
  </script>
  <script type="module" src="/assets/js/require-auth.min.js?v=2c63810b"></script>
