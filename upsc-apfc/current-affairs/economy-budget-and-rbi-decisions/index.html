      February: {

          { who:"Fiscal roadmap met ahead of time", what:"Fiscal deficit FY27 BE at 4.3% of GDP (₹16.96 lakh crore) — confirming the glide path commitment of below 4.5% by FY26 achieved; FD FY26 RE retained at 4.4%." },
          { who:"Debt anchor", what:"Central government debt-to-GDP projected to decline from 56.1% (FY26 RE) to 55.6% (FY27 BE)." },
          { who:"Spending & borrowing plan", what:"Total expenditure ₹53.5 lakh crore; non-debt receipts ₹36.5 lakh crore; net dated-securities borrowings ₹11.7 lakh crore and gross borrowings ₹17.2 lakh crore." },

          { who:"New Income Tax Act, 2025", what:"Officially replaces the Income Tax Act, 1961 effective April 1, 2026; sections cut from about 800 to about 500 for simplicity." },
          { who:"Direct tax sweeteners", what:"Minimum Alternate Tax (MAT) reduced to 14% with April 2026 as the final-tax point; TCS on overseas tour packages eased to 2% without amount stipulation; revised-return window extended from Dec 31 to March 31 of the following tax year (with a nominal fee)." },
          { who:"Customs & trade facilitation", what:"Duty exemptions for 17 cancer and 7 rare-disease medicines; personal parcel import duty halved from 20% to 10%; ₹10-lakh-per-consignment courier export cap removed; fish catch by Indian vessels in the EEZ made duty-free; Customs Integrated System — one digital platform for all customs processes." },
          { who:"Biopharma SHAKTI", what:"₹10,000 crore over 5 years for healthcare innovation; 3 new plus 7 upgraded NIPERs; more than 1,000 accredited clinical-trial sites." },
          { who:"ISMs and missions", what:"India Semiconductor Mission 2.0 focused on equipment, materials and Indian IP design; Khelo India gets a 10-year sports transformation plan; SHE-Marts for rural women-led retail; Bharat-VISTAAR AI farm advisory tool." },
          { who:"Branding agri exports", what:"Cashew and cocoa targeted for global brand status by 2030." },
          { who:"Ease-of-doing-business push", what:"350+ reforms rolled out since August 2025 — GST simplification, Labour Code notifications, mandatory QCO rationalisation; foreign companies exempted on data-centre services income up to March 2047; Advance Pricing Agreements fast-tracked for IT." }
        ],
        economy: [
          { who:"Fiscal consolidation on track", what:"Fiscal deficit stood at ₹12.52 trillion — 80.4% of the annual FY26 target at end-Feb, much better than 85.8% a year ago (CGA data). US–India trade deals lifted growth expectations into the MPC." }
        ]
      },
      March: {
        rbi: [],
        budget: [],
        economy: [
          { who:"Fiscal balance tracker", what:"FY26 fiscal-deficit target of ₹15.58 trillion (4.4% of GDP) held on course; end-Feb print at 80.4% of the target (CGA / Dept. of Expenditure)." },
          { who:"New Income Tax Act notified", what:"Simplified return forms prepared ahead of the April 1, 2026 rollout of the new Act." },
          { who:"India–UK CETA", what:"Tariff-Rate Quota (TRQ) application process opened for CY 2026-27 exporters." },
          { who:"Growth tracking", what:"Q3 FY26 momentum assessed ahead of the April MPC; strong capex momentum maintained." }
        ]
      },
      April: {
        rbi: [
          { who:"MPC Meeting — Apr 8, 2026", what:"Repo rate unchanged at 5.25%; neutral stance retained. Decision unanimous." },
          { who:"GDP outlook", what:"FY27 growth projected at 6.9% (versus 7.6% for FY26), with risks tilted to the downside." },
          { who:"West Asia conflict flagged", what:"Escalating tensions seen as a potential near-term drag — supply-chain disruptions could hamper domestic growth." },
          { who:"Liquidity stance", what:"System liquidity to remain in ample surplus in FY27; OMO purchases possible to support liquidity." },
          { who:"SLR dynamics favourable", what:"Banks' SLR holdings trending lower while demand from pension funds revives." }
        ],
        budget: [],
        economy: [
          { who:"New Income Tax Act effective April 1, 2026", what:"The simplified statute replaces the 1961 Act as scheduled." },
          { who:"ISMs progress", what:"India Semiconductor Mission 2.0 implementation underway; Biopharma SHAKTI roll-out begins." },
          { who:"India–UK CETA", what:"TRQ application process live for beneficiaries under India-UK FTA provisions." }
        ]
      },
      May: {
        rbi: [],
        budget: [],
        economy: [
          { who:"FAO Agricola Medal conferred on PM Modi", what:"Honoured at the FAO in Rome (May 2026) for leadership and commitment to sustainable agriculture." },
          { who:"Biopharma SHAKTI roll-out progresses", what:"Healthcare-innovation allocations from the Budget begin flowing to clinical-trial infrastructure." },
          { who:"Services growth moderates", what:"Growth momentum sustained while new-business growth moderates; GST collections maintain monthly pace." },
          { who:"India–UK CETA", what:"Import-licensing process for Indian exporters continues under the FTA." }
        ]
      },
      June: {
        rbi: [
          { who:"MPC Meeting — June 2026", what:"Repo rate unchanged at 5.25%; neutral stance maintained." },
          { who:"Inflation watch begins", what:"CPI starting to creep up toward — and above — the 4% target in June." },
          { who:"Urban Co-operative Banks", what:"January 2026 discussion paper on UCB licensing norms to be followed up with draft guidelines." }
        ],
        budget: [],
        economy: [
          { who:"Industrial activity accelerates", what:"IIP data shows accelerating industrial activity through Q1 FY27." },
          { who:"West Asia conflict impact", what:"Oil import costs and supply chains come under pressure as the conflict escalates." },
          { who:"Resilience narrative intact", what:"Robust domestic demand, healthy corporate balance sheets and fiscal discipline keep India resilient despite the West Asia risk." }
        ]
      },
      July: {
        rbi: [],
        budget: [],
        economy: [
          { who:"Record GST collection (Jul 2026)", what:"₹2.11 lakh crore gross GST — highest ever, +15.4% YoY; import-linked GST jumped 28.8% YoY; cumulative Apr–Jul collections ₹8.43 lakh crore (+10.1%)." },
          { who:"IIP accelerates", what:"June IIP grew 7.3% YoY (May revised to 5.0%); capital goods +14.2% and electrical equipment +34.0%." },
          { who:"CPI crosses midpoint again", what:"June CPI at 4.38% — first time above the 4% target in 17 months." },
          { who:"Capital flows offset", what:"FIIs net sold ₹3,40,394 crore Jan–Jun 2026, fully offset by DIIs buying a record ₹4,50,428 crore." },
          { who:"Global backdrop normalises", what:"West Asia ceasefire dissipated pressure; strong US dollar persists on hawkish Fed view and AI-productivity gains; AI-led equity repricing keeps markets volatile." }
        ]
      },
      August: {
        rbi: [
          { who:"MPC Meeting — Aug 3–5, 2026", what:"Repo rate held at 5.25% with a neutral stance. Governor Sanjay Malhotra: the MPC is 'neither dovish nor hawkish'." },
          { who:"GDP forecast trimmed", what:"FY27 growth projection revised to 6.7% amid West Asia uncertainty." },
          { who:"Inflation watch", what:"June CPI at 4.38% crossed the 4% midpoint — tracked closely after 17 months below it." },
          { who:"Consensus check", what:"A Reuters poll had 68 of 72 economists expecting the hold." },
          { who:"Looking ahead", what:"Next MPC scheduled October 5–7, 2026; draft licensing guidelines for Urban Co-operative Banks awaited." }
        ],
        budget: [],
        economy: [
          { who:"Q1 FY27 GDP estimates released (Aug 31)", what:"The key indicator for the FY27 growth trajectory." },
          { who:"Export Promotion Mission tweak", what:"Niryat Protsahan interest subvention for pre/post-shipment credit shifts from the RBI to EXIM Bank." },
          { who:"Cross-border e-commerce exports", what:"Framework introduced under the Foreign Trade Policy; inventory-based framework operationalised under the Handbook of Procedures 2023." },
          { who:"India–UK CETA", what:"TRQ application deadline extended for CY 2026-27." },
          { who:"MSCI August review", what:"Potential changes to Indian equity weightage monitored by markets." },
          { who:"ITR deadline extended", what:"Filing deadline extended beyond July 31 for businesses and professionals." },
          { who:"Resilience call", what:"Strong domestic demand, healthy corporate balance sheets and sustained fiscal discipline keep India resilient despite West Asia risk." }
        ]
      }
    };

    /* ================= APP LOGIC ================= */
    const months = Object.keys(data);
    const catCfg = {
      rbi:     { icon:"\u{1F3E6}", label:"RBI & Monetary Policy", desc:"MPC decisions, rates & liquidity", cls:"c-violet" },
      budget:  { icon:"\u{1F4CB}", label:"Union Budget",         desc:"Budget 2026-27 & tax reforms",    cls:"c-rose" },
      economy: { icon:"\u{1F4CA}", label:"Economy & Data",        desc:"Growth, inflation & indicators",  cls:"c-blue" }
    };
    const rateRows = [
      { date:"Dec 2025", val:"5.25%", cls:"cut", note:"Cut 25 bps from 5.50% — the last cut before the pause." },
      { date:"Feb 2026", val:"5.25%", cls:"",    note:"Hold after a capex-boosting Union Budget; CPI just 1.33%, GDP surging at 8.2% in Q2 FY26." },
      { date:"Apr 2026", val:"5.25%", cls:"",    note:"Hold; FY27 growth seen at 6.9% with downside risks from West Asia conflict." },
      { date:"Jun 2026", val:"5.25%", cls:"",    note:"Hold; inflation beginning to creep up toward the 4% target." },
      { date:"Aug 2026", val:"5.25%", cls:"",    note:"Hold; 'neither dovish nor hawkish' — Governor Malhotra. Next MPC Oct 5–7." }
    ];

    let activeMonth = "January";
    let activeCat = "economy";
    let search = "";
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const $tabs = document.getElementById("monthTabs");
    const $catTabs = document.getElementById("catTabs");
    const $wrap = document.getElementById("caWrap");
    const $search = document.getElementById("searchBox");
    const $statRow = document.getElementById("statRow");
    const $progress = document.getElementById("progressFill");

    const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const catKeys = ["rbi","budget","economy"];
    const catIcons = { rbi:"\u{1F3E6}", budget:"\u{1F4CB}", economy:"\u{1F4CA}" };
    const catLabels = { rbi:"RBI", budget:"Budget", economy:"Economy" };

    const monthData = () => data[activeMonth] || {};

    /* ---- scroll progress bar ---- */
    addEventListener("scroll", () => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      $progress.style.transform = `scaleX(${max > 0 ? (h.scrollTop || document.body.scrollTop) / max : 0})`;
    }, { passive:true });

    /* ---- stats with animated counters ---- */
    function renderStats() {
      const md = monthData();
      const n = k => (md[k] || []).length;
      const items = [
        ["stat-rbi",     n("rbi"),     "RBI"],
        ["stat-budget",  n("budget"),  "Budget"],
        ["stat-economy", n("economy"), "Economy"],
        ["stat-months",  months.length, "Months"]
      ];
      $statRow.innerHTML = items.map(([cls, val, label]) =>
        `<div class="stat ${cls}"><span class="stat-num" data-target="${val}">${val}</span><span class="stat-label">${label}</span></div>`
      ).join("");
      if (!reduceMotion) {
        $statRow.querySelectorAll(".stat-num").forEach(el => {
          const target = +el.dataset.target, t0 = performance.now();
          el.textContent = "0";
          (function tick(t) {
            const p = Math.min((t - t0) / 550, 1), e = 1 - Math.pow(1 - p, 3);
            el.textContent = Math.round(target * e);
            if (p < 1) requestAnimationFrame(tick);
          })(t0);
        });
      }
    }

    /* ---- month & category tabs ---- */
    function renderTabs() {
      $tabs.innerHTML = `<span class="rail-pill" id="railPill" aria-hidden="true"></span>` +
        months.map(m =>
          `<button type="button" role="tab" class="month-btn${m === activeMonth ? " active" : ""}" data-month="${m}" aria-selected="${m === activeMonth}" tabindex="${m === activeMonth ? 0 : -1}">${m}</button>`
        ).join("");
      movePill();
    }

    function movePill() {
      const pill = document.getElementById("railPill");
      const btn = $tabs.querySelector(".month-btn.active");
      if (!pill || !btn) return;
      pill.style.width = btn.offsetWidth + "px";
      pill.style.transform = `translateX(${btn.offsetLeft - pill.offsetLeft}px)`;
      btn.scrollIntoView({ block:"nearest", inline:"nearest", behavior: reduceMotion ? "auto" : "smooth" });
    }

    function renderCatTabs() {
      const md = monthData();
      const counts = { rbi:(md.rbi||[]).length, budget:(md.budget||[]).length, economy:(md.economy||[]).length };
      $catTabs.innerHTML = `<span class="cat-pill" id="catPill" aria-hidden="true"></span>` +
        catKeys.map(k =>
          `<button type="button" role="tab" class="cat-tab${k === activeCat ? " active" : ""}" data-cat="${k}" aria-selected="${k === activeCat}" tabindex="${k === activeCat ? 0 : -1}">
            <span class="cat-icon-sm">${catIcons[k]}</span> <span>${catLabels[k]}</span>
            <span class="cat-tab-count">${counts[k]}</span>
          </button>`
        ).join("");
      moveCatPill();
    }

    function moveCatPill() {
      const pill = document.getElementById("catPill");
      const btn = $catTabs.querySelector(".cat-tab.active");
      if (!pill || !btn) return;
      pill.style.width = btn.offsetWidth + "px";
      pill.style.transform = `translateX(${btn.offsetLeft - pill.offsetLeft}px)`;
      btn.scrollIntoView({ block:"nearest", inline:"nearest", behavior: reduceMotion ? "auto" : "smooth" });
    }

    /* ---- content render ---- */
    function filt(items) {
      if (!search.trim()) return items;
      const q = search.toLowerCase();
      return items.filter(it => ["who","what"].some(k => String(it[k] ?? "").toLowerCase().includes(q)));
    }

    function rateCardHtml() {
      return `<section class="cat-card c-violet reveal" aria-label="Repo rate timeline">
        <header class="cat-head"><div class="cat-id"><span class="cat-icon" aria-hidden="true">\u{1F4C8}</span>
          <div><h2 class="cat-title">Repo Rate Timeline</h2><p class="cat-desc">MPC actions since the December 2025 cut · RBI under Governor Sanjay Malhotra</p></div></div>
          <span class="count-pill">${rateRows.length} MPC reviews</span></header>
        <div class="rate-grid">
          ${rateRows.map(r =>
            `<div class="rate-row"><span class="rate-date">${r.date}</span><span class="rate-val ${r.cls}">${r.val}</span><span class="rate-note">${esc(r.note)}</span></div>`
          ).join("")}
        </div>
        <p class="rate-foot"><strong>Policy corridor:</strong> SDF 5.00% \u00b7 MSF &amp; Bank Rate 5.50% \u00b7 Standing reverse repo 3.35% \u00b7 Inflation target 4% (\u00b12%) \u00b7 Stance: neutral.</p>
      </section>`;
    }

    function render() {
      renderTabs();
      renderCatTabs();
      renderStats();
      const md = monthData();

      let html = "";
      const items = filt(md[activeCat] || []);
      const cfg = catCfg[activeCat];
      let catHtml = "";
      if (items.length === 0) {
        catHtml = '<div class="empty-state reveal in"><strong>No matches for \u201c' + esc(search) + '\u201d</strong> in ' + activeMonth + ' ' + catLabels[activeCat] + '.<br>Try another keyword or pick a different month.</div>';
      } else {
        catHtml = '<section class="cat-card ' + cfg.cls + ' reveal">';
        catHtml += '<header class="cat-head"><div class="cat-id"><span class="cat-icon" aria-hidden="true">' + cfg.icon + '</span>';
        catHtml += '<div><h2 class="cat-title">' + cfg.label + '</h2><p class="cat-desc">' + cfg.desc + ' \u00b7 ' + activeMonth + ' 2026</p></div></div>';
        catHtml += '<span class="count-pill">' + items.length + ' ' + (items.length === 1 ? 'entry' : 'entries') + '</span></header>';
        catHtml += '<ol class="item-list">';
        catHtml += items.map((it, i) =>
          '<li class="item"><span class="idx">' + String(i + 1).padStart(2, "0") + '</span><div><p class="item-title">' + esc(it.who) + '</p><p class="item-desc">' + esc(it.what) + '</p></div></li>'
        ).join("");
        catHtml += '</ol></section>';
      }

      if (activeCat === "rbi") html += rateCardHtml();
      html += catHtml;

      html += '<aside class="ui-callout success reveal"><strong>\u{1F4CC} APFC Exam Focus \u2014 </strong>prioritise <strong>Repo 5.25% (neutral stance)</strong>, <strong>Fiscal Deficit FY27 BE 4.3%</strong> &amp; FY26 RE 4.4%, <strong>GDP FY26 7.4%</strong>, <strong>CPI June 4.38%</strong> (above 4% after 17 months), record <strong>GST of \u20B92.11 lakh crore (Jul)</strong>, <strong>forex reserves $701.4 bn</strong>, and the <strong>New Income Tax Act effective Apr 1, 2026</strong>.</aside>';

      $wrap.innerHTML = html;
      observeReveals();
    }

    /* ---- reveal-on-scroll ---- */
    function observeReveals() {
      const els = $wrap.querySelectorAll(".reveal:not(.in)");
      if (reduceMotion || !("IntersectionObserver" in window)) {
        els.forEach(el => el.classList.add("in"));
        return;
      }
      let d = 0;
      const io = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (!e.isIntersecting) return;
          e.target.style.transitionDelay = Math.min(d * 45, 240) + "ms";
          d++;
          e.target.classList.add("in");
          io.unobserve(e.target);
        });
      }, { rootMargin:"0px 0px -8% 0px" });
      els.forEach(el => io.observe(el));
    }

    /* ---- events ---- */
    $catTabs.addEventListener("click", e => {
      const btn = e.target.closest(".cat-tab");
      if (!btn || btn.classList.contains("active")) return;
      activeCat = btn.dataset.cat;
      render();
    });

    $tabs.addEventListener("click", e => {
      const btn = e.target.closest("[data-month]");
      if (!btn || btn.dataset.month === activeMonth) return;
      activeMonth = btn.dataset.month;
      activeCat = "economy";
      search = "";
      $search.value = "";
      render();
      window.scrollTo({ top:0, behavior: reduceMotion ? "auto" : "smooth" });
      $progress.style.transform = "scaleX(0)";
    });

    let searchTimer;
    $search.addEventListener("input", e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { search = e.target.value; render(); }, 120);
    });

    addEventListener("resize", () => { movePill(); moveCatPill(); }, { passive:true });
    addEventListener("load", () => { setTimeout(movePill, 60); setTimeout(moveCatPill, 60); });

    render();
  </script></body></html>
