    /* ================= PREMIUM APP LOGIC ================= */
    const months = Object.keys(data);
    const catCfg = {
      awards:  { icon:"\u{1F3C6}", label:"Awards & Honours",  desc:"National & international honours", cls:"c-amber" },
      sports:  { icon:"\u26BD",    label:"Sports",            desc:"Tournaments, titles & records",   cls:"c-blue" },
      persons: { icon:"\u{1F464}", label:"Persons in News",   desc:"Appointments & firsts",           cls:"c-emerald" },

    };

    let activeMonth = "January";
    let search = "";
    let lastAnswer = null;
    const quizState = {};

            const $tabs = document.getElementById("monthTabs");
    const $catTabs = document.getElementById("catTabs");
    const $wrap = document.getElementById("caWrap");
    const $search = document.getElementById("searchBox");
    const $statRow = document.getElementById("statRow");
    const $progress = document.getElementById("progressFill");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const catKeys = ["awards","sports","persons","quiz"];
    const catIcons = { awards:"🏆", sports:"⚽", persons:"👤", quiz:"📝" };
    const catLabels = { awards:"Awards", sports:"Sports", persons:"Persons", quiz:"Quiz" };

    let activeCat = "awards"; /* current in-month tab */


    const monthData = () => data[activeMonth] || {};
    const quizOf = m => QUIZZES[m] || [];

    /* ---- scroll progress bar ---- */
    addEventListener("scroll", () => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      $progress.style.transform = `scaleX(${max > 0 ? (h.scrollTop || document.body.scrollTop) / max : 0})`;
    }, { passive:true });

    /* ---- stats with animated counters ---- */
    function renderStats() {
      const md = monthData();
      const n = k => (md[k] || []).length;
      const items = [
        ["stat-awards",  n("awards"),  "Awards"],
        ["stat-sports",  n("sports"),  "Sports"],
        ["stat-persons", n("persons"), "Persons"],
        ["stat-quiz",    quizOf(activeMonth).length, "Quiz Qs"]
      ];
      $statRow.innerHTML = items.map(([cls, val, label]) =>
        `<div class="stat ${cls}"><span class="stat-num" data-target="${val}">${val}</span><span class="stat-label">${label}</span></div>`
      ).join("");
      if (!reduceMotion) {
        $statRow.querySelectorAll(".stat-num").forEach(el => {
          const target = +el.dataset.target, t0 = performance.now();
          el.textContent = "0";
          (function tick(t) {
            const p = Math.min((t - t0) / 550, 1), e = 1 - Math.pow(1 - p, 3);
            el.textContent = Math.round(target * e);
            if (p < 1) requestAnimationFrame(tick);
          })(t0);
        });
      }
    }

    /* ---- month rail with sliding pill ---- */
    function renderTabs() {
      $tabs.innerHTML = `<span class="rail-pill" id="railPill" aria-hidden="true"></span>` +
        months.map(m =>
          `<button type="button" class="month-btn${m === activeMonth ? " active" : ""}" role="tab" aria-selected="${m === activeMonth}" data-month="${m}">${m}</button>`
        ).join("");
      movePill();
    }

        function movePill() {
      const pill = document.getElementById("railPill");
      const btn = $tabs.querySelector(".month-btn.active");
      if (!pill || !btn) return;
      pill.style.width = btn.offsetWidth + "px";
      pill.style.transform = `translateX(${btn.offsetLeft - pill.offsetLeft}px)`;
      btn.scrollIntoView({ block:"nearest", inline:"nearest", behavior: reduceMotion ? "auto" : "smooth" });
    }

    /* ---- in-month category tabs with sliding pill ---- */
    function renderCatTabs() {
      const md = monthData();
      const counts = {
        awards:  (md.awards  || []).length,
        sports:  (md.sports  || []).length,
        persons: (md.persons || []).length,
        quiz:    quizOf(activeMonth).length
      };
      $catTabs.innerHTML = `<span class="cat-pill" id="catPill" aria-hidden="true"></span>` +
        catKeys.map(k =>
          `<button type="button" class="cat-tab${k === activeCat ? " active" : ""}"
            data-cat="${k}" aria-selected="${k === activeCat}" tabindex="${k === activeCat ? 0 : -1}">
            <span class="cat-icon">${catIcons[k]}</span> <span>${catLabels[k]}</span>
            <span class="cat-tab-count">${counts[k]}</span>
          </button>`
        ).join("");
      moveCatPill();
    }

    function moveCatPill() {
      const pill = document.getElementById("catPill");
      const btn = $catTabs.querySelector(".cat-tab.active");
      if (!pill || !btn) return;
      pill.style.width = btn.offsetWidth + "px";
      pill.style.transform = `translateX(${btn.offsetLeft - pill.offsetLeft}px)`;
      btn.scrollIntoView({ block:"nearest", inline:"nearest", behavior: reduceMotion ? "auto" : "smooth" });
    }

    /* ---- content render ---- */
    function filt(items) {
      if (!search.trim()) return items;
      const q = search.toLowerCase();
      return items.filter(it => ["who","what","event","detail"].some(k => String(it[k] ?? "").toLowerCase().includes(q)));
    }

    function render() {
      renderTabs();
      renderCatTabs();
      renderStats();
      const md = monthData();

      let html = "";

      if (activeCat === "quiz") {
        html += quizSectionHtml();
      } else {
        const items = filt(md[activeCat] || []);
        const cfg = catCfg[activeCat];
        if (items.length === 0) {
          html += '<div class="empty-state reveal in"><strong>No matches for \u201c' + esc(search) + '\u201d</strong> in ' + activeMonth + ' ' + catLabels[activeCat] + '.<br>Try another keyword or pick a different month.</div>';
        } else {
          html += '<section class="cat-card ' + cfg.cls + ' reveal">';
          html += '<header class="cat-head"><div class="cat-id"><span class="cat-icon" aria-hidden="true">' + cfg.icon + '</span>';
          html += '<div><h2 class="cat-title">' + cfg.label + '</h2><p class="cat-desc">' + cfg.desc + ' \u00b7 ' + activeMonth + ' 2026</p></div></div>';
          html += '<span class="count-pill">' + items.length + ' ' + (items.length === 1 ? 'entry' : 'entries') + '</span></header>';
          html += '<ol class="item-list">';
          html += items.map((it, i) =>
            '<li class="item"><span class="idx">' + String(i + 1).padStart(2, '0') + '</span><div><p class="item-title">' + esc(it.who || it.event) + '</p><p class="item-desc">' + esc(it.what || it.desc || it.detail) + '</p></div></li>'
          ).join('');
          html += '</ol></section>';
        }
      }

      html += '<aside class="ui-callout success reveal"><strong>\u{1F4CC} APFC Exam Focus \u2014 </strong>prioritise <strong>National Sports Awards</strong> (Khel Ratna, Arjuna, Dronacharya), <strong>Padma Awards 2026</strong>, <strong>Gallantry Awards</strong> (Ashoka Chakra), <strong>Jnanpith / Sahitya Akademi / Grammy / Oscar winners</strong>, <strong>CWG 2026 India medal highlights</strong>, the <strong>FIFA World Cup 2026 winner</strong>, and <strong>first-time achievements</strong> by Indian athletes.</aside>';

      $wrap.innerHTML = html;
      observeReveals();
      animateLastAnswer();
      moveCatPill();
    }

    /* ---- quiz ---- */
    function quizSectionHtml() {
      const qs = quizOf(activeMonth);
      if (!qs.length) return "";
      if (!quizState[activeMonth]) quizState[activeMonth] = Array(qs.length).fill(null);
      const st = quizState[activeMonth];
      let answered = 0, correct = 0;

      let segs = "";
      qs.forEach((q, qi) => {
        const p = st[qi];
        let segClass = "q-seg";
        if (p !== null) { answered++; segClass += " done " + (p === q.a ? "ok" : "no"); }
        segs += `<span class="${segClass}"><i></i></span>`;
      });

      let body = "";
      qs.forEach((q, qi) => {
        const picked = st[qi];
        if (picked !== null && picked === q.a) correct++;
        body += `<div class="q-block">
          <p class="q-text"><span class="q-no">${qi + 1}</span>${esc(q.q)}</p>` +
          q.o.map((opt, oi) => {
            let cls = "q-opt";
            if (picked !== null) {
              if (oi === q.a) cls += " correct";
              else if (oi === picked) cls += " wrong";
            }
            return `<button type="button" class="${cls}" data-q="${qi}" data-o="${oi}"${picked !== null ? " disabled" : ""}><span class="q-letter">${"ABCD"[oi]}</span><span>${esc(opt)}</span></button>`;
          }).join("") +
          (picked !== null
            ? `<div class="q-expl"><strong>${picked === q.a ? "\u2714 Correct." : "\u2718 Answer: " + "ABCD"[q.a] + " — " + esc(q.o[q.a])}</strong> ${esc(q.ex)}</div>`
            : "") + `</div>`;
      });

      const done = answered === qs.length;
      let result = "";
      if (done) {
        const pct = Math.round(correct / qs.length * 100);
        const C = 2 * Math.PI * 52;
        const msg = pct >= 80 ? "Outstanding — you're exam-ready on this month."
                  : pct >= 60 ? "Good grip. Revise the explanations you missed."
                  : "Worth one more pass through this month's notes.";
        result = `<div class="quiz-result" id="quizResult">
          <div class="score-ring" role="img" aria-label="Score ${correct} out of ${qs.length}, ${pct} percent">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#34d399"/>
              </linearGradient></defs>
              <circle class="ring-bg" cx="60" cy="60" r="52"/>
              <circle class="ring-fill" cx="60" cy="60" r="52" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" data-offset="${(C * (1 - pct / 100)).toFixed(1)}"/>
            </svg>
            <span class="ring-label">${pct}%</span>
          </div>
          <p class="result-title">${correct}/${qs.length} correct</p>
          <p class="result-msg">${msg}</p>
          <button type="button" id="retakeBtn" class="retake-btn">Retake Quiz</button>
        </div>`;
      }

      return `<section class="quiz-card reveal" aria-label="${activeMonth} quiz">
        <header class="quiz-head">
          <div class="quiz-title-wrap"><span class="quiz-icon" aria-hidden="true">\u{1F9E0}</span>
            <div><h2 class="cat-title" style="margin:0">${activeMonth} Quiz</h2><p class="cat-desc">APFC pattern · instant feedback</p></div>
          </div>
          <span class="count-pill" style="--cat-accent:#6d28d9;--cat-icon-bg:rgba(139,92,246,.12);--cat-line:rgba(124,58,237,.24)">${answered}/${qs.length} answered</span>
        </header>
        <div class="q-progress" aria-hidden="true">${segs}</div>
        <div class="quiz-body">${body}${result}</div>
      </section>`;
    }

    /* ---- reveal-on-scroll + answer micro-animations ---- */
    function observeReveals() {
      const els = $wrap.querySelectorAll(".reveal:not(.in)");
      if (reduceMotion || !("IntersectionObserver" in window)) {
        els.forEach(el => el.classList.add("in"));
        return;
      }
      let d = 0;
      const io = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (!e.isIntersecting) return;
          e.target.style.transitionDelay = Math.min(d * 45, 240) + "ms";
          d++;
          e.target.classList.add("in");
          io.unobserve(e.target);
        });
      }, { rootMargin:"0px 0px -8% 0px" });
      els.forEach(el => io.observe(el));
    }

    function animateLastAnswer() {
      if (!lastAnswer) return;
      const opt = $wrap.querySelector(`.q-opt[data-q="${lastAnswer.qi}"][data-o="${lastAnswer.oi}"]`);
      if (opt && !reduceMotion) opt.classList.add("opt-pop");
      lastAnswer = null;
    }

    function animateRing() {
      const fill = $wrap.querySelector(".ring-fill");
      if (!fill) return;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        fill.style.strokeDashoffset = fill.dataset.offset;
      }));
    }

    /* ---- events ---- */
    $catTabs.addEventListener("click", e => {
      const btn = e.target.closest(".cat-tab");
      if (!btn || btn.classList.contains("active")) return;
      activeCat = btn.dataset.cat;
      render();
      moveCatPill();
    });

    $tabs.addEventListener("click", e => {
      const btn = e.target.closest("[data-month]");
      if (!btn || btn.dataset.month === activeMonth) return;
      activeMonth = btn.dataset.month;
      activeCat = "awards";
      search = "";
      $search.value = "";
      render();
      window.scrollTo({ top:0, behavior: reduceMotion ? "auto" : "smooth" });
      $progress.style.transform = "scaleX(0)";
    });

    let searchTimer;
    $search.addEventListener("input", e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { search = e.target.value; render(); }, 120);
    });

    $wrap.addEventListener("click", e => {
      const opt = e.target.closest(".q-opt:not(:disabled)");
      if (opt) {
        const qi = +opt.dataset.q, oi = +opt.dataset.o;
        quizState[activeMonth][qi] = oi;
        lastAnswer = { qi, oi };
        render();
        animateRing();
        return;
      }
      if (e.target.closest("#retakeBtn")) {
        quizState[activeMonth] = null;
        render();
        const first = $wrap.querySelector(".quiz-card");
        if (first) first.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block:"nearest" });
      }
    });

    addEventListener("resize", () => { movePill(); moveCatPill(); }, { passive:true });
    addEventListener("load", () => { setTimeout(movePill, 60); setTimeout(moveCatPill, 60); });

    render();
    animateRing();
  </script></body></html>
