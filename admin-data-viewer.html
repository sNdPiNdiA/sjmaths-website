<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Viewer — SJMaths Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="preload" as="style" href="/assets/vendor/fontawesome/css/all.min.css?v=7441465c"
        onload="this.onload=null;this.rel='stylesheet'" crossorigin="anonymous">
    <noscript><link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css?v=7441465c"></noscript>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a; --border: #2e3348;
            --primary: #6c63ff; --primary-light: #8b85ff; --accent: #00d2ff;
            --success: #22c55e; --warning: #f59e0b; --danger: #ef4444;
            --text: #e2e8f0; --text-muted: #8892a4; --radius: 12px;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(12px); }
        .header-brand { display: flex; align-items: center; gap: 0.75rem; font-size: 1.15rem; font-weight: 700; color: var(--text); text-decoration: none; }
        .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1rem; color: white; }
        .header-right { display: flex; align-items: center; gap: 1rem; }
        .user-chip { display: flex; align-items: center; gap: 0.5rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 0.35rem 0.9rem; font-size: 0.85rem; color: var(--text-muted); }
        .user-chip i { color: var(--primary-light); }
        .page-container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .page-title { font-size: 1.75rem; font-weight: 800; margin-bottom: 0.25rem; background: linear-gradient(135deg, var(--primary-light), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .page-subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-pill { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; display: flex; align-items: center; gap: 0.9rem; transition: border-color 0.2s; }
        .stat-pill:hover { border-color: var(--primary); }
        .stat-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1rem; }
        .stat-icon.purple { background: rgba(108,99,255,0.15); color: var(--primary-light); }
        .stat-icon.cyan   { background: rgba(0,210,255,0.12);  color: var(--accent); }
        .stat-icon.green  { background: rgba(34,197,94,0.15);  color: var(--success); }
        .stat-icon.amber  { background: rgba(245,158,11,0.15); color: var(--warning); }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--text); line-height: 1.2; }
        .tabs-bar { display: flex; gap: 0.5rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.35rem; margin-bottom: 1.5rem; overflow-x: auto; scrollbar-width: none; }
        .tabs-bar::-webkit-scrollbar { display: none; }
        .tab-btn { flex-shrink: 0; background: none; border: none; color: var(--text-muted); font-family: inherit; font-size: 0.875rem; font-weight: 500; padding: 0.55rem 1.1rem; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; transition: all 0.2s; }
        .tab-btn:hover { background: var(--surface2); color: var(--text); }
        .tab-btn.active { background: linear-gradient(135deg, var(--primary), #9d96ff); color: white; font-weight: 600; }
        .tab-count { background: rgba(255,255,255,0.2); border-radius: 10px; padding: 1px 7px; font-size: 0.75rem; }
        .tab-btn:not(.active) .tab-count { background: var(--surface2); color: var(--text-muted); }
        .filter-bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1.25rem; display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
        .filter-group { display: flex; align-items: center; gap: 0.5rem; }
        .filter-label { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; }
        .filter-input, .filter-select { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 0.875rem; padding: 0.45rem 0.75rem; transition: border-color 0.2s; outline: none; }
        .filter-input:focus, .filter-select:focus { border-color: var(--primary); }
        .filter-input[type="date"] { min-width: 145px; color-scheme: dark; }
        .filter-input[type="text"]  { min-width: 200px; }
        .filter-select { min-width: 140px; }
        .filter-actions { margin-left: auto; display: flex; gap: 0.5rem; }
        .btn { border: none; border-radius: 8px; font-family: inherit; font-size: 0.85rem; font-weight: 600; padding: 0.45rem 1rem; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); transform: translateY(-1px); }
        .btn-ghost { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
        .btn-ghost:hover { color: var(--text); border-color: var(--primary); }
        .btn-success { background: var(--success); color: white; }
        .table-wrapper { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
        .table-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 0.75rem; }
        .table-title { font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 0.5rem; }
        .result-count { font-size: 0.8rem; color: var(--text-muted); background: var(--surface2); border-radius: 20px; padding: 2px 10px; }
        .table-scroll { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        thead th { background: var(--surface2); color: var(--text-muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.75rem 1.25rem; text-align: left; white-space: nowrap; cursor: pointer; user-select: none; border-bottom: 1px solid var(--border); }
        thead th:hover { color: var(--text); background: rgba(108,99,255,0.1); }
        thead th.sort-asc::after  { content: ' \2191'; color: var(--primary-light); }
        thead th.sort-desc::after { content: ' \2193'; color: var(--primary-light); }
        thead th.active-sort { color: var(--primary-light); }
        tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: rgba(108,99,255,0.05); }
        td { padding: 0.85rem 1.25rem; vertical-align: top; max-width: 300px; }
        .td-date .date-part { display: block; color: var(--text); font-size: 0.88rem; font-weight: 600; }
        .td-date .time-part { display: block; color: var(--accent); font-size: 0.78rem; }
        .td-id    { font-family: monospace; font-size: 0.78rem; color: var(--text-muted); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .td-token { font-family: monospace; font-size: 0.72rem; color: var(--text-muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: help; }
        .td-agent { font-size: 0.8rem; color: var(--text-muted); max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .device-badge { display: inline-flex; align-items: center; gap: 0.3rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; font-size: 0.75rem; font-weight: 500; }
        .device-badge.mobile  { color: var(--success); border-color: rgba(34,197,94,0.3); }
        .device-badge.desktop { color: var(--accent);  border-color: rgba(0,210,255,0.3); }
        .device-badge.tablet  { color: var(--warning); border-color: rgba(245,158,11,0.3); }
        .loading-row td { text-align: center; padding: 4rem; color: var(--text-muted); }
        .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 0.75rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-muted); }
        .empty-state i { font-size: 2.5rem; margin-bottom: 1rem; opacity: 0.4; display: block; }
        .timeline { display: flex; flex-direction: column; gap: 1.5rem; }
        .timeline-group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
        .timeline-date-header { background: var(--surface2); padding: 0.75rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .timeline-date { font-weight: 700; font-size: 0.9rem; color: var(--primary-light); display: flex; align-items: center; gap: 0.5rem; }
        .timeline-badge { background: rgba(108,99,255,0.2); color: var(--primary-light); border-radius: 12px; padding: 1px 9px; font-size: 0.75rem; }
        .pagination { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-top: 1px solid var(--border); flex-wrap: wrap; gap: 0.75rem; }
        .pagination-info { font-size: 0.8rem; color: var(--text-muted); }
        .pagination-btns { display: flex; gap: 0.5rem; }
        .pg-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.8rem; padding: 0.35rem 0.75rem; cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .pg-btn:hover { border-color: var(--primary); color: var(--primary-light); }
        .pg-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .pg-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .view-toggle { display: flex; gap: 0.25rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
        .view-btn { background: none; border: none; color: var(--text-muted); font-size: 0.85rem; padding: 0.3rem 0.65rem; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .view-btn.active { background: var(--primary); color: white; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: min(620px, 95vw); max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: modalIn 0.25s ease; }
        @keyframes modalIn { from { opacity:0; transform: scale(0.95) translateY(10px); } to { opacity:1; transform: none; } }
        .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); }
        .modal-header h3 { font-size: 1rem; font-weight: 700; }
        .modal-close { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; padding: 4px; border-radius: 6px; }
        .modal-close:hover { color: var(--danger); }
        .modal-body { padding: 1.5rem; overflow-y: auto; flex: 1; }
        .detail-grid { display: flex; flex-direction: column; gap: 1rem; }
        .detail-row { display: grid; grid-template-columns: 140px 1fr; gap: 0.75rem; align-items: start; }
        .detail-key { font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; padding-top: 2px; }
        .detail-val { font-size: 0.875rem; color: var(--text); word-break: break-all; }
        .detail-val.code { font-family: monospace; font-size: 0.78rem; background: var(--surface2); padding: 6px 10px; border-radius: 8px; white-space: pre-wrap; }
        @media (max-width: 768px) { .page-container { padding: 1rem; } .filter-bar { flex-direction: column; align-items: stretch; } .filter-actions { margin-left: 0; justify-content: flex-end; } .stats-row { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>

<header class="header">
    <a href="/dashboard.html" class="header-brand">
        <div class="logo-icon"><i class="fas fa-database"></i></div>
        SJMaths &middot; Data Viewer
    </a>
    <div class="header-right">
        <div class="user-chip"><i class="fas fa-user-shield"></i>&nbsp;<span id="adminName">Admin</span></div>
        <a href="/dashboard.html" class="btn btn-ghost" style="text-decoration:none;"><i class="fas fa-arrow-left"></i>&nbsp;Dashboard</a>
    </div>
</header>

<main class="page-container">
    <h1 class="page-title">Firestore Data Viewer</h1>
    <p class="page-subtitle">Browse all Firestore collections — sorted and filtered by date</p>

    <div class="stats-row">
        <div class="stat-pill"><div class="stat-icon purple"><i class="fas fa-bell"></i></div><div><div class="stat-label">FCM Tokens</div><div class="stat-value" id="stat-fcmTokens">—</div></div></div>
        <div class="stat-pill"><div class="stat-icon cyan"><i class="fas fa-eye"></i></div><div><div class="stat-label">Page Views</div><div class="stat-value" id="stat-page_views">—</div></div></div>
        <div class="stat-pill"><div class="stat-icon amber"><i class="fas fa-mouse-pointer"></i></div><div><div class="stat-label">User Actions</div><div class="stat-value" id="stat-user_actions">—</div></div></div>
        <div class="stat-pill"><div class="stat-icon green"><i class="fas fa-users"></i></div><div><div class="stat-label">Users</div><div class="stat-value" id="stat-users">—</div></div></div>
    </div>

    <div class="tabs-bar" role="tablist">
        <button class="tab-btn active" data-col="fcmTokens" role="tab"><i class="fas fa-bell"></i>&nbsp;FCM Tokens&nbsp;<span class="tab-count" id="tc-fcmTokens">0</span></button>
        <button class="tab-btn" data-col="page_views" role="tab"><i class="fas fa-eye"></i>&nbsp;Page Views&nbsp;<span class="tab-count" id="tc-page_views">0</span></button>
        <button class="tab-btn" data-col="user_actions" role="tab"><i class="fas fa-mouse-pointer"></i>&nbsp;User Actions&nbsp;<span class="tab-count" id="tc-user_actions">0</span></button>
        <button class="tab-btn" data-col="users" role="tab"><i class="fas fa-users"></i>&nbsp;Users&nbsp;<span class="tab-count" id="tc-users">0</span></button>
    </div>

    <div class="filter-bar">
        <div class="filter-group"><label class="filter-label"><i class="fas fa-calendar-alt"></i>&nbsp;From</label><input type="date" id="filterFrom" class="filter-input"></div>
        <div class="filter-group"><label class="filter-label">To</label><input type="date" id="filterTo" class="filter-input"></div>
        <div class="filter-group"><label class="filter-label"><i class="fas fa-search"></i>&nbsp;Search</label><input type="text" id="filterSearch" class="filter-input" placeholder="Filter by any field..."></div>
        <div class="filter-group">
            <label class="filter-label">Limit</label>
            <select id="filterLimit" class="filter-select">
                <option value="50">50 rows</option>
                <option value="100">100 rows</option>
                <option value="200">200 rows</option>
                <option value="500">500 rows</option>
            </select>
        </div>
        <div class="filter-actions">
            <button class="btn btn-ghost" id="resetFiltersBtn"><i class="fas fa-times"></i>&nbsp;Reset</button>
            <button class="btn btn-primary" id="applyFiltersBtn"><i class="fas fa-filter"></i>&nbsp;Apply</button>
            <button class="btn btn-success" id="exportCsvBtn"><i class="fas fa-download"></i>&nbsp;CSV</button>
        </div>
    </div>

    <div class="table-wrapper">
        <div class="table-header">
            <div class="table-title">
                <i class="fas fa-table" style="color:var(--primary-light);"></i>
                <span id="tableCollectionLabel">fcmTokens</span>
                <span class="result-count" id="resultCount">0 records</span>
            </div>
            <div style="display:flex;gap:0.75rem;align-items:center;">
                <div class="view-toggle">
                    <button class="view-btn active" id="viewTable" title="Table view"><i class="fas fa-table"></i></button>
                    <button class="view-btn" id="viewTimeline" title="Grouped by date"><i class="fas fa-stream"></i></button>
                </div>
                <button class="btn btn-ghost" id="refreshBtn"><i class="fas fa-sync-alt"></i>&nbsp;Refresh</button>
            </div>
        </div>
        <div id="tableView" class="table-scroll">
            <table><thead id="tableHead"></thead><tbody id="tableBody">
                <tr class="loading-row"><td colspan="10"><div class="spinner"></div>Loading...</td></tr>
            </tbody></table>
        </div>
        <div id="timelineView" style="display:none;padding:1.25rem;">
            <div class="timeline" id="timelineContent"></div>
        </div>
        <div class="pagination" id="paginationBar" style="display:none;">
            <div class="pagination-info" id="paginationInfo"></div>
            <div class="pagination-btns" id="paginationBtns"></div>
        </div>
    </div>
</main>

<div class="modal-overlay" id="detailModal">
    <div class="modal">
        <div class="modal-header">
            <h3><i class="fas fa-info-circle" style="color:var(--primary-light);margin-right:6px;"></i>Document Detail</h3>
            <button class="modal-close" id="closeModal"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body"><div class="detail-grid" id="detailContent"></div></div>
    </div>
</div>

<script type="module">
import { auth, db } from '/assets/js/firebase-config.min.js?v=d5efb85e';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";
import { collection, getDocs, query, orderBy, limit as fsLimit, Timestamp }
    from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";

const COLLECTIONS = {
    fcmTokens: {
        dateField: 'createdAt',
        columns: [
            { key: '_date',     label: 'Date / Time', type: 'date'  },
            { key: 'uid',       label: 'UID',         type: 'id'    },
            { key: 'token',     label: 'Token',       type: 'token' },
            { key: 'userAgent', label: 'User Agent',  type: 'agent' },
            { key: '_id',       label: 'Doc ID',      type: 'id'    }
        ]
    },
    page_views: {
        dateField: 'timestamp',
        columns: [
            { key: '_date',     label: 'Date / Time', type: 'date'   },
            { key: 'page',      label: 'Page',        type: 'text'   },
            { key: 'uid',       label: 'UID',         type: 'id'     },
            { key: 'sessionId', label: 'Session',     type: 'id'     },
            { key: 'device',    label: 'Device',      type: 'device' },
            { key: '_id',       label: 'Doc ID',      type: 'id'     }
        ]
    },
    user_actions: {
        dateField: 'timestamp',
        columns: [
            { key: '_date',  label: 'Date / Time', type: 'date' },
            { key: 'action', label: 'Action',      type: 'text' },
            { key: 'uid',    label: 'UID',         type: 'id'   },
            { key: 'detail', label: 'Detail',      type: 'text' },
            { key: '_id',    label: 'Doc ID',      type: 'id'   }
        ]
    },
    users: {
        dateField: 'createdAt',
        columns: [
            { key: '_date',       label: 'Joined', type: 'date' },
            { key: 'displayName', label: 'Name',   type: 'text' },
            { key: 'email',       label: 'Email',  type: 'text' },
            { key: 'streak',      label: 'Streak', type: 'text' },
            { key: 'points',      label: 'Points', type: 'text' },
            { key: '_id',         label: 'UID',    type: 'id'   }
        ]
    }
};

let currentCollection = 'fcmTokens';
let allRows = [], filteredRows = [];
let sortCol = '_date', sortDir = 'desc';
let currentPage = 1;
const PAGE_SIZE = 25;
let viewMode = 'table';

onAuthStateChanged(auth, user => {
    if (!user) { window.location.href = '/login.html'; return; }
    document.getElementById('adminName').textContent =
        user.displayName ? user.displayName.split(' ')[0] : (user.email ? user.email.split('@')[0] : 'Admin');
    setDefaultDates();
    loadCollection(currentCollection);
    prefetchCounts();
});

function setDefaultDates() {
    const today = new Date();
    const from  = new Date(); from.setDate(today.getDate() - 30);
    document.getElementById('filterTo').value   = today.toISOString().slice(0,10);
    document.getElementById('filterFrom').value = from.toISOString().slice(0,10);
}

function normaliseDate(raw) {
    if (!raw) return null;
    if (raw instanceof Timestamp) return raw.toDate();
    if (raw && raw.seconds)       return new Date(raw.seconds * 1000);
    if (typeof raw === 'string')  return new Date(raw);
    if (raw instanceof Date)      return raw;
    return null;
}

async function prefetchCounts() {
    for (const col of Object.keys(COLLECTIONS)) {
        try {
            const snap = await getDocs(query(collection(db, col), fsLimit(500)));
            const txt  = snap.size >= 500 ? '500+' : String(snap.size);
            const se = document.getElementById('stat-' + col);
            const te = document.getElementById('tc-'   + col);
            if (se) se.textContent = txt;
            if (te) te.textContent = txt;
        } catch (e) { /* collection may not exist */ }
    }
}

async function loadCollection(col) {
    showLoading();
    document.getElementById('tableCollectionLabel').textContent = col;
    const cfg      = COLLECTIONS[col];
    const limitVal = parseInt(document.getElementById('filterLimit').value) || 50;
    try {
        const q    = query(collection(db, col), orderBy(cfg.dateField, 'desc'), fsLimit(limitVal));
        const snap = await getDocs(q);
        allRows = snap.docs.map(d => {
            const data   = d.data();
            const jsDate = normaliseDate(data[cfg.dateField]);
            return { ...data, _id: d.id, _date: jsDate, _raw: data };
        });
        applyFilters();
    } catch (err) {
        showError(err.message);
    }
}

function applyFilters() {
    const fromVal  = document.getElementById('filterFrom').value;
    const toVal    = document.getElementById('filterTo').value;
    const search   = document.getElementById('filterSearch').value.toLowerCase().trim();
    const fromDate = fromVal ? new Date(fromVal + 'T00:00:00') : null;
    const toDate   = toVal   ? new Date(toVal   + 'T23:59:59') : null;

    filteredRows = allRows.filter(row => {
        if (fromDate && row._date && row._date < fromDate) return false;
        if (toDate   && row._date && row._date > toDate)   return false;
        if (search) { const h = JSON.stringify(row._raw).toLowerCase(); if (!h.includes(search)) return false; }
        return true;
    });

    filteredRows.sort((a, b) => {
        const va = a[sortCol], vb = b[sortCol];
        if (va == null) return 1; if (vb == null) return -1;
        if (va < vb) return sortDir === 'asc' ? -1 : 1;
        if (va > vb) return sortDir === 'asc' ?  1 : -1;
        return 0;
    });

    currentPage = 1;
    document.getElementById('resultCount').textContent = filteredRows.length + ' records';
    render();
}

function render() { if (viewMode === 'table') renderTable(); else renderTimeline(); }

function renderCell(col, row) {
    const val = row[col.key];
    switch (col.type) {
        case 'date': {
            if (!val) return '<td class="td-date">—</td>';
            const d  = val instanceof Date ? val : new Date(val);
            const dp = d.toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
            const tp = d.toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:true });
            return '<td class="td-date"><span class="date-part">' + dp + '</span><span class="time-part">' + tp + '</span></td>';
        }
        case 'id':    return '<td class="td-id"    title="' + esc(val) + '">' + (esc(val)||'—') + '</td>';
        case 'token': return '<td class="td-token" title="' + esc(val) + '">' + (esc(val)||'—') + '</td>';
        case 'agent': return '<td class="td-agent" title="' + esc(val) + '">' + (esc(val)||'—') + '</td>';
        case 'device': {
            const v   = (val||'').toLowerCase();
            const cls = v.includes('mobile')||v.includes('android')||v.includes('iphone') ? 'mobile' : v.includes('tablet')||v.includes('ipad') ? 'tablet' : 'desktop';
            const ico = cls==='mobile' ? 'fa-mobile-alt' : cls==='tablet' ? 'fa-tablet-alt' : 'fa-desktop';
            return '<td><span class="device-badge '+cls+'"><i class="fas '+ico+'"></i>&nbsp;'+(esc(val)||'—')+'</span></td>';
        }
        default: return '<td>' + esc(String(val??'—')) + '</td>';
    }
}

function renderTable() {
    document.getElementById('tableView').style.display    = '';
    document.getElementById('timelineView').style.display = 'none';
    const cfg   = COLLECTIONS[currentCollection];
    const thead = document.getElementById('tableHead');
    const tbody = document.getElementById('tableBody');

    thead.innerHTML = '<tr>' + cfg.columns.map(c => {
        const active = c.key===sortCol ? ' active-sort' : '';
        const dir    = c.key===sortCol ? (sortDir==='asc' ? ' sort-asc' : ' sort-desc') : '';
        return '<th class="'+active+dir+'" data-key="'+c.key+'">'+c.label+'</th>';
    }).join('') + '<th>Detail</th></tr>';

    const start    = (currentPage-1)*PAGE_SIZE;
    const pageRows = filteredRows.slice(start, start+PAGE_SIZE);

    if (!pageRows.length) {
        tbody.innerHTML = '<tr><td colspan="'+(cfg.columns.length+1)+'"><div class="empty-state"><i class="fas fa-inbox"></i>No records match your filters.</div></td></tr>';
        document.getElementById('paginationBar').style.display = 'none';
        return;
    }

    tbody.innerHTML = pageRows.map(row => {
        const cells = cfg.columns.map(c => renderCell(c, row)).join('');
        const rj    = encodeURIComponent(JSON.stringify(row._raw));
        return '<tr>'+cells+'<td><button class="btn btn-ghost detail-btn" style="padding:3px 10px;font-size:0.78rem;" data-row="'+rj+'"><i class="fas fa-expand-alt"></i></button></td></tr>';
    }).join('');

    renderPagination();
    document.getElementById('paginationBar').style.display = 'flex';
}

function renderTimeline() {
    document.getElementById('tableView').style.display     = 'none';
    document.getElementById('timelineView').style.display  = '';
    document.getElementById('paginationBar').style.display = 'none';
    const container = document.getElementById('timelineContent');
    if (!filteredRows.length) { container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i>No records found.</div>'; return; }

    const groups = {};
    filteredRows.forEach(row => {
        const d     = row._date;
        const label = d ? d.toLocaleDateString('en-IN', { weekday:'long', day:'2-digit', month:'long', year:'numeric' }) : 'Unknown Date';
        if (!groups[label]) groups[label] = [];
        groups[label].push(row);
    });

    const cfg      = COLLECTIONS[currentCollection];
    const dateCols = cfg.columns.filter(c => c.key !== '_date');

    container.innerHTML = Object.entries(groups).map(([lbl, rows]) =>
        '<div class="timeline-group">'+
        '<div class="timeline-date-header"><div class="timeline-date"><i class="fas fa-calendar-day"></i>&nbsp;'+lbl+'</div>'+
        '<span class="timeline-badge">'+rows.length+' record'+(rows.length!==1?'s':'')+'</span></div>'+
        '<div class="table-scroll"><table><thead><tr>'+
        dateCols.map(c=>'<th>'+c.label+'</th>').join('')+'<th>Time</th><th>Detail</th></tr></thead><tbody>'+
        rows.map(row => {
            const cells = dateCols.map(c => renderCell(c, row)).join('');
            const time  = row._date ? row._date.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}) : '—';
            const rj    = encodeURIComponent(JSON.stringify(row._raw));
            return '<tr>'+cells+'<td class="td-date"><span class="time-part">'+time+'</span></td>'+
                   '<td><button class="btn btn-ghost detail-btn" style="padding:3px 10px;font-size:0.78rem;" data-row="'+rj+'"><i class="fas fa-expand-alt"></i></button></td></tr>';
        }).join('')+
        '</tbody></table></div></div>'
    ).join('');
}

function renderPagination() {
    const total      = filteredRows.length;
    const totalPages = Math.ceil(total/PAGE_SIZE);
    const start      = (currentPage-1)*PAGE_SIZE+1;
    const end        = Math.min(currentPage*PAGE_SIZE, total);
    document.getElementById('paginationInfo').textContent = 'Showing '+start+'–'+end+' of '+total;
    const btns = document.getElementById('paginationBtns');
    let html = '<button class="pg-btn" id="pgPrev" '+(currentPage<=1?'disabled':'')+'><i class="fas fa-chevron-left"></i></button>';
    for (let i=1; i<=totalPages; i++) {
        if (i===1||i===totalPages||Math.abs(i-currentPage)<=1)
            html+='<button class="pg-btn '+(i===currentPage?'active':'')+'" data-page="'+i+'">'+i+'</button>';
        else if (Math.abs(i-currentPage)===2)
            html+='<span class="pg-btn" style="cursor:default">...</span>';
    }
    html+='<button class="pg-btn" id="pgNext" '+(currentPage>=totalPages?'disabled':'')+'><i class="fas fa-chevron-right"></i></button>';
    btns.innerHTML = html;
}

function esc(str) {
    if (str==null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showLoading() {
    document.getElementById('tableHead').innerHTML = '';
    document.getElementById('tableBody').innerHTML = '<tr class="loading-row"><td colspan="10"><div class="spinner"></div>Loading...</td></tr>';
    document.getElementById('paginationBar').style.display = 'none';
}
function showError(msg) {
    document.getElementById('tableBody').innerHTML =
        '<tr class="loading-row"><td colspan="10"><i class="fas fa-exclamation-triangle" style="color:var(--danger);font-size:2rem;display:block;margin-bottom:0.75rem;"></i>Error: '+esc(msg)+'</td></tr>';
}
function exportCSV() {
    const cfg  = COLLECTIONS[currentCollection];
    const hdrs = cfg.columns.map(c=>c.label).join(',');
    const rows = filteredRows.map(row=>cfg.columns.map(c=>{
        let v=row[c.key]; if(c.key==='_date'&&v instanceof Date) v=v.toISOString();
        return '"'+String(v??'').replace(/"/g,'""')+'"';
    }).join(','));
    const blob = new Blob([[hdrs,...rows].join('\n')],{type:'text/csv'});
    const url  = URL.createObjectURL(blob);
    const a    = Object.assign(document.createElement('a'),{href:url,download:currentCollection+'-'+new Date().toISOString().slice(0,10)+'.csv'});
    a.click(); URL.revokeObjectURL(url);
}
function showDetail(raw) {
    document.getElementById('detailContent').innerHTML = Object.entries(raw).map(([k,v])=>{
        let h;
        if(v&&typeof v==='object'&&v.seconds) h='<span class="detail-val">'+new Date(v.seconds*1000).toLocaleString('en-IN')+'</span>';
        else if(typeof v==='object') h='<span class="detail-val code">'+esc(JSON.stringify(v,null,2))+'</span>';
        else h='<span class="detail-val">'+esc(String(v??'—'))+'</span>';
        return '<div class="detail-row"><div class="detail-key">'+esc(k)+'</div>'+h+'</div>';
    }).join('');
    document.getElementById('detailModal').classList.add('open');
}

// Events
document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentCollection=btn.dataset.col; sortCol='_date'; sortDir='desc';
    document.getElementById('filterSearch').value='';
    loadCollection(currentCollection);
}));
document.getElementById('applyFiltersBtn').addEventListener('click',()=>loadCollection(currentCollection));
document.getElementById('resetFiltersBtn').addEventListener('click',()=>{
    document.getElementById('filterSearch').value='';
    document.getElementById('filterLimit').value='50';
    setDefaultDates(); loadCollection(currentCollection);
});
document.getElementById('tableHead').addEventListener('click',e=>{
    const th=e.target.closest('th[data-key]'); if(!th) return;
    const key=th.dataset.key;
    if(sortCol===key) sortDir=sortDir==='asc'?'desc':'asc'; else{sortCol=key;sortDir='desc';}
    applyFilters();
});
document.getElementById('paginationBtns').addEventListener('click',e=>{
    const btn=e.target.closest('[data-page]');
    if(btn){currentPage=parseInt(btn.dataset.page);render();}
    if(e.target.closest('#pgPrev')&&currentPage>1){currentPage--;render();}
    if(e.target.closest('#pgNext')){currentPage++;render();}
});
document.getElementById('viewTable').addEventListener('click',()=>{
    viewMode='table';
    document.getElementById('viewTable').classList.add('active');
    document.getElementById('viewTimeline').classList.remove('active');
    render();
});
document.getElementById('viewTimeline').addEventListener('click',()=>{
    viewMode='timeline';
    document.getElementById('viewTimeline').classList.add('active');
    document.getElementById('viewTable').classList.remove('active');
    render();
});
document.getElementById('refreshBtn').addEventListener('click',()=>loadCollection(currentCollection));
document.getElementById('exportCsvBtn').addEventListener('click',exportCSV);
document.addEventListener('click',e=>{
    const btn=e.target.closest('.detail-btn');
    if(btn) showDetail(JSON.parse(decodeURIComponent(btn.dataset.row)));
});
document.getElementById('closeModal').addEventListener('click',()=>document.getElementById('detailModal').classList.remove('open'));
document.getElementById('detailModal').addEventListener('click',e=>{
    if(e.target===document.getElementById('detailModal')) document.getElementById('detailModal').classList.remove('open');
});
</script>
</body>
</html>
