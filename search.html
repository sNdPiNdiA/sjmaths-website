<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | SJMaths</title>
    <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css?v=1781231711">
    <link rel="stylesheet" href="/assets/css/main.min.css?v=1781231711">
    <link rel="stylesheet" href="/assets/css/component.min.css?v=1781231711">
    <link rel="stylesheet" href="/assets/css/improved-ui.min.css?v=1781231711">
    <style>
        .search-container {
            max-width: 800px;
            margin: 100px auto;
            padding: 2rem;
            text-align: center;
        }
        .search-box-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
        }
        .search-input-large {
            flex: 1;
            padding: 15px 20px;
            border-radius: 12px;
            border: 2px solid #eee;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-input-large:focus {
            border-color: #8e44ad;
        }
        .search-btn-large {
            background: #8e44ad;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 25px;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .skeleton {
            background: #f0f2f5;
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
    <meta name="description" content="Search study material for CBSE Maths on SJMaths with notes, questions, practice resources, and exam preparation support.">
    
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://sjmaths.com/search.html">
<meta property="og:title" content="Search | SJMaths">
    <meta property="og:description" content="Search study material for CBSE Maths on SJMaths with notes, questions, practice resources, and exam preparation support.">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://sjmaths.com/search.html">
    <meta property="og:image" content="https://sjmaths.com/assets/icons/icon-512x512.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Search | SJMaths">
    <meta name="twitter:description" content="Search study material for CBSE Maths on SJMaths with notes, questions, practice resources, and exam preparation support.">
    <meta name="twitter:image" content="https://sjmaths.com/assets/icons/icon-512x512.png">
    </head>

<body>
    <div id="header-container"></div>

    <main class="search-container">
        <div class="search-header">
            <h1>Search SJMaths</h1>
            <p>Find chapters, exercises, and math topics instantly.</p>
        </div>

        <div class="search-box-wrapper">
            <input type="text" id="searchInput" class="search-input-large" placeholder="Search for notes, solutions, topics...">
            <button id="searchBtn" class="search-btn-large"><i class="fas fa-search"></i></button>
        </div>

        <div id="resultsCount" class="results-count"></div>
        <div id="resultsContainer">
            <div class="skeleton" style="height: 100px; margin-bottom: 1rem; border-radius: 12px;"></div>
            <div class="skeleton" style="height: 100px; margin-bottom: 1rem; border-radius: 12px;"></div>
            <div class="skeleton" style="height: 100px; margin-bottom: 1rem; border-radius: 12px;"></div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="/assets/js/search.min.js?v=1781231711" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            
            const triggerSearch = (term) => {
                const searchInput = document.getElementById('searchInput');
                if (searchInput) {
                    if (term) searchInput.value = term;
                    searchInput.focus(); // Triggers premium modal
                    
                    if (term) {
                        setTimeout(() => {
                            const modalInput = document.getElementById('search-modal-input');
                            if (modalInput) {
                                modalInput.value = term;
                                modalInput.dispatchEvent(new Event('input', { bubbles: true }));
                            }
                        }, 300);
                    }
                }
            };

            document.getElementById('searchBtn').addEventListener('click', () => {
                triggerSearch(document.getElementById('searchInput').value);
            });

            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') triggerSearch(e.target.value);
            });

            // Auto-trigger if query in URL
            if (query) {
                setTimeout(() => triggerSearch(query), 500);
            }
        });
    </script>
</body>

</html>
