    <style>
        :root {
            --primary: #8e44ad;
            --primary-light: #9b59b6;
            --maths-accent: #3498db;
            --success: #2ecc71;
            --warning: #f1c40f;
            --danger: #e74c3c;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(142, 68, 173, 0.1);
            --card-shadow: 0 10px 30px -5px rgba(142, 68, 173, 0.08);
            --font-display: 'Outfit', sans-serif;
            --font-main: 'Inter', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background: linear-gradient(160deg, #fbfaff 0%, #f7eff9 50%, #f0f4ff 100%);
            min-height: 100vh;
            color: #2c3e50;
        }

        .job-hub-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1.5rem 1rem 4rem;
        }

        /* Hero Banner */
        .hub-hero {
            text-align: center;
            padding: 2.5rem 1rem;
            margin-bottom: 2rem;
            position: relative;
        }

        .hub-hero h1 {
            font-family: var(--font-display);
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--maths-accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .hub-hero p {
            font-size: clamp(0.95rem, 2vw, 1.1rem);
            color: #7f8c8d;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .stat-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.25rem;
            text-align: center;
            box-shadow: var(--card-shadow);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .stat-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: 0 10px 20px rgba(142, 68, 173, 0.08);
        }

        .stat-card.active {
            border-color: var(--primary);
            background: rgba(142, 68, 173, 0.03);
            box-shadow: 0 10px 20px -5px rgba(142, 68, 173, 0.15);
        }

        .stat-icon {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .stat-val {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 700;
            color: #2c3e50;
            line-height: 1;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #7f8c8d;
            font-weight: 500;
        }

        /* Filters & Search */
        .control-bar {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.25rem;
            box-shadow: var(--card-shadow);
            margin-bottom: 2rem;
            position: sticky;
            top: 70px;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .search-wrapper {
            position: relative;
            margin-bottom: 1rem;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            border: 1px solid rgba(142, 68, 173, 0.15);
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(142, 68, 173, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #95a5a6;
        }

        /* Swipable categories */
        .categories-scroll {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 0.25rem;
        }

        .categories-scroll::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            white-space: nowrap;
            padding: 0.45rem 1rem;
            background: rgba(142, 68, 173, 0.05);
            border: 1px solid rgba(142, 68, 173, 0.1);
            color: #7f8c8d;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(142, 68, 173, 0.2);
        }

        /* Timeline grouping */
        .timeline-section {
            margin-bottom: 2rem;
        }

        .date-header {
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary);
            margin: 1.5rem 0 1rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .date-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(142, 68, 173, 0.15);
        }

        /* Job Cards */
        .job-card {
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: 16px;
            padding: 1.25rem;
            margin-bottom: 0.75rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            transition: all 0.3s ease;
        }

        .job-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(142, 68, 173, 0.08);
            border-color: rgba(142, 68, 173, 0.15);
        }

        .job-info {
            flex: 1;
        }

        .job-meta-top {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }

        .job-badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .badge-apply {
            background: rgba(46, 204, 113, 0.1);
            color: var(--success);
        }

        .badge-soon {
            background: rgba(231, 76, 60, 0.1);
            color: var(--danger);
        }

        .badge-admit {
            background: rgba(52, 152, 219, 0.1);
            color: var(--maths-accent);
        }

        .badge-result {
            background: rgba(142, 68, 173, 0.1);
            color: var(--primary);
        }

        .job-agency {
            font-size: 0.8rem;
            color: #7f8c8d;
            font-weight: 600;
        }

        .job-title {
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 700;
            color: #2c3e50;
            line-height: 1.4;
            margin: 0 0 0.5rem 0;
        }

        .job-details-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            font-size: 0.85rem;
            color: #7f8c8d;
        }

        .job-details-item {
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .job-details-item i {
            color: var(--primary);
        }

        /* Actions */
        .job-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn-job-detail {
            border: 1px solid var(--primary);
            background: transparent;
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-job-detail:hover {
            background: var(--primary);
            color: white;
        }

        .btn-bookmark {
            background: transparent;
            border: none;
            font-size: 1.25rem;
            color: #bdc3c7;
            cursor: pointer;
            transition: color 0.2s;
            padding: 0.5rem;
        }

        .btn-bookmark.active {
            color: #e74c3c;
        }

        /* Mobile specific card styles */
        @media (max-width: 576px) {
            .job-card {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
            }

            .job-actions {
                justify-content: space-between;
                border-top: 1px solid rgba(0, 0, 0, 0.05);
                padding-top: 0.75rem;
            }
        }

        /* Premium Modal Drawer */
        .job-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            padding: 1rem;
        }

        .job-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            transform: translateY(30px);
            transition: transform 0.3s;
        }

        .job-modal.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            padding: 1.5rem;
            color: white;
            position: relative;
        }

        .modal-close {
            position: absolute;
            right: 1.25rem;
            top: 1.25rem;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            font-size: 1.1rem;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .modal-body {
            padding: 1.5rem;
            max-height: 70vh;
            overflow-y: auto;
        }

        .modal-job-title {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .modal-job-agency {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .modal-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        @media(max-width: 480px) {
            .modal-info-grid {
                grid-template-columns: 1fr;
            }
        }

        .modal-info-item {
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            padding-bottom: 0.5rem;
        }

        .modal-info-label {
            font-size: 0.8rem;
            color: #7f8c8d;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 0.2rem;
        }

        .modal-info-val {
            font-size: 0.95rem;
            color: #2c3e50;
            font-weight: 700;
        }

        .modal-footer {
            padding: 1rem 1.5rem;
            background: #fcf9fe;
            border-top: 1px solid rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
        }

        .btn-apply-main {
            background: linear-gradient(135deg, var(--primary), var(--maths-accent));
            color: white;
            border: none;
            padding: 0.65rem 1.5rem;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-apply-main:hover {
            opacity: 0.9;
        }
    </style>
</head>
