<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="auto" style="max-width:960px; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Background & Shading Gradients -->
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0.08" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrRed" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#ef4444" />
    </marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#0284c7" />
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#10b981" />
    </marker>
    <marker id="arrPurple" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#8b5cf6" />
    </marker>
    <marker id="arrAmber" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#f59e0b" />
    </marker>
    <marker id="arrDim" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M1,1 L5,3 L1,5 Z" fill="#64748b" />
    </marker>
    <marker id="arrDimRev" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M5,1 L1,3 L5,5 Z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="520" fill="#0f172a" rx="12" />
  <rect x="1.5" y="1.5" width="957" height="517" fill="none" stroke="#334155" stroke-width="1.5" rx="11" />

  <!-- Title Badge -->
  <rect x="30" y="24" width="900" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
  <text x="48" y="51" fill="#38bdf8" font-size="16" font-weight="800" letter-spacing="0.5">UPSC AIR SAFETY OFFICER · AERODYNAMIC CENTRE, CENTRE OF PRESSURE &amp; LONGITUDINAL TRIM</text>

  <!-- Fuselage Reference Centerline Datum -->
  <line x1="80" y1="280" x2="880" y2="280" stroke="#475569" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.6" />
  <text x="810" y="274" fill="#64748b" font-size="11" font-weight="600">Fuselage Datum</text>

  <!-- Relative Wind Oncoming Vector -->
  <line x1="40" y1="280" x2="110" y2="280" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrBlue)" />
  <line x1="40" y1="260" x2="105" y2="260" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrBlue)" opacity="0.7" />
  <line x1="40" y1="300" x2="105" y2="300" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrBlue)" opacity="0.7" />
  <text x="42" y="244" fill="#38bdf8" font-size="12" font-weight="700">Relative Wind (V<tspan font-size="9" dy="3">∞</tspan>)</text>

  <!-- Main Airfoil Wing Profile (cambered, chord = 420px, LE at 140, TE at 560) -->
  <!-- Chord line connects (140, 280) to (560, 280) -->
  <path d="M 140 280 
           C 140 230, 240 200, 310 200 
           C 400 200, 490 245, 560 280 
           C 490 288, 380 292, 300 288 
           C 220 285, 140 290, 140 280 Z"
        fill="url(#foilGrad)" stroke="#38bdf8" stroke-width="2.5" />

  <!-- Chord Line Dimension -->
  <line x1="140" y1="360" x2="560" y2="360" stroke="#64748b" stroke-width="1.5" />
  <line x1="140" y1="352" x2="140" y2="368" stroke="#64748b" stroke-width="1.5" />
  <line x1="560" y1="352" x2="560" y2="368" stroke="#64748b" stroke-width="1.5" />
  <line x1="140" y1="280" x2="140" y2="360" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="560" y1="280" x2="560" y2="360" stroke="#475569" stroke-width="1" stroke-dasharray="3,3" />
  <text x="320" y="380" fill="#94a3b8" font-size="13" font-weight="700" text-anchor="middle">Wing Mean Aerodynamic Chord (c = 100%)</text>

  <!-- Point 1: Aerodynamic Centre (x_ac = 0.25c = 140 + 105 = 245) -->
  <!-- Vertical Drop & Indicator -->
  <line x1="245" y1="110" x2="245" y2="360" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6" />
  <circle cx="245" cy="245" r="7" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
  <text x="245" y="232" fill="#38bdf8" font-size="12" font-weight="800" text-anchor="middle">AC (0.25c)</text>

  <!-- Lift Vector at AC (Upward) -->
  <line x1="245" y1="245" x2="245" y2="105" stroke="#0284c7" stroke-width="3.5" marker-end="url(#arrBlue)" />
  <text x="255" y="125" fill="#38bdf8" font-size="15" font-weight="800">Lift (L<tspan font-size="10" dy="3">w</tspan>)</text>

  <!-- Constant Pitching Moment Arrow about AC (Nose-down Mac < 0 for positive camber) -->
  <!-- Curved arc indicating counterclockwise/clockwise nose-down moment -->
  <path d="M 220 230 A 25 25 0 0 1 270 230" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrAmber)" />
  <text x="245" y="208" fill="#f59e0b" font-size="12" font-weight="800" text-anchor="middle">M<tspan font-size="9" dy="2">ac</tspan> &lt; 0 (Constant)</text>

  <!-- Quarter-Chord Dimension from LE -->
  <line x1="140" y1="335" x2="245" y2="335" stroke="#38bdf8" stroke-width="1.2" marker-start="url(#arrDimRev)" marker-end="url(#arrDim)" />
  <text x="192" y="328" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">x<tspan font-size="9" dy="2">ac</tspan> = 0.25c</text>

  <!-- Point 2: Centre of Gravity (CG at x_cg = 0.30c = 140 + 126 = 266) -->
  <line x1="266" y1="160" x2="266" y2="440" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6" />
  <!-- Traditional CG quadrant circle -->
  <circle cx="266" cy="270" r="9" fill="#10b981" stroke="#34d399" stroke-width="2" />
  <path d="M 266 261 A 9 9 0 0 1 275 270 L 266 270 Z" fill="#064e3b" />
  <path d="M 266 279 A 9 9 0 0 1 257 270 L 266 270 Z" fill="#064e3b" />
  <text x="266" y="295" fill="#34d399" font-size="12" font-weight="800" text-anchor="middle">CG</text>
  <!-- Aircraft Weight Vector at CG (Downward) -->
  <line x1="266" y1="270" x2="266" y2="420" stroke="#10b981" stroke-width="3.5" marker-end="url(#arrGreen)" />
  <text x="278" y="415" fill="#34d399" font-size="14" font-weight="800">Weight (W)</text>

  <!-- Dimension: Distance between AC and CG (x_cg - x_ac = 0.05c) -->
  <line x1="245" y1="150" x2="266" y2="150" stroke="#f59e0b" stroke-width="1.5" marker-start="url(#arrDimRev)" marker-end="url(#arrDim)" />
  <text x="255" y="142" fill="#f59e0b" font-size="10" font-weight="800" text-anchor="middle">Δx = 0.05c</text>

  <!-- Point 3: Centre of Pressure (CP at x_cp = 0.38c = 140 + 160 = 300) -->
  <line x1="300" y1="120" x2="300" y2="360" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.6" />
  <circle cx="300" cy="255" r="7" fill="#ef4444" stroke="#f87171" stroke-width="2" />
  <text x="300" y="242" fill="#f87171" font-size="12" font-weight="800" text-anchor="middle">CP (M<tspan font-size="9" dy="2">cp</tspan> = 0)</text>
  <!-- Total Lift at CP (Zero Moment Point) -->
  <line x1="300" y1="255" x2="300" y2="125" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="3,2" marker-end="url(#arrRed)" />
  <text x="310" y="145" fill="#f87171" font-size="11" font-weight="700">Total Lift (at CP)</text>

  <!-- CP Movement Annotation -->
  <path d="M 330 265 L 275 265" fill="none" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrRed)" />
  <text x="340" y="270" fill="#fca5a5" font-size="10" font-weight="600">CP moves forward with ↑ α</text>

  <!-- Horizontal Stabilizer (Tailplane) at aft fuselage (LE at 730, TE at 850) -->
  <path d="M 730 278 
           C 740 262, 790 262, 850 278 
           C 790 286, 740 286, 730 278 Z"
        fill="url(#tailGrad)" stroke="#a855f7" stroke-width="2" />
  <text x="790" y="254" fill="#c084fc" font-size="12" font-weight="800" text-anchor="middle">Horizontal Tail</text>

  <!-- Downward Tail Load for Longitudinal Trim (L_tail < 0) -->
  <line x1="790" y1="280" x2="790" y2="390" stroke="#a855f7" stroke-width="3" marker-end="url(#arrPurple)" />
  <text x="802" y="380" fill="#c084fc" font-size="14" font-weight="800">Tail Lift (L<tspan font-size="10" dy="3">t</tspan> &lt; 0)</text>

  <!-- Tail Moment Arm (l_t from CG to Tail AC) -->
  <line x1="266" y1="465" x2="790" y2="465" stroke="#c084fc" stroke-width="1.5" marker-start="url(#arrDimRev)" marker-end="url(#arrDim)" />
  <line x1="266" y1="420" x2="266" y2="475" stroke="#c084fc" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="790" y1="390" x2="790" y2="475" stroke="#c084fc" stroke-width="1" stroke-dasharray="3,3" />
  <text x="528" y="458" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">Tail Moment Arm (l<tspan font-size="9" dy="2">t</tspan>)</text>

  <!-- Formula Summary Callout Card -->
  <rect x="520" y="80" width="410" height="135" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
  <text x="535" y="104" fill="#38bdf8" font-size="13" font-weight="800">KEY LONGITUDINAL GOVERNING FORMULAS</text>
  <text x="535" y="128" fill="#f1f5f9" font-size="12" font-family="'JetBrains Mono', monospace">1. C<tspan font-size="9" dy="2">M,cg</tspan><tspan dy="-2"> = C</tspan><tspan font-size="9" dy="2">M,ac</tspan><tspan dy="-2"> + C</tspan><tspan font-size="9" dy="2">L</tspan><tspan dy="-2"> · ((x</tspan><tspan font-size="9" dy="2">cg</tspan><tspan dy="-2"> - x</tspan><tspan font-size="9" dy="2">ac</tspan><tspan dy="-2">)/c)</tspan></text>
  <text x="535" y="152" fill="#f1f5f9" font-size="12" font-family="'JetBrains Mono', monospace">2. x<tspan font-size="9" dy="2">cp</tspan><tspan dy="-2"> = x</tspan><tspan font-size="9" dy="2">ref</tspan><tspan dy="-2"> - (c · C</tspan><tspan font-size="9" dy="2">M,ref</tspan><tspan dy="-2"> / C</tspan><tspan font-size="9" dy="2">L</tspan><tspan dy="-2">)</tspan></text>
  <text x="535" y="176" fill="#f1f5f9" font-size="12" font-family="'JetBrains Mono', monospace">3. Static Margin = (x<tspan font-size="9" dy="2">np</tspan><tspan dy="-2"> - x</tspan><tspan font-size="9" dy="2">cg</tspan><tspan dy="-2">)/c = -dC</tspan><tspan font-size="9" dy="2">M</tspan><tspan dy="-2">/dC</tspan><tspan font-size="9" dy="2">L</tspan><tspan dy="-2"> &gt; 0</tspan></text>
  <text x="535" y="200" fill="#10b981" font-size="11" font-weight="700">✓ Positive Static Stability Requires CG Ahead of Neutral Point (x<tspan font-size="9" dy="2">cg</tspan><tspan dy="-2"> &lt; x</tspan><tspan font-size="9" dy="2">np</tspan><tspan dy="-2">)</tspan></text>
</svg>
