ght:1.5}.notebook-nav-controls{display:flex;justify-content:space-between;margin-top:25px}.notebook-action-btn{background:#0f9d8a;color:white;border:none;padding:12px 24px;font-family:Outfit,sans-serif;font-weight:700;font-size:0.9rem;border-radius:50px;cursor:pointer;transition:all 0.2s ease}.notebook-action-btn:hover{background:#0d9488;transform:translateY(-1px)}.notebook-action-btn:disabled{background:#cbd5e1;color:#94a3b8;cursor:not-allowed}</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
const quizData = [{"question": "1. A force of 10 N displaces an object by 5 m in the direction of the force. How much work is done?", "options": ["2 J", "15 J", "50 J", "500 J"], "correctIdx": 2, "explanations": ["Incorrect: W = F × s = 10 × 5 = 50 J.", "Incorrect: That would be F + s.", "Correct: W = F × s = 10 N × 5 m = 50 J.", "Incorrect: That multiplies by 10 twice."], "hint": "Work = Force × displacement in the direction of force."}, {"question": "2. A girl lifts a dumbbell of mass 5 kg to a height of 2 m. What is the work done against gravity? (g = 10 m/s²)", "options": ["10 J", "100 J", "50 J", "25 J"], "correctIdx": 1, "explanations": ["Incorrect: That would be if mass was 1 kg.", "Correct: W = mgh = 5 × 10 × 2 = 100 J.", "Incorrect: That uses g = 5.", "Incorrect: That uses height = 2.5 m."], "hint": "Work against gravity = m × g × h."}, {"question": "3. When is work done equal to zero?", "options": ["When force is zero OR displacement is zero", "Only when both force and displacement are zero", "Never — work is always positive", "Only when force is perpendicular to displacement"], "correctIdx": 0, "explanations": ["Correct: W = 0 if F = 0 or s = 0 (or both).", "Incorrect: Work is zero even if only one is zero.", "Incorrect: Work can be positive, negative, or zero.", "Incorrect: That is one case, but not the only case."], "hint": "Check W = F × s × cos(θ). When is this zero?"}, {"question": "4. A box is pushed 4 m with a force of 15 N, but friction of 5 N opposes the motion. What is the net work done?", "options": ["60 J", "80 J", "40 J", "20 J"], "correctIdx": 2, "explanations": ["Incorrect: That is work by applied force only.", "Incorrect: That adds friction.", "Correct: Net force = 15 - 5 = 10 N. Net work = 10 × 4 = 40 J.", "Incorrect: That uses friction as net force."], "hint": "Net work = (applied force - friction) × displacement."}, {"question": "5. Which of the following is an example of negative work?", "options": ["A crane lifting a load upward", "A goalkeeper stopping a ball", "A child sliding down a slide", "A car accelerating forward"], "correctIdx": 1, "explanations": ["Incorrect: Force and displacement are in the same direction → positive work.", "Correct: Goalkeeper applies force opposite to ball motion → negative work.", "Incorrect: Gravity acts in the direction of motion → positive work.", "Incorrect: Engine force and displacement are in the same direction."], "hint": "Negative work occurs when force opposes the displacement."}, {"question": "6. The kinetic energy of a body of mass m moving with velocity v is:", "options": ["mv²", "½mv²", "mgh", "mv"], "correctIdx": 1, "explanations": ["Incorrect: Missing the factor of ½.", "Correct: KE = ½mv².", "Incorrect: That is potential energy.", "Incorrect: That is momentum."], "hint": "Kinetic energy depends on mass and the square of velocity."}, {"question": "7. If the velocity of a vehicle doubles, its kinetic energy becomes:", "options": ["Half", "Double", "Four times", "Eight times"], "correctIdx": 2, "explanations": ["Incorrect: KE increases, not decreases.", "Incorrect: KE ∝ v², not v.", "Correct: KE ∝ v², so doubling v quadruples KE.", "Incorrect: That would be if KE ∝ v³."], "hint": "KE = ½mv². If v becomes 2v, KE becomes ½m(2v)² = 4 × ½mv²."}, {"question": "8. A 2 kg ball is thrown upward at 10 m/s. What is its kinetic energy at the moment of throw?", "options": ["20 J", "100 J", "50 J", "200 J"], "correctIdx": 1, "explanations": ["Incorrect: That would be mv.", "Correct: KE = ½ × 2 × 10² = 100 J.", "Incorrect: That uses v instead of v².", "Incorrect: That uses ½m × v × g."], "hint": "KE = ½mv². Substitute m = 2 kg and v = 10 m/s."}, {"question": "9. A 15000 kg jet lands at 70 m/s and stops in 100 m. What is the approximate braking force?", "options": ["36750 N", "73500 N", "367500 N", "15000 N"], "correctIdx": 2, "explanations": ["Incorrect: That is half the correct value.", "Incorrect: That is double the correct value.", "Correct: Using work-energy: F × s = ½mv² → F = (½ × 15000 × 70²) / 100 = 367500 N.", "Incorrect: That is just the mass."], "hint": "Work done by brakes = change in KE. F × s = ½mv²."}, {"question": "10. The potential energy of an object of mass m at height h near Earth's surface is:", "options": ["½mv²", "mgh", "mg/h", "mh/g"], "correctIdx": 1, "explanations": ["Incorrect: That is kinetic energy.", "Correct: PE = mgh.", "Incorrect: g is multiplied, not divided.", "Incorrect: The formula is mgh, not mh/g."], "hint": "Potential energy depends on mass, gravity, and height."}, {"question": "11. A 0.5 kg ball is raised to a height of 10 m. Its gain in potential energy is: (g = 10 m/s²)", "options": ["5 J", "50 J", "100 J", "20 J"], "correctIdx": 1, "explanations": ["Incorrect: That uses h = 1 m.", "Correct: PE = mgh = 0.5 × 10 × 10 = 50 J.", "Incorrect: That uses m = 1 kg.", "Incorrect: That uses g = 4."], "hint": "PE = m × g × h. All values are given."}, {"question": "12. In a hydroelectric dam, the sequence of energy transformations is:", "options": ["Potential → Kinetic → Electrical", "Kinetic → Potential → Electrical", "Electrical → Potential → Kinetic", "Thermal → Kinetic → Electrical"], "correctIdx": 0, "explanations": ["Correct: Water at height has PE → flows with KE → turns turbine → generates electricity.", "Incorrect: Potential comes first, not kinetic.", "Incorrect: Electrical energy is the output, not input.", "Incorrect: Thermal energy is not the primary source."], "hint": "Water stored at height possesses potential energy first."}, {"question": "13. A pendulum bob reaches almost the same height on the other side because:", "options": ["Energy is created during swing", "Mechanical energy is conserved (ignoring friction)", "Gravity disappears at the bottom", "The string pushes the bob upward"], "correctIdx": 1, "explanations": ["Incorrect: Energy is conserved, not created.", "Correct: KE at bottom converts back to PE at the top, conserving mechanical energy.", "Incorrect: Gravity acts throughout the motion.", "Incorrect: The string only provides tension, not upward push."], "hint": "Energy transforms between kinetic and potential, but total stays constant."}, {"question": "14. A child slides down a frictionless slide of height h. At the bottom, the speed is:", "options": ["√(2gh)", "gh", "2gh", "√(gh)"], "correctIdx": 0, "explanations": ["Correct: From mgh = ½mv² → v = √(2gh).", "Incorrect: Missing the square root and factor of 2.", "Incorrect: Missing the square root.", "Incorrect: Missing the factor of 2 under the root."], "hint": "Set PE at top equal to KE at bottom: mgh = ½mv²."}, {"question": "15. A truck of mass 10000 kg moving at 20 m/s is stopped by a sand ramp exerting 50000 N. Minimum ramp length is:", "options": ["20 m", "40 m", "80 m", "10 m"], "correctIdx": 1, "explanations": ["Incorrect: That uses half the kinetic energy.", "Correct: Initial KE = ½ × 10000 × 20² = 2,000,000 J. Work by sand = F × d = 50000d. Equating: 50000d = 2,000,000 → d = 40 m.", "Incorrect: That doubles the correct value.", "Incorrect: That uses KE = mv²."], "hint": "Work done by sand (force × distance) equals initial kinetic energy."}, {"question": "16. Power is defined as:", "options": ["Total work done", "Rate at which work is done", "Energy stored in an object", "Force multiplied by time"], "correctIdx": 1, "explanations": ["Incorrect: That is work, not power.", "Correct: Power = Work / time.", "Incorrect: That describes potential or kinetic energy.", "Incorrect: Force × time is impulse, not power."], "hint": "Power measures how quickly work is done."}, {"question": "17. A weightlifter lifts 75 kg by 2 m in 5 s. The power required is: (g = 10 m/s²)", "options": ["150 W", "300 W", "750 W", "30 W"], "correctIdx": 1, "explanations": ["Incorrect: That is the work done, not power.", "Correct: Work = mgh = 75 × 10 × 2 = 1500 J. Power = 1500 / 5 = 300 W.", "Incorrect: That divides by 2 instead of 5.", "Incorrect: That divides by 50."], "hint": "First find work (mgh), then divide by time."}, {"question": "18. A 1000 kg car goes from rest to 20 m/s in 10 s. Engine power is:", "options": ["2000 W", "20000 W", "40000 W", "1000 W"], "correctIdx": 1, "explanations": ["Incorrect: That uses ½mv / t incorrectly.", "Correct: KE gained = ½ × 1000 × 20² = 200,000 J. Power = 200000 / 10 = 20000 W.", "Incorrect: That doubles the correct answer.", "Incorrect: That uses m × v / t."], "hint": "Work done = change in KE. Then Power = Work / time."}, {"question": "19. A fixed pulley:", "options": ["Reduces the effort force needed", "Changes the direction of effort", "Doubles the load", "Creates energy"], "correctIdx": 1, "explanations": ["Incorrect: Effort equals load for a fixed pulley.", "Correct: A fixed pulley only changes direction; MA = 1.", "Incorrect: The load stays the same.", "Incorrect: Machines cannot create energy."], "hint": "A fixed pulley is a wheel that redirects force — effort equals load."}, {"question": "20. An inclined plane of height 30 cm and length 50 cm has mechanical advantage:", "options": ["0.6", "1.67", "1.33", "2.0"], "correctIdx": 1, "explanations": ["Incorrect: That is h/L, the inverse.", "Correct: MA = L/h = 50/30 = 1.67.", "Incorrect: That is 40/30.", "Incorrect: That is 60/30."], "hint": "Mechanical advantage of an inclined plane = Length / Height."}, {"question": "21. In a lever, if the effort arm is twice the load arm, the mechanical advantage is:", "options": ["0.5", "1", "2", "4"], "correctIdx": 2, "explanations": ["Incorrect: That is the inverse (load arm / effort arm).", "Incorrect: That is when both arms are equal.", "Correct: MA = effort arm / load arm = 2/1 = 2.", "Incorrect: That would be if the ratio was squared."], "hint": "MA = effort arm / load arm. If effort arm is 2× load arm, MA = 2."}, {"question": "22. Which class of lever has the load between the fulcrum and the effort?", "options": ["Class I", "Class II", "Class III", "All classes"], "correctIdx": 1, "explanations": ["Incorrect: Class I has fulcrum in the middle.", "Correct: Class II has load between fulcrum and effort (e.g., wheelbarrow).", "Incorrect: Class III has effort between fulcrum and load.", "Incorrect: Only Class II fits this description."], "hint": "Think of a wheelbarrow — the load is in the middle."}, {"question": "23. A seesaw balances when: effort × effort arm = load × load arm. If a 30 kg child sits 2 m from the fulcrum, where should a 15 kg child sit?", "options": ["1 m", "2 m", "4 m", "0.5 m"], "correctIdx": 2, "explanations": ["Incorrect: That would balance if masses were swapped.", "Incorrect: That would mean both sit at the same distance.", "Correct: 30 × 2 = 15 × L → L = 4 m.", "Incorrect: That uses inverse proportion."], "hint": "30 kg × 2 m = 15 kg × ? → solve for ?."}, {"question": "24. Power of a machine is 200 W. This means:", "options": ["It does 200 J of work", "It does 200 J of work per second", "It needs 200 N of force", "It lifts 200 kg"], "correctIdx": 1, "explanations": ["Incorrect: 200 J is work, but we need the rate.", "Correct: 1 W = 1 J/s, so 200 W = 200 J/s.", "Incorrect: Watt is not a unit of force.", "Incorrect: Watt is not a unit of mass."], "hint": "Watt is joules per second — a rate, not an amount."}, {"question": "25. A ball of mass 1 kg is dropped from 10 m. Just before hitting the ground, its kinetic energy is: (g = 10 m/s², neglect air resistance)", "options": ["10 J", "100 J", "50 J", "200 J"], "correctIdx": 1, "explanations": ["Incorrect: That would be mgh with h = 1 m.", "Correct: KE gained = PE lost = mgh = 1 × 10 × 10 = 100 J.", "Incorrect: That uses ½mgh.", "Incorrect: That uses m × 2gh."], "hint": "By conservation of mechanical energy, KE at bottom = initial PE."}];
let curQ = 0;
let userAnswers = Array(quizData.length).fill(null);
let score = 0;

function updateQuizUI() {
const q = quizData[curQ];
document.getElementById("quiz-q-num").textContent = `Question ${curQ + 1} of ${quizData.length}`;
document.getElementById("quiz-score-indicator").textContent = `Score: ${score}/${quizData.length}`;
const pct = ((curQ + 1) / quizData.length) * 100;
document.getElementById("quiz-progress-fill").style.width = `${pct}%`;
document.getElementById("quiz-q-text").textContent = q.question;
const wrapper = document.getElementById("quiz-options-wrapper");
wrapper.innerHTML = "";

const showHint = () => {
const box = document.getElementById("quiz-hint-box");
const txt = document.getElementById("quiz-hint-text");
box.style.display = "block";
txt.textContent = q.hint;
};

q.options.forEach((opt, idx) => {
const container = document.createElement("div");
container.className = "notebook-option-container";
const btn = document.createElement("button");
btn.className = "notebook-option-btn";
btn.textContent = opt;
const exp = document.createElement("div");
exp.className = "notebook-option-explanation";

const revealAnswer = () => {
if (userAnswers[curQ] !== null) return;
userAnswers[curQ] = idx;
if (idx === q.correctIdx) {
score++;
btn.classList.add("selected-correct");
exp.classList.add("correct-exp");
} else {
btn.classList.add("selected-wrong");
exp.classList.add("wrong-exp");
}
exp.style.display = "block";
exp.textContent = q.explanations[idx];
document.getElementById("quiz-score-indicator").textContent = `Score: ${score}/${quizData.length}`;
document.getElementById("quiz-btn-next").disabled = false;
};

btn.addEventListener("click", revealAnswer);
container.appendChild(btn);
container.appendChild(exp);
wrapper.appendChild(container);
});

document.getElementById("quiz-btn-prev").disabled = curQ === 0;
const nextBtn = document.getElementById("quiz-btn-next");
if (curQ === quizData.length - 1) {
nextBtn.innerHTML = `View Results <i class="fas fa-flag-checkered"></i>`;
} else {
nextBtn.innerHTML = `Next Question <i class="fas fa-arrow-right"></i>`;
}
if (userAnswers[curQ] !== null) {
nextBtn.disabled = false;
}
}

document.getElementById("quiz-btn-prev").addEventListener("click", () => {
if (curQ > 0) { curQ--; updateQuizUI(); }
});

document.getElementById("quiz-btn-next").addEventListener("click", () => {
if (curQ < quizData.length - 1) { curQ++; updateQuizUI(); }
else { showScorecard(); }
});

document.getElementById("quiz-btn-hint").addEventListener("click", showHint);

function showScorecard() {
let finalCorrect = 0;
let detailsLog = "";
quizData.forEach((q, idx) => {
const isCorrect = userAnswers[idx] === q.correctIdx;
if (isCorrect) finalCorrect++;
detailsLog += `<div style="border-bottom:1px solid #e2e8f0;padding:15px 0;font-size:0.9rem"><strong style="color:${isCorrect ? "#10b981" : "#ef4444"}"><i class="${isCorrect ? "fas fa-check-circle" : "fas fa-times-circle"}"></i> Question ${idx + 1}: ${isCorrect ? "Correct" : "Incorrect"}</strong><p style="margin:6px 0;color:#1e293b;font-weight:600">${q.question}</p><p style="margin:0;font-size:0.85rem;color:#0284c7"><strong>Smart Study Insights:</strong> ${q.explanations[q.correctIdx]}</p></div>`;
});
const pct = Math.round((finalCorrect / quizData.length) * 100);
let badge = "";
if (pct >= 85) badge = "Energy Expert 👑";
else if (pct >= 60) badge = "Motion Explorer 🚀";
else badge = "Review Required 🔍";
const rootEl = document.getElementById("quiz-companion-root");
rootEl.innerHTML = `<div style="text-align:center;padding:20px 0"><h2 style="font-family:Outfit,sans-serif;color:#0f9d8a;font-size:2.2rem;margin-bottom:10px">${finalCorrect} / ${quizData.length}</h2><span style="background:#f0fdfa;border:1px solid #0f9d8a;color:#0f9d8a;padding:6px 16px;font-weight:700;font-size:0.9rem;border-radius:20px">${badge} (${pct}%)</span><p style="margin-top:20px;color:#475569">You have completed the Work, Energy and Simple Machines Assessment.</p><button id="btn-retake" class="notebook-action-btn" style="margin-top:15px"><i class="fas fa-redo"></i> Retake Quiz</button></div><div style="margin-top:30px;text-align:left"><h3 style="font-family:Outfit,sans-serif;border-bottom:2px solid #0f9d8a;padding-bottom:8px;margin-bottom:15px">Detailed Study Logs</h3>${detailsLog}</div>`;
document.getElementById("btn-retake").addEventListener("click", () => { location.reload(); });
}

updateQuizUI();
});
</script>
