<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class 9 Science Hub | SJMaths</title>
  <meta name="description" content="A modern, mobile-first study hub for Class 9 Science with chapter-wise notes, concepts, practice, tests and revision resources." />
  <meta name="theme-color" content="#4f46e5" />
  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(10, 20, 39, 0.78);
      --panel-strong: rgba(15, 27, 49, 0.94);
      --text: #f8fbff;
      --muted: #9db0c9;
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
      --accent-3: #34d399;
      --border: rgba(255,255,255,0.12);
      --shadow: 0 20px 45px rgba(2, 8, 23, 0.38);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(34, 211, 238, 0.16), transparent 28%),
        radial-gradient(circle at top right, rgba(139, 92, 246, 0.18), transparent 30%),
        linear-gradient(135deg, #07111f 0%, #0f172a 60%, #111827 100%);
      color: var(--text);
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    .shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    .hero {
      background: linear-gradient(135deg, rgba(25, 29, 56, 0.95), rgba(17, 24, 39, 0.92));
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 24px;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(10px);
      opacity: 0.35;
      pointer-events: none;
    }

    .hero::before {
      width: 160px;
      height: 160px;
      right: -30px;
      top: -40px;
      background: var(--accent);
    }

    .hero::after {
      width: 180px;
      height: 180px;
      left: -50px;
      bottom: -60px;
      background: var(--accent-2);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      background: rgba(255,255,255,0.08);
      color: #dbeafe;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hero h1 {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      margin: 14px 0 10px;
      line-height: 1.08;
      letter-spacing: -0.03em;
    }

    .hero p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.65;
      max-width: 720px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 14px;
      border-radius: 999px;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 1px solid transparent;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: white;
      box-shadow: 0 12px 24px rgba(34, 211, 238, 0.2);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.07);
      color: #f8fbff;
      border-color: rgba(255,255,255,0.15);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
    }

    .stat {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 16px;
      padding: 12px;
    }

    .stat strong {
      display: block;
      font-size: 1.05rem;
      margin-bottom: 4px;
    }

    .stat span {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .search-card {
      margin-top: 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(7, 17, 31, 0.8);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 10px 12px;
      border-radius: 12px;
    }

    .search-box input {
      flex: 1;
      background: transparent;
      border: 0;
      outline: none;
      color: var(--text);
      font-size: 0.96rem;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 10px;
      border-radius: 999px;
      font-size: 0.84rem;
      color: var(--muted);
      cursor: pointer;
      background: rgba(255,255,255,0.04);
      transition: all 0.2s ease;
    }

    .chip.active {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(34, 211, 238, 0.18));
      color: white;
      border-color: rgba(139, 92, 246, 0.35);
    }

    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .chapter-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.2s ease, border-color 0.2s ease;
      min-height: 100%;
      cursor: pointer;
      color: inherit;
    }

    .chapter-card:hover {
      transform: translateY(-2px);
      border-color: rgba(139, 92, 246, 0.45);
    }

    .chapter-card:focus-visible {
      outline: 2px solid #67e8f9;
      outline-offset: 3px;
    }

    .chapter-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      color: #dbeafe;
      border: 1px solid rgba(255,255,255,0.1);
      font-weight: 600;
    }

    .chapter-title {
      font-size: 1.02rem;
      font-weight: 800;
      line-height: 1.35;
    }

    .chapter-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.93rem;
    }

    .chapter-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
      padding-top: 2px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .small-tag {
      font-size: 0.74rem;
      color: #dbeafe;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 4px 8px;
    }

    .open-btn {
      font-weight: 700;
      color: #67e8f9;
      white-space: nowrap;
    }

    .section-title {
      margin: 26px 4px 10px;
      font-size: 1rem;
      font-weight: 700;
      color: #e2e8f0;
    }

    .tips {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .tip {
      background: linear-gradient(135deg, rgba(17, 24, 39, 0.9), rgba(15, 23, 42, 0.88));
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;
      padding: 14px;
      color: var(--muted);
    }

    .tip strong { color: #f8fbff; display: block; margin-bottom: 4px; }

    @media (min-width: 700px) {
      .shell { padding: 28px 24px 56px; }
      .hero { padding: 32px; }
      .chapter-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tips { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .search-card { flex-direction: row; align-items: center; }
      .search-box { flex: 1; }
      .chips { margin-left: auto; }
    }

    @media (min-width: 980px) {
      .chapter-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .hero { padding: 40px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div class="eyebrow">✨ Class 9 Science • NCERT-ready study hub</div>
      <h1>Pick a chapter and start learning.</h1>
      <p>Browse Class 9 Science chapter by chapter with clear topics, quick access, and a clean study-first layout.</p>

      <div class="hero-actions">
        <a class="btn btn-primary" href="#chapters">Open chapters</a>
      </div>

      <div class="search-card">
        <div class="search-box">
          <span>🔎</span>
          <input id="searchInput" type="text" placeholder="Search chapter names or topics..." />
        </div>
        <div class="chips" id="filterChips">
          <button class="chip active" data-filter="all">All</button>
          <button class="chip" data-filter="Physics">Physics</button>
          <button class="chip" data-filter="Chemistry">Chemistry</button>
          <button class="chip" data-filter="Biology">Biology</button>
          <button class="chip" data-filter="Earth">Earth</button>
        </div>
      </div>
    </section>

    <div class="section-title" id="chapters">Choose a chapter</div>
    <section class="chapter-grid" id="chapterGrid"></section>

    <div class="section-title" id="tips">Start with the chapter that feels most useful today.</div>
  </div>

  <script>
    const chapters = [
      {
        title: 'Chapter 1 • Exploration: Entering the World of Secondary Science',
        type: 'Science',
        tags: ['Intro', 'Concepts'],
        href: './chapter-1-exploration-entering-world-of-secondary-science/index.html',
        description: 'Set the tone for science learning with curiosity, observation and a strong foundation.'
      },
      {
        title: 'Chapter 2 • Cell: The Building Block of Life',
        type: 'Biology',
        tags: ['Cell', 'Fundamentals'],
        href: './chapter-2-cell-building-block-of-life/index.html',
        description: 'Explore the tiny units that make living organisms function and grow.'
      },
      {
        title: 'Chapter 3 • Tissues in Action',
        type: 'Biology',
        tags: ['Biology', 'Structure'],
        href: './chapter-3-tissues-in-action/index.html',
        description: 'Understand how groups of cells work together to carry out life processes.'
      },
      {
        title: 'Chapter 4 • Describing Motion Around Us',
        type: 'Physics',
        tags: ['Motion', 'Basics'],
        href: './chapter-4-describing-motion-around-us/index.html',
        description: 'Learn how motion is observed, measured and represented in simple terms.'
      },
      {
        title: 'Chapter 5 • Exploring Mixtures and Their Separation',
        type: 'Chemistry',
        tags: ['Mixtures', 'Separation'],
        href: './chapter-5-exploring-mixtures-and-their-separation/index.html',
        description: 'Discover different kinds of mixtures and clever ways to separate them.'
      },
      {
        title: 'Chapter 6 • How Forces Affect Motion',
        type: 'Physics',
        tags: ['Force', 'Motion'],
        href: './chapter-6-how-forces-affect-motion/index.html',
        description: 'See how forces change motion and why balance matters in the physical world.'
      },
      {
        title: 'Chapter 7 • Work, Energy and Simple Machines',
        type: 'Physics',
        tags: ['Energy', 'Machines'],
        href: './chapter-7-work-energy-and-simple-machines/index.html',
        description: 'Connect work, energy and machines through practical examples and clear logic.'
      },
      {
        title: 'Chapter 8 • Journey Inside the Atom',
        type: 'Chemistry',
        tags: ['Atom', 'Structure'],
        href: './chapter-8-journey-inside-the-atom/index.html',
        description: 'Peek into the atomic world and understand the particles that build matter.'
      },
      {
        title: 'Chapter 9 • Atomic Foundations of Matter',
        type: 'Chemistry',
        tags: ['Matter', 'Atomic Theory'],
        href: './chapter-9-atomic-foundations-of-matter/index.html',
        description: 'Build a strong base for understanding matter, atoms and their behavior.'
      },
      {
        title: 'Chapter 10 • Sound: Waves, Characteristics and Applications',
        type: 'Physics',
        tags: ['Sound', 'Waves'],
        href: './chapter-10-sound-waves-characteristics-and-applications/index.html',
        description: 'Explore how sound travels, behaves and becomes useful in daily life.'
      },
      {
        title: 'Chapter 11 • Reproduction: How Life Continues',
        type: 'Biology',
        tags: ['Reproduction', 'Life'],
        href: './chapter-11-reproduction-how-life-continues/index.html',
        description: 'Understand the biological processes that help life continue across generations.'
      },
      {
        title: 'Chapter 12 • Patterns in Life: Diversity and Classification',
        type: 'Biology',
        tags: ['Diversity', 'Classification'],
        href: './chapter-12-patterns-in-life-diversity-and-classification/index.html',
        description: 'See how living organisms are grouped and why biodiversity matters.'
      },
      {
        title: 'Chapter 13 • Earth as a System: Energy, Matter and Life',
        type: 'Earth',
        tags: ['Earth', 'Environment'],
        href: './chapter-13-earth-as-a-system-energy-matter-and-life/index.html',
        description: 'Study the planet as a connected system shaped by life, energy and matter.'
      }
    ];

    const grid = document.getElementById('chapterGrid');
    const searchInput = document.getElementById('searchInput');
    const chips = document.querySelectorAll('.chip');

    let activeFilter = 'all';

    function getVisibleChapters() {
      const query = searchInput.value.trim().toLowerCase();
      return chapters.filter(chapter => {
        const matchesFilter = activeFilter === 'all' || chapter.type === activeFilter;
        const haystack = `${chapter.title} ${chapter.description} ${chapter.tags.join(' ')}`.toLowerCase();
        const matchesQuery = haystack.includes(query);
        return matchesFilter && matchesQuery;
      });
    }

    function renderChapters() {
      const visible = getVisibleChapters();
      grid.innerHTML = '';

      if (!visible.length) {
        grid.innerHTML = '<div class="chapter-card"><strong>No chapters matched your search.</strong><p>Try another keyword or switch the filter.</p></div>';
        return;
      }

      visible.forEach(chapter => {
        const card = document.createElement('a');
        card.className = 'chapter-card';
        card.href = chapter.href;
        card.innerHTML = `
          <div class="chapter-meta">
            <span>${chapter.type}</span>
            <span class="pill">📘 ${chapter.tags[0]}</span>
          </div>
          <div class="chapter-title">${chapter.title}</div>
          <p>${chapter.description}</p>
          <div class="chapter-footer">
            <div class="tag-row">
              ${chapter.tags.map(tag => `<span class="small-tag">${tag}</span>`).join('')}
            </div>
            <span class="open-btn">Open →</span>
          </div>`;
        grid.appendChild(card);
      });
    }

    searchInput.addEventListener('input', renderChapters);
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        chips.forEach(item => item.classList.remove('active'));
        chip.classList.add('active');
        activeFilter = chip.dataset.filter;
        renderChapters();
      });
    });

    renderChapters();
  </script>
</body>
</html>
